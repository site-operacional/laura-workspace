          <div class="field span-2"><label>Modo de preparo</label><textarea id="f-modo" style="min-height:100px;">${U.escapeHtml(r.modoPreparo || '')}</textarea></div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(r.observacoes || '')}</textarea></div>
          <div class="field span-2">
            <label>Imagem</label>
            <div id="img-preview">${imagemData ? `<img src="${imagemData}" style="width:100%; max-height:160px; object-fit:cover; border-radius:8px; margin-bottom:8px;">` : ''}</div>
            <input type="file" id="f-imagem" accept="image/*">
          </div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        overlay.querySelector('#f-imagem').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 2 * 1024 * 1024) { window.UI.toast('Imagem muito grande — escolha uma com até 2MB.', 'default'); return; }
          imagemData = await readFileAsDataURL(file);
          overlay.querySelector('#img-preview').innerHTML = `<img src="${imagemData}" style="width:100%; max-height:160px; object-fit:cover; border-radius:8px; margin-bottom:8px;">`;
        });
        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            nome: overlay.querySelector('#f-nome').value.trim() || 'Receita sem nome',
            tipo: overlay.querySelector('#f-tipo').value,
            categoria: overlay.querySelector('#f-cat').value,
            tempo: overlay.querySelector('#f-tempo').value,
            ingredientes: overlay.querySelector('#f-ing').value,
            modoPreparo: overlay.querySelector('#f-modo').value,
            observacoes: overlay.querySelector('#f-obs').value,
            imagem: imagemData,
          };
          window.PessoalDB.save(s => {
            if (isEdit) Object.assign(s.receitas.find(x => x.id === r.id), payload);
            else s.receitas.push(Object.assign({ id: U.uid('receita') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Receita salva.', 'success');
          renderReceitas(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog('Remover esta receita?', () => {
            window.PessoalDB.save(s => { s.receitas = s.receitas.filter(x => x.id !== r.id); });
            window.UI.toast('Receita removida.', 'success');
            renderReceitas(content);
          });
        });
      }
    });
  }

  /* ================================ SENHAS ================================ */
  let senhasCatFilter = 'todas';
  let senhasSearch = '';
  const revealedSenhas = new Set();

  function renderSenhas(content) {
    const s = window.PessoalDB.get();
    const q = senhasSearch.trim().toLowerCase();
    const list = s.senhas.filter(p =>
      (senhasCatFilter === 'todas' || p.categoria === senhasCatFilter) &&
      (!q || p.nome.toLowerCase().includes(q) || (p.login || '').toLowerCase().includes(q))
    );

    content.innerHTML = `
      <div class="filter-bar">
        <div class="search-box" style="position:relative; max-width:240px;">
          <i data-lucide="search"></i>
          <input id="senhas-search" placeholder="Pesquisar..." value="${U.escapeHtml(senhasSearch)}">
        </div>
        <button class="filter-chip ${senhasCatFilter === 'todas' ? 'mod-chip-active' : ''}" data-cat="todas">Todas</button>
        ${SENHA_CATS.map(c => `<button class="filter-chip ${senhasCatFilter === c ? 'mod-chip-active' : ''}" data-cat="${c}">${c}</button>`).join('')}
        <div style="flex:1;"></div>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-senha"><i data-lucide="plus"></i> Nova senha</button>
      </div>
      <div id="senhas-list"></div>
    `;
    U.lucide();

    document.getElementById('senhas-list').innerHTML = list.length
      ? `<div class="item-grid">` + list.map(p => senhaCard(p)).join('') + `</div>`
      : window.UI.emptyState('key-round', 'Nenhuma senha cadastrada', 'Guarde suas senhas de sites, apps, bancos e mais.');

    U.lucide();
    const searchInput = document.getElementById('senhas-search');
    searchInput.addEventListener('input', () => { senhasSearch = searchInput.value; renderSenhas(content); });
    setTimeout(() => { searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length); }, 0);

    U.qsa('[data-cat]', content).forEach(b => b.addEventListener('click', () => { senhasCatFilter = b.getAttribute('data-cat'); renderSenhas(content); }));
    document.getElementById('btn-add-senha').addEventListener('click', () => openSenhaForm(null, content));
    U.qsa('[data-open-senha]', content).forEach(el => el.addEventListener('click', (e) => {
      if (e.target.closest('[data-copy],[data-reveal]')) return;
      const p = window.PessoalDB.get().senhas.find(x => x.id === el.getAttribute('data-open-senha'));
      openSenhaForm(p, content);
    }));
    U.qsa('[data-reveal]', content).forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-reveal');
      if (revealedSenhas.has(id)) revealedSenhas.delete(id); else revealedSenhas.add(id);
      renderSenhas(content);
    }));
    U.qsa('[data-copy]', content).forEach(btn => btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const text = btn.getAttribute('data-copy');
      try {
        await navigator.clipboard.writeText(text);
        window.UI.toast('Copiado para a área de transferência.', 'success');
      } catch (err) {
        window.UI.toast('Não foi possível copiar automaticamente.', 'default');
      }
    }));
  }

  function senhaCard(p) {
    const revealed = revealedSenhas.has(p.id);
    return `
      <div class="card" data-open-senha="${p.id}" style="cursor:pointer;">
        <div class="item-card-top">
          <div>
            <div class="item-card-title">${U.escapeHtml(p.nome)}</div>
            <div class="item-card-meta" style="margin-top:4px;">${U.escapeHtml(p.categoria || 'Outros')}</div>
          </div>
        </div>
        ${p.login ? `
        <div style="display:flex; align-items:center; gap:6px; margin-top:10px; font-size:12px;">
          <span class="text-faint" style="width:44px; flex-shrink:0;">Login</span>
          <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${U.escapeHtml(p.login)}</span>
          <button class="icon-btn" data-copy="${U.escapeHtml(p.login)}" style="width:26px;height:26px;"><i data-lucide="copy"></i></button>
        </div>` : ''}
        <div style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px;">
          <span class="text-faint" style="width:44px; flex-shrink:0;">Senha</span>
          <span style="flex:1; font-family:var(--font-mono, monospace); letter-spacing:1px;">${revealed ? U.escapeHtml(p.senha) : '••••••••'}</span>
          <button class="icon-btn" data-reveal="${p.id}" style="width:26px;height:26px;"><i data-lucide="${revealed ? 'eye-off' : 'eye'}"></i></button>
          <button class="icon-btn" data-copy="${U.escapeHtml(p.senha)}" style="width:26px;height:26px;"><i data-lucide="copy"></i></button>
        </div>
        ${p.observacoes ? `<div class="text-muted" style="font-size:11.5px; margin-top:8px; line-height:1.4;">${U.escapeHtml(p.observacoes)}</div>` : ''}
      </div>
    `;
  }

  function openSenhaForm(senha, content) {
    const isEdit = !!(senha && senha.id);
    const p = senha || { id: null, nome: '', categoria: SENHA_CATS[0], login: '', senha: '', observacoes: '' };
    window.UI.openModal({
      title: isEdit ? 'Editar senha' : 'Nova senha',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome</label><input id="f-nome" value="${U.escapeHtml(p.nome)}" placeholder="Ex: Gmail, Netflix, Banco X..."></div>
          <div class="field"><label>Categoria</label><select id="f-cat">${SENHA_CATS.map(c => `<option ${p.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
          <div class="field"><label>Login</label><input id="f-login" value="${U.escapeHtml(p.login || '')}"></div>
          <div class="field span-2"><label>Senha</label>
            <div class="pw-field"><input type="password" id="f-senha" value="${U.escapeHtml(p.senha || '')}"><button type="button" class="pw-toggle" data-target="f-senha"><i data-lucide="eye"></i></button></div>
          </div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(p.observacoes || '')}</textarea></div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        overlay.querySelectorAll('.pw-toggle').forEach(btn => btn.addEventListener('click', () => window.WorkspaceAuth.togglePwVisibility(btn, overlay.querySelector('#' + btn.getAttribute('data-target')))));
        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            nome: overlay.querySelector('#f-nome').value.trim() || 'Sem nome',
            categoria: overlay.querySelector('#f-cat').value,
            login: overlay.querySelector('#f-login').value,
            senha: overlay.querySelector('#f-senha').value,
            observacoes: overlay.querySelector('#f-obs').value,
          };
          window.PessoalDB.save(s => {
            if (isEdit) Object.assign(s.senhas.find(x => x.id === p.id), payload);
            else s.senhas.push(Object.assign({ id: U.uid('senha') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Senha salva.', 'success');
          renderSenhas(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog('Remover esta senha?', () => {
            window.PessoalDB.save(s => { s.senhas = s.senhas.filter(x => x.id !== p.id); });
            window.UI.toast('Senha removida.', 'success');
            renderSenhas(content);
          });
        });
      }
    });
  }

  /* ================================ DOCUMENTOS ================================ */
  let documentosPastaAtiva = null;

  function renderDocumentos(content) {
    const s = window.PessoalDB.get();
    if (!documentosPastaAtiva || !s.documentosPastas.find(p => p.id === documentosPastaAtiva)) {
      documentosPastaAtiva = s.documentosPastas[0] && s.documentosPastas[0].id;
    }
    const docs = s.documentos.filter(d => d.pastaId === documentosPastaAtiva);

    content.innerHTML = `
      <div style="display:grid; grid-template-columns: 220px 1fr; gap:20px; align-items:start;">
        <div class="card">
          <div class="dg-section-title"><i data-lucide="folder"></i> Pastas</div>
          <div id="pastas-list" style="display:flex; flex-direction:column; gap:4px;"></div>
          <button class="btn btn-soft btn-sm" id="btn-manage-pastas" style="margin-top:12px; width:100%; justify-content:center;"><i data-lucide="settings-2"></i> Gerenciar pastas</button>
        </div>
        <div class="card">
          <div class="filter-bar" style="padding:0; border:none; margin-bottom:16px;">
            <div class="dg-section-title" style="margin:0;"><i data-lucide="file"></i> ${U.escapeHtml((s.documentosPastas.find(p => p.id === documentosPastaAtiva) || {}).nome || '')}</div>
            <div style="flex:1;"></div>
            <label class="btn mod-btn-primary btn-sm" style="cursor:pointer;"><i data-lucide="upload"></i> Enviar arquivo<input type="file" id="doc-upload" style="display:none;"></label>
          </div>
          <div id="docs-list"></div>
        </div>
      </div>
    `;
    U.lucide();

    document.getElementById('pastas-list').innerHTML = s.documentosPastas.map(p => {
      const count = s.documentos.filter(d => d.pastaId === p.id).length;
      return `<button class="filter-chip ${p.id === documentosPastaAtiva ? 'mod-chip-active' : ''}" data-pasta="${p.id}" style="justify-content:space-between; width:100%;">${U.escapeHtml(p.nome)} <span class="text-faint">${count}</span></button>`;
    }).join('');
    U.qsa('[data-pasta]', content).forEach(b => b.addEventListener('click', () => { documentosPastaAtiva = b.getAttribute('data-pasta'); renderDocumentos(content); }));

    document.getElementById('docs-list').innerHTML = docs.length
      ? `<div style="display:flex; flex-direction:column; gap:10px;">` + docs.map(d => `
          <div class="file-card" data-doc-id="${d.id}">
            <div class="file-icon"><i data-lucide="file-text"></i></div>
            <div style="flex:1;">
              <div class="file-name">${U.escapeHtml(d.nome)}</div>
              <div class="file-meta">${formatBytes(d.tamanho)}</div>
            </div>
            <a class="icon-btn" href="${d.arquivo}" download="${U.escapeHtml(d.nome)}" title="Baixar"><i data-lucide="download"></i></a>
            <button class="icon-btn" data-doc-del="${d.id}" title="Remover"><i data-lucide="trash-2"></i></button>
          </div>
        `).join('') + `</div>`
      : window.UI.emptyState('folder-open', 'Nenhum arquivo nesta pasta', 'Envie um arquivo para começar.');
    U.lucide();

    document.getElementById('btn-manage-pastas').addEventListener('click', () => openPastasManager(content));
    U.qsa('[data-doc-del]', content).forEach(btn => btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-doc-del');
      window.UI.confirmDialog('Remover este arquivo?', () => {
        window.PessoalDB.save(s2 => { s2.documentos = s2.documentos.filter(x => x.id !== id); });
        window.UI.toast('Arquivo removido.', 'success');
        renderDocumentos(content);
      });
    }));
    document.getElementById('doc-upload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { window.UI.toast('Arquivo muito grande — escolha um com até 5MB.', 'default'); return; }
      const dataUrl = await readFileAsDataURL(file);
      const ok = window.PessoalDB.save(s2 => {
        s2.documentos.push({ id: U.uid('doc'), pastaId: documentosPastaAtiva, nome: file.name, tamanho: file.size, arquivo: dataUrl });
      });
      if (ok) window.UI.toast('Arquivo enviado.', 'success');
      renderDocumentos(content);
    });
  }

  function openPastasManager(content) {
    function bodyHtml() {
      const s = window.PessoalDB.get();
      return `
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
          ${s.documentosPastas.map(p => `
            <div style="display:flex; align-items:center; gap:8px;">
              <i data-lucide="folder" style="width:16px;height:16px; color:var(--text-faint); flex-shrink:0;"></i>
              <input class="pasta-name-input" data-pasta-id="${p.id}" value="${U.escapeHtml(p.nome)}" style="flex:1;">
              <button class="icon-btn" data-pasta-del="${p.id}"><i data-lucide="trash-2"></i></button>
            </div>
          `).join('')}
        </div>
        <div class="checklist-add"><input id="new-pasta-name" placeholder="Nova pasta..." style="flex:1;"><button class="btn btn-soft btn-sm" id="btn-add-pasta">Adicionar</button></div>
      `;
    }
    window.UI.openModal({
      title: 'Gerenciar pastas',
      bodyHtml: bodyHtml(),
      footerHtml: `<button class="btn mod-btn-primary" id="pastas-done">Concluído</button>`,
      onMount: (overlay) => {
        function bindRows() {
          U.qsa('.pasta-name-input', overlay).forEach(inp => inp.addEventListener('change', () => {
            window.PessoalDB.save(s => { const p = s.documentosPastas.find(x => x.id === inp.getAttribute('data-pasta-id')); if (p) p.nome = inp.value.trim() || p.nome; });
          }));
          U.qsa('[data-pasta-del]', overlay).forEach(btn => btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-pasta-del');
            const s = window.PessoalDB.get();
            if (s.documentosPastas.length <= 1) { window.UI.toast('Mantenha ao menos uma pasta.', 'default'); return; }
            window.UI.confirmDialog('Remover esta pasta e todos os arquivos dentro dela?', () => {
              window.PessoalDB.save(s2 => {
                s2.documentos = s2.documentos.filter(d => d.pastaId !== id);
                s2.documentosPastas = s2.documentosPastas.filter(x => x.id !== id);
              });
              if (documentosPastaAtiva === id) documentosPastaAtiva = null;
              overlay.querySelector('.modal-body').innerHTML = bodyHtml();
              bindRows(); U.lucide();
            });
          }));
        }
        bindRows();
        overlay.querySelector('#btn-add-pasta').addEventListener('click', () => {
          const input = overlay.querySelector('#new-pasta-name');
          if (!input.value.trim()) return;
          window.PessoalDB.save(s => { s.documentosPastas.push({ id: U.uid('pasta'), nome: input.value.trim() }); });
          overlay.querySelector('.modal-body').innerHTML = bodyHtml();
          bindRows(); U.lucide();
        });
        overlay.querySelector('#pastas-done').addEventListener('click', () => { window.UI.closeModal(); renderDocumentos(content); });
      }
    });
  }

  return { mount };
})();

// ============================== BOOTSTRAP ==============================
function mountApp(folder) {
  window.DB.load();
  const app = document.getElementById('app');
  const title = folder ? folder.name : 'Faculdade';
  const icon = folder ? folder.icon : 'graduation-cap';
  const accent = folder ? folder.color2 : '#EF4444';
  const scopeId = 'estudos:' + (folder ? folder.id : 'builtin');
  window.Router.setScope(scopeId);

  const routeByKey = {};
  window.UI.MAIN_TABS.forEach(t => { routeByKey[t.key] = t.route; });
  function tabsWithRoutes() {
    return window.TabCustomizer.mergeTabs(window.UI.MAIN_TABS, scopeId).map(t => ({
      ...t, route: t.isCustom ? ('custom/' + t.customId) : (routeByKey[t.key] || t.key),
    }));
  }

  app.innerHTML = `
    <div class="module-page" style="--mod-accent:${accent};">
      <header class="module-topbar">
        <div class="module-topbar-left">
          <button class="icon-btn" id="btn-back-hub" title="Voltar ao Hub"><i data-lucide="layout-grid"></i></button>
          <div class="module-title"><i data-lucide="${icon}"></i><span>${window.Utils.escapeHtml(title)}</span></div>
        </div>
        <div class="module-tabs" id="module-tabs"></div>
        <div class="module-topbar-right">
          <div class="search-box" style="position:relative;">
            <i data-lucide="search"></i>
            <input id="global-search-input" placeholder="Buscar disciplinas, tarefas, referências...">
            <div id="search-results" style="display:none; position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); max-height:340px; overflow-y:auto; z-index:50;"></div>
          </div>
          <button class="icon-btn" id="btn-mod-tabs" title="Personalizar abas"><i data-lucide="layout-list"></i></button>
          <button class="icon-btn" id="btn-lock-workspace" title="Bloquear Workspace"><i data-lucide="lock"></i></button>
          <button class="icon-btn" id="btn-theme-toggle" title="Alternar tema claro/escuro"><i data-lucide="sun"></i></button>
        </div>
      </header>
      <main class="content" id="main-content"></main>
    </div>
  `;

  function rebuildTabsBar() {
    const bar = document.getElementById('module-tabs');
    bar.innerHTML = tabsWithRoutes().map(t => `<button class="module-tab" data-route="${t.route}" data-key="${t.key}"><i data-lucide="${t.icon}"></i><span>${window.Utils.escapeHtml(t.label)}</span></button>`).join('');
    window.Utils.lucide();
    window.Utils.qsa('.module-tab[data-route]', bar).forEach(btn => {
      btn.addEventListener('click', () => window.Router.navigate(btn.getAttribute('data-route')));
    });
    window.Router.refreshTabs();
  }
  rebuildTabsBar();

  window.Utils.lucide();
  window.__bindGlobalSearch();
  window.Theme.init();
  window.location.hash = 'dashboard';
  window.Router.init();

  const backBtn = document.getElementById('btn-back-hub');
  if (backBtn) backBtn.addEventListener('click', () => window.Hub.render());

  const tabsBtn = document.getElementById('btn-mod-tabs');
  if (tabsBtn) tabsBtn.addEventListener('click', () => window.TabCustomizer.openManager(scopeId, window.UI.MAIN_TABS, rebuildTabsBar));

  const lockBtn = document.getElementById('btn-lock-workspace');
  if (lockBtn) lockBtn.addEventListener('click', () => window.WorkspaceLock.lockNow());

  window.addEventListener('db:changed', () => {
    // mantém a UI reativa a mudanças externas (ex: import de backup)
  });
}
window.mountApp = mountApp;

document.addEventListener('DOMContentLoaded', () => {
  window.CloudSync.boot(() => {
    window.WS.load();
    window.DB.load();
    window.Theme.apply(window.Theme.current());
    window.Splash.show(() => {
      window.WorkspaceAuth.boot();
    });
    window.WorkspaceLock.initActivityTracking();
  });
});

  </script>
</body>
</html>
