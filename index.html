window.EventosDB = (function () {
  const LEGACY_KEY = 'eventos_workspace_v1';
  let KEY = LEGACY_KEY;
  const { uid } = window.Utils;

  function setInstance(id) { KEY = id ? ('folder_eventos_v1::' + id) : LEGACY_KEY; state = null; }

  const DEFAULT_CATS = [
    { nome: 'Pessoal', cor: '#A855F7' },
    { nome: 'Amigos', cor: '#C084FC' },
    { nome: 'Família', cor: '#8B5CF6' },
    { nome: 'Faculdade', cor: '#EF4444' },
    { nome: 'Igreja', cor: '#22C55E' },
    { nome: 'Trabalho', cor: '#F97316' },
    { nome: 'Outro', cor: '#64748B' },
  ];

  function defaultState() {
    return {
      categorias: DEFAULT_CATS.map(c => Object.assign({ id: uid('cat') }, c)),
      eventos: [],
    };
  }

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
      if (!state.categorias || !state.categorias.length) state.categorias = defaultState().categorias;
    } catch (e) {
      console.error('Erro ao carregar dados de Eventos, restaurando padrão.', e);
      state = defaultState();
    }
    persist();
    return state;
  }
  function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function get() { return state; }
  function save(fn) { fn(state); persist(); }

  return { load, get, save, setInstance };
})();

window.EventosApp = (function () {
  const U = window.Utils;
  const ACCENT = '#A855F7';
  const CAT_PALETTE = ['#A855F7', '#C084FC', '#8B5CF6', '#D946EF', '#818CF8', '#E879F9', '#6366F1'];

  function mount(folder) {
    window.EventosDB.load();
    window.ModuleShell.mount({
      icon: folder ? folder.icon : 'party-popper',
      title: folder ? folder.name : 'Eventos',
      accent: folder ? folder.color2 : ACCENT,
      scopeId: 'eventos:' + (folder ? folder.id : 'builtin'),
      tabs: [{ key: 'eventos', label: 'Eventos' }],
      initialTab: 'eventos',
      onRenderTab: (tab, content) => renderEventos(content),
    });
  }

  let catFilter = 'todas';
  let eventosRefMonth = new Date();
  let showAuto = true; // mostra também itens vindos de outros módulos (Faculdade, Igreja, etc.)

  function categorias() { return window.EventosDB.get().categorias; }
  function catById(id) { return categorias().find(c => c.id === id); }

  // Itens que vieram de OUTROS módulos (Faculdade, Igreja, Financeiro,
  // Pessoal) — não pertencem a este app, então aparecem como somente
  // leitura, com um selo indicando de onde vieram e como editar.
  function autoImportedItems() {
    if (!showAuto || !window.DashboardGeral) return [];
    return window.DashboardGeral.collectEvents().filter(i => i.source !== 'Eventos');
  }

  // Casa um item vindo de outro módulo com uma categoria da tela de
  // Eventos, comparando o nome de origem (ex: source "Faculdade" com a
  // categoria "Faculdade"). Itens de disciplinas específicas (cujo source
  // é o nome da disciplina) continuam aparecendo em "Todas".
  function matchesCategoriaAuto(item, catId) {
    const cat = catById(catId);
    if (!cat) return false;
    return item.source.toLowerCase() === cat.nome.toLowerCase();
  }

  function renderEventos(content) {
    const state = window.EventosDB.get();
    const list = state.eventos
      .filter(ev => catFilter === 'todas' || ev.categoriaId === catFilter)
      .sort((a, b) => (a.data || '9999').localeCompare(b.data || '9999'));
    const autoItemsAll = autoImportedItems();
    const autoItems = catFilter === 'todas'
      ? autoItemsAll
      : autoItemsAll.filter(i => matchesCategoriaAuto(i, catFilter));

    content.innerHTML = `
      <div class="filter-bar">
        <button class="filter-chip ${catFilter === 'todas' ? 'mod-chip-active' : ''}" data-cat="todas">Todas</button>
        ${categorias().map(c => `
          <button class="filter-chip ${catFilter === c.id ? 'mod-chip-active' : ''}" data-cat="${c.id}" style="${catFilter === c.id ? `background:${c.cor}22; border-color:${c.cor}; color:${c.cor};` : ''}">
            <span style="width:7px; height:7px; border-radius:50%; background:${c.cor}; display:inline-block;"></span> ${U.escapeHtml(c.nome)}
          </button>
        `).join('')}
        <button class="icon-btn" id="btn-manage-cats" title="Gerenciar categorias"><i data-lucide="settings-2"></i></button>
        <div style="flex:1;"></div>
        <button class="filter-chip ${showAuto ? 'mod-chip-active' : ''}" id="btn-toggle-auto" title="Mostrar eventos lançados em outros módulos (Faculdade, Igreja, etc.)">
          <i data-lucide="link-2" style="width:12px;height:12px;"></i> Outros módulos
        </button>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-evento"><i data-lucide="plus"></i> Novo evento</button>
      </div>

      <div class="dash-split-13" style="gap:20px;">
        <div class="card">
          <div class="dg-section-title"><i data-lucide="list"></i> Eventos (${list.length}${autoItems.length ? ' + ' + autoItems.length + ' de outros módulos' : ''})</div>
          <div id="eventos-list"></div>
        </div>
        <div class="card">
          <div class="dg-section-title"><i data-lucide="calendar"></i> Calendário de eventos</div>
          <div id="eventos-cal"></div>
        </div>
      </div>
    `;
    U.lucide();

    const autoHtml = autoItems.length ? `
      <div class="dg-section-title" style="margin-top:16px; font-size:11.5px; color:var(--text-faint);"><i data-lucide="link-2" style="width:12px;height:12px;"></i> Vindos de outros módulos</div>
      <div class="item-grid">${autoItems.map(autoItemCard).join('')}</div>
    ` : '';

    document.getElementById('eventos-list').innerHTML = (list.length
      ? `<div class="item-grid">` + list.map(ev => eventoCard(ev)).join('') + `</div>`
      : (autoItems.length ? '' : window.UI.emptyState('party-popper', 'Nenhum evento por aqui', 'Cadastre um evento pessoal, com amigos, família e mais.'))
    ) + autoHtml;

    renderEventosMiniCal(document.getElementById('eventos-cal'), state, content, autoItems);

    U.lucide();
    U.qsa('[data-cat]', content).forEach(b => b.addEventListener('click', () => { catFilter = b.getAttribute('data-cat'); renderEventos(content); }));
    document.getElementById('btn-manage-cats').addEventListener('click', () => openCategoriaManager(content));
    document.getElementById('btn-toggle-auto').addEventListener('click', () => { showAuto = !showAuto; renderEventos(content); });
    document.getElementById('btn-add-evento').addEventListener('click', () => openEventoForm(null, content));
    U.qsa('[data-open-evento]', content).forEach(b => b.addEventListener('click', () => {
      const ev = window.EventosDB.get().eventos.find(x => x.id === b.getAttribute('data-open-evento'));
      openEventoForm(ev, content);
    }));
  }

  // Card somente-leitura para itens vindos de outros módulos. Editar
  // precisa ser feito no módulo de origem — clicar mostra onde ir.
  function autoItemCard(item) {
    return `
      <div class="card" style="opacity:.85; border-style:dashed;">
        <div class="item-card-top">
          <div>
            <div class="item-card-title">${U.escapeHtml(item.label)}</div>
            <div class="item-card-meta" style="margin-top:4px;">
              <i data-lucide="calendar" style="width:12px;height:12px;"></i> ${U.formatDateBR(item.date)}
            </div>
          </div>
          <span class="dg-source-tag" style="background:${item.color};">${U.escapeHtml(item.source)}</span>
        </div>
        <div class="text-faint" style="font-size:11px; margin-top:8px;"><i data-lucide="pencil" style="width:11px;height:11px;"></i> Editar em: ${U.escapeHtml(item.source)}</div>
      </div>
    `;
  }

  function renderEventosMiniCal(container, state, content, autoItems) {
    const ref = eventosRefMonth;
    const year = ref.getFullYear(), month = ref.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const todayISO = U.todayISO();

    const eventsByDay = {};
    state.eventos.forEach(e => { if (e.data) (eventsByDay[e.data] = eventsByDay[e.data] || []).push({ ...e, __auto: false }); });
    (autoItems || []).forEach(i => { (eventsByDay[i.date] = eventsByDay[i.date] || []).push({ nome: i.label, __auto: true, __color: i.color, __source: i.source }); });

    let cells = '';
    for (let i = startOffset - 1; i >= 0; i--) cells += `<div class="calendar-mini-day other-month">${daysInPrevMonth - i}</div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const has = eventsByDay[iso] && eventsByDay[iso].length;
      const first = has ? eventsByDay[iso][0] : null;
      const dotColor = has ? (first.__auto ? first.__color : ((catById(first.categoriaId) || {}).cor || ACCENT)) : '';
      cells += `<div class="calendar-mini-day ${iso === todayISO ? 'today' : ''} ${has ? 'has-event' : ''}" data-day="${iso}" style="cursor:pointer; ${has ? `--dot-color:${dotColor};` : ''}">${d}</div>`;
    }
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) cells += `<div class="calendar-mini-day other-month">${i}</div>`;

    container.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <button class="icon-btn" id="ev-cal-prev"><i data-lucide="chevron-left"></i></button>
        <div style="font-size:12.5px; font-weight:700;">${U.MESES[month]} de ${year}</div>
        <button class="icon-btn" id="ev-cal-next"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="calendar-mini">
        ${U.DIAS_SEMANA_ABREV.map(d => `<div class="calendar-weekday">${d}</div>`).join('')}
        ${cells}
      </div>
    `;
    U.lucide();
    container.querySelector('#ev-cal-prev').addEventListener('click', () => { eventosRefMonth = new Date(year, month - 1, 1); renderEventosMiniCal(container, state, content, autoItems); });
    container.querySelector('#ev-cal-next').addEventListener('click', () => { eventosRefMonth = new Date(year, month + 1, 1); renderEventosMiniCal(container, state, content, autoItems); });
    U.qsa('[data-day]', container).forEach(d => d.addEventListener('click', () => {
      const iso = d.getAttribute('data-day');
      const evs = (eventsByDay[iso] || []).filter(e => !e.__auto);
      const autos = (eventsByDay[iso] || []).filter(e => e.__auto);
      if (evs.length === 1 && autos.length === 0) openEventoForm(evs[0], content);
      else if (evs.length + autos.length > 1) window.UI.toast(`${evs.length + autos.length} evento(s) em ${U.formatDateBR(iso)} — veja a lista.`, 'default');
      else if (autos.length === 1) window.UI.toast(`"${autos[0].nome}" — edite em ${autos[0].__source}.`, 'default');
      else openEventoForm({ id: null, nome: '', categoriaId: categorias()[0].id, data: iso, horario: '', local: '', descricao: '', checklist: [], anexos: [], observacoes: '' }, content);
    }));
  }

  function eventoCard(ev) {
    const cat = catById(ev.categoriaId) || { nome: 'Outro', cor: '#64748B' };
    const done = (ev.checklist || []).filter(c => c.feito).length;
    const total = (ev.checklist || []).length;
    return `
      <div class="card" data-open-evento="${ev.id}" style="cursor:pointer;">
        <div class="item-card-top">
          <div>
            <div class="item-card-title">${U.escapeHtml(ev.nome || 'Evento')}</div>
            <div class="item-card-meta" style="margin-top:4px;">
              <i data-lucide="calendar" style="width:12px;height:12px;"></i> ${ev.data ? U.formatDateBR(ev.data) : 'Sem data'}
              ${ev.horario ? `· ${ev.horario}` : ''}
            </div>
          </div>
          <span class="status-pill" style="background:${cat.cor}22; color:${cat.cor};">${U.escapeHtml(cat.nome)}</span>
        </div>
        ${ev.local ? `<div class="item-card-meta" style="margin-top:8px;"><i data-lucide="map-pin" style="width:12px;height:12px;"></i> ${U.escapeHtml(ev.local)}</div>` : ''}
        ${total ? `<div class="checklist-progress" style="margin-top:8px;"><i data-lucide="check-square" style="width:12px;height:12px;"></i> ${done}/${total} concluídos</div>` : ''}
        ${(ev.anexos || []).length ? `<div class="checklist-progress" style="margin-top:4px;"><i data-lucide="paperclip" style="width:12px;height:12px;"></i> ${ev.anexos.length} anexo(s)</div>` : ''}
      </div>
    `;
  }

  /* --------- Gerenciar categorias --------- */
  function openCategoriaManager(content) {
    function bodyHtml() {
      return `
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
          ${categorias().map(c => `
            <div style="display:flex; align-items:center; gap:8px;" data-cat-row="${c.id}">
              <span style="width:12px; height:12px; border-radius:50%; background:${c.cor}; flex-shrink:0;"></span>
              <input class="cat-name-input" data-cat-id="${c.id}" value="${U.escapeHtml(c.nome)}" style="flex:1;">
              <button class="icon-btn" data-cat-del="${c.id}"><i data-lucide="trash-2"></i></button>
            </div>
          `).join('')}
        </div>
        <div class="checklist-add">
          <input id="new-cat-name" placeholder="Nova categoria..." style="flex:1;">
          <button class="btn btn-soft btn-sm" id="btn-add-cat">Adicionar</button>
        </div>
      `;
    }
    window.UI.openModal({
      title: 'Gerenciar categorias',
      bodyHtml: bodyHtml(),
      footerHtml: `<button class="btn mod-btn-primary" id="cats-done">Concluído</button>`,
      onMount: (overlay) => {
        function bindRows() {
          U.qsa('.cat-name-input', overlay).forEach(inp => {
            inp.addEventListener('change', () => {
              window.EventosDB.save(s => { const c = s.categorias.find(x => x.id === inp.getAttribute('data-cat-id')); if (c) c.nome = inp.value.trim() || c.nome; });
              window.UI.toast('Categoria atualizada.', 'success');
            });
          });
          U.qsa('[data-cat-del]', overlay).forEach(btn => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-cat-del');
              if (categorias().length <= 1) { window.UI.toast('Mantenha ao menos uma categoria.', 'default'); return; }
              window.UI.confirmDialog('Remover esta categoria? Eventos nela serão movidos para a primeira categoria disponível.', () => {
                window.EventosDB.save(s => {
                  const fallback = s.categorias.find(c => c.id !== id);
                  s.eventos.forEach(ev => { if (ev.categoriaId === id) ev.categoriaId = fallback.id; });
                  s.categorias = s.categorias.filter(c => c.id !== id);
                });
                if (catFilter === id) catFilter = 'todas';
                overlay.querySelector('.modal-body').innerHTML = bodyHtml();
                bindRows();
                U.lucide();
                window.UI.toast('Categoria removida.', 'success');
              });
            });
          });
        }
        bindRows();
        overlay.querySelector('#btn-add-cat').addEventListener('click', () => {
          const input = overlay.querySelector('#new-cat-name');
          const name = input.value.trim();
          if (!name) return;
          window.EventosDB.save(s => {
            const color = CAT_PALETTE[s.categorias.length % CAT_PALETTE.length];
            s.categorias.push({ id: U.uid('cat'), nome: name, cor: color });
          });
          overlay.querySelector('.modal-body').innerHTML = bodyHtml();
          bindRows();
          U.lucide();
        });
        overlay.querySelector('#cats-done').addEventListener('click', () => {
          window.UI.closeModal();
          renderEventos(content);
        });
      }
    });
  }

  /* --------- Formulário de evento --------- */
  function openEventoForm(evento, content) {
    const isEdit = !!(evento && evento.id);
    const ev = evento || { id: null, nome: '', categoriaId: categorias()[0].id, data: '', horario: '', local: '', descricao: '', checklist: [], anexos: [], observacoes: '' };
    let checklist = (ev.checklist || []).map(c => Object.assign({}, c));
    let anexos = (ev.anexos || []).map(a => Object.assign({}, a));

    function checklistHtml() {
      if (!checklist.length) return `<p class="text-faint" style="font-size:12px;">Nenhum item ainda.</p>`;
      return checklist.map(c => `
        <div class="checklist-item ${c.feito ? 'done' : ''}" data-check-id="${c.id}">
          <input type="checkbox" ${c.feito ? 'checked' : ''} data-check-toggle="${c.id}">
          <span>${U.escapeHtml(c.texto)}</span>
          <button class="icon-btn" data-check-del="${c.id}" style="width:24px;height:24px;margin-left:auto;"><i data-lucide="x"></i></button>
        </div>
      `).join('');
    }
    function anexosHtml() {
      if (!anexos.length) return `<p class="text-faint" style="font-size:12px;">Nenhum anexo ainda.</p>`;
      return anexos.map(a => `
        <div class="file-card" data-file-id="${a.id}" style="padding:8px 0;">
          <div class="file-icon"><i data-lucide="paperclip"></i></div>
          <div style="flex:1;">
            <div class="file-name">${U.escapeHtml(a.nome)}</div>
            ${a.link ? `<div class="file-meta">${U.escapeHtml(a.link)}</div>` : ''}
          </div>
          <button class="icon-btn" data-file-del="${a.id}"><i data-lucide="trash-2"></i></button>
        </div>
      `).join('');
    }

    window.UI.openModal({
      title: isEdit ? 'Editar evento' : 'Novo evento',
      size: 'lg',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome do evento</label><input id="f-nome" value="${U.escapeHtml(ev.nome)}" placeholder="Ex: Aniversário da Marina"></div>
          <div class="field"><label>Categoria</label>

          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(ev.observacoes || '')}</textarea></div>

          <div class="field span-2">
            <label>Checklist</label>

            <div class="checklist-add"><input id="f-check-new" placeholder="Novo item..."><button class="btn btn-soft btn-sm" id="btn-add-check">Adicionar</button></div>
          </div>

          <div class="field span-2">
            <label>Anexos (nome + link opcional)</label>

            <div class="checklist-add">
              <input id="f-anexo-nome" placeholder="Nome do anexo" style="flex:1;">
              <input id="f-anexo-link" placeholder="Link (opcional)" style="flex:1;">
              <button class="btn btn-soft btn-sm" id="btn-add-anexo">Adicionar</button>
            </div>
          </div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        function refreshChecklist() {
          overlay.querySelector('#checklist-box').innerHTML = checklistHtml();
          U.lucide();
          U.qsa('[data-check-toggle]', overlay).forEach(cb => cb.addEventListener('change', () => {
            checklist.find(c => c.id === cb.getAttribute('data-check-toggle')).feito = cb.checked;
            refreshChecklist();
          }));
          U.qsa('[data-check-del]', overlay).forEach(btn => btn.addEventListener('click', () => {
            checklist = checklist.filter(c => c.id !== btn.getAttribute('data-check-del'));
            refreshChecklist();
          }));
        }
        function refreshAnexos() {
          overlay.querySelector('#anexos-box').innerHTML = anexosHtml();
          U.lucide();
          U.qsa('[data-file-del]', overlay).forEach(btn => btn.addEventListener('click', () => {
            anexos = anexos.filter(a => a.id !== btn.getAttribute('data-file-del'));
            refreshAnexos();
          }));
        }
        refreshChecklist();
        refreshAnexos();

        overlay.querySelector('#btn-add-check').addEventListener('click', () => {
          const input = overlay.querySelector('#f-check-new');
          if (!input.value.trim()) return;
          checklist.push({ id: U.uid('chk'), texto: input.value.trim(), feito: false });
          input.value = '';
          refreshChecklist();
        });
        overlay.querySelector('#f-check-new').addEventListener('keydown', e => { if (e.key === 'Enter') overlay.querySelector('#btn-add-check').click(); });

        overlay.querySelector('#btn-add-anexo').addEventListener('click', () => {
          const nomeI = overlay.querySelector('#f-anexo-nome');
          const linkI = overlay.querySelector('#f-anexo-link');
          if (!nomeI.value.trim()) return;
          anexos.push({ id: U.uid('anexo'), nome: nomeI.value.trim(), link: linkI.value.trim() });
          nomeI.value = ''; linkI.value = '';
          refreshAnexos();
        });

        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            nome: overlay.querySelector('#f-nome').value.trim() || 'Evento sem nome',
            categoriaId: overlay.querySelector('#f-cat').value,
            local: overlay.querySelector('#f-local').value,
            data: overlay.querySelector('#f-data').value,
            horario: overlay.querySelector('#f-horario').value,
            descricao: overlay.querySelector('#f-desc').value,
            observacoes: overlay.querySelector('#f-obs').value,
            checklist, anexos,
          };
          window.EventosDB.save(s => {
            if (isEdit) Object.assign(s.eventos.find(x => x.id === ev.id), payload);
            else s.eventos.push(Object.assign({ id: U.uid('pevento') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Evento salvo.', 'success');
          renderEventos(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog('Remover este evento?', () => {
            window.EventosDB.save(s => { s.eventos = s.eventos.filter(x => x.id !== ev.id); });
            window.UI.toast('Evento removido.', 'success');
            renderEventos(content);
          });
        });
      }
    });
  }

  return { mount };
})();

/* ==========================================================================
   financeiro.js — Módulo Financeiro (Dashboard, Contas, Cartões, Assinaturas)

window.FinanceiroDB = (function () {
  const LEGACY_KEY = 'financeiro_workspace_v1';
  let KEY = LEGACY_KEY;
  const { uid } = window.Utils;

  function setInstance(id) { KEY = id ? ('folder_financeiro_v1::' + id) : LEGACY_KEY; state = null; }

  const DEFAULT_CATS = [
    { nome: 'Casa', cor: '#F97316' },
    { nome: 'Alimentação', cor: '#FB923C' },
    { nome: 'Transporte', cor: '#EA580C' },
    { nome: 'Lazer', cor: '#FBBF24' },
    { nome: 'Saúde', cor: '#F43F5E' },
    { nome: 'Educação', cor: '#EF4444' },
    { nome: 'Assinaturas', cor: '#C2410C' },
    { nome: 'Outros', cor: '#78716C' },
  ];
  const CARD_COLOR_PALETTE = ['#F97316', '#EF4444', '#8B5CF6', '#3B82F6', '#10B981', '#EC4899', '#F59E0B', '#06B6D4', '#6366F1', '#84CC16'];
  const BANDEIRAS = ['Visa', 'Mastercard', 'Elo', 'American Express', 'Hipercard', 'Outra'];

  function defaultState() {
    return {
      categorias: DEFAULT_CATS.map(c => Object.assign({ id: uid('fcat') }, c)),
      contas: [],
      cartoes: [],
      assinaturas: [],
      recorrencias: [],
      reservas: [],
      cdiAnual: 10.75,
    };
  }

  let state = null;

  function competenciaKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }

  function migrateV2() {
    if (state.migradoV2) return;
    const todayKey = competenciaKey(new Date());
    (state.contas || []).forEach(c => { if (!c.competencia) c.competencia = todayKey; });
    (state.cartoes || []).forEach((cartao, idx) => {
      if (cartao.cor === undefined || cartao.cor === null) cartao.cor = CARD_COLOR_PALETTE[idx % CARD_COLOR_PALETTE.length];
      if (cartao.bandeira === undefined) cartao.bandeira = '';
      if (cartao.arquivado === undefined) cartao.arquivado = false;
      if (!cartao.faturas) cartao.faturas = {};
      cartao.compras = (cartao.compras || []).map(compra => {
        if (compra.parcelas) return compra;
        const qtd = Number(compra.quantidadeTotal) || 1;
        const atual = Number(compra.parcelaAtual) || 1;
        const valorParcela = Math.round(((Number(compra.valor) || 0) / qtd) * 100) / 100;
        const parcelas = [];
        for (let i = 1; i <= qtd; i++) {
          const mesOffset = i - atual;
          const d = new Date();
          d.setMonth(d.getMonth() + mesOffset);
          parcelas.push({ numero: i, valor: valorParcela, competencia: competenciaKey(d), paga: i < atual || compra.status === 'quitada', dataPagamento: null });
        }
        return {
          id: compra.id || uid('compra'), descricao: compra.descricao, categoriaId: compra.categoriaId,
          valor: Number(compra.valor) || 0, dataCompra: window.Utils.todayISO(),
          parcelado: qtd > 1, quantidadeParcelas: qtd, cancelada: false, observacoes: '', parcelas,
        };
      });
    });
    state.migradoV2 = true;
  }

  function migrateV3() {
    if (state.migradoV3) return;
    (state.assinaturas || []).forEach(a => {
      if (a.diaCobranca === undefined) {
        const d = a.proximaCobranca ? new Date(a.proximaCobranca + 'T00:00:00') : new Date();
        a.diaCobranca = d.getDate();
        a.mesCobranca = d.getMonth() + 1;
        a.dataInicio = a.dataInicio || window.Utils.todayISO();
        a.status = a.status || 'ativa';
        a.dataCancelamento = a.dataCancelamento || null;
        a.pagamentos = a.pagamentos || {};
      }
    });
    (state.contas || []).forEach(c => { if (c.recorrenciaId === undefined) c.recorrenciaId = null; });
    if (!state.recorrencias) state.recorrencias = [];
    state.migradoV3 = true;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        state = Object.assign(defaultState(), JSON.parse(raw));
        if (!state.categorias || !state.categorias.length) state.categorias = defaultState().categorias;
        migrateV2();
        migrateV3();
      } else {
        state = defaultState();
        state.migradoV2 = true; // instalação nova: nada para migrar
        state.migradoV3 = true;
      }
    } catch (e) {
      console.error('Erro ao carregar dados Financeiros, restaurando padrão.', e);
      state = defaultState();
      state.migradoV2 = true;
      state.migradoV3 = true;
    }
    persist();
    return state;
  }
  function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function get() { return state; }
  function save(fn) { fn(state); persist(); }

  return { load, get, save, CARD_COLOR_PALETTE, BANDEIRAS, setInstance };
})();

window.FinanceiroApp = (function () {
  const U = window.Utils;
  const ACCENT = '#F97316';
  const CAT_PALETTE = ['#F97316', '#FB923C', '#EA580C', '#FBBF24', '#F43F5E', '#EF4444', '#C2410C', '#78716C'];
  const MESES_LONGOS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  function formatBRL(v) {
    return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  /* --------------------------- Utilitários de competência --------------------------- */
  function competenciaKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
  function competenciaLabel(key) { const [a, m] = key.split('-').map(Number); return `${MESES_LONGOS[m - 1]} de ${a}`; }
  function competenciaAdd(key, n) { const [a, m] = key.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return competenciaKey(d); }
  function competenciaDeCompra(dataCompraISO, cartao) {
    const d = new Date((dataCompraISO || U.todayISO()) + 'T00:00:00');
    const fechamento = Number(cartao.fechamento) || 31;
    let ano = d.getFullYear(), mes = d.getMonth();
    if (d.getDate() > fechamento) { mes += 1; if (mes > 11) { mes = 0; ano++; } }
    return `${ano}-${String(mes + 1).padStart(2, '0')}`;
  }
  function gerarParcelas(compra, cartao) {
    const primeira = competenciaDeCompra(compra.dataCompra, cartao);
    const qtd = compra.parcelado ? Math.max(1, Number(compra.quantidadeParcelas) || 1) : 1;
    const valorTotal = Number(compra.valor) || 0;
    const base = Math.floor((valorTotal / qtd) * 100) / 100;
    const resto = Math.round((valorTotal - base * qtd) * 100) / 100;
    const parcelas = [];
    for (let i = 1; i <= qtd; i++) {
      const valor = i === qtd ? Math.round((base + resto) * 100) / 100 : base;
      parcelas.push({ numero: i, valor, competencia: competenciaAdd(primeira, i - 1), paga: false, dataPagamento: null });
    }
    return parcelas;
  }

  let financeiroMes = competenciaKey(new Date());

  function monthNavHtml(extraClass) {
    return `
      <div class="month-nav ${extraClass || ''}">
        <button class="icon-btn" data-mnav="prev" style="width:28px;height:28px;"><i data-lucide="chevron-left"></i></button>
        <div class="month-nav-label">${competenciaLabel(financeiroMes)}</div>
        <button class="icon-btn" data-mnav="next" style="width:28px;height:28px;"><i data-lucide="chevron-right"></i></button>
      </div>
    `;
  }
  function bindMonthNav(scope, onChange) {
    U.qsa('[data-mnav]', scope).forEach(btn => btn.addEventListener('click', () => {
      const action = btn.getAttribute('data-mnav');
      if (action === 'prev') financeiroMes = competenciaAdd(financeiroMes, -1);
      else if (action === 'next') financeiroMes = competenciaAdd(financeiroMes, 1);
      else financeiroMes = competenciaKey(new Date());
      onChange();
    }));
  }

  function mount(folder) {
    window.FinanceiroDB.load();
    window.ModuleShell.mount({
      icon: folder ? folder.icon : 'wallet',
      title: folder ? folder.name : 'Financeiro',
      accent: folder ? folder.color2 : ACCENT,
      scopeId: 'financeiro:' + (folder ? folder.id : 'builtin'),
      tabs: [
        { key: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
        { key: 'contas', label: 'Contas', icon: 'receipt' },
        { key: 'cartoes', label: 'Cartões', icon: 'credit-card' },
        { key: 'assinaturas', label: 'Assinaturas', icon: 'repeat' },
        { key: 'projecao', label: 'Projeção', icon: 'trending-up' },
        { key: 'reservas', label: 'Reservas', icon: 'piggy-bank' },
        { key: 'simulacoes', label: 'Simulações', icon: 'flask-conical' },
      ],
      initialTab: 'dashboard',
      onRenderTab: (tab, content) => {
        cartaoDetalheId = null;
        if (tab === 'dashboard') renderDashboard(content);
        else if (tab === 'contas') renderContas(content);
        else if (tab === 'cartoes') renderCartoes(content);
        else if (tab === 'assinaturas') renderAssinaturas(content);
        else if (tab === 'projecao') renderProjecao(content);
        else if (tab === 'reservas') renderReservas(content);
        else renderSimulacoes(content);
      },
    });
  }

  function categorias() { return window.FinanceiroDB.get().categorias; }
  function catById(id) { return categorias().find(c => c.id === id) || { nome: 'Outros', cor: '#78716C' }; }

  /* --------------------------- Assinaturas: cobrança automática --------------------------- */
  function assinaturaCobraNoMes(a, mesKey) {
    const inicioMes = (a.dataInicio || U.todayISO()).slice(0, 7);
    if (mesKey < inicioMes) return false;
    if (a.status === 'cancelada') {
      if (!a.dataCancelamento) return false;
      const cancelMes = a.dataCancelamento.slice(0, 7);
      if (mesKey > cancelMes) return false;
    }
    if (a.periodicidade === 'anual') {
      const mes = Number(mesKey.split('-')[1]);
      return mes === Number(a.mesCobranca || 1);
    }
    return true;
  }
  function proximaCobrancaDe(a) {
    if (a.status === 'cancelada') return null;
    const hoje = new Date();
    const dia = Math.min(Number(a.diaCobranca) || 1, 28);
    if (a.periodicidade === 'anual') {
      const mesAlvo = Number(a.mesCobranca) || 1;
      let ano = hoje.getFullYear();
      let candidata = new Date(ano, mesAlvo - 1, dia);
      if (candidata < hoje) candidata = new Date(ano + 1, mesAlvo - 1, dia);
      return `${candidata.getFullYear()}-${String(candidata.getMonth() + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
    }
    let ano = hoje.getFullYear(), mes = hoje.getMonth();
    if (hoje.getDate() > dia) { mes += 1; if (mes > 11) { mes = 0; ano++; } }
    return `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
  }

  function cartaoLimiteUsado(cartao) {
    const s = window.FinanceiroDB.get();
    let total = (cartao.compras || []).reduce((sum, c) => {
      if (c.cancelada) return sum;
      return sum + (c.parcelas || []).filter(p => !p.paga).reduce((s2, p) => s2 + p.valor, 0);
    }, 0);
    const mesAtualReal = competenciaKey(new Date());
    (s.assinaturas || []).forEach(a => {
      if (a.cartaoId !== cartao.id) return;
      if (!assinaturaCobraNoMes(a, mesAtualReal)) return;
      if (a.pagamentos && a.pagamentos[mesAtualReal]) return;
      total += Number(a.valor) || 0;
    });
    return total;
  }

  function parcelasDoMes(cartao, competencia) {
    const s = window.FinanceiroDB.get();
    const rows = [];
    (cartao.compras || []).forEach(compra => {
      if (compra.cancelada) return;
      (compra.parcelas || []).forEach(p => {
        if (p.competencia === competencia) rows.push({ compra, parcela: p });
      });
    });
    (s.assinaturas || []).forEach(a => {
      if (a.cartaoId !== cartao.id) return;
      if (!assinaturaCobraNoMes(a, competencia)) return;
      const paga = !!(a.pagamentos && a.pagamentos[competencia]);
      rows.push({
        assinatura: a,
        parcela: { numero: null, valor: Number(a.valor) || 0, competencia, paga, dataPagamento: paga ? (a.pagamentos[competencia] === true ? null : a.pagamentos[competencia]) : null },
      });
    });
    return rows;
  }

  function totaisDoMes() {
    const s = window.FinanceiroDB.get();
    garantirContasDoMes(financeiroMes);
    const entradas = s.contas.filter(c => c.tipo === 'entrada' && c.competencia === financeiroMes).reduce((sum, c) => sum + (Number(c.valor) || 0), 0);
    const saidasContas = s.contas.filter(c => c.tipo === 'saida' && c.competencia === financeiroMes).reduce((sum, c) => sum + (Number(c.valor) || 0), 0);
    const saidasAssinaturas = s.assinaturas.filter(a => !a.cartaoId && assinaturaCobraNoMes(a, financeiroMes)).reduce((sum, a) => sum + (Number(a.valor) || 0), 0);
    let saidasCartoes = 0;
    s.cartoes.filter(c => !c.arquivado).forEach(cartao => {
      parcelasDoMes(cartao, financeiroMes).forEach(({ parcela }) => { saidasCartoes += parcela.valor; });
    });
    const saidas = saidasContas + saidasAssinaturas + saidasCartoes;
    return { entradas, saidas, saldo: entradas - saidas, saidasContas, saidasAssinaturas, saidasCartoes };
  }

  function proximoVencimento() {
    const s = window.FinanceiroDB.get();
    const today = U.todayISO();
    const hojeDia = new Date().getDate();
    const candidatos = [];
    s.contas.filter(c => c.status === 'pendente' && c.diaVencimento && c.tipo === 'saida').forEach(c => {
      let mes = new Date().getMonth(), ano = new Date().getFullYear();
      if (Number(c.diaVencimento) < hojeDia) { mes += 1; if (mes > 11) { mes = 0; ano += 1; } }
      const iso = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(Math.min(Number(c.diaVencimento), 28)).padStart(2, '0')}`;
      candidatos.push({ label: c.nome, dia: Number(c.diaVencimento), data: iso });
    });
    s.assinaturas.filter(a => a.status === 'ativa').forEach(a => {
      const prox = proximaCobrancaDe(a);
      if (prox && prox >= today) candidatos.push({ label: a.nome, data: prox });
    });
    candidatos.sort((a, b) => a.data.localeCompare(b.data));
    return candidatos[0] || null;
  }

  /* --------------------------- Contas recorrentes --------------------------- */
  function garantirContasDoMes(mesKey) {
    const s = window.FinanceiroDB.get();
    let mudou = false;
    (s.recorrencias || []).forEach(r => {
      if (r.status !== 'ativa') return;
      if (mesKey < r.criadoEm) return;
      const jaExiste = s.contas.some(c => c.recorrenciaId === r.id && c.competencia === mesKey);
      if (!jaExiste) {
        s.contas.push({
          id: U.uid('conta'), nome: r.nome, categoriaId: r.categoriaId, tipo: r.tipo, valor: r.valor,
          diaVencimento: r.diaVencimento, competencia: mesKey, status: 'pendente', observacoes: '', recorrenciaId: r.id,
        });
        mudou = true;
      }
    });
    if (mudou) window.FinanceiroDB.save(() => {});
  }

  /* --------------------------- Projeção financeira (12 meses) --------------------------- */
  // Retorna as contas "esperadas" de um mês: as que já existem de verdade, mais as recorrências
  // ativas que ainda não foram materializadas naquele mês (previsão, sem gravar nada).
  function contasProjetadasDoMes(mesKey) {
    const s = window.FinanceiroDB.get();
    const materializadas = s.contas.filter(c => c.competencia === mesKey);
    const recorrenciaIdsMaterializados = new Set(materializadas.map(c => c.recorrenciaId).filter(Boolean));
    const resultado = materializadas.slice();
    (s.recorrencias || []).filter(r => r.status === 'ativa' && mesKey >= r.criadoEm && !recorrenciaIdsMaterializados.has(r.id)).forEach(r => {
      resultado.push({ nome: r.nome, tipo: r.tipo, valor: r.valor, categoriaId: r.categoriaId, projetado: true });
    });
    return resultado;
  }

  function calcularProjecaoMes(mesKey) {
    const s = window.FinanceiroDB.get();
    const contasDoMes = contasProjetadasDoMes(mesKey);
    const receita = contasDoMes.filter(c => c.tipo === 'entrada').reduce((sum, c) => sum + (Number(c.valor) || 0), 0);
    const saidasContas = contasDoMes.filter(c => c.tipo === 'saida').reduce((sum, c) => sum + (Number(c.valor) || 0), 0);
    const saidasAssin = s.assinaturas.filter(a => !a.cartaoId && assinaturaCobraNoMes(a, mesKey)).reduce((sum, a) => sum + (Number(a.valor) || 0), 0);
    let saidasCartoes = 0;
    s.cartoes.filter(c => !c.arquivado).forEach(cartao => { parcelasDoMes(cartao, mesKey).forEach(({ parcela }) => { saidasCartoes += parcela.valor; }); });
    const comprometido = saidasContas + saidasAssin + saidasCartoes;
    const disponivel = receita - comprometido;
    const percentual = receita > 0 ? (comprometido / receita) * 100 : (comprometido > 0 ? 100 : 0);
    return { mesKey, receita, comprometido, disponivel, percentual, saidasContas, saidasAssin, saidasCartoes };
  }

  function calcularProjecao12Meses() {
    const inicio = competenciaKey(new Date());
    const meses = [];
    let saldoAcumulado = 0;
    for (let i = 0; i < 12; i++) {
      const mesKey = competenciaAdd(inicio, i);
      const proj = calcularProjecaoMes(mesKey);
      saldoAcumulado += proj.disponivel;
      meses.push(Object.assign({ saldoPrevisto: saldoAcumulado }, proj));
    }
    return meses;
  }

  function pctColor(pct) {
    if (pct >= 90) return '#EF4444';
    if (pct >= 70) return '#F59E0B';
    return '#22C55E';
  }

  /* ================================ PROJEÇÃO (tab) ================================ */
  function renderProjecao(content) {
    const meses = calcularProjecao12Meses();
    const mesAtualKey = competenciaKey(new Date());

    content.innerHTML = `
      <div class="dg-section-title"><i data-lucide="calendar-range"></i> Linha do tempo — próximos 12 meses</div>
      <div class="projecao-timeline" id="projecao-timeline" style="margin-bottom:24px;"></div>

      <div class="dg-section-title"><i data-lucide="table"></i> Detalhamento mês a mês</div>
      <div class="table-wrap">

          <tbody id="projecao-tbody"></tbody>
        </table>
      </div>
      <p class="text-faint" style="font-size:11.5px; margin-top:12px;">Considera automaticamente contas (inclusive recorrências ainda não geradas), parcelas de cartão já agendadas e assinaturas ativas. Compras futuras e pagamentos programados entram assim que forem cadastrados.</p>

      return `

          <div class="mc-pct" style="color:${cor};">${pctExibido}%</div>
          <div class="mc-bar"><div class="mc-bar-fill" style="width:${Math.min(100, m.percentual)}%; background:${cor};"></div></div>
          <div class="mc-sub">${formatBRL(m.disponivel)} livre</div>

    }).join('');

    document.getElementById('projecao-tbody').innerHTML = meses.map(m => {

        </tr>

    U.lucide();
    U.qsa('[data-jump-mes]', content).forEach(chip => chip.addEventListener('click', () => {
      financeiroMes = chip.getAttribute('data-jump-mes');
      window.UI.toast(`Mês selecionado: ${competenciaLabel(financeiroMes)}. Abra "Contas" ou "Cartões" para ver os detalhes.`, 'default');
    }));

  /* ================================ DASHBOARD ================================ */
  /* --------------------------- Helpers do Dashboard Financeiro final --------------------------- */
  function limiteDisponivelTotal() {
    const s = window.FinanceiroDB.get();
    return s.cartoes.filter(c => !c.arquivado).reduce((sum, c) => sum + Math.max(0, (Number(c.limite) || 0) - cartaoLimiteUsado(c)), 0);
  }
  function faturaAtualTotal() {
    const s = window.FinanceiroDB.get();
    const mesAtual = competenciaKey(new Date());
    let total = 0;
    s.cartoes.filter(c => !c.arquivado).forEach(cartao => { parcelasDoMes(cartao, mesAtual).forEach(({ parcela }) => { total += parcela.valor; }); });
    return total;
  }
  function proximoFechamento() {
    const s = window.FinanceiroDB.get();
    const hojeDia = new Date().getDate();
    let melhor = null;
    s.cartoes.filter(c => !c.arquivado && c.fechamento).forEach(c => {
      let dias = Number(c.fechamento) - hojeDia;
      if (dias < 0) dias += 30;
      if (!melhor || dias < melhor.dias) melhor = { nome: c.nome, dia: c.fechamento, dias };
    });
    return melhor;
  }
  function assinaturasDoMesInfo() {
    const s = window.FinanceiroDB.get();
    const mesAtual = competenciaKey(new Date());
    const ativas = s.assinaturas.filter(a => assinaturaCobraNoMes(a, mesAtual));
    return { qtd: ativas.length, total: ativas.reduce((sum, a) => sum + (Number(a.valor) || 0), 0) };
  }
  function contasAVencerInfo() {
    const mesAtual = competenciaKey(new Date());
    garantirContasDoMes(mesAtual);
    const s = window.FinanceiroDB.get();
    const pendentes = s.contas.filter(c => c.competencia === mesAtual && c.status === 'pendente' && c.tipo === 'saida');
    return { qtd: pendentes.length, total: pendentes.reduce((sum, c) => sum + (Number(c.valor) || 0), 0) };
  }
  function reservasResumoGlobal() {
    const s = window.FinanceiroDB.get();
    let guardado = 0, investido = 0, rendimento = 0;
    s.reservas.forEach(r => { const c = calcularReserva(r); guardado += c.valorAtual; investido += c.totalInvestido; rendimento += c.totalRendimento; });
    return { guardado, investido, rendimento };
  }

  function renderDashboard(content) {
    const t = totaisDoMes();
    const s = window.FinanceiroDB.get();
    const cartoesAtivos = s.cartoes.filter(c => !c.arquivado);
    const prox = proximoVencimento();
    const fech = proximoFechamento();
    const assinInfo = assinaturasDoMesInfo();

        <div class="dg-card"><div class="dg-card-icon" style="background:#22C55E22; color:#22C55E;"><i data-lucide="arrow-down-circle"></i></div><div class="dg-card-label">Receitas</div><div class="dg-card-value">${formatBRL(t.entradas)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#EF444422; color:#EF4444;"><i data-lucide="arrow-up-circle"></i></div><div class="dg-card-label">Despesas / comprometido</div><div class="dg-card-value">${formatBRL(t.saidas)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="wallet"></i></div><div class="dg-card-label">Valor livre</div><div class="dg-card-value">${formatBRL(t.saldo)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="credit-card"></i></div><div class="dg-card-label">Limite disponível (cartões)</div><div class="dg-card-value">${formatBRL(limiteDisponivelTotal())}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="receipt"></i></div><div class="dg-card-label">Fatura atual (todos cartões)</div><div class="dg-card-value">${formatBRL(faturaAtualTotal())}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#F9731622; color:#F97316;"><i data-lucide="calendar-clock"></i></div><div class="dg-card-label">Próximo vencimento</div><div class="dg-card-value" style="font-size:12.5px;">${prox ? `${U.escapeHtml(prox.label)} · ${U.formatDateBR(prox.data)}` : 'Nada pendente'}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#8B5CF622; color:#8B5CF6;"><i data-lucide="calendar-x"></i></div><div class="dg-card-label">Próximo fechamento</div><div class="dg-card-value" style="font-size:12.5px;">${fech ? `${U.escapeHtml(fech.nome)} · dia ${fech.dia}` : '—'}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="repeat"></i></div><div class="dg-card-label">Assinaturas do mês</div><div class="dg-card-value">${assinInfo.qtd} · ${formatBRL(assinInfo.total)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#EAB30822; color:#EAB308;"><i data-lucide="receipt-text"></i></div><div class="dg-card-label">Contas a vencer</div><div class="dg-card-value">${contasInfo.qtd} · ${formatBRL(contasInfo.total)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#3B82F622; color:#3B82F6;"><i data-lucide="piggy-bank"></i></div><div class="dg-card-label">Reserva financeira</div><div class="dg-card-value">${formatBRL(reservasInfo.guardado)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#3B82F622; color:#3B82F6;"><i data-lucide="landmark"></i></div><div class="dg-card-label">Total investido</div><div class="dg-card-value">${formatBRL(reservasInfo.investido)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#22C55E22; color:#22C55E;"><i data-lucide="line-chart"></i></div><div class="dg-card-label">Rendimento acumulado</div><div class="dg-card-value">${formatBRL(reservasInfo.rendimento)}</div></div>
      </div>

      <div class="dg-content" style="margin-bottom:18px;">
        <div class="card">
          <div class="dg-section-title"><i data-lucide="pie-chart"></i> Saídas por categoria — ${competenciaLabel(financeiroMes)}</div>
          <canvas id="fin-chart-cat" height="180"></canvas>
        </div>
        <div class="card">
          <div class="dg-section-title"><i data-lucide="bar-chart-2"></i> Limite dos cartões</div>
          <canvas id="fin-chart-cartoes" height="180"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="dg-section-title"><i data-lucide="bell"></i> Próximos vencimentos</div>
        <div id="fin-proximos"></div>
      </div>
    `;
    U.lucide();

    const porCategoria = {};
    function add(catId, valor) {
      const cat = catById(catId);
      porCategoria[cat.nome] = porCategoria[cat.nome] || { valor: 0, cor: cat.cor };
      porCategoria[cat.nome].valor += valor;
    }
    s.contas.filter(c => c.tipo === 'saida' && c.competencia === financeiroMes).forEach(c => add(c.categoriaId, Number(c.valor) || 0));
    s.assinaturas.filter(a => !a.cartaoId && assinaturaCobraNoMes(a, financeiroMes)).forEach(a => add(a.categoriaId, Number(a.valor) || 0));
    cartoesAtivos.forEach(cartao => parcelasDoMes(cartao, financeiroMes).forEach(({ compra, assinatura, parcela }) => add(compra ? compra.categoriaId : assinatura.categoriaId, parcela.valor)));

    const canvas = document.getElementById('fin-chart-cat');
    const catNames = Object.keys(porCategoria);
    if (!catNames.length) {
      canvas.parentElement.innerHTML = window.UI.emptyState('pie-chart', 'Nenhuma saída neste mês', 'Cadastre contas, cartões ou assinaturas para ver o gráfico.');
      U.lucide();
    } else if (window.Chart) {
      if (window.__finChart) window.__finChart.destroy();
      window.__finChart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: { labels: catNames, datasets: [{ data: catNames.map(n => porCategoria[n].valor.toFixed(2)), backgroundColor: catNames.map(n => porCategoria[n].cor), borderWidth: 0 }] },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#8B94A7', font: { family: 'Inter', size: 11 }, boxWidth: 10, padding: 10 } } } },
      });
    }

    const cartoesCanvas = document.getElementById('fin-chart-cartoes');
    if (!cartoesAtivos.length) {
      cartoesCanvas.parentElement.innerHTML = window.UI.emptyState('credit-card', 'Nenhum cartão cadastrado', '');
      U.lucide();
    } else if (window.Chart) {
      if (window.__finChartCartoes) window.__finChartCartoes.destroy();
      const usados = cartoesAtivos.map(c => Math.round(cartaoLimiteUsado(c) * 100) / 100);
      const disponiveis = cartoesAtivos.map((c, i) => Math.max(0, Math.round(((Number(c.limite) || 0) - usados[i]) * 100) / 100));
      window.__finChartCartoes = new Chart(cartoesCanvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: cartoesAtivos.map(c => c.nome),
          datasets: [
            { label: 'Usado', data: usados, backgroundColor: '#EF4444', stack: 'a' },
            { label: 'Disponível', data: disponiveis, backgroundColor: '#22C55E', stack: 'a' },
          ],
        },
        options: {
          responsive: true, indexAxis: 'y',
          plugins: { legend: { position: 'bottom', labels: { color: '#8B94A7', font: { size: 11 }, boxWidth: 10, padding: 10 } } },
          scales: { x: { stacked: true, ticks: { color: '#8B94A7', font: { size: 10 } } }, y: { stacked: true, ticks: { color: '#8B94A7', font: { size: 11 } } } },
        },
      });
    }

    const prox2 = [];
    s.contas.filter(c => c.status === 'pendente' && c.diaVencimento && c.tipo === 'saida').forEach(c => prox2.push({ label: c.nome, meta: `Dia ${c.diaVencimento}`, color: catById(c.categoriaId).cor, valor: c.valor }));
    s.assinaturas.filter(a => a.status === 'ativa').forEach(a => { const prx = proximaCobrancaDe(a); if (prx) prox2.push({ label: a.nome, meta: U.formatDateBR(prx), color: catById(a.categoriaId).cor, valor: a.valor, data: prx }); });
    prox2.sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    document.getElementById('fin-proximos').innerHTML = prox2.length
      ? `<div class="timeline">` + prox2.slice(0, 8).map(p => `
          <div class="timeline-item">
            <div class="timeline-dot" style="background:${p.color};"></div>
            <div class="timeline-content">
              <div class="t-title">${U.escapeHtml(p.label)}</div>
              <div class="t-meta">${p.meta} · ${formatBRL(p.valor)}</div>
            </div>
          </div>
        `).join('') + `</div>`
      : window.UI.emptyState('calendar-check', 'Nada pendente por aqui', '');
    U.lucide();
  }

  /* ================================ CONTAS ================================ */
  let contasTipoFilter = 'todas';
  let contasCatFilter = 'todas';

  function renderContas(content) {
    garantirContasDoMes(financeiroMes);
    const s = window.FinanceiroDB.get();
    const list = s.contas.filter(c =>
      c.competencia === financeiroMes &&
      (contasTipoFilter === 'todas' || c.tipo === contasTipoFilter) &&
      (contasCatFilter === 'todas' || c.categoriaId === contasCatFilter)
    ).sort((a, b) => (Number(a.diaVencimento) || 99) - (Number(b.diaVencimento) || 99));

    content.innerHTML = `
      <div class="filter-bar">
        ${monthNavHtml()}
        <button class="filter-chip ${contasTipoFilter === 'todas' ? 'mod-chip-active' : ''}" data-tipo="todas">Todas</button>
        <button class="filter-chip ${contasTipoFilter === 'entrada' ? 'mod-chip-active' : ''}" data-tipo="entrada">Entradas</button>
        <button class="filter-chip ${contasTipoFilter === 'saida' ? 'mod-chip-active' : ''}" data-tipo="saida">Saídas</button>
        <button class="icon-btn" id="btn-manage-cats-contas" title="Gerenciar categorias"><i data-lucide="settings-2"></i></button>
        <div style="flex:1;"></div>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-conta"><i data-lucide="plus"></i> Nova conta</button>
      </div>
      <div id="contas-list"></div>
    `;
    U.lucide();
    bindMonthNav(content, () => renderContas(content));

    document.getElementById('contas-list').innerHTML = list.length
      ? `<div class="item-grid">` + list.map(c => contaCard(c)).join('') + `</div>`
      : window.UI.emptyState('receipt', `Nenhuma conta em ${competenciaLabel(financeiroMes)}`, 'Cadastre água, luz, internet, salário e mais.');

    U.lucide();
    U.qsa('[data-tipo]', content).forEach(b => b.addEventListener('click', () => { contasTipoFilter = b.getAttribute('data-tipo'); renderContas(content); }));
    document.getElementById('btn-manage-cats-contas').addEventListener('click', () => openCategoriaManager(content, renderContas));
    document.getElementById('btn-add-conta').addEventListener('click', () => openContaForm(null, content));
    U.qsa('[data-open-conta]', content).forEach(b => b.addEventListener('click', (e) => {
      if (e.target.closest('[data-dup-conta],[data-manage-rec]')) return;
      const c = window.FinanceiroDB.get().contas.find(x => x.id === b.getAttribute('data-open-conta'));
      openContaForm(c, content);
    }));
    U.qsa('[data-dup-conta]', content).forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-dup-conta');
      window.FinanceiroDB.save(s2 => {
        const original = s2.contas.find(x => x.id === id);
        const copia = Object.assign({}, original, { id: U.uid('conta'), competencia: competenciaAdd(financeiroMes, 1), status: 'pendente', recorrenciaId: null });
        s2.contas.push(copia);
      });
      window.UI.toast(`Conta duplicada para ${competenciaLabel(competenciaAdd(financeiroMes, 1))}.`, 'success');
      renderContas(content);
    }));
    U.qsa('[data-manage-rec]', content).forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      openRecorrenciaManager(b.getAttribute('data-manage-rec'), content);
    }));
  }

  function contaCard(c) {
    const cat = catById(c.categoriaId);
    const hojeDia = new Date().getDate();
    const isMesAtual = financeiroMes === competenciaKey(new Date());

    const statusMeta = c.status === 'paga' ? { label: 'Paga', color: '#22C55E' } : atrasada ? { label: 'Atrasada', color: '#EF4444' } : { label: 'Pendente', color: '#EAB308' };

    return `
      <div class="card" data-open-conta="${c.id}" style="cursor:pointer;">

          <div>
            <div class="item-card-title">${U.escapeHtml(c.nome)} ${recorrencia ? `<i data-lucide="repeat" style="width:12px;height:12px; color:var(--text-faint); vertical-align:middle;" title="Recorrente"></i>` : ''}</div>
            <div class="item-card-meta" style="margin-top:4px;">
              <span style="width:7px; height:7px; border-radius:50%; background:${cat.cor}; display:inline-block;"></span> ${U.escapeHtml(cat.nome)}

              ${recorrencia && recorrencia.status !== 'ativa' ? `· <span style="color:#EAB308;">${recorrencia.status === 'pausada' ? 'pausada' : 'encerrada'}</span>` : ''}

          <span class="status-pill" style="background:${statusMeta.color}22; color:${statusMeta.color};">${statusMeta.label}</span>
        </div>
        <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:10px;">
          <div style="font-size:16px; font-weight:800; color:${c.tipo === 'entrada' ? '#22C55E' : 'var(--text)'};">${formatBRL(c.valor)}</div>
          <div class="item-card-meta">Dia ${c.diaVencimento || '—'}</div>
        </div>
        <div class="item-card-actions">
          ${recorrencia
            ? `<button class="btn btn-soft btn-sm" data-manage-rec="${recorrencia.id}" style="flex:1;"><i data-lucide="repeat"></i> Gerenciar recorrência</button>`

      </div>

    window.UI.openModal({
      title: isEdit ? 'Editar conta' : 'Nova conta',
      bodyHtml: `

          <div class="field span-2"><label>Nome</label><input id="f-nome" value="${U.escapeHtml(c.nome)}" placeholder="Ex: Água, Luz, Internet, Salário..."></div>

          <div class="field"><label>Categoria</label>
            <select id="f-cat">${categorias().map(cat => `<option value="${cat.id}" ${c.categoriaId === cat.id ? 'selected' : ''}>${U.escapeHtml(cat.nome)}</option>`).join('')}</select>
