                `).join('')}
              </div>
              ${e.checklist && e.checklist.length ? `<div class="text-faint" style="font-size:11px; margin-top:4px;">${doneCount}/${e.checklist.length} concluído(s)</div>` : ''}
            </div>
          </div>
        `;
        }).join('');

        U.qsa('[data-edit]', el).forEach(b => b.addEventListener('click', () => openEtapaForm(t.etapas.find(x => x.id === b.getAttribute('data-edit')), () => etapas.render(container))));
        U.qsa('[data-del]', el).forEach(b => b.addEventListener('click', () => {
          window.UI.confirmDialog('Remover esta etapa?', () => {
            saveTcc(tt => { tt.etapas = tt.etapas.filter(x => x.id !== b.getAttribute('data-del')); });
            etapas.render(container);
          });
        }));
        U.qsa('[data-dup]', el).forEach(b => b.addEventListener('click', () => {
          saveTcc(tt => {
            const orig = tt.etapas.find(x => x.id === b.getAttribute('data-dup'));
            const copy = JSON.parse(JSON.stringify(orig));
            copy.id = U.uid('etapa');
            copy.nome = orig.nome + ' (cópia)';
            copy.checklist = (copy.checklist || []).map(c => ({ ...c, id: U.uid('chk') }));
            tt.etapas.splice(tt.etapas.indexOf(orig) + 1, 0, copy);
          });
          etapas.render(container);
        }));
        U.qsa('[data-chk]', el).forEach(cb => cb.addEventListener('change', () => {
          const [eid, cid] = cb.getAttribute('data-chk').split(':');
          saveTcc(tt => { tt.etapas.find(x => x.id === eid).checklist.find(c => c.id === cid).done = cb.checked; });
        }));
      }
    }
  };

  function openEtapaForm(etapa, onSaved) {
    const isEdit = !!etapa;
    const t = tcc();
    const defaultCor = U.ETAPA_PALETTE[t.etapas.length % U.ETAPA_PALETTE.length];
    const e = etapa || { id: null, nome: '', descricao: '', dataInicio: U.todayISO(), dataFim: U.addDays(U.todayISO(), 14), status: 'pendente', observacoes: '', responsavel: '', cor: defaultCor, checklist: [] };
    window.UI.openModal({
      title: isEdit ? 'Editar etapa' : 'Nova etapa',
      size: 'lg',
      bodyHtml: `
        <div class="form-grid">

              <option value="andamento" ${e.status==='andamento'?'selected':''}>Em andamento</option>

            </select>
          </div>
          <div class="field"><label>Responsável</label><input id="f-resp" value="${U.escapeHtml(e.responsavel)}"></div>
          <div class="field span-2"><label>Cor da etapa</label>
            <div class="field-color-row" id="f-color-row">
              ${U.ETAPA_PALETTE.map(c => `<div class="color-swatch ${e.cor === c ? 'selected' : ''}" style="background:${c}" data-color="${c}"></div>`).join('')}
              <input type="color" id="f-cor-custom" value="${e.cor}" style="width:26px;height:26px;padding:0;border:none;border-radius:8px;background:none;cursor:pointer;">
            </div>
          </div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(e.observacoes)}</textarea></div>
          <div class="field span-2">
            <label>Checklist</label>
            <div id="checklist-box"></div>
            <div class="checklist-add"><input id="f-check-new" placeholder="Novo item..."><button class="btn btn-soft btn-sm" id="btn-add-check">Adicionar</button></div>
          </div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        let selectedColor = e.cor;
        U.qsa('.color-swatch', overlay).forEach(sw => {
          sw.addEventListener('click', () => {
            selectedColor = sw.getAttribute('data-color');
            U.qsa('.color-swatch', overlay).forEach(s => s.classList.remove('selected'));
            sw.classList.add('selected');
            U.qs('#f-cor-custom', overlay).value = selectedColor;
          });
        });
        U.qs('#f-cor-custom', overlay).addEventListener('input', (ev) => { selectedColor = ev.target.value; });

        let checklist = JSON.parse(JSON.stringify(e.checklist || []));
        function refresh() {
          const box = U.qs('#checklist-box', overlay);
          box.innerHTML = checklist.length ? checklist.map(c => `
            <div class="checklist-item ${c.done ? 'done' : ''}">
              <input type="checkbox" data-t="${c.id}" ${c.done ? 'checked' : ''}><span>${U.escapeHtml(c.texto)}</span>
              <button class="icon-btn" data-d="${c.id}" style="margin-left:auto;"><i data-lucide="x"></i></button>
            </div>`).join('') : '<div class="text-faint" style="font-size:12px;">Nenhum item ainda.</div>';
          U.lucide();
          U.qsa('[data-t]', box).forEach(cb => cb.addEventListener('change', () => { checklist.find(c => c.id === cb.getAttribute('data-t')).done = cb.checked; refresh(); }));
          U.qsa('[data-d]', box).forEach(b => b.addEventListener('click', () => { checklist = checklist.filter(c => c.id !== b.getAttribute('data-d')); refresh(); }));
        }
        refresh();
        U.qs('#btn-add-check', overlay).addEventListener('click', () => {
          const input = U.qs('#f-check-new', overlay);
          if (!input.value.trim()) return;
          checklist.push({ id: U.uid('chk'), texto: input.value.trim(), done: false });
          input.value = ''; refresh();

        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        if (isEdit) U.qs('#f-delete', overlay).addEventListener('click', () => {
          window.UI.confirmDialog('Remover esta etapa?', () => {
            saveTcc(tt => { tt.etapas = tt.etapas.filter(x => x.id !== e.id); });
            window.UI.closeModal(); onSaved && onSaved();
          });
        });

  const projeto = {
    render(container) {

        <div class="content-inner">
          ${T.tccHeader('projeto')}

                <div style="display:flex; justify-content:space-between; align-items:start;">

                  <span class="badge ${U.statusBadge(p.status).cls}">${U.statusBadge(p.status).label}</span>
                </div>
                ${p.data ? `<div class="text-faint" style="font-size:11.5px; margin-top:6px;">${U.formatDateBR(p.data)}</div>` : ''}
                ${p.observacoes ? `<p class="text-muted" style="font-size:12px; margin-top:8px;">${U.escapeHtml(p.observacoes)}</p>` : ''}
                <div class="row-actions" style="opacity:1; margin-top:10px;">
                  <button class="btn btn-ghost btn-sm" data-edit-proj="${p.id}"><i data-lucide="pencil"></i> Editar</button>
                  <button class="icon-btn" data-del-proj="${p.id}"><i data-lucide="trash-2"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      U.lucide();
      U.qs('#btn-add-item', container).addEventListener('click', () => openProjetoForm(null, container));
      U.qsa('[data-edit-proj]', container).forEach(b => b.addEventListener('click', () => openProjetoForm(t.projeto.find(x => x.id === b.getAttribute('data-edit-proj')), container)));
      U.qsa('[data-del-proj]', container).forEach(b => b.addEventListener('click', () => {
        saveTcc(tt => { tt.projeto = tt.projeto.filter(x => x.id !== b.getAttribute('data-del-proj')); });
        projeto.render(container);
      }));
    }
  };

  function openProjetoForm(item, container) {
    const isEdit = !!item;
    const p = item || { id: null, nome: '', status: 'pendente', arquivos: [], data: '', observacoes: '' };
    window.UI.openModal({
      title: isEdit ? 'Editar item do projeto' : 'Novo item do projeto',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome</label><input id="f-nome" value="${U.escapeHtml(p.nome)}"></div>
          <div class="field"><label>Status</label>
            <select id="f-status">
              <option value="pendente" ${p.status==='pendente'?'selected':''}>Pendente</option>
              <option value="andamento" ${p.status==='andamento'?'selected':''}>Em andamento</option>
              <option value="concluido" ${p.status==='concluido'?'selected':''}>Concluído</option>
            </select>
          </div>
          <div class="field"><label>Data</label><input id="f-data" type="date" value="${p.data || ''}"></div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(p.observacoes)}</textarea></div>
        </div>
      `,
      footerHtml: `<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Salvar</button>`,
      onMount: (overlay) => {

  // Agenda várias orientações de uma vez (você já sabe todas as datas do
  // semestre): cada linha vira um registro separado, com professor/resumo
  // em branco pra você preencher depois de cada reunião acontecer.
  function openBulkOrientForm(container) {
    let rows = [U.todayISO()];
    window.UI.openModal({
      title: 'Agendar várias orientações',
      bodyHtml: `
        <p class="text-muted" style="font-size:12.5px; margin-bottom:14px;">
          Adicione todas as datas que você já tem marcadas. Depois de cada
          reunião, é só abrir o registro e preencher o que foi conversado.
        </p>
        <div id="bulk-rows"></div>
        <button class="btn btn-soft btn-sm" id="bulk-add-row" type="button" style="margin-top:8px;"><i data-lucide="plus"></i> Adicionar outra data</button>
      `,
      footerHtml: `<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save-bulk">Agendar todas</button>`,
      onMount: (overlay) => {
        const rowsEl = U.qs('#bulk-rows', overlay);
        function renderRows() {
          rowsEl.innerHTML = rows.map((val, i) => `
            <div class="form-grid" style="margin-bottom:8px; align-items:end;">
              <div class="field"><label>Data ${i + 1}</label><input type="date" class="bulk-date" value="${val}"></div>
              <div class="field" style="flex:0;"><button class="icon-btn bulk-remove-row" ${rows.length === 1 ? 'disabled' : ''} type="button"><i data-lucide="x"></i></button></div>
            </div>
          `).join('');
          U.lucide();
          U.qsa('.bulk-date', rowsEl).forEach((input, i) => input.addEventListener('input', () => { rows[i] = input.value; }));
          U.qsa('.bulk-remove-row', rowsEl).forEach((btn, i) => btn.addEventListener('click', () => {
            if (rows.length > 1) { rows.splice(i, 1); renderRows(); }
          }));
        }
        renderRows();

        U.qs('#bulk-add-row', overlay).addEventListener('click', () => {
          const last = rows[rows.length - 1] || U.todayISO();
          rows.push(U.addDays(last, 14)); // sugere daqui 2 semanas, ajustável
          renderRows();
        });

        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        U.qs('#f-save-bulk', overlay).addEventListener('click', () => {
          const validRows = rows.filter(Boolean);
          if (!validRows.length) { window.UI.toast('Adicione ao menos uma data', 'error'); return; }
          saveTcc(tt => {
            validRows.forEach(data => {
              tt.orientacoes.push({ id: U.uid('orient'), data, professor: '', resumo: '', pendencias: '', prazo: '', anexos: [] });
            });
          });
          window.UI.closeModal();
          window.UI.toast(`${validRows.length} orientação(ões) agendada(s)`, 'success');
          orientacoes.render(container);
        });
      }
    });
  }

          footerHtml: `<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Adicionar</button>`,
          onMount: (overlay) => {
            window.UI.bindFileAttachInput(overlay, 'tcc-file', newItem);
            U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
            U.qs('#f-save', overlay).addEventListener('click', () => {
              const nome = U.qs('#f-nome', overlay).value.trim();
              if (!nome) { window.UI.toast('Informe o nome do arquivo', 'error'); return; }
              Object.assign(newItem, { nome, categoria: U.qs('#f-cat', overlay).value, link: U.qs('#f-link', overlay).value, data: U.todayISO() });
              saveTcc(tt => { tt.arquivos.push(newItem); });
              window.UI.closeModal();
              arquivos.render(container);
            });
          }
        });
      });
      U.qsa('[data-del-file]', container).forEach(b => b.addEventListener('click', () => {
        const removed = t.arquivos.find(x => x.id === b.getAttribute('data-del-file'));
        if (removed && removed.localFileId) window.LocalFiles.remove(removed.localFileId);
        saveTcc(tt => { tt.arquivos = tt.arquivos.filter(x => x.id !== b.getAttribute('data-del-file')); });
        arquivos.render(container);
      }));
      U.qsa('[data-open-local]', container).forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); window.UI.openLocalFile(b.getAttribute('data-open-local')); }));
    }
  };

  Object.assign(window.Pages.tcc, { etapas, projeto, referencias, ideias, orientacoes, arquivos, openEtapaForm });
})();

window.Pages = window.Pages || {};

window.Pages.estagio = (function () {
  const U = window.Utils;

  // Compatível com registros antigos (que só tinham um único dia: `data`
  // + `horas` digitado à mão). Para esses, tratamos início = fim = data e
  // usamos as horas já salvas, sem recalcular nada.
  const horasDoRegistro = U.estagioHorasRegistro;

  function periodoLabel(r) {
    if (r.dataInicio && r.dataFim) {
      return r.dataInicio === r.dataFim
        ? U.formatDateBR(r.dataInicio)
        : `${U.formatDateBR(r.dataInicio)} → ${U.formatDateBR(r.dataFim)}`;
    }
    return U.formatDateBR(r.data);
  }

  function sortKey(r) {
    return r.dataInicio || r.data || '';
  }

  function render(container) {
    const state = window.DB.get();
    const est = state.estagio;
    const horasFeitas = est.registros.reduce((s, r) => s + horasDoRegistro(r), 0);
    const horasRestantes = Math.max(0, est.horasObrigatorias - horasFeitas);
    const pct = est.horasObrigatorias ? Math.round((horasFeitas / est.horasObrigatorias) * 100) : 0;
    const sorted = [...est.registros].sort((a, b) => sortKey(b).localeCompare(sortKey(a)));

    container.innerHTML = `
      <div class="content-inner">
        <div class="page-header">
          <div>
            <h1>Estágio</h1>
            <div class="subtitle">Gerenciamento das horas e entrega dos relatórios</div>
          </div>
          <div class="header-actions">
            <button class="btn btn-ghost" id="btn-edit-required"><i data-lucide="settings-2"></i> Definir carga exigida</button>
            <button class="btn btn-primary" id="btn-add-registro"><i data-lucide="plus"></i> Novo registro</button>
          </div>
        </div>

        <div class="grid grid-3">
          ${statCard('target', 'Horas obrigatórias', `${est.horasObrigatorias}h`)}
          ${statCard('check-circle-2', 'Horas realizadas', `${horasFeitas}h`)}
          ${statCard('hourglass', 'Horas restantes', `${horasRestantes}h`)}
        </div>

        <div class="card section">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12.5px;">
            <span class="text-muted">Progresso</span>
            <span class="mono" style="font-weight:700;">${pct}%</span>
          </div>
          ${window.UI.progressBar(pct, '#6B7280')}
        </div>

        <div class="page-header" style="margin-bottom:14px;">
          <h3 style="font-size:15px;">Registros</h3>
        </div>
        ${sorted.length === 0 ? `<div class="card">${window.UI.emptyState('briefcase', 'Nenhum registro de estágio', '')}</div>` : `
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Período</th><th>Empresa</th><th>Carga/dia</th><th>Horas</th><th>Relatório</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${sorted.map(r => `
                <tr>
                  <td>${periodoLabel(r)}</td>
                  <td>${U.escapeHtml(r.empresa)}</td>
                  <td class="mono">${r.cargaHorariaDiaria != null ? r.cargaHorariaDiaria + 'h' : '—'}</td>
                  <td class="mono">${horasDoRegistro(r)}h</td>
                  <td>${r.relatorio ? `<span class="badge badge-success">Entregue</span>` : `<span class="badge badge-muted">Pendente</span>`}</td>
                  <td><span class="badge ${U.statusBadge(r.status).cls}">${U.statusBadge(r.status).label}</span></td>
                  <td><div class="row-actions">
                    <button class="icon-btn" data-edit-reg="${r.id}"><i data-lucide="pencil"></i></button>
                    <button class="icon-btn" data-del-reg="${r.id}"><i data-lucide="trash-2"></i></button>
                  </div></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`}
      </div>
    `;
    U.lucide();
    bindEvents(container);
  }

  function statCard(icon, label, value) {
    return `<div class="card stat-card"><div class="stat-icon"><i data-lucide="${icon}"></i></div><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
  }

  function bindEvents(container) {
    U.qs('#btn-add-registro', container).addEventListener('click', () => openRegistroForm(null, container));
    U.qs('#btn-edit-required', container).addEventListener('click', () => openRequiredForm(container));
    U.qsa('[data-edit-reg]', container).forEach(b => b.addEventListener('click', () => {
      const r = window.DB.get().estagio.registros.find(x => x.id === b.getAttribute('data-edit-reg'));
      openRegistroForm(r, container);
    }));
    U.qsa('[data-del-reg]', container).forEach(b => b.addEventListener('click', () => {
      window.UI.confirmDialog('Remover este registro?', () => {
        window.DB.save(s => { s.estagio.registros = s.estagio.registros.filter(x => x.id !== b.getAttribute('data-del-reg')); });
        render(container);
      });
    }));
  }

  function openRequiredForm(container) {
    const est = window.DB.get().estagio;
    window.UI.openModal({
      title: 'Carga horária exigida',
      bodyHtml: `<div class="field"><label>Horas obrigatórias totais</label><input id="f-horas" type="number" min="0" value="${est.horasObrigatorias}"></div>`,
      footerHtml: `<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Salvar</button>`,
      onMount: (overlay) => {
        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        U.qs('#f-save', overlay).addEventListener('click', () => {
          window.DB.save(s => { s.estagio.horasObrigatorias = Number(U.qs('#f-horas', overlay).value || 0); });
          window.UI.closeModal();
          render(container);
        });
      }
    });
  }

  function openRegistroForm(reg, container) {
    const isEdit = !!reg;
    const r = reg || {
      id: null,
      dataInicio: U.todayISO(), dataFim: U.todayISO(), cargaHorariaDiaria: 6,
      empresa: '', relatorio: false, status: 'pendente',
    };
    // Registro antigo (formato de um único dia) sendo editado pela primeira
    // vez no formato novo: pré-preenche início/fim com o dia que já existia.
    const dataInicioInicial = r.dataInicio || r.data || U.todayISO();
    const dataFimInicial = r.dataFim || r.data || U.todayISO();
    const cargaInicial = r.cargaHorariaDiaria != null ? r.cargaHorariaDiaria : 6;

    window.UI.openModal({
      title: isEdit ? 'Editar registro' : 'Novo registro de estágio',
      bodyHtml: `
        <div class="form-grid">
          <div class="field"><label>Data de início</label><input id="f-ini" type="date" value="${dataInicioInicial}"></div>
          <div class="field"><label>Data de fim</label><input id="f-fim" type="date" value="${dataFimInicial}"></div>
          <div class="field"><label>Carga horária diária</label><input id="f-carga" type="number" min="0" step="0.5" value="${cargaInicial}"></div>
          <div class="field">
            <label>Total calculado (dias úteis)</label>
            <div id="f-total-preview" class="mono" style="padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg-subtle); font-weight:700;">
              ${U.businessDaysBetween(dataInicioInicial, dataFimInicial) * Number(cargaInicial || 0)}h
            </div>
          </div>
          <div class="field span-2"><label>Empresa</label><input id="f-empresa" value="${U.escapeHtml(r.empresa)}"></div>
          <div class="field"><label>Status</label>
            <select id="f-status">
              <option value="pendente" ${r.status==='pendente'?'selected':''}>Pendente</option>
              <option value="andamento" ${r.status==='andamento'?'selected':''}>Em andamento</option>
              <option value="concluido" ${r.status==='concluido'?'selected':''}>Concluído</option>
            </select>
          </div>
          <div class="field checkbox-row"><input type="checkbox" id="f-relatorio" ${r.relatorio ? 'checked' : ''}><label>Relatório entregue</label></div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        const updatePreview = () => {
          const ini = U.qs('#f-ini', overlay).value;
          const fim = U.qs('#f-fim', overlay).value;
          const carga = Number(U.qs('#f-carga', overlay).value || 0);
          const total = ini && fim ? U.businessDaysBetween(ini, fim) * carga : 0;
          U.qs('#f-total-preview', overlay).textContent = `${total}h`;
        };
        U.qs('#f-ini', overlay).addEventListener('input', updatePreview);
        U.qs('#f-fim', overlay).addEventListener('input', updatePreview);
        U.qs('#f-carga', overlay).addEventListener('input', updatePreview);

        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        if (isEdit) U.qs('#f-delete', overlay).addEventListener('click', () => {
          window.DB.save(s => { s.estagio.registros = s.estagio.registros.filter(x => x.id !== r.id); });
          window.UI.closeModal();
          render(container);
        });
        U.qs('#f-save', overlay).addEventListener('click', () => {
          const payload = {
            dataInicio: U.qs('#f-ini', overlay).value,
            dataFim: U.qs('#f-fim', overlay).value,
            cargaHorariaDiaria: Number(U.qs('#f-carga', overlay).value || 0),
            empresa: U.qs('#f-empresa', overlay).value.trim(), status: U.qs('#f-status', overlay).value,
            relatorio: U.qs('#f-relatorio', overlay).checked,
          };
          window.DB.save(s => {
            if (isEdit) {
              const alvo = s.estagio.registros.find(x => x.id === r.id);
              // Remove os campos do formato antigo pra não ficar com dado
              // duplicado/inconsistente depois de editar no formato novo.
              delete alvo.data; delete alvo.horas;
              Object.assign(alvo, payload);
            } else {
              s.estagio.registros.push(Object.assign({ id: U.uid('estagio') }, payload));
            }
          });
          window.UI.closeModal();
          window.UI.toast('Registro salvo', 'success');
          render(container);
        });
      }
    });
  }

  return { render };
})();

/* ===================== script.js ===================== */
/* ==========================================================================
   script.js
   Ponto de entrada. Roteador baseado em hash + busca global.
   ========================================================================== */

window.Router = (function () {
  const U = window.Utils;
  let currentRoute = 'dashboard';
  let scopeId = 'estudos:builtin';

  function setScope(id) { scopeId = id; }

  function activeTabKey(route) {
    if (route.indexOf('custom/') === 0) return 'custom:' + route.slice(7);
    if (route === 'disciplinas' || route.startsWith('disciplinas/')) return 'disciplinas';
    if (route.startsWith('tcc/')) return 'tcc';
    if (['dashboard', 'tarefas', 'calendario', 'cronograma', 'estagio', 'configuracoes'].includes(route)) return route;
    return 'dashboard';
  }

  function parseHash() {
    let h = window.location.hash.replace('#', '');
    if (!h) h = 'dashboard';
    return h;
  }

  function navigate(route) {
    window.location.hash = route;
  }

  function rerender() {
    renderCurrent();
  }

  // Atualiza apenas o destaque da aba ativa na module-tabs (a barra é estática, criada uma vez em mountApp).
  function refreshTabs() {
    const key = activeTabKey(currentRoute);
    U.qsa('.module-tab[data-key]').forEach(b => b.classList.toggle('active', b.getAttribute('data-key') === key));
  }

  function renderCurrent() {
    currentRoute = parseHash();
    refreshTabs();

    const content = U.qs('#main-content');
    if (!content) return;
    content.scrollTop = 0;

    if (currentRoute.indexOf('custom/') === 0) return window.TabCustomizer.renderCustomTabPage(scopeId, currentRoute.slice(7), content);
    if (currentRoute === 'dashboard') return window.Pages.dashboard.render(content);
    if (currentRoute === 'disciplinas') return window.Pages.disciplinas.render(content);
    if (currentRoute.startsWith('disciplinas/')) return window.Pages.disciplinas.renderDetail(content, currentRoute.split('/')[1]);
    if (currentRoute === 'tarefas') return window.Pages.tarefas.render(content);
    if (currentRoute === 'calendario') return window.Pages.calendario.render(content);
    if (currentRoute === 'cronograma') return window.Pages.cronograma.render(content);
    if (currentRoute === 'estagio') return window.Pages.estagio.render(content);
    if (currentRoute === 'configuracoes') return window.Pages.configuracoes.render(content);
    if (currentRoute === 'tcc/dashboard') return window.Pages.tcc.dashboard.render(content);
    if (currentRoute === 'tcc/cronograma') return window.Pages.tcc.cronogramaTcc.render(content);
    if (currentRoute === 'tcc/etapas') return window.Pages.tcc.etapas.render(content);
    if (currentRoute === 'tcc/projeto') return window.Pages.tcc.projeto.render(content);
    if (currentRoute === 'tcc/referencias') return window.Pages.tcc.referencias.render(content);
    if (currentRoute === 'tcc/ideias') return window.Pages.tcc.ideias.render(content);
    if (currentRoute === 'tcc/orientacoes') return window.Pages.tcc.orientacoes.render(content);
    if (currentRoute === 'tcc/arquivos') return window.Pages.tcc.arquivos.render(content);

    // fallback
    window.Pages.dashboard.render(content);
  }

  let listenerBound = false;
  function init() {
    if (!listenerBound) {
      window.addEventListener('hashchange', renderCurrent);
      listenerBound = true;
    }
    renderCurrent();
  }

  return { navigate, rerender, refreshTabs, init, setScope, getScope: () => scopeId, getCurrentRoute: () => currentRoute };
})();

(function () {
  const U = window.Utils;

  function buildIndex() {
    const state = window.DB.get();
    const items = [];
    state.disciplinas.forEach(d => items.push({ label: d.nome, sub: 'Disciplina', route: 'disciplinas/' + d.id, icon: 'book-open' }));
    state.tarefas.forEach(t => items.push({ label: t.titulo, sub: 'Tarefa', route: 'tarefas', icon: 'check-square' }));
    state.tcc.etapas.forEach(e => items.push({ label: e.nome, sub: 'Etapa do TCC', route: 'tcc/etapas', icon: 'flag' }));
    state.tcc.referencias.forEach(r => items.push({ label: r.titulo, sub: 'Referência TCC', route: 'tcc/referencias', icon: 'library' }));
    state.tcc.ideias.forEach(i => items.push({ label: i.titulo, sub: 'Ideia TCC', route: 'tcc/ideias', icon: 'lightbulb' }));
    return items;
  }

  function renderResults(query) {
    const box = U.qs('#search-results');
    if (!box) return;
    if (!query) { box.style.display = 'none'; box.innerHTML = ''; return; }
    const q = query.toLowerCase();
    const results = buildIndex().filter(i => i.label.toLowerCase().includes(q)).slice(0, 8);
    if (!results.length) { box.style.display = 'block'; box.innerHTML = `<div style="padding:14px; font-size:12.5px; color:var(--text-faint);">Nenhum resultado para "${U.escapeHtml(query)}"</div>`; return; }
    box.style.display = 'block';
    box.innerHTML = results.map(r => `
      <div class="search-result-item" data-route="${r.route}" style="display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; font-size:13px;">
        <i data-lucide="${r.icon}" style="width:15px; height:15px; color:var(--text-muted);"></i>
        <span style="flex:1;">${U.escapeHtml(r.label)}</span>
        <span class="text-faint" style="font-size:11px;">${r.sub}</span>
      </div>
    `).join('');
    U.lucide();
    U.qsa('.search-result-item', box).forEach(item => {
      item.addEventListener('mouseenter', () => item.style.background = 'var(--card-hover)');
      item.addEventListener('mouseleave', () => item.style.background = 'transparent');
      item.addEventListener('click', () => {
        window.Router.navigate(item.getAttribute('data-route'));
        U.qs('#global-search-input').value = '';
        box.style.display = 'none';
      });
    });
  }

  window.__bindGlobalSearch = function () {
    const input = U.qs('#global-search-input');
    if (!input) return;
    input.addEventListener('input', U.debounce((e) => renderResults(e.target.value), 150));
    input.addEventListener('focus', (e) => { if (e.target.value) renderResults(e.target.value); });
    document.addEventListener('click', (e) => {
      const box = U.qs('#search-results');
      if (box && !e.target.closest('.search-box') && !e.target.closest('#search-results')) box.style.display = 'none';
    });
  };
})();

window.Theme = (function () {
  function apply(theme) {
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    const btn = document.getElementById('btn-theme-toggle');
    if (btn) {
      btn.innerHTML = theme === 'light' ? '<i data-lucide="moon"></i>' : '<i data-lucide="sun"></i>';
      window.Utils.lucide();
    }
  }

  function current() {
    const s = window.DB.get();
    return (s && s.config.theme === 'light') ? 'light' : 'dark';
  }

  function toggle() {
    const next = current() === 'light' ? 'dark' : 'light';
    window.DB.save(s => { s.config.theme = next; });
    apply(next);
  }

  function init() {
    apply(current());
    const btn = document.getElementById('btn-theme-toggle');
    if (btn) btn.addEventListener('click', toggle);
  }

  return { apply, current, toggle, init };
})();

/* ----------------------------- Crypto (PBKDF2) --------------------------- */
window.Crypto2 = (function () {
  function bytesToBase64(bytes) {
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }
  function base64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function randomSalt(len) {
    const arr = new Uint8Array(len || 16);
    crypto.getRandomValues(arr);
    return bytesToBase64(arr);
  }
  async function deriveHash(password, saltB64, iterations) {
    const enc = new TextEncoder();
    const salt = base64ToBytes(saltB64);
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, keyMaterial, 256);
    return bytesToBase64(new Uint8Array(bits));
  }
  return { randomSalt, deriveHash };
})();

/* ------------------------------ Workspace store --------------------------- */
window.WS = (function () {
  const KEY = 'laura_workspace_v1';

  function defaultState() {
    return {
      auth: null, // { salt, hash, iterations, createdAt }
      security: { autoLockMinutes: 15, failedAttempts: 0, lockedUntil: null },
    };
  }

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = Object.assign(defaultState(), parsed);
        state.security = Object.assign(defaultState().security, parsed.security);
      } else {
        state = defaultState();
        persist();
      }
    } catch (e) {
      console.error('Erro ao carregar dados do workspace, restaurando padrão.', e);
      state = defaultState();
      persist();
    }
    return state;
  }

  function persist() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function get() { return state; }

  function save(mutatorFn) {
    mutatorFn(state);
    persist();
  }

  function wipeAll() {
    // Remove os dados de autenticação/configuração do workspace e de todos os módulos existentes,
    // incluindo pastas customizadas criadas a partir de modelos.
    ['faculdade_app_state_v1', 'igreja_workspace_v1', 'eventos_workspace_v1', 'financeiro_workspace_v1', 'pessoal_workspace_v1']
      .forEach(k => localStorage.removeItem(k));
    try {
      const prefixByTemplate = {
        estudos: 'folder_estudos_v1::', financeiro: 'folder_financeiro_v1::', igreja: 'folder_igreja_v1::',
        eventos: 'folder_eventos_v1::', pessoal: 'folder_pessoal_v1::',
      };
      const folders = window.FoldersDB ? window.FoldersDB.allIncludingArchived() : [];
      folders.forEach(f => {
        const prefix = prefixByTemplate[f.template];
        if (prefix) localStorage.removeItem(prefix + f.id);
      });
      if (window.FoldersDB) window.FoldersDB.wipeAll();
    } catch (e) {
      console.error('Erro ao limpar pastas customizadas.', e);
    }
    localStorage.removeItem(KEY);
    state = defaultState();
    persist();
  }

  return { load, get, save, wipeAll, defaultState };
})();

/* -------------------------------- Autenticação ----------------------------- */
window.WorkspaceAuth = (function () {
  const C = window.Crypto2;
  const ITERATIONS = 150000;

  function isConfigured() {
    return !!(window.WS.get().auth);
  }

  async function setup(password) {
    const salt = C.randomSalt(16);
    const hash = await C.deriveHash(password, salt, ITERATIONS);
    window.WS.save(s => {
      const existingQuestions = (s.auth && s.auth.questions) || null;
      s.auth = { salt, hash, iterations: ITERATIONS, createdAt: Date.now(), questions: existingQuestions };
      s.security.failedAttempts = 0;
      s.security.lockedUntil = null;
    });
  }

  function normalizeAnswer(a) { return (a || '').trim().toLowerCase(); }

  async function hashAnswer(answer) {
    const salt = C.randomSalt(16);
    const hash = await C.deriveHash(normalizeAnswer(answer), salt, ITERATIONS);
    return { salt, hash, iterations: ITERATIONS };
  }

  async function checkAnswer(answer, stored) {
    const hash = await C.deriveHash(normalizeAnswer(answer), stored.salt, stored.iterations);
    return hash === stored.hash;
  }

  function hasQuestions() {
    const a = window.WS.get().auth;
    return !!(a && Array.isArray(a.questions) && a.questions.length === 3);
  }

  function getQuestionTexts() {
    const a = window.WS.get().auth;
    return (a && a.questions) ? a.questions.map(q => q.question) : [];
  }

  function saveQuestions(list) {
    window.WS.save(s => { s.auth.questions = list; });
  }

  async function verifyAnswers(answers) {
    const a = window.WS.get().auth;
    if (!a || !Array.isArray(a.questions) || a.questions.length !== 3) return false;
    for (let i = 0; i < 3; i++) {
      const ok = await checkAnswer(answers[i], a.questions[i]);
      if (!ok) return false;
    }
    return true;
  }

  async function resetPasswordViaQuestions(newPassword) {
    await setup(newPassword);
  }

  async function verify(password) {
    const s = window.WS.get();
    if (!s.auth) return false;
    const hash = await C.deriveHash(password, s.auth.salt, s.auth.iterations);
    return hash === s.auth.hash;
  }

  async function changePassword(current, next) {
    const ok = await verify(current);
    if (!ok) return false;
    await setup(next);
    return true;
  }

  function isLockedOut() {
    const s = window.WS.get().security;
    return !!(s.lockedUntil && Date.now() < s.lockedUntil);
  }

  function lockoutRemaining() {
    const s = window.WS.get().security;
    return s.lockedUntil ? Math.max(0, Math.ceil((s.lockedUntil - Date.now()) / 1000)) : 0;
  }

  function registerFail() {
    window.WS.save(s => {
      s.security.failedAttempts = (s.security.failedAttempts || 0) + 1;
      if (s.security.failedAttempts >= 5) {
        s.security.lockedUntil = Date.now() + 30000;
        s.security.failedAttempts = 0;
      }
    });
  }

  function registerSuccess() {
    window.WS.save(s => {
      s.security.failedAttempts = 0;
      s.security.lockedUntil = null;
    });
  }

  function togglePwVisibility(btn, input) {
    const isPw = input.type === 'password';
    input.type = isPw ? 'text' : 'password';
    btn.innerHTML = `<i data-lucide="${isPw ? 'eye-off' : 'eye'}"></i>`;
    window.Utils.lucide();
  }

  /* --------- Tela: criar senha (primeira execução) --------- */
  function showSetupScreen(onDone) {
    const wrap = window.Utils.el(`
      <div class="auth-screen" id="setup-screen">
        <div class="auth-card">
          <div class="auth-icon"><i data-lucide="shield-check"></i></div>
          <div class="auth-title">Bem-vinda ao Laura Workspace</div>
          <div class="auth-sub">Crie uma senha para proteger seu espaço pessoal. Ela será usada sempre que você abrir o sistema.</div>
          <div class="auth-form">
            <div class="field">
              <label>Nova senha</label>
              <div class="pw-field">
                <input type="password" id="setup-pw1" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
                <button type="button" class="pw-toggle" data-target="setup-pw1"><i data-lucide="eye"></i></button>
              </div>
              <div class="auth-strength"><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="field">
              <label>Confirmar senha</label>
              <div class="pw-field">
                <input type="password" id="setup-pw2" placeholder="Repita a senha" autocomplete="new-password">
                <button type="button" class="pw-toggle" data-target="setup-pw2"><i data-lucide="eye"></i></button>
              </div>
            </div>
            <div class="auth-error" id="setup-error"><i data-lucide="alert-triangle"></i><span></span></div>
            <button class="btn btn-primary" id="setup-submit" style="justify-content:center; padding:11px;">Criar senha e continuar</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(wrap);
    window.Utils.lucide();

    const pw1 = wrap.querySelector('#setup-pw1');
    const pw2 = wrap.querySelector('#setup-pw2');
    const errBox = wrap.querySelector('#setup-error');
    const strengthEls = wrap.querySelectorAll('.auth-strength span');

    function showError(msg) {
      errBox.querySelector('span').textContent = msg;
      errBox.classList.add('show');
    }
    function clearError() { errBox.classList.remove('show'); }

    function strengthScore(pw) {
      let score = 0;
      if (pw.length >= 6) score++;
      if (pw.length >= 10) score++;
      if (/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;
      return score;
    }
    pw1.addEventListener('input', () => {
      const score = strengthScore(pw1.value);
      const colors = ['var(--danger)', 'var(--warning)', '#84CC16', 'var(--success)'];
      strengthEls.forEach((el, i) => { el.style.background = i < score ? colors[score - 1] : 'var(--border-soft)'; });
    });

    wrap.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => togglePwVisibility(btn, wrap.querySelector('#' + btn.getAttribute('data-target'))));
    });

    async function submit() {
      clearError();
      const p1 = pw1.value, p2 = pw2.value;
      if (p1.length < 6) return showError('A senha deve ter pelo menos 6 caracteres.');
      if (p1 !== p2) return showError('As senhas não coincidem.');
      await setup(p1);
      wrap.remove();
      onDone();
    }
    wrap.querySelector('#setup-submit').addEventListener('click', submit);
    pw2.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }

  /* --------- Tela: login / bloqueio --------- */
  function showLoginScreen(onSuccess, opts) {
    opts = opts || {};
    const isLock = !!opts.isLock;
    const container = opts.container || document.body;
    const U = window.Utils;

    const wrap = U.el(`<div class="auth-screen" id="login-screen"><div class="auth-card"></div></div>`);
    container.appendChild(wrap);
    const card = wrap.querySelector('.auth-card');

    /* --------- Passo 1: login normal --------- */
    function renderLoginStep() {
      card.innerHTML = `
        <div class="auth-icon"><i data-lucide="${isLock ? 'lock' : 'shield-check'}"></i></div>
        <div class="auth-title">${isLock ? 'Workspace bloqueado' : 'Laura Workspace'}</div>
        <div class="auth-sub">${isLock ? 'Digite sua senha para continuar de onde parou.' : 'Digite sua senha para entrar.'}</div>
        <div class="auth-form">
          <div class="field">
            <label>Senha</label>
            <div class="pw-field">
              <input type="password" id="login-pw" placeholder="Sua senha" autocomplete="current-password">
              <button type="button" class="pw-toggle" data-target="login-pw"><i data-lucide="eye"></i></button>
            </div>
          </div>
          <div class="auth-error" id="login-error"><i data-lucide="alert-triangle"></i><span></span></div>
          <div class="auth-lockout" id="login-lockout"><i data-lucide="timer"></i><span></span></div>
          <button class="btn btn-primary" id="login-submit" style="justify-content:center; padding:11px;">Entrar</button>
          <div class="auth-forgot" id="login-forgot">Esqueci minha senha</div>
        </div>
      `;
      U.lucide();

      const pwInput = card.querySelector('#login-pw');
      const errBox = card.querySelector('#login-error');
      const lockoutBox = card.querySelector('#login-lockout');
      const submitBtn = card.querySelector('#login-submit');

      function showError(msg) { errBox.querySelector('span').textContent = msg; errBox.classList.add('show'); }
      function clearError() { errBox.classList.remove('show'); }

      let lockoutTimer = null;
      function refreshLockoutUI() {
        if (isLockedOut()) {
          submitBtn.disabled = true;
          lockoutBox.classList.add('show');
          lockoutBox.querySelector('span').textContent = `Muitas tentativas incorretas. Tente novamente em ${lockoutRemaining()}s.`;
          lockoutTimer = setTimeout(refreshLockoutUI, 1000);
        } else {
          submitBtn.disabled = false;
          lockoutBox.classList.remove('show');
          if (lockoutTimer) clearTimeout(lockoutTimer);
        }
      }
      refreshLockoutUI();

      card.querySelectorAll('.pw-toggle').forEach(btn => {
        btn.addEventListener('click', () => togglePwVisibility(btn, card.querySelector('#' + btn.getAttribute('data-target'))));
      });

      async function submit() {
        if (isLockedOut()) return;
        clearError();
        const ok = await verify(pwInput.value);
        if (ok) {
          registerSuccess();
          if (lockoutTimer) clearTimeout(lockoutTimer);
          wrap.remove();
          onSuccess();
        } else {
          registerFail();
          pwInput.value = '';
          pwInput.focus();
          if (isLockedOut()) refreshLockoutUI();
          else showError('Senha incorreta. Tente novamente.');
        }
      }
      submitBtn.addEventListener('click', submit);
      pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      setTimeout(() => pwInput.focus(), 350);

      // Clique aqui já troca o cartão para as perguntas — nenhuma senha é exigida antes disso.
      card.querySelector('#login-forgot').addEventListener('click', () => {
        if (isLockedOut()) { window.UI.toast('Aguarde o tempo de bloqueio antes de tentar novamente.', 'default'); return; }
        if (hasQuestions()) renderQuestionsStep();
        else renderNoQuestionsStep();
      });
    }

    /* --------- Passo 2 (recuperação): responder perguntas — nenhuma senha envolvida --------- */
    function renderQuestionsStep() {
      const qtexts = getQuestionTexts();
      card.innerHTML = `
        <div class="auth-icon"><i data-lucide="help-circle"></i></div>
        <div class="auth-title">Perguntas de segurança</div>
        <div class="auth-sub">Responda corretamente para definir uma nova senha, sem perder seus dados.</div>
        <div class="auth-form">
          ${qtexts.map((q, i) => `
            <div class="field">
              <label>${U.escapeHtml(q)}</label>
              <input id="rq-answer-${i}" placeholder="Sua resposta">
            </div>
          `).join('')}
          <div class="auth-error" id="rq-error"><i data-lucide="alert-triangle"></i><span></span></div>
          <div class="auth-lockout" id="rq-lockout"><i data-lucide="timer"></i><span></span></div>
          <button class="btn btn-primary" id="rq-verify" style="justify-content:center; padding:11px;">Verificar respostas</button>
          <div class="auth-forgot" id="rq-back">Voltar para o login</div>
          <div class="auth-forgot" id="rq-wipe-link">Prefiro apagar todos os dados</div>
        </div>
      `;
      U.lucide();

      const verifyBtn = card.querySelector('#rq-verify');
      const errBox = card.querySelector('#rq-error');
      const lockoutBox = card.querySelector('#rq-lockout');

      function refreshLockoutUI() {
        if (isLockedOut()) {
          verifyBtn.disabled = true;
          lockoutBox.classList.add('show');
          lockoutBox.querySelector('span').textContent = `Muitas tentativas incorretas. Tente novamente em ${lockoutRemaining()}s.`;
        } else {
          verifyBtn.disabled = false;
          lockoutBox.classList.remove('show');
        }
      }
      refreshLockoutUI();

      card.querySelector('#rq-back').addEventListener('click', renderLoginStep);
      card.querySelector('#rq-wipe-link').addEventListener('click', renderWipeStep);
      setTimeout(() => { const first = card.querySelector('#rq-answer-0'); if (first) first.focus(); }, 50);

      verifyBtn.addEventListener('click', async () => {
        if (isLockedOut()) return;
        errBox.classList.remove('show');
        const answers = [0, 1, 2].map(i => card.querySelector('#rq-answer-' + i).value);
        const ok = await verifyAnswers(answers);
        if (ok) {
          registerSuccess();
          renderNewPasswordStep();
        } else {
          registerFail();
          if (isLockedOut()) {
            refreshLockoutUI();
          } else {
            errBox.querySelector('span').textContent = 'Uma ou mais respostas estão incorretas.';
            errBox.classList.add('show');
          }
        }
      });
    }

    /* --------- Passo 2b: sem perguntas configuradas ainda --------- */
    function renderNoQuestionsStep() {
      card.innerHTML = `
        <div class="auth-icon"><i data-lucide="help-circle"></i></div>
        <div class="auth-title">Esqueci minha senha</div>
        <div class="auth-sub" style="text-align:left; line-height:1.6;">
          Não é possível recuperar sua senha, pois ela nunca é armazenada em texto puro.<br><br>
          Você ainda não configurou perguntas de segurança (isso é feito em Configurações do Workspace, depois de entrar). Por enquanto, a única opção é apagar completamente os dados do Laura Workspace.
        </div>
        <div class="auth-form">
          <button class="btn btn-danger" id="nq-wipe" style="justify-content:center; padding:11px;"><i data-lucide="trash-2"></i> Apagar tudo e recomeçar</button>
          <div class="auth-forgot" id="nq-back">Voltar para o login</div>
        </div>
      `;
      U.lucide();
      card.querySelector('#nq-back').addEventListener('click', renderLoginStep);
      card.querySelector('#nq-wipe').addEventListener('click', renderWipeStep);
    }

    /* --------- Passo 3 (opcional): apagar tudo --------- */
    function renderWipeStep() {
      card.innerHTML = `
        <div class="auth-icon" style="background:linear-gradient(135deg, var(--danger), #F87171);"><i data-lucide="trash-2"></i></div>
        <div class="auth-title">Apagar todos os dados</div>
        <div class="auth-sub">Isso apagará permanentemente sua senha e todos os dados de todos os módulos do Laura Workspace neste dispositivo. Esta ação não pode ser desfeita.</div>
        <div class="auth-form">
          <button class="btn btn-danger" id="wipe-confirm" style="justify-content:center; padding:11px;">Apagar tudo e recomeçar</button>
          <div class="auth-forgot" id="wipe-back">Cancelar e voltar</div>
        </div>
      `;
      U.lucide();
      card.querySelector('#wipe-back').addEventListener('click', renderLoginStep);
      card.querySelector('#wipe-confirm').addEventListener('click', () => {
        window.WS.wipeAll();
        window.location.reload();
      });
    }

    /* --------- Passo 4: recuperação bem-sucedida — definir nova senha e entrar --------- */
    function renderNewPasswordStep() {
      card.innerHTML = `
        <div class="auth-icon"><i data-lucide="shield-check"></i></div>
        <div class="auth-title">Definir nova senha</div>
        <div class="auth-sub">Identidade confirmada. Escolha uma nova senha para entrar.</div>
        <div class="auth-form">
          <div class="field">
            <label>Nova senha</label>
            <div class="pw-field"><input type="password" id="rp-pw1" placeholder="Mínimo de 6 caracteres"><button type="button" class="pw-toggle" data-target="rp-pw1"><i data-lucide="eye"></i></button></div>
          </div>
          <div class="field">
            <label>Confirmar nova senha</label>
            <div class="pw-field"><input type="password" id="rp-pw2" placeholder="Repita a senha"><button type="button" class="pw-toggle" data-target="rp-pw2"><i data-lucide="eye"></i></button></div>
          </div>
          <div class="auth-error" id="rp-error"><i data-lucide="alert-triangle"></i><span></span></div>
          <button class="btn btn-primary" id="rp-save" style="justify-content:center; padding:11px;">Salvar e entrar</button>
        </div>
      `;
      U.lucide();
      card.querySelectorAll('.pw-toggle').forEach(btn => btn.addEventListener('click', () => togglePwVisibility(btn, card.querySelector('#' + btn.getAttribute('data-target')))));
      setTimeout(() => { const f = card.querySelector('#rp-pw1'); if (f) f.focus(); }, 50);

      card.querySelector('#rp-save').addEventListener('click', async () => {
        const errBox = card.querySelector('#rp-error');
        errBox.classList.remove('show');
        const p1 = card.querySelector('#rp-pw1').value;
        const p2 = card.querySelector('#rp-pw2').value;
        if (p1.length < 6) { errBox.querySelector('span').textContent = 'A senha deve ter pelo menos 6 caracteres.'; errBox.classList.add('show'); return; }
        if (p1 !== p2) { errBox.querySelector('span').textContent = 'As senhas não coincidem.'; errBox.classList.add('show'); return; }
        await resetPasswordViaQuestions(p1);
        window.UI.toast('Senha redefinida com sucesso.', 'success');
        wrap.remove();
        onSuccess();
      });
    }

    renderLoginStep();
    return wrap;
  }

  function boot() {
    if (!isConfigured()) {
      showSetupScreen(() => {
        window.WorkspaceLock.markUnlocked();
        window.Hub.render();
      });
    } else {
      showLoginScreen(() => {
        window.WorkspaceLock.markUnlocked();
        window.Hub.render();
      });
    }
  }

  return {
    isConfigured, setup, verify, changePassword, isLockedOut, lockoutRemaining,
    registerFail, registerSuccess, showSetupScreen, showLoginScreen, boot, togglePwVisibility,
    hasQuestions, getQuestionTexts, saveQuestions, verifyAnswers, hashAnswer, resetPasswordViaQuestions,
  };
})();

/* -------------------------------- Bloqueio automático ------------------------------ */
window.WorkspaceLock = (function () {
  let unlocked = false;
  let lastActivity = Date.now();
  let overlayShown = false;
  let checkTimer = null;

  function markUnlocked() { unlocked = true; lastActivity = Date.now(); }
  function markLocked() { unlocked = false; }

  function bump() { lastActivity = Date.now(); }

  function initActivityTracking() {
    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, bump, { passive: true });
    });
    checkTimer = setInterval(checkAutoLock, 10000);
  }

  function checkAutoLock() {
    if (!unlocked || overlayShown) return;
    const minutes = (window.WS.get().security.autoLockMinutes);
    if (!minutes || minutes === 'never') return;
    const elapsedMin = (Date.now() - lastActivity) / 60000;
    if (elapsedMin >= Number(minutes)) lockNow();
  }

  function lockNow() {
    if (!unlocked || overlayShown) return;
    overlayShown = true;
    markLocked();
    const overlay = window.Utils.el('<div class="lock-overlay" id="lock-overlay"></div>');
    document.body.appendChild(overlay);
    window.WorkspaceAuth.showLoginScreen(() => {
      overlay.remove();
      overlayShown = false;
      markUnlocked();
    }, { isLock: true, container: overlay });
  }

  return { initActivityTracking, markUnlocked, lockNow };
})();

/* --------------------------- Pastas dinâmicas (Modelos) --------------------------- */
window.FoldersDB = (function () {
  const KEY = 'laura_custom_folders_v1';
  const { uid } = window.Utils;
  let state = null;

  function defaultState() { return { folders: [], archivedBuiltins: [] }; }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
      if (!state.archivedBuiltins) state.archivedBuiltins = [];
    } catch (e) {
      console.error('Erro ao carregar pastas personalizadas, restaurando padrão.', e);
      state = defaultState();
    }
    return state;
  }
  function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function all() { return (state || load()).folders; }
  function list() { return all().filter(f => !f.archived); }
  function listArchived() { return all().filter(f => f.archived); }
  function get(id) { return all().find(f => f.id === id) || null; }
  function create({ name, icon, color1, color2, template }) {
    if (!state) load();
    const folder = { id: uid('folder'), name, icon, color1, color2, template, createdAt: Date.now(), archived: false };
    state.folders.push(folder);
    persist();
    return folder;
  }
  function update(id, patch) {
    if (!state) load();
    const f = state.folders.find(x => x.id === id);
    if (!f) return null;
    Object.assign(f, patch);
    persist();
    return f;
  }
  function remove(id) {
    if (!state) load();
    state.folders = state.folders.filter(x => x.id !== id);
    persist();
  }
  function archive(id) { return update(id, { archived: true }); }
  function unarchive(id) { return update(id, { archived: false }); }

  // Pastas fixas (builtin) não vivem aqui, mas seu estado de arquivamento sim.
  function isBuiltinArchived(id) {
    if (!state) load();
    return state.archivedBuiltins.includes(id);
  }
  function archiveBuiltin(id) {
    if (!state) load();
    if (!state.archivedBuiltins.includes(id)) state.archivedBuiltins.push(id);
    persist();
  }
  function unarchiveBuiltin(id) {
    if (!state) load();
    state.archivedBuiltins = state.archivedBuiltins.filter(x => x !== id);
    persist();
  }
  function listArchivedBuiltins() {
    if (!state) load();
    return state.archivedBuiltins.slice();
  }

  function wipeAll() {
    localStorage.removeItem(KEY);
    state = defaultState();
  }

  return {
    load, list, listArchived, get, create, update, remove, archive, unarchive,
    isBuiltinArchived, archiveBuiltin, unarchiveBuiltin, listArchivedBuiltins, wipeAll,
    allIncludingArchived: all,
  };
})();

            <span class="wf-3d" style="--f1:${f.color1}; --f2:${f.color2}; opacity:.65;">

      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-open-archived-builtin');
        const folder = FOLDERS.find(f => f.id === id);
        if (folder && folder.template) window.Templates.setInstance(folder.template, null);
        openModule(id);

      btn.addEventListener('click', () => {

        e.stopPropagation();
        const id = btn.getAttribute('data-restore-custom');
        window.FoldersDB.unarchive(id);
        window.UI.toast('Pasta restaurada.', 'success');
        renderArchived();
      });
    });
  }

  function openModule(id) {
    if (id === 'faculdade') return window.mountApp();
    if (id === 'dashboard-geral') return window.DashboardGeral.render();
    if (id === 'igreja') return window.IgrejaApp.mount();
    if (id === 'eventos') return window.EventosApp.mount();
    if (id === 'financeiro') return window.FinanceiroApp.mount();
    if (id === 'pessoal') return window.PessoalApp.mount();
  }

  return { render, renderArchived, FOLDERS };
})();
