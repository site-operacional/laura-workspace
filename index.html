/* ==========================================================================
   styles.css — Sistema de Gerenciamento Acadêmico
   Tema escuro · Inter · Lucide icons
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0F1117;
  --bg-elevated: #131722;
  --sidebar: #161B22;
  --card: #1E293B;
  --card-hover: #24304A;
  --border: #2A3344;
  --border-soft: #232C3D;
  --text: #E7EBF3;
  --text-muted: #8B94A7;
  --text-faint: #5B6478;
  --accent: #1F7A4D;
  --accent-hover: #24915C;
  --accent-soft: rgba(31, 122, 77, 0.18);
  --accent-text: #6EE7B7;
  --accent-grad-end: #34D399;
  --danger: #EF4444;
  --warning: #EAB308;
  --success: #22C55E;
  --info: #38BDF8;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.45);
  --sidebar-w: 264px;
  --sidebar-w-collapsed: 76px;
  --topbar-h: 64px;
  --ease: cubic-bezier(.4,0,.2,1);
  --row-alt-bg: rgba(255,255,255,0.02);
  --row-alt-label-bg: #212C41;
  --scrollbar-thumb: #2A3344;
  --scrollbar-thumb-hover: #3A4560;
  --overlay-bg: rgba(6,7,11,0.65);
}

:root[data-theme="light"] {
  --bg: #F3F5F8;
  --bg-elevated: #FFFFFF;
  --sidebar: #FFFFFF;
  --card: #FFFFFF;
  --card-hover: #F1F4F8;
  --border: #E1E5EB;
  --border-soft: #EAEDF1;
  --text: #171A21;
  --text-muted: #5B6474;
  --text-faint: #939CAC;
  --accent: #1F7A4D;
  --accent-hover: #186B41;
  --accent-soft: rgba(31, 122, 77, 0.12);
  --accent-text: #1B7A4C;
  --accent-grad-end: #34D399;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
  --shadow: 0 4px 16px rgba(15,23,42,0.08);
  --shadow-lg: 0 12px 40px rgba(15,23,42,0.14);
  --row-alt-bg: rgba(15,23,42,0.02);
  --row-alt-label-bg: #F5F7FA;
  --scrollbar-thumb: #D6DBE3;
  --scrollbar-thumb-hover: #C1C8D3;
  --overlay-bg: rgba(30,35,45,0.4);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background-color .2s var(--ease), color .2s var(--ease);
}
.sidebar, .card, .topbar, .modal, .kanban-col, .week-grid, .gantt-wrap, .table-wrap, .calendar-day, .toast {
  transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
}
h1,h2,h3,h4,h5 { margin: 0; font-weight: 700; letter-spacing: -0.02em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
::selection { background: var(--accent-soft); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); background-clip: padding-box; }

.text-muted { color: var(--text-muted); }
.text-faint { color: var(--text-faint); }
.mono { font-family: 'JetBrains Mono', monospace; }

/* ============================== APP SHELL ============================== */
#app { display: flex; height: 100vh; width: 100vw; }

.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--sidebar);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  transition: width .2s var(--ease), min-width .2s var(--ease);
  overflow-x: hidden;
  overflow-y: auto;
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); min-width: var(--sidebar-w-collapsed); }
.sidebar.collapsed .nav-label,
.sidebar.collapsed .brand-name,
.sidebar.collapsed .chevron,
.sidebar.collapsed .nav-subgroup,
.sidebar.collapsed .semester-pill span { display: none; }
.sidebar.collapsed .nav-group-toggle { justify-content: center; }

.sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 18px; }
.brand { display: flex; align-items: center; gap: 10px; overflow: hidden; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-grad-end));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  color: #fff;
}
.brand-mark svg { width: 18px; height: 18px; }
.brand-name { font-size: 15px; font-weight: 700; white-space: nowrap; }

.icon-btn {
  background: transparent; border: 1px solid transparent; color: var(--text-muted);
  width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .15s var(--ease); flex-shrink: 0;
}
.icon-btn:hover { background: var(--card); color: var(--text); border-color: var(--border); }
.icon-btn svg { width: 16px; height: 16px; }

.sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-divider { height: 1px; background: var(--border-soft); margin: 10px 6px; }

.nav-item, .nav-group-toggle {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px;
  border-radius: 9px; color: var(--text-muted); font-size: 13.5px; font-weight: 500;
  cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
  transition: background .15s var(--ease), color .15s var(--ease);
  white-space: nowrap;
}
.nav-item svg, .nav-group-toggle svg { width: 17px; height: 17px; flex-shrink: 0; }
.nav-item:hover, .nav-group-toggle:hover { background: var(--card); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); }
.nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chevron { width: 14px !important; height: 14px !important; transition: transform .2s var(--ease); }
.nav-group.open .chevron { transform: rotate(180deg); }
.nav-subgroup { max-height: 0; overflow: hidden; transition: max-height .25s var(--ease); display: flex; flex-direction: column; gap: 1px; padding-left: 30px; }
.nav-group.open .nav-subgroup { max-height: 400px; padding-top: 4px; padding-bottom: 4px; }
.nav-subitem { display: block; padding: 7px 10px; font-size: 13px; color: var(--text-faint); border-radius: 7px; border-left: 2px solid transparent; }
.nav-subitem:hover { color: var(--text); background: var(--card); }
.nav-subitem.active { color: var(--accent-text); border-left-color: var(--accent); background: var(--accent-soft); }

.sidebar-bottom { padding: 10px 4px 0; }
.semester-pill {
  display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border);
  padding: 8px 10px; border-radius: 9px; font-size: 12px; color: var(--text-muted);
}
.semester-pill svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ============================== MAIN AREA ============================== */
.main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar {
  height: var(--topbar-h); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; border-bottom: 1px solid var(--border-soft); background: rgba(15,17,23,0.85); backdrop-filter: blur(8px);
  gap: 20px;
}
.topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.page-title { font-size: 18px; font-weight: 700; white-space: nowrap; }
.breadcrumb { font-size: 12px; color: var(--text-faint); }

.search-box {
  display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border);
  border-radius: 9px; padding: 7px 12px; width: 320px; max-width: 40vw; color: var(--text-faint);
}
.search-box svg { width: 15px; height: 15px; flex-shrink: 0; }
.search-box input { background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; width: 100%; }
.search-box input::placeholder { color: var(--text-faint); }

.content { flex: 1; min-width: 0; overflow-x: hidden; overflow-y: auto; padding: 26px 28px 60px; }
.content-inner { max-width: 1400px; margin: 0 auto; animation: fadeUp .25s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
.page-header h1 { font-size: 22px; }
.page-header .subtitle { color: var(--text-muted); font-size: 13.5px; margin-top: 4px; }
.header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ============================== BUTTONS ============================== */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 9px;
  font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
  transition: all .15s var(--ease); white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
.btn-ghost:hover { background: var(--card); color: var(--text); }
.btn-soft { background: var(--card); color: var(--text); border-color: var(--border); }
.btn-soft:hover { background: var(--card-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #DC2626; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-icon { padding: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ============================== CARDS / GRID ============================== */
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1200px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }
.dash-split-13 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.dash-split-14 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 720px) { .dash-split-13, .dash-split-14 { grid-template-columns: 1fr; } }

.card {
  background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow-sm); transition: border-color .15s var(--ease), transform .15s var(--ease);
}
.card-hover:hover { border-color: var(--border); transform: translateY(-1px); }

.stat-card { display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.stat-card .stat-icon {
  width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-text); margin-bottom: 2px;
}
.stat-card .stat-icon svg { width: 17px; height: 17px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.stat-card .stat-value { font-size: 20px; font-weight: 700; line-height: 1.25; }
.stat-card .stat-sub { font-size: 12px; color: var(--text-faint); }

.section { margin-bottom: 28px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-title h3 svg { width: 16px; height: 16px; color: var(--text-muted); }

/* ============================== BADGES / TAGS ============================== */
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 100px; white-space: nowrap;
}
.badge-muted { background: #232C3D; color: var(--text-muted); }
.badge-info { background: rgba(56,189,248,.15); color: var(--info); }
.badge-success { background: rgba(34,197,94,.15); color: var(--success); }
.badge-danger { background: rgba(239,68,68,.15); color: var(--danger); }
.badge-warning { background: rgba(234,179,8,.15); color: var(--warning); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-elevated); border: 1px solid var(--border); padding: 3px 10px; border-radius: 100px; font-size: 11.5px; color: var(--text-muted); }

/* ============================== PROGRESS ============================== */
.progress-track { height: 8px; background: var(--bg-elevated); border-radius: 100px; overflow: hidden; border: 1px solid var(--border-soft); }
.progress-fill { height: 100%; border-radius: 100px; transition: width .4s var(--ease); }
.progress-track.thin { height: 5px; }

/* ============================== EMPTY STATE ============================== */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 50px 20px; color: var(--text-faint); }
.empty-state svg { width: 34px; height: 34px; margin-bottom: 12px; opacity: .6; }
.empty-state h4 { color: var(--text-muted); font-size: 14px; margin-bottom: 4px; }
.empty-state p { font-size: 12.5px; max-width: 280px; }

/* ============================== TABLE ============================== */
.table-wrap { border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; background: var(--card); }
table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data-table th {
  text-align: left; padding: 11px 14px; background: var(--bg-elevated); color: var(--text-muted);
  font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--border-soft);
}
table.data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table tbody tr { transition: background .12s var(--ease); }
table.data-table tbody tr:hover { background: var(--card-hover); }
.row-actions { display: flex; gap: 6px; opacity: 0; transition: opacity .12s var(--ease); }
table.data-table tbody tr:hover .row-actions { opacity: 1; }

/* ============================== FORMS ============================== */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.single { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.span-2 { grid-column: span 2; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.field input, .field select, .field textarea {
  background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
  padding: 9px 11px; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none;
  transition: border-color .15s var(--ease);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 70px; }
.field-color-row { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch { width: 26px; height: 26px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: transform .1s var(--ease); }
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected { border-color: #fff; }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
.checkbox-row input { width: 15px; height: 15px; accent-color: var(--accent); }

/* ============================== MODAL ============================== */
.modal-overlay {
  position: fixed; inset: 0; background: var(--overlay-bg); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  animation: fadeIn .15s var(--ease);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
  width: 560px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); animation: modalIn .18s var(--ease);
}
.modal-lg { width: 820px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
.modal-header h3 { font-size: 15.5px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border-soft); flex-shrink: 0; }

/* ============================== TOAST ============================== */
.toast-container { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }
.toast {
  display: flex; align-items: center; gap: 9px; background: var(--bg-elevated); border: 1px solid var(--border);
  padding: 11px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateX(20px); transition: all .25s var(--ease);
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
.toast-success svg { color: var(--success); }
.toast-error svg { color: var(--danger); }
.toast-default svg { color: var(--info); }

/* ============================== TABS ============================== */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-soft); margin-bottom: 20px; overflow-x: auto; }
@media (max-width: 640px) { .tabs { flex-wrap: wrap; overflow-x: visible; } }
.tab-btn {
  padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); background: none; border: none;
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s var(--ease);
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

/* ============================== KANBAN ============================== */
.kanban-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 900px) { .kanban-board { grid-template-columns: 1fr; } }
.kanban-col { background: var(--bg-elevated); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 12px; min-height: 200px; }
.kanban-col-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px; }
.kanban-col-header .title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.kanban-col-header .count { background: var(--card); color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 100px; }
.kanban-cards { display: flex; flex-direction: column; gap: 10px; min-height: 60px; }
.kanban-card {
  background: var(--card); border: 1px solid var(--border-soft); border-left: 3px solid var(--accent);
  border-radius: 10px; padding: 12px; cursor: grab; transition: transform .12s var(--ease), border-color .12s var(--ease);
}
.kanban-card:hover { border-color: var(--border); }
.kanban-card.dragging { opacity: .4; }
.kanban-card .card-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
.kanban-card .card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kanban-card .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.kanban-col.drag-over { background: var(--accent-soft); }
.kanban-checklist-mini { font-size: 11px; color: var(--text-faint); display: flex; align-items: center; gap: 4px; }

/* ============================== CALENDAR ============================== */
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.calendar-weekday { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-faint); padding: 6px 0; text-transform: uppercase; letter-spacing: .04em; }
.calendar-day {
  min-height: 96px; min-width: 0; overflow: hidden; background: var(--card); border: 1px solid var(--border-soft); border-radius: 10px;
  padding: 7px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: border-color .12s var(--ease);
}
.calendar-day:hover { border-color: var(--border); }
.calendar-day.other-month { opacity: .35; }
.calendar-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.calendar-day .day-num { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.calendar-day.today .day-num { color: var(--accent); }
.calendar-event { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; color: #0F1117; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calendar-mini { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.calendar-mini .calendar-weekday { font-size: 9.5px; padding: 2px 0; }
.calendar-mini-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 7px; color: var(--text-muted); position: relative; }
.calendar-mini-day.today { background: var(--accent); color: #fff; font-weight: 700; }
@media (max-width: 640px) {
  .calendar-day { min-height: 60px; padding: 4px; gap: 2px; border-radius: 7px; }
  .calendar-day .day-num { font-size: 10.5px; }
  .calendar-event { font-size: 8.5px; padding: 1px 4px; }
  .calendar-grid { gap: 3px; }
}
.calendar-mini-day.has-event::after { content: ''; position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--dot-color, var(--info)); }
.calendar-mini-day.other-month { opacity: .3; }

/* ============================== WEEKLY SCHEDULE ============================== */
.week-grid { display: grid; grid-template-columns: 60px repeat(7, 1fr); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; background: var(--card); }
.week-grid-header { display: contents; }
.week-head-cell { padding: 10px 6px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--text-muted); background: var(--bg-elevated); border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; }
.week-time-cell { padding: 8px 6px; font-size: 10.5px; color: var(--text-faint); text-align: right; border-top: 1px solid var(--border-soft); background: var(--bg-elevated); }
.week-slot { border-top: 1px solid var(--border-soft); border-left: 1px solid var(--border-soft); min-height: 46px; position: relative; padding: 2px; }
.week-block {
  position: absolute; inset: 2px; border-radius: 7px; padding: 4px 7px; font-size: 10.5px; font-weight: 600;
  color: #0F1117; overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm);
}

/* ============================== GANTT ============================== */
.gantt-wrap { overflow-x: auto; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--card); }
.gantt { position: relative; min-width: 900px; }
.gantt-header { display: flex; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--bg-elevated); z-index: 4; }
.gantt-header-cell {
  flex-shrink: 0; display: flex; align-items: center; text-align: left; font-size: 10.5px; font-weight: 600;
  color: var(--text-faint); padding: 0 0 0 10px; border-left: 1px solid var(--border-soft); letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
}
.gantt-row { display: flex; align-items: center; position: relative; border-bottom: 1px solid var(--border-soft); transition: background .12s var(--ease); }
.gantt-row.alt { background: var(--row-alt-bg); }
.gantt-row:hover { background: var(--card-hover); }
.gantt-row-label {
  position: sticky; left: 0; z-index: 2; flex-shrink: 0; padding: 0 14px; font-size: 12.5px; font-weight: 600;
  background: var(--card); border-right: 1px solid var(--border-soft); white-space: nowrap; overflow: hidden;
  display: flex; align-items: center; gap: 9px;
}
.gantt-row.alt .gantt-row-label { background: var(--row-alt-label-bg); }
.gantt-row-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.gantt-row-text { overflow: hidden; text-overflow: ellipsis; }
.gantt-track { flex: 1; position: relative; height: 100%; }
.gantt-bar {
  position: absolute; top: 10px; bottom: 10px; border-radius: 8px; cursor: grab;
  display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 700;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); user-select: none; white-space: nowrap; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12); transition: box-shadow .12s var(--ease), filter .12s var(--ease);
}
.gantt-bar:hover { filter: brightness(1.08); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.gantt-bar-label { overflow: hidden; text-overflow: ellipsis; }
.gantt-bar-done { opacity: .65; }
.gantt-bar-done::after { content: '✓'; margin-left: 6px; opacity: .8; }
.gantt-bar.dragging { cursor: grabbing; opacity: .9; z-index: 6; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.gantt-bar .resize-handle { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; opacity: 0; transition: opacity .12s var(--ease); background: rgba(255,255,255,0.25); }
.gantt-bar:hover .resize-handle { opacity: 1; }
.gantt-bar .resize-handle.left { left: 0; border-radius: 8px 0 0 8px; } .gantt-bar .resize-handle.right { right: 0; border-radius: 0 8px 8px 0; }
.gantt-today-line { position: absolute; top: 0; width: 1.5px; background: var(--danger); z-index: 3; opacity: .75; pointer-events: none; }
.gantt-today-tag {
  position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff;
  font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 100px; white-space: nowrap;
}
.gantt-body { position: relative; }
.gantt-gridlines { position: absolute; top: 0; right: 0; z-index: 0; pointer-events: none; }
.gantt-grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border-soft); opacity: .6; }

/* ============================== TIMELINE (list) ============================== */
.timeline { display: flex; flex-direction: column; }
.timeline-item { display: flex; gap: 14px; padding-bottom: 20px; position: relative; }
.timeline-item:not(:last-child)::before { content:''; position: absolute; left: 5px; top: 16px; bottom: 0; width: 1px; background: var(--border); }
.timeline-dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; border: 2px solid var(--bg-elevated); box-shadow: 0 0 0 1px var(--border); }
.timeline-content { flex: 1; }
.timeline-content .t-title { font-size: 13px; font-weight: 600; }
.timeline-content .t-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }

/* ============================== CHECKLIST ============================== */
.checklist-item { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 13px; }
.checklist-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
.checklist-item.done span { text-decoration: line-through; color: var(--text-faint); }
.checklist-add { display: flex; gap: 8px; margin-top: 10px; }
.checklist-add input { flex: 1; }

/* ============================== TODO LIST (dashboard) ============================== */
.todo-list { display: flex; flex-direction: column; gap: 2px; }
.todo-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-radius: 8px; transition: background .12s; }
.todo-row:hover { background: var(--bg-elevated); }
.todo-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); flex-shrink: 0; }
.todo-row.done span { text-decoration: line-through; color: var(--text-faint); }
.todo-row span { flex: 1; font-size: 13.5px; }

/* ============================== DISCIPLINE DETAIL ============================== */
.disc-hero { display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: var(--radius-lg); margin-bottom: 18px; border: 1px solid var(--border-soft); }
.disc-hero .disc-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #0F1117; }
.disc-hero .disc-icon svg { width: 24px; height: 24px; }
.disc-hero h1 { font-size: 19px; }
.disc-hero .disc-meta { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

/* ============================== FILTER BAR ============================== */
.filter-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
.filter-chip {
  padding: 6px 13px; border-radius: 100px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  background: var(--card); border: 1px solid var(--border-soft); color: var(--text-muted); transition: all .12s var(--ease);
  display: inline-flex; align-items: center; gap: 5px;
}
.filter-chip:hover { border-color: var(--border); color: var(--text); }
.filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.chip-count {
  font-size: 10.5px; font-weight: 700; background: rgba(127,127,127,.2); color: inherit;
  padding: 1px 6px; border-radius: 100px; line-height: 1.5;
}
.filter-select { background: var(--card); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 6px 10px; border-radius: 100px; font-size: 12.5px; font-weight: 600; }

/* ============================== IDEA / FILE CARDS ============================== */
.idea-card { display: flex; flex-direction: column; gap: 8px; }
.idea-card .idea-title { font-size: 13.5px; font-weight: 700; }
.idea-card .idea-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
.idea-tags { display: flex; gap: 6px; flex-wrap: wrap; }

.file-card { display: flex; align-items: center; gap: 12px; }
.file-card .file-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0; }
.file-card .file-icon svg { width: 18px; height: 18px; }
.file-card .file-name { font-size: 13px; font-weight: 600; }
.file-card .file-meta { font-size: 11px; color: var(--text-faint); }

/* ============================== RESPONSIVE ============================== */
@media (max-width: 880px) {
  .sidebar { position: fixed; z-index: 500; height: 100vh; box-shadow: var(--shadow-lg); }
  .sidebar:not(.mobile-open) { transform: translateX(-100%); width: var(--sidebar-w); }
  .content { padding: 18px; }
  .form-grid { grid-template-columns: 1fr; }
  .field.span-2 { grid-column: span 1; }
  .topbar { padding: 0 16px; }
  .search-box { display: none; }
}

.mobile-menu-btn { display: none; }
@media (max-width: 880px) { .mobile-menu-btn { display: flex; } }

/* ============================== SPLASH / BOOT SCREEN ============================== */
.splash-screen {
  position: fixed; inset: 0; z-index: 5000; background: var(--bg);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  animation: splashIn .5s var(--ease);
}
.splash-screen.splash-exit { animation: splashOut .5s var(--ease) forwards; }
@keyframes splashIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes splashOut { to { opacity: 0; transform: scale(1.04); filter: blur(6px); } }

.splash-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--border-soft) 1px, transparent 1px), linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 72%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 72%);
  opacity: .8;
}
.splash-vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 0%, var(--bg) 92%);
  pointer-events: none;
}
.splash-blueprint-art { position: absolute; bottom: 0; left: 0; width: 100%; height: 46%; opacity: .16; pointer-events: none; }
.splash-blueprint-art .bp-lines { stroke: var(--accent); }

.splash-deco { position: absolute; color: var(--accent); opacity: .09; pointer-events: none; }
.splash-deco.deco-1 { width: 130px; height: 130px; top: 8%; left: 7%; transform: rotate(-8deg); }
.splash-deco.deco-2 { width: 90px; height: 90px; top: 18%; right: 12%; transform: rotate(18deg); }
.splash-deco.deco-3 { width: 100px; height: 100px; bottom: 14%; left: 10%; transform: rotate(-14deg); }
.splash-deco.deco-4 { width: 150px; height: 150px; bottom: 8%; right: 8%; transform: rotate(10deg); }
.splash-deco.deco-5 { width: 70px; height: 70px; top: 42%; left: 4%; opacity: .06; transform: rotate(6deg); }

.splash-center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 34px; }

.splash-clock { text-align: center; }
.splash-time { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); line-height: 1; }
.splash-date { font-size: 14px; color: var(--text-muted); margin-top: 8px; text-transform: capitalize; }

.splash-folder-btn {
  background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding: 10px; -webkit-tap-highlight-color: transparent;
}
.folder3d { position: relative; width: 128px; height: 96px; margin-top: 10px; }
.folder-tab {
  position: absolute; top: -12px; left: 4px; width: 52px; height: 18px;
  background: var(--accent); border-radius: 7px 7px 0 0; transition: transform .3s var(--ease);
}
.folder-back {
  position: absolute; inset: 0; background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  border-radius: 4px 14px 14px 14px; box-shadow: var(--shadow-lg);
}
.folder-front {
  position: absolute; left: -3px; right: -3px; bottom: -5px; height: 70%;
  background: linear-gradient(165deg, var(--accent-hover), var(--accent));
  border-radius: 5px 14px 14px 14px; transform-origin: bottom center;
  transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 10px 24px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
}
.folder-icon { width: 30px; height: 30px; color: rgba(255,255,255,.92); }
.splash-folder-btn:hover .folder-front, .splash-folder-btn:focus-visible .folder-front { transform: perspective(320px) rotateX(-22deg) translateY(-8px); }
.splash-folder-btn:hover .folder-tab { transform: translateY(-2px); }
.splash-folder-btn:active .folder3d { transform: scale(.96); }
.splash-folder-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 12px; }

.splash-name { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }

.splash-hint { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-faint); animation: hintPulse 2.2s ease-in-out infinite; }
.splash-hint svg { width: 13px; height: 13px; }
@keyframes hintPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

.splash-footer {
  position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
  font-size: 11px; color: var(--text-faint); letter-spacing: .02em; z-index: 2;
}

@media (max-width: 560px) {
  .splash-time { font-size: 42px; }
  .splash-deco { display: none; }
}

/* ==========================================================================
   laura-workspace.css — Hub, autenticação, bloqueio e Dashboard Geral
   ========================================================================== */

/* ---------- Telas de autenticação (setup / login / bloqueio) ---------- */
.auth-screen {
  position: fixed; inset: 0; z-index: 5500; background: var(--bg);
  display: flex; align-items: center; justify-content: center; overflow: hidden auto;
  animation: splashIn .4s var(--ease); padding: 24px;
}
.auth-card {
  position: relative; z-index: 2; width: 100%; max-width: 380px;
  background: var(--bg-elevated); border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
  padding: 32px 28px; box-shadow: var(--shadow-lg);
}
.auth-icon {
  width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent-grad-end));
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.auth-icon svg { width: 26px; height: 26px; }
.auth-title { font-size: 19px; text-align: center; margin-bottom: 6px; }
.auth-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; line-height: 1.5; }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.pw-field { position: relative; }
.pw-field input { width: 100%; padding-right: 40px; }
.pw-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px;
}
.pw-toggle:hover { background: var(--card); color: var(--text); }
.pw-toggle svg { width: 15px; height: 15px; }
.auth-error {
  font-size: 12.5px; color: var(--danger); background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
  border-radius: 8px; padding: 9px 12px; display: none; align-items: center; gap: 8px;
}
.auth-error.show { display: flex; }
.auth-error svg { width: 14px; height: 14px; flex-shrink: 0; }
.auth-lockout {
  font-size: 12.5px; color: var(--warning); background: rgba(234,179,8,.1); border: 1px solid rgba(234,179,8,.25);
  border-radius: 8px; padding: 9px 12px; display: none; align-items: center; gap: 8px;
}
.auth-lockout.show { display: flex; }
.auth-attempts { font-size: 11.5px; color: var(--text-faint); text-align: center; }
.auth-forgot { font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.auth-forgot:hover { color: var(--danger); }
.auth-strength { display: flex; gap: 4px; margin-top: -6px; }
.auth-strength span { height: 3px; flex: 1; border-radius: 2px; background: var(--border-soft); }

/* ---------- Hub de pastas ---------- */
.hub-screen { flex: 1; min-width: 0; min-height: 100vh; background: var(--bg); position: relative; overflow: hidden auto; }
.hub-screen::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(var(--border-soft) 1px, transparent 1px), linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size: 42px 42px; mask-image: radial-gradient(ellipse at top, black 0%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at top, black 0%, transparent 70%); opacity: .6;
}
.hub-topbar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; }
.hub-brand { display: flex; align-items: center; gap: 11px; }
.hub-brand-mark {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, #7C1D3D, #E11D48); display: flex; align-items: center; justify-content: center; color: #fff;
}
.hub-brand-mark svg { width: 18px; height: 18px; }
.hub-brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.hub-brand-sub { font-size: 11.5px; color: var(--text-faint); }
.hub-actions { display: flex; align-items: center; gap: 8px; }
.hub-hero { position: relative; z-index: 2; text-align: center; margin: 18px 0 6px; }
.hub-hero h1 { font-size: 22px; margin-bottom: 6px; }
.hub-hero p { font-size: 13px; color: var(--text-muted); }
.hub-grid {
  position: relative; z-index: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px; max-width: 900px; margin: 34px auto 60px; padding: 0 32px;
}
.ws-folder-btn {
  background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 20px 10px; border-radius: 16px; transition: transform .25s var(--ease), background .2s var(--ease);
}
.ws-folder-btn:hover { transform: translateY(-4px); background: var(--card); }
.ws-folder-btn:active .wf-3d { transform: scale(.96); }
.ws-folder-btn.soon { opacity: .6; }
.wf-3d { position: relative; width: 100px; height: 78px; transition: transform .15s var(--ease); }
.wf-tab { position: absolute; top: -10px; left: 4px; width: 42px; height: 15px; background: var(--f1); border-radius: 6px 6px 0 0; transition: transform .3s var(--ease); }
.wf-back { position: absolute; inset: 0; background: linear-gradient(150deg, var(--f1), var(--f2)); border-radius: 4px 12px 12px 12px; box-shadow: var(--shadow-lg); }
.wf-front {
  position: absolute; left: -3px; right: -3px; bottom: -4px; height: 70%;
  background: linear-gradient(165deg, var(--f2), var(--f1)); border-radius: 5px 12px 12px 12px; transform-origin: bottom center;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 8px 20px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
}
.wf-front svg { width: 24px; height: 24px; color: rgba(255,255,255,.95); }
.ws-folder-btn:hover .wf-front { transform: perspective(300px) rotateX(-20deg) translateY(-6px); }
.ws-folder-btn:hover .wf-tab { transform: translateY(-2px); }
.wf-label { font-size: 13px; font-weight: 700; color: var(--text); text-align: center; }
.wf-badge {
  font-size: 9.5px; font-weight: 700; color: var(--text-faint); background: var(--card); border: 1px solid var(--border-soft);
  padding: 2px 8px; border-radius: 100px; letter-spacing: .02em; text-transform: uppercase;
}
.hub-folder-open { animation: hubFolderOpen .5s var(--ease) forwards; }
@keyframes hubFolderOpen { to { opacity: 0; transform: scale(1.15); filter: blur(8px); } }

/* ---------- Pastas customizadas (Modelos) ---------- */
.ws-folder-wrap { position: relative; }
.wf-menu-btn {
  position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 100px; border: none;
  background: var(--card); color: var(--text-muted); display: flex; align-items: center; justify-content: center;
  cursor: pointer; opacity: 0; transition: opacity .15s var(--ease), background .15s var(--ease); z-index: 3;
}
.wf-menu-btn svg { width: 13px; height: 13px; }
.ws-folder-wrap:hover .wf-menu-btn { opacity: 1; }
.wf-menu-btn:hover { background: var(--card-hover); color: var(--text); }
.wf-3d-new { display: flex; align-items: center; justify-content: center; }
.wf-3d-new .wf-front {
  position: static; inset: auto; height: auto; width: 60px; height: 60px; margin: 9px auto 0;
  background: var(--card); border: 1.5px dashed var(--border); box-shadow: none; border-radius: 14px;
}
.wf-3d-new .wf-front svg { color: var(--text-faint); width: 22px; height: 22px; }

  <!-- Aplicação (utils, storage, componentes, páginas e roteador) -->
  <script>

/* ==========================================================================
   CONFIGURAÇÃO DA SINCRONIZAÇÃO NA NUVEM (Firebase)
   ==========================================================================
   Preencha o objeto abaixo com a configuração do seu projeto gratuito em
   https://console.firebase.google.com — veja o passo a passo no README.md.
   Enquanto estiver com os valores de exemplo, o app funciona 100% offline
   (só localStorage, como antes), sem sincronizar entre aparelhos.
   ========================================================================== */
window.CLOUD_SYNC_CONFIG = {
  FIREBASE_CONFIG: {
    apiKey: 'AIzaSyB9p2LcFKQ7LBoQKCsSn5tW9Qgs7ms_Mq8',
    authDomain: 'laura-org.firebaseapp.com',
    projectId: 'laura-org',
    storageBucket: 'laura-org.firebasestorage.app',
    messagingSenderId: '54713469294',
    appId: '1:54713469294:web:dc9b1616b5ff5eddd8d97f',
  },
};

/* ==========================================================================
   CloudSync — sincroniza os dados entre celular/notebook via Firebase
   ==========================================================================
   Estratégia: todos os módulos do app continuam lendo/gravando no
   localStorage normalmente (nada nos módulos precisou mudar). O CloudSync
   apenas:
     1) No boot, baixa a última cópia salva na nuvem e sobrescreve o
        localStorage ANTES do app iniciar.
     2) Depois do boot, "escuta" toda escrita feita no localStorage pelas
        chaves do app e envia (com um pequeno atraso) a cópia atualizada
        para a nuvem.
     3) Enquanto o app está aberto, mantém uma escuta em tempo real
        (Firestore onSnapshot) — assim que outro aparelho salvar algo,
        aparece um aviso quase na hora, com um botão para atualizar.
   O "pareamento" entre aparelhos é feito por um código de acesso (PIN)
   simples: o mesmo código nos dois aparelhos = mesmo espaço de dados.
   O PIN nunca é enviado como texto puro — só o hash dele (SHA-256).
   ========================================================================== */
window.CloudSync = (function () {
  const WATCHED_KEYS = [
    'laura_workspace_v1',
    'laura_custom_folders_v1',
    'laura_tab_layouts_v1',
    'faculdade_app_state_v1',
    'igreja_workspace_v1',
    'eventos_workspace_v1',
    'financeiro_workspace_v1',
    'pessoal_workspace_v1',
  ];
  const PIN_KEY = 'laura_sync_pin_v1';
  const META_KEY = 'laura_sync_meta_v1'; // guarda, POR CHAVE, o carimbo de tempo já confirmado
  const DEVICE_KEY = 'laura_sync_device_id_v1';
  const PULL_TIMEOUT_MS = 7000;
  const COLLECTION = 'sync_data';

  let workspaceId = null;
  let deviceId = null;
  let pushTimer = null;
  let dirtyKeys = new Set();
  let applyingRemote = false; // evita reagir às próprias escritas durante um pull
  let originalSetItem = null;
  let originalRemoveItem = null;
  let originalGetItem = null;
  let firestoreDb = null;
  let unsubscribeSnapshot = null;

  function isConfigured() {
    const c = (window.CLOUD_SYNC_CONFIG || {}).FIREBASE_CONFIG || {};
    return !!(c.apiKey && c.projectId &&
      !String(c.apiKey).includes('SUA_API_KEY') && !String(c.projectId).includes('SEU-PROJETO'));
  }

  function getDb() {
    if (!firestoreDb) {
      const app = firebase.apps.length
        ? firebase.apps[0]
        : firebase.initializeApp(window.CLOUD_SYNC_CONFIG.FIREBASE_CONFIG);
      firestoreDb = firebase.firestore(app);
    }
    return firestoreDb;
  }

  function docRef() {
    return getDb().collection(COLLECTION).doc(workspaceId);
  }

  async function sha256Hex(text) {
    const enc = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function getDeviceId() {
    if (deviceId) return deviceId;
    let stored = localStorage.getItem(DEVICE_KEY);
    if (!stored) {
      stored = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2)));
      localStorage.setItem(DEVICE_KEY, stored);
    }
    deviceId = stored;
    return deviceId;
  }

  /* ------------------------- Metadados locais (por chave) ------------------------- */
  // Para cada uma das WATCHED_KEYS, guardamos aqui o carimbo de tempo (do
  // servidor) da versão mais recente que ESTE aparelho já recebeu/confirmou.
  // É isso que permite comparar "o que é mais novo" campo a campo, em vez
  // de sobrescrever o workspace inteiro de uma vez (que foi a causa da
  // perda de dados).
  function getMeta() {
    try { return JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch (e) { return {}; }
  }
  function setMetaTimestamp(key, isoString) {
    const meta = getMeta();
    meta[key] = isoString;
    originalSetItem ? originalSetItem.call(localStorage, META_KEY, JSON.stringify(meta)) : localStorage.setItem(META_KEY, JSON.stringify(meta));
  }

  function applyRemoteField(key, field) {
    applyingRemote = true;
    try {
      if (field.value === null) originalRemoveItem.call(localStorage, key);
      else originalSetItem.call(localStorage, key, field.value);
    } finally {
      applyingRemote = false;
    }
  }

  // Processa o documento inteiro vindo do Firestore, campo por campo.
  // Só aplica (sobrescreve o localStorage) as chaves cujo carimbo de tempo
  // remoto é mais novo do que o último que este aparelho já confirmou —
  // e nunca aplica uma chave que foi escrita por ESTE MESMO aparelho (é só
  // o eco da própria escrita voltando do servidor).
  function processRemoteDoc(data, isBootPull) {
    let appliedSomething = false;
    WATCHED_KEYS.forEach((key) => {
      const field = data[key];
      if (!field || !field.updated_at || !field.updated_at.toDate) return; // escrita pendente de confirmação do servidor
      const remoteIso = field.updated_at.toDate().toISOString();
      const meta = getMeta();
      const localIso = meta[key];
      if (localIso && new Date(remoteIso) <= new Date(localIso)) return; // já temos essa versão (ou mais nova)

      const isOwnWrite = field.last_writer === getDeviceId();
      if (!isOwnWrite) {
        applyRemoteField(key, field);
        appliedSomething = true;
      }
      setMetaTimestamp(key, remoteIso);
    });
    return appliedSomething;
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
    ]);
  }

  async function pullOnce() {
    const snap = await docRef().get({ source: 'server' });
    if (!snap.exists) return false;
    return processRemoteDoc(snap.data() || {}, true);
  }

  async function pushDirtyKeys() {
    if (!isConfigured() || !workspaceId || dirtyKeys.size === 0) return;
    const keysToSend = Array.from(dirtyKeys);
    dirtyKeys.clear();
    const updates = {};
    keysToSend.forEach((key) => {
      const raw = originalGetItem(key);
      updates[key] = {
        value: raw === null ? null : raw,
        updated_at: firebase.firestore.FieldValue.serverTimestamp(),
        last_writer: getDeviceId(),
      };
    });
    try {
      await docRef().set(updates, { merge: true });
      // Meta local é atualizada quando o eco desta escrita voltar pelo
      // listener em tempo real (garante o carimbo de tempo real do
      // servidor, não uma estimativa do relógio do aparelho).
    } catch (e) {
      // Falhou: devolve as chaves pra fila pra tentar de novo depois.
      keysToSend.forEach((k) => dirtyKeys.add(k));
      console.warn('CloudSync: não foi possível enviar para a nuvem agora.', e);
    }
  }

  function schedulePush(key) {
    if (!isConfigured() || applyingRemote) return;
    dirtyKeys.add(key);
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushDirtyKeys, 1200);
  }

  function watchLocalStorage() {
    originalSetItem = localStorage.setItem.bind(localStorage);
    originalRemoveItem = localStorage.removeItem.bind(localStorage);
    originalGetItem = localStorage.getItem.bind(localStorage);
    localStorage.setItem = function (key, value) {
      originalSetItem(key, value);
      if (WATCHED_KEYS.includes(key)) schedulePush(key);
    };
    localStorage.removeItem = function (key) {
      originalRemoveItem(key);
      if (WATCHED_KEYS.includes(key)) schedulePush(key);
    };
  }

  function showUpdateToast() {
    if (document.getElementById('cloudsync-toast')) return;
    const toast = document.createElement('div');
    toast.id = 'cloudsync-toast';
    toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E293B;color:#E7EBF3;border:1px solid #2A3344;padding:12px 16px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:99999;display:flex;gap:12px;align-items:center;font-family:Inter,sans-serif;font-size:14px;';
    toast.innerHTML = `
      <span>📱 Dados novos de outro aparelho.</span>
      <button id="cloudsync-refresh-btn" style="background:#1F7A4D;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;">Atualizar</button>
      <button id="cloudsync-dismiss-btn" style="background:transparent;color:#8B94A7;border:none;cursor:pointer;">✕</button>
    `;
    document.body.appendChild(toast);
    document.getElementById('cloudsync-refresh-btn').onclick = () => window.location.reload();
    document.getElementById('cloudsync-dismiss-btn').onclick = () => toast.remove();
  }

  function startBackgroundChecks() {
    // onSnapshot mantém uma conexão viva com o Firestore: assim que outro
    // aparelho salvar algo, este listener dispara quase instantaneamente
    // (sem precisar ficar checando de tempos em tempos). Cada campo é
    // avaliado individualmente por processRemoteDoc.
    unsubscribeSnapshot = docRef().onSnapshot(
      (snap) => {
        if (!snap.exists) return;
        const appliedSomething = processRemoteDoc(snap.data() || {}, false);
        if (appliedSomething) showUpdateToast();
      },
      (e) => console.warn('CloudSync: listener em tempo real falhou.', e)
    );
  }

  /* ------------------------------ Tela de PIN ------------------------------ */
  function askPin() {
    const existing = localStorage.getItem(PIN_KEY);
    return new Promise((resolve) => {
      if (existing) { resolve(existing); return; }

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:#0F1117;color:#E7EBF3;display:flex;align-items:center;justify-content:center;z-index:999999;font-family:Inter,sans-serif;padding:24px;';
      overlay.innerHTML = `
        <div style="max-width:380px;width:100%;text-align:center;">
          <div style="font-size:40px;margin-bottom:12px;">🔗</div>
          <h2 style="margin:0 0 8px;font-size:20px;">Sincronizar este aparelho</h2>
          <p style="color:#8B94A7;font-size:14px;line-height:1.5;margin:0 0 20px;">
            Crie um código de sincronização (mínimo 6 caracteres). Use o
            <b>mesmo código</b> em todos os seus aparelhos para que os dados
            fiquem sempre integrados entre eles.
          </p>
          <input id="cloudsync-pin-input" type="text" placeholder="Código de sincronização" autocomplete="off"
            style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2A3344;background:#1E293B;color:#E7EBF3;font-size:16px;box-sizing:border-box;margin-bottom:12px;text-align:center;letter-spacing:1px;" />
          <button id="cloudsync-pin-btn" style="width:100%;padding:12px;border-radius:10px;border:none;background:#1F7A4D;color:#fff;font-weight:700;font-size:15px;cursor:pointer;">Continuar</button>
          <p id="cloudsync-pin-error" style="color:#EF4444;font-size:13px;height:16px;margin:10px 0 0;"></p>
        </div>
      `;
      document.body.appendChild(overlay);

      const input = overlay.querySelector('#cloudsync-pin-input');
      const btn = overlay.querySelector('#cloudsync-pin-btn');
      const err = overlay.querySelector('#cloudsync-pin-error');
      input.focus();

      function submit() {
        const val = input.value.trim();
        if (val.length < 6) {
          err.textContent = 'Use pelo menos 6 caracteres.';
          return;
        }
        localStorage.setItem(PIN_KEY, val);
        overlay.remove();
        resolve(val);
      }
      btn.onclick = submit;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    });
  }

  function showBootOverlay(message) {
    let el = document.getElementById('cloudsync-boot-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'cloudsync-boot-overlay';
      el.style.cssText = 'position:fixed;inset:0;background:#0F1117;color:#8B94A7;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999998;font-family:Inter,sans-serif;gap:10px;';
      document.body.appendChild(el);
    }
    el.innerHTML = `<div style="font-size:28px;">🎓</div><div style="font-size:14px;">${message}</div>`;
  }

  function hideBootOverlay() {
    const el = document.getElementById('cloudsync-boot-overlay');
    if (el) el.remove();
  }

  /* -------------------------- Reemparelhar aparelho ------------------------- */
  // Chame window.CloudSync.changePin() a partir de qualquer botão/console
  // para trocar de código (ex: entrar em outro "espaço" de dados).
  function changePin() {
    if (unsubscribeSnapshot) unsubscribeSnapshot();
    localStorage.removeItem(PIN_KEY);
    (originalRemoveItem || localStorage.removeItem.bind(localStorage))(META_KEY);
    window.location.reload();
  }

  /* ---------------------------------- Boot ---------------------------------- */
  async function boot(startAppFn) {
    if (!isConfigured()) {
      // Sem Firebase configurado ainda: comportamento 100% local, como antes.
      startAppFn();
      return;
    }

    // Precisa existir ANTES de qualquer pull, porque aplicar dados remotos
    // já usa essas referências originais do localStorage.
    watchLocalStorage();

    showBootOverlay('Conectando ao seu espaço sincronizado…');
    try {
      const pin = await askPin();
      workspaceId = await sha256Hex(pin);

      try {
        await withTimeout(pullOnce(), PULL_TIMEOUT_MS);
      } catch (e) {
        console.warn('CloudSync: sem conexão com a nuvem agora, usando dados locais.', e);
      }
    } finally {
      hideBootOverlay();
    }

    startBackgroundChecks();
    startAppFn();

    // Depois do pull, qualquer chave que já tenha dado local mas NUNCA foi
    // confirmada com a nuvem (meta ainda não tem essa chave) precisa ser
    // enviada agora — cobre o primeiro aparelho a configurar o sync, ou
    // dados criados localmente antes de ativar a sincronização. Chaves já
    // reconciliadas não são reenviadas à toa a cada abertura do app.
    const meta = getMeta();
    WATCHED_KEYS.forEach((k) => {
      if (localStorage.getItem(k) !== null && !meta[k]) dirtyKeys.add(k);
    });
    if (dirtyKeys.size > 0) schedulePush();
  }

  return { boot, changePin, isConfigured };
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('SW não registrado:', e));
  });

/* ===================== utils/helpers.js ===================== */
/* ==========================================================================
   utils/helpers.js
   Funções utilitárias genéricas usadas em todo o sistema.
   ========================================================================== */

window.Utils = (function () {
  const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const DIAS_SEMANA_ABREV = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const DIAS_SEMANA_FULL = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
  const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  function uid(prefix) {
    return (prefix ? prefix + '_' : '') + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function todayISO() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return toISO(d);
  }

  function toISO(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function parseISO(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function formatDateBR(iso) {
    if (!iso) return '—';
    const d = parseISO(iso);
    if (!d || isNaN(d)) return '—';
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
  }

  function formatDateLong(iso) {
    if (!iso) return '—';
    const d = parseISO(iso);
    if (!d || isNaN(d)) return '—';
    return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
  }

  function daysBetween(isoA, isoB) {
    const a = parseISO(isoA), b = parseISO(isoB);
    if (!a || !b) return null;
    return Math.round((b - a) / 86400000);
  }

  function daysFromToday(iso) {
    return daysBetween(todayISO(), iso);
  }

  function addDays(iso, n) {
    const d = parseISO(iso);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  // Conta dias úteis (segunda a sexta) entre duas datas ISO, incluindo
  // ambas as pontas. Usado para calcular horas de estágio automaticamente.
  function businessDaysBetween(isoStart, isoEnd) {
    const start = parseISO(isoStart), end = parseISO(isoEnd);
    if (!start || !end || isNaN(start) || isNaN(end)) return 0;
    let a = start, b = end;
    if (a > b) { const t = a; a = b; b = t; }
    let count = 0;
    const cursor = new Date(a);
    while (cursor <= b) {
      const day = cursor.getDay(); // 0 = domingo, 6 = sábado
      if (day !== 0 && day !== 6) count++;
      cursor.setDate(cursor.getDate() + 1);
    }
    return count;
  }

  // Horas de um registro de estágio: se for do formato novo (período +
  // carga diária), calcula automaticamente pelos dias úteis; se for do
  // formato antigo (um único dia com horas digitadas à mão), usa o valor
  // que já estava salvo, sem recalcular.
  function estagioHorasRegistro(r) {
    if (r.dataInicio && r.dataFim && r.cargaHorariaDiaria != null) {
      return businessDaysBetween(r.dataInicio, r.dataFim) * Number(r.cargaHorariaDiaria || 0);
    }
    return Number(r.horas || 0);
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function debounce(fn, wait) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  }

  function el(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html.trim();
    return tpl.content.firstElementChild;
  }

  function qs(sel, scope) {
    return (scope || document).querySelector(sel);
  }
  function qsa(sel, scope) {
    return Array.from((scope || document).querySelectorAll(sel));
  }

  function lucide() {
    if (window.lucide) window.lucide.createIcons();
  }

  const ETAPA_PALETTE = ['#C084FC', '#818CF8', '#38BDF8', '#2DD4BF', '#A78BFA', '#60A5FA', '#22D3EE', '#F472B6', '#6366F1', '#0EA5E9'];

  function textColorFor(hex) {
    if (!hex) return '#0F1117';
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#0F1117' : '#F5F7FB';
  }

  function priorityMeta(p) {
    const map = {
      alta: { label: 'Alta', color: '#EF4444', icon: '🔴' },
      media: { label: 'Média', color: '#EAB308', icon: '🟡' },
      baixa: { label: 'Baixa', color: '#22C55E', icon: '🟢' },
    };
    return map[p] || map.media;
  }

  function statusBadge(status) {
    const map = {
      pendente: { label: 'Pendente', cls: 'badge-muted' },
      andamento: { label: 'Em andamento', cls: 'badge-info' },
      concluido: { label: 'Concluído', cls: 'badge-success' },
      atrasado: { label: 'Atrasado', cls: 'badge-danger' },
    };
    return map[status] || map.pendente;
  }

  function download(filename, text) {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  return {
    DIAS_SEMANA, DIAS_SEMANA_ABREV, DIAS_SEMANA_FULL, MESES,
    uid, escapeHtml, todayISO, toISO, parseISO,
    formatDateBR, formatDateLong, daysBetween, daysFromToday, addDays, businessDaysBetween, estagioHorasRegistro,
    clamp, debounce, el, qs, qsa, lucide, priorityMeta, statusBadge,
    download, readFileAsText, textColorFor, ETAPA_PALETTE,
  };
})();

        const def = isCustom ? blankState() : defaultState();

        state.config = Object.assign({}, def.config, state.config);
        // Correção pontual do cronograma do TCC conforme o Gantt enviado pela Laura (uma única vez, só na pasta original).
        if (!isCustom && !state.cronogramaCorrigidoV1) {
          state.tcc.etapas = defaultState().tcc.etapas;
          state.cronogramaCorrigidoV1 = true;
          persist();
        }
      } else {
        state = isCustom ? blankState() : defaultState();
        if (!isCustom) state.cronogramaCorrigidoV1 = true;
        persist();
      }
    } catch (e) {
      console.error('Erro ao carregar dados, restaurando padrão.', e);
      state = isCustom ? blankState() : defaultState();
      if (!isCustom) state.cronogramaCorrigidoV1 = true;
      persist();
    }
    return state;
  }

  function persist() {
    localStorage.setItem(KEY, JSON.stringify(state));
    window.dispatchEvent(new CustomEvent('db:changed'));
  }


  function get() {
    return state;
  }

  function save(mutatorFn) {
    mutatorFn(state);
    persist();
  }

  function resetAll() {
    state = defaultState();
    persist();
  }

  function importJSON(json) {
    const parsed = JSON.parse(json);
    state = parsed;
    persist();
  }

  function exportJSON() {
    return JSON.stringify(state, null, 2);
  }

  return { load, get, save, resetAll, importJSON, exportJSON, defaultState, setInstance };
})();

/* ==========================================================================
   LocalFiles — guarda arquivos pequenos (PDF/imagem) anexados nas telas de
   Arquivos/Bibliografia. Fica FORA das WATCHED_KEYS do CloudSync de
   propósito: arquivos em base64 são grandes demais pra caber no mesmo
   documento sincronizado que guarda o resto dos seus dados (que tem um
   limite de tamanho). Por isso esses anexos ficam só no aparelho onde
   foram enviados — os outros aparelhos veem o nome do arquivo (isso sim
   sincroniza, é só texto), mas não o conteúdo.
   ========================================================================== */
window.LocalFiles = (function () {
  const KEY = 'laura_local_files_v1';
  const MAX_BYTES = 400 * 1024; // ~400KB por arquivo

  function getAll() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
  }
  function save(id, dataUrl) {
    const all = getAll();
    all[id] = dataUrl;
    localStorage.setItem(KEY, JSON.stringify(all));
  }
  function get(id) {
    return getAll()[id] || null;
  }
  function remove(id) {
    const all = getAll();
    delete all[id];
    localStorage.setItem(KEY, JSON.stringify(all));
  }
  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  return { save, get, remove, readFileAsDataUrl, MAX_BYTES };
})();

window.UI = (function () {

  const MAIN_TABS = [

    { key: 'disciplinas', route: 'disciplinas', label: 'Disciplinas', icon: 'book-open' },

    { route: 'tcc/orientacoes', label: 'Orientações' },
    { route: 'tcc/arquivos', label: 'Arquivos' },
  ];

  // ---------------- Modal ----------------
  function openModal({ title, bodyHtml, footerHtml, onMount, size }) {
    closeModal();
    const overlay = el(`
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal ${size === 'lg' ? 'modal-lg' : ''}" role="dialog" aria-modal="true">
          <div class="modal-header">
            <h3>${title}</h3>
            <button class="icon-btn" id="modal-close"><i data-lucide="x"></i></button>
          </div>
          <div class="modal-body">${bodyHtml}</div>
          ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
        </div>
      </div>
    `);
    document.body.appendChild(overlay);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
    qs('#modal-close', overlay).addEventListener('click', closeModal);
    lucide();
    if (onMount) onMount(overlay);
    return overlay;
  }

  function closeModal() {
    const existing = qs('#modal-overlay');
    if (existing) existing.remove();
  }

  // ---------------- Toast ----------------
  let toastTimer = null;
  function toast(message, type) {
    let container = qs('#toast-container');
    if (!container) {
      container = el('<div id="toast-container" class="toast-container"></div>');
      document.body.appendChild(container);
    }
    const t = el(`<div class="toast toast-${type || 'default'}">
      <i data-lucide="${type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle-2' : 'info'}"></i>
      <span>${window.Utils.escapeHtml(message)}</span>
    </div>`);
    container.appendChild(t);
    lucide();
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 250);
    }, 3000);
  }

  function confirmDialog(message, onConfirm) {
    openModal({
      title: 'Confirmar ação',
      bodyHtml: `<p class="text-muted">${window.Utils.escapeHtml(message)}</p>`,
      footerHtml: `
        <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
        <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
      `,
      onMount: (overlay) => {
        qs('#confirm-cancel', overlay).addEventListener('click', closeModal);
        qs('#confirm-ok', overlay).addEventListener('click', () => { closeModal(); onConfirm(); });
      }
    });
  }

  // Confirmação reforçada para ações destrutivas (ex: zona de risco): exige a senha do Workspace antes de prosseguir.
  function confirmWithPassword(message, onConfirm) {
    openModal({
      title: 'Confirmar ação',
      bodyHtml: `
        <p class="text-muted">${window.Utils.escapeHtml(message)}</p>
        <div class="field" style="margin-top:14px;">
          <label>Digite sua senha para confirmar</label>
          <div class="pw-field"><input type="password" id="confirm-pw-input" autocomplete="current-password"><button type="button" class="pw-toggle" data-target="confirm-pw-input"><i data-lucide="eye"></i></button></div>
        </div>
        <div class="auth-error" id="confirm-pw-error" style="display:none;"><i data-lucide="alert-triangle"></i><span></span></div>
      `,
      footerHtml: `
        <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
        <button class="btn btn-danger" id="confirm-ok"><i data-lucide="shield-check"></i> Confirmar</button>
      `,
      onMount: (overlay) => {
        const input = qs('#confirm-pw-input', overlay);
        const errorEl = qs('#confirm-pw-error', overlay);
        const okBtn = qs('#confirm-ok', overlay);
        const toggleBtn = qs('.pw-toggle', overlay);

        if (toggleBtn) toggleBtn.addEventListener('click', () => window.WorkspaceAuth.togglePwVisibility(toggleBtn, input));
        qs('#confirm-cancel', overlay).addEventListener('click', closeModal);

        function showError(msg) {
          errorEl.querySelector('span').textContent = msg;
          errorEl.style.display = 'flex';
        }

        async function trySubmit() {
          const pw = input.value;
          if (!pw) { showError('Digite sua senha.'); input.focus(); return; }
          okBtn.disabled = true;
          const ok = await window.WorkspaceAuth.verify(pw);
          okBtn.disabled = false;
          if (!ok) {
            showError('Senha incorreta.');
            input.value = '';
            input.focus();
            return;
          }
          closeModal();
          onConfirm();
        }

        okBtn.addEventListener('click', trySubmit);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') trySubmit(); });
        setTimeout(() => input.focus(), 50);
      }
    });
  }

  // ---------------- Progress bar ----------------
  function progressBar(pct, color) {
    const p = window.Utils.clamp(pct, 0, 100);
    return `<div class="progress-track"><div class="progress-fill" style="width:${p}%; background:${color || 'var(--accent)'}"></div></div>`;
  }

  // ---------------- Empty state ----------------
  function emptyState(icon, title, subtitle) {
    return `
      <div class="empty-state">
        <i data-lucide="${icon}"></i>
        <h4>${title}</h4>
        <p>${subtitle || ''}</p>
      </div>
    `;
  }

  // ------------------------------------------------------------------
  // Anexo de arquivo pequeno (fica salvo só neste aparelho — ver
  // window.LocalFiles). Usado nas abas de Arquivos/Bibliografia das
  // disciplinas e do TCC, ao lado do campo de link (que esse sim
  // sincroniza entre aparelhos).
  // ------------------------------------------------------------------
  function fileAttachHtml(att, idPrefix) {
    const U = window.Utils;
    const has = att && att.fileName;
    const hasLocalCopy = has && window.LocalFiles.get(att.localFileId);
    return `
      <div class="field span-2">
        <label>Anexar arquivo pequeno (opcional — PDF ou imagem, fica salvo só neste aparelho)</label>
        <div id="${idPrefix}-current" style="margin-bottom:8px; font-size:12.5px; ${has ? '' : 'display:none;'}">
          📎 <span id="${idPrefix}-current-name">${has ? U.escapeHtml(att.fileName) + ' (' + Math.round((att.fileSize||0)/1024) + ' KB)' : ''}</span>
          ${has && !hasLocalCopy ? ' <span class="text-faint">— disponível só no aparelho onde foi enviado</span>' : ''}
          <button type="button" class="icon-btn" id="${idPrefix}-remove" style="margin-left:4px;"><i data-lucide="x"></i></button>
        </div>
        <input type="file" id="${idPrefix}-input" accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx" />
        <div class="text-faint" style="font-size:11px; margin-top:4px;">Máx. ~400KB. Pra arquivos grandes (DWG, SketchUp, Lumion, etc.), use o campo de link e guarde no Drive/Dropbox.</div>
      </div>
    `;
  }

  // `item` é o objeto (arquivo, referência, etc.) que vai receber os
  // campos localFileId/fileName/fileSize/mimeType diretamente.
  function bindFileAttachInput(overlay, idPrefix, item) {
    const U = window.Utils;
    const removeBtn = overlay.querySelector(`#${idPrefix}-remove`);
    if (removeBtn) removeBtn.addEventListener('click', () => {
      if (item.localFileId) window.LocalFiles.remove(item.localFileId);
      item.localFileId = null; item.fileName = null; item.fileSize = null; item.mimeType = null;
      overlay.querySelector(`#${idPrefix}-current`).style.display = 'none';
    });
    const input = overlay.querySelector(`#${idPrefix}-input`);
    if (!input) return;
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > window.LocalFiles.MAX_BYTES) {
        toast('Arquivo muito grande (máx. ~400KB) — use o campo de link para arquivos maiores', 'error');
        e.target.value = '';
        return;
      }
      try {
        const dataUrl = await window.LocalFiles.readFileAsDataUrl(file);
        const id = U.uid('lf');
        window.LocalFiles.save(id, dataUrl);
        item.localFileId = id; item.fileName = file.name; item.fileSize = file.size; item.mimeType = file.type;
        const cur = overlay.querySelector(`#${idPrefix}-current`);
        cur.style.display = '';
        cur.querySelector(`#${idPrefix}-current-name`).textContent = `${file.name} (${Math.round(file.size / 1024)} KB)`;
        toast('Arquivo anexado (salvo neste aparelho)', 'success');
      } catch (err) {
        toast('Não foi possível ler o arquivo.', 'error');
      }
    });
  }

  // Botão "Abrir" pra um anexo local — só funciona no aparelho que tem a
  // cópia (os outros aparelhos veem o nome do arquivo, mas não o conteúdo).
  function openLocalFile(localFileId) {
    const dataUrl = localFileId && window.LocalFiles.get(localFileId);
    if (!dataUrl) { toast('Esse arquivo está disponível só no aparelho onde foi enviado.', 'error'); return; }
    const win = window.open();
    if (win) { win.document.write(`<iframe src="${dataUrl}" style="border:0;position:fixed;inset:0;width:100%;height:100%;"></iframe>`); }
    else window.location.href = dataUrl;
  }

  return {
    MAIN_TABS, TCC_ITEMS,
    openModal, closeModal, toast, confirmDialog, confirmWithPassword,
    progressBar, emptyState, fileAttachHtml, bindFileAttachInput, openLocalFile,
  };
})();

window.Pages = window.Pages || {};

window.Pages.dashboard = (function () {
  const U = window.Utils;

  function nextClass(state) {
    const now = new Date();
    const todayIdx = now.getDay();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    let best = null, bestDelta = Infinity;
    state.disciplinas.forEach(d => {
      if (!d.dia || !d.horarioInicio) return;
      const dIdx = U.DIAS_SEMANA.indexOf(d.dia);
      if (dIdx < 0) return;
      let dayDelta = dIdx - todayIdx;
      if (dayDelta < 0) dayDelta += 7;
      const [h, m] = d.horarioInicio.split(':').map(Number);
      const classMinutes = h * 60 + m;
      let totalDelta = dayDelta * 1440 + (classMinutes - nowMinutes);
      if (totalDelta < 0) totalDelta += 7 * 1440;
      if (totalDelta < bestDelta) { bestDelta = totalDelta; best = d; }
    });
    return best;
  }

  function nextDelivery(state) {
    const pend = state.tarefas.filter(t => t.status !== 'concluido' && t.prazo);
    pend.sort((a, b) => a.prazo.localeCompare(b.prazo));
    return pend[0] || null;
