window.FolderWizard = (function () {
  const DATA_KEY_PREFIX = { estudos: 'folder_estudos_v1::', financeiro: 'folder_financeiro_v1::', igreja: 'folder_igreja_v1::', eventos: 'folder_eventos_v1::', pessoal: 'folder_pessoal_v1::' };
  const BUILTIN_DATA_KEY = { faculdade: 'faculdade_app_state_v1', igreja: 'igreja_workspace_v1', eventos: 'eventos_workspace_v1', financeiro: 'financeiro_workspace_v1', pessoal: 'pessoal_workspace_v1' };
  const BUILTIN_TEMPLATE = { faculdade: 'estudos', igreja: 'igreja', eventos: 'eventos', financeiro: 'financeiro', pessoal: 'pessoal' };

  function openStep1() {
    const templates = window.Templates.LIST;
    window.UI.openModal({
      title: 'Nova pasta — escolha um modelo',
      bodyHtml: `
        <div class="tmpl-grid">
          ${templates.map(t => `
            <button type="button" class="tmpl-card" data-tmpl="${t.key}" style="--f1:${t.color1}; --f2:${t.color2};">
              <span class="tmpl-icon"><i data-lucide="${t.icon}"></i></span>
              <span class="tmpl-name">${t.label}</span>
              <span class="tmpl-desc">${window.Utils.escapeHtml(t.description)}</span>
            </button>
          `).join('')}
        </div>
      `,
      footerHtml: `<button class="btn btn-ghost" id="tmpl-cancel">Cancelar</button>`,
      onMount: (overlay) => {
        overlay.querySelector('#tmpl-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelectorAll('.tmpl-card').forEach(card => {
          card.addEventListener('click', () => {
            const key = card.getAttribute('data-tmpl');
            window.UI.closeModal();
            setTimeout(() => openForm(key, null), 200);
          });
        });
      }
    });
  }

  // templateKey + existingFolder=null -> modo criação. existingFolder preenchido -> modo edição.
  function openForm(templateKey, existingFolder) {
    const tmpl = window.Templates.get(templateKey);
    const icons = window.Templates.ICONS;
    const colors = window.Templates.COLORS;
    let chosenIcon = existingFolder ? existingFolder.icon : tmpl.icon;
    let chosenColorIdx = Math.max(0, colors.findIndex(c => c.c1 === (existingFolder ? existingFolder.color1 : tmpl.color1)));
    if (chosenColorIdx < 0) chosenColorIdx = 0;

    window.UI.openModal({
      title: existingFolder ? `Editar pasta` : `Nova pasta — ${tmpl.label}`,
      bodyHtml: `
        <div class="field">
          <label>Nome da pasta</label>
          <input type="text" id="nf-name" placeholder="Ex: ${tmpl.label}" maxlength="40" value="${existingFolder ? window.Utils.escapeHtml(existingFolder.name) : ''}">
        </div>
        <div class="field">
          <label>Ícone</label>
          <div class="icon-picker" id="nf-icons">
            ${icons.map(ic => `<button type="button" class="icon-pick ${ic === chosenIcon ? 'active' : ''}" data-icon="${ic}"><i data-lucide="${ic}"></i></button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Cor</label>
          <div class="color-picker" id="nf-colors">
            ${colors.map((c, i) => `<button type="button" class="color-pick ${i === chosenColorIdx ? 'active' : ''}" data-idx="${i}" style="--f1:${c.c1}; --f2:${c.c2};"></button>`).join('')}
          </div>
        </div>
      `,
      footerHtml: `
        <button class="btn btn-ghost" id="nf-back">${existingFolder ? 'Cancelar' : 'Voltar'}</button>
        <button class="btn btn-primary" id="nf-create">${existingFolder ? 'Salvar' : 'Criar pasta'}</button>
      `,
      onMount: (overlay) => {
        const nameInput = overlay.querySelector('#nf-name');
        setTimeout(() => nameInput.focus(), 50);

        overlay.querySelector('#nf-back').addEventListener('click', () => {
          window.UI.closeModal();
          if (!existingFolder) setTimeout(openStep1, 200);
        });

        overlay.querySelectorAll('.icon-pick').forEach(btn => {
          btn.addEventListener('click', () => {
            overlay.querySelectorAll('.icon-pick').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            chosenIcon = btn.getAttribute('data-icon');
          });
        });
        overlay.querySelectorAll('.color-pick').forEach(btn => {
          btn.addEventListener('click', () => {
            overlay.querySelectorAll('.color-pick').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            chosenColorIdx = Number(btn.getAttribute('data-idx'));
          });
        });

        overlay.querySelector('#nf-create').addEventListener('click', () => {
          const name = nameInput.value.trim();
          if (!name) { nameInput.focus(); window.UI.toast('Digite um nome para a pasta.', 'error'); return; }
          const color = colors[chosenColorIdx];
          if (existingFolder) {
            window.FoldersDB.update(existingFolder.id, { name, icon: chosenIcon, color1: color.c1, color2: color.c2 });
            window.UI.toast('Pasta atualizada.', 'success');
          } else {
            window.FoldersDB.create({ name, icon: chosenIcon, color1: color.c1, color2: color.c2, template: templateKey });
            window.UI.toast(`Pasta "${name}" criada.`, 'success');
          }
          window.UI.closeModal();
          window.Hub.render();
        });
      }
    });
  }

  // source = { name, icon, color1, color2, template, scopeId, dataKey }
  function duplicateFolder(source, { name, icon, color1, color2, withData }) {
    const newFolder = window.FoldersDB.create({ name, icon, color1, color2, template: source.template });
    const newScopeId = source.template + ':' + newFolder.id;

    const srcScope = window.TabLayoutDB.getScope(source.scopeId);
    const clonedScope = JSON.parse(JSON.stringify(srcScope));
    if (!withData) {
      clonedScope.customTabs.forEach(ct => {
        ct.blocks.forEach(b => {
          if (b.type === 'notes') b.text = '';
          if (b.type === 'checklist' || b.type === 'links') b.items = [];
        });
      });
    }
    window.TabLayoutDB.save(newScopeId, s => Object.assign(s, clonedScope));

    if (withData) {
      const newKey = DATA_KEY_PREFIX[source.template] + newFolder.id;
      const rawData = localStorage.getItem(source.dataKey);
      if (rawData) localStorage.setItem(newKey, rawData);
    }
    return newFolder;
  }

  function openDuplicateForm(source) {
    const icons = window.Templates.ICONS;
    const colors = window.Templates.COLORS;
    let chosenIcon = source.icon;
    let chosenColorIdx = colors.findIndex(c => c.c1 === source.color1);
    if (chosenColorIdx < 0) chosenColorIdx = 0;

    window.UI.openModal({
      title: `Duplicar "${source.name}"`,
      bodyHtml: `
        <div class="field">
          <label>Nome da nova pasta</label>
          <input type="text" id="dup-name" value="${window.Utils.escapeHtml(source.name + ' (cópia)')}" maxlength="40">
        </div>
        <div class="field">
          <label>Ícone</label>
          <div class="icon-picker" id="dup-icons">
            ${icons.map(ic => `<button type="button" class="icon-pick ${ic === chosenIcon ? 'active' : ''}" data-icon="${ic}"><i data-lucide="${ic}"></i></button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Cor</label>
          <div class="color-picker" id="dup-colors">
            ${colors.map((c, i) => `<button type="button" class="color-pick ${i === chosenColorIdx ? 'active' : ''}" data-idx="${i}" style="--f1:${c.c1}; --f2:${c.c2};"></button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>O que copiar</label>
          <div class="dup-mode-options">
            <label class="dup-mode-option">
              <input type="radio" name="dup-mode" value="data" checked>
              <div><strong>Estrutura + dados</strong><span>Cópia completa, com todas as informações atuais.</span></div>
            </label>
            <label class="dup-mode-option">
              <input type="radio" name="dup-mode" value="empty">
              <div><strong>Apenas estrutura</strong><span>Mesmas abas e organização, porém vazia.</span></div>
            </label>
          </div>
        </div>
      `,
      footerHtml: `<button class="btn btn-ghost" id="dup-cancel">Cancelar</button><button class="btn btn-primary" id="dup-confirm"><i data-lucide="copy"></i> Duplicar</button>`,
      onMount: (overlay) => {
        const nameInput = overlay.querySelector('#dup-name');
        setTimeout(() => nameInput.focus(), 50);
        overlay.querySelector('#dup-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelectorAll('.icon-pick').forEach(btn => {
          btn.addEventListener('click', () => {
            overlay.querySelectorAll('.icon-pick').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            chosenIcon = btn.getAttribute('data-icon');
          });
        });
        overlay.querySelectorAll('.color-pick').forEach(btn => {
          btn.addEventListener('click', () => {
            overlay.querySelectorAll('.color-pick').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            chosenColorIdx = Number(btn.getAttribute('data-idx'));
          });
        });
        overlay.querySelector('#dup-confirm').addEventListener('click', () => {
          const name = nameInput.value.trim();
          if (!name) { nameInput.focus(); window.UI.toast('Digite um nome para a pasta.', 'error'); return; }
          const withData = overlay.querySelector('input[name="dup-mode"]:checked').value === 'data';
          const color = colors[chosenColorIdx];
          duplicateFolder(source, { name, icon: chosenIcon, color1: color.c1, color2: color.c2, withData });
          window.UI.closeModal();
          window.UI.toast(`Pasta "${name}" criada${withData ? ' com os dados copiados' : ' com a mesma estrutura, vazia'}.`, 'success');
          window.Hub.render();
        });
      }
    });
  }

  function openMenu(folder) {
    const tmpl = window.Templates.get(folder.template);
    window.UI.openModal({
      title: window.Utils.escapeHtml(folder.name),
      bodyHtml: `<p class="text-muted">Modelo: ${tmpl ? tmpl.label : folder.template}</p>`,
      footerHtml: `
        <button class="btn btn-ghost" id="fm-cancel">Fechar</button>
        <button class="btn btn-soft" id="fm-edit"><i data-lucide="pencil"></i> Editar</button>
        <button class="btn btn-soft" id="fm-duplicate"><i data-lucide="copy"></i> Duplicar</button>
        <button class="btn btn-soft" id="fm-archive"><i data-lucide="archive"></i> Arquivar</button>
        <button class="btn btn-danger" id="fm-delete"><i data-lucide="trash-2"></i> Excluir pasta</button>
      `,
      onMount: (overlay) => {
        overlay.querySelector('#fm-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#fm-edit').addEventListener('click', () => {
          window.UI.closeModal();
          setTimeout(() => openForm(folder.template, folder), 200);
        });
        overlay.querySelector('#fm-duplicate').addEventListener('click', () => {
          window.UI.closeModal();
          setTimeout(() => openDuplicateForm({
            name: folder.name, icon: folder.icon, color1: folder.color1, color2: folder.color2,
            template: folder.template, scopeId: folder.template + ':' + folder.id,
            dataKey: DATA_KEY_PREFIX[folder.template] + folder.id,
          }), 200);
        });
        overlay.querySelector('#fm-archive').addEventListener('click', () => {
          window.UI.closeModal();
          window.FoldersDB.archive(folder.id);
          window.UI.toast(`Pasta "${folder.name}" arquivada.`, 'success');
          window.Hub.render();
        });
        overlay.querySelector('#fm-delete').addEventListener('click', () => {
          window.UI.closeModal();
          setTimeout(() => {
            window.UI.confirmWithPassword(
              `Isso apagará permanentemente a pasta "${folder.name}" e todos os dados dela. Deseja continuar?`,
              () => {
                const prefix = DATA_KEY_PREFIX[folder.template];
                if (prefix) localStorage.removeItem(prefix + folder.id);
                window.FoldersDB.remove(folder.id);
                window.UI.toast('Pasta excluída.', 'success');
                window.Hub.render();
              }
            );
          }, 200);
        });
      }
    });
  }

  // Pastas fixas (builtin) podem ser arquivadas/restauradas e duplicadas — não têm edição de modelo nem exclusão de dados.
  function openBuiltinMenu(folder) {
    const template = BUILTIN_TEMPLATE[folder.id];
    window.UI.openModal({
      title: folder.label,
      bodyHtml: `<p class="text-muted">Arquivar esta pasta a remove da tela inicial, mas nenhum dado é apagado — você pode restaurá-la a qualquer momento em "Arquivados".</p>`,
      footerHtml: `
        <button class="btn btn-ghost" id="fm-cancel">Fechar</button>
        ${template ? '<button class="btn btn-soft" id="fm-duplicate"><i data-lucide="copy"></i> Duplicar</button>' : ''}
        <button class="btn btn-soft" id="fm-archive"><i data-lucide="archive"></i> Arquivar</button>
      `,
      onMount: (overlay) => {
        overlay.querySelector('#fm-cancel').addEventListener('click', window.UI.closeModal);
        const dupBtn = overlay.querySelector('#fm-duplicate');
        if (dupBtn) {
          dupBtn.addEventListener('click', () => {
            window.UI.closeModal();
            setTimeout(() => openDuplicateForm({
              name: folder.label, icon: folder.icon, color1: folder.c1, color2: folder.c2,
              template, scopeId: template + ':builtin', dataKey: BUILTIN_DATA_KEY[folder.id],
            }), 200);
          });
        }
        overlay.querySelector('#fm-archive').addEventListener('click', () => {
          window.UI.closeModal();
          window.FoldersDB.archiveBuiltin(folder.id);
          window.UI.toast(`Pasta "${folder.label}" arquivada.`, 'success');
          window.Hub.render();
        });
      }
    });
  }

  return { open: openStep1, openMenu, openBuiltinMenu };
})();

/* ---------------------------------- Dashboard Geral ----------------------------------- */
window.DashboardGeral = (function () {
  const U = window.Utils;
  let refDate = new Date();

  function collectEvents() {
    // Reúne itens de todos os módulos disponíveis em um único formato.
    // Módulos ainda não construídos (Igreja, Eventos, Financeiro, Pessoal) entrarão aqui
    // automaticamente assim que forem implementados nas próximas etapas.
    const items = [];
    const state = window.DB.get();

    state.tarefas.forEach(t => {
      if (!t.prazo) return;
      items.push({ date: t.prazo, label: t.titulo, kind: 'Entrega', source: 'Faculdade', color: '#EF4444' });
    });
    state.eventos.forEach(e => {
      if (!e.data) return;
      items.push({ date: e.data, label: e.titulo, kind: 'Evento', source: 'Faculdade', color: e.cor || '#EF4444' });
    });
    (state.tcc.etapas || []).forEach(e => {
      if (!e.dataFim) return;
      items.push({ date: e.dataFim, label: 'TCC · ' + e.nome, kind: 'TCC', source: 'Faculdade', color: '#C084FC' });
    });
    state.disciplinas.forEach(d => {
      (d.atividades || []).forEach(a => {
        if (!a.prazo) return;
        items.push({ date: a.prazo, label: a.titulo, kind: 'Prova/Atividade', source: d.nome, color: d.cor || '#EF4444' });
      });
    });

    if (window.IgrejaDB) {
      window.IgrejaDB.load();
      const ig = window.IgrejaDB.get();
      (ig.escalas || []).forEach(e => {
        if (!e.data) return;
        items.push({ date: e.data, label: `Escala · ${e.culto || 'Culto'}${e.funcao ? ' (' + e.funcao + ')' : ''}`, kind: 'Escala', source: 'Igreja', color: '#22C55E' });
      });
      (ig.eventos || []).forEach(e => {
        if (!e.data) return;
        items.push({ date: e.data, label: e.nome, kind: 'Evento · Igreja', source: 'Igreja', color: '#22C55E' });
      });
    }

    if (window.EventosDB) {
      window.EventosDB.load();
      const evState = window.EventosDB.get();
      (evState.eventos || []).forEach(e => {
        if (!e.data) return;
        const cat = evState.categorias.find(c => c.id === e.categoriaId);
        items.push({ date: e.data, label: e.nome, kind: 'Evento · ' + (cat ? cat.nome : 'Pessoal'), source: 'Eventos', color: (cat && cat.cor) || '#A855F7' });
      });
    }

    if (window.FinanceiroDB) {
      window.FinanceiroDB.load();
      const finState = window.FinanceiroDB.get();
      const today2 = U.todayISO();
      const hojeDia = new Date().getDate();
      finState.contas.filter(c => c.status === 'pendente' && c.diaVencimento).forEach(c => {
        const d = new Date();
        let mes = d.getMonth(), ano = d.getFullYear();
        if (Number(c.diaVencimento) < hojeDia) { mes += 1; if (mes > 11) { mes = 0; ano += 1; } }
        const iso = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(Math.min(Number(c.diaVencimento), 28)).padStart(2, '0')}`;
        items.push({ date: iso, label: `Conta · ${c.nome}`, kind: 'Financeiro', source: 'Financeiro', color: '#F97316' });
      });
      finState.assinaturas.filter(a => a.status === 'ativa').forEach(a => {
        const prx = window.FinanceiroApp && window.FinanceiroApp.proximaCobrancaDe ? window.FinanceiroApp.proximaCobrancaDe(a) : null;
        if (prx) items.push({ date: prx, label: `Assinatura · ${a.nome}`, kind: 'Financeiro', source: 'Financeiro', color: '#F97316' });
      });
    }

    if (window.PessoalDB) {
      window.PessoalDB.load();
      (window.PessoalDB.get().objetivos || []).forEach(o => {
        if (!o.dataAlvo || o.feito) return;
        items.push({ date: o.dataAlvo, label: `Objetivo · ${o.titulo}`, kind: 'Pessoal', source: 'Pessoal', color: '#3B82F6' });
      });
    }

    return items.sort((a, b) => a.date.localeCompare(b.date));
  }

  function nextEscala() {
    if (!window.IgrejaDB) return null;
    window.IgrejaDB.load();
    const today = U.todayISO();
    const list = (window.IgrejaDB.get().escalas || []).filter(e => e.data >= today).sort((a, b) => a.data.localeCompare(b.data));
    return list[0] || null;
  }

  function nextEventoPessoal() {
    if (!window.EventosDB) return null;
    window.EventosDB.load();
    const today = U.todayISO();
    const list = (window.EventosDB.get().eventos || []).filter(e => e.data && e.data >= today).sort((a, b) => a.data.localeCompare(b.data));
    return list[0] || null;
  }

  function nextVencimento() {
    if (!window.FinanceiroApp) return null;
    if (window.FinanceiroDB) window.FinanceiroDB.load();
    return window.FinanceiroApp.proximoVencimento();
  }

  function render() {
    window.ModuleShell.mount({
      icon: 'layout-dashboard',
      title: 'Dashboard Geral',
      accent: '#C0223F',
      tabs: [{ key: 'geral', label: 'Visão Geral' }],
      initialTab: 'geral',
      onRenderTab: (tab, content) => renderContent(content),
    });
  }

  function renderContent(content) {
    const items = collectEvents();
    const today = U.todayISO();
    const in7 = U.addDays(today, 7);

    const todayItems = items.filter(i => i.date === today);
    const upcoming = items.filter(i => i.date > today && i.date <= in7);
    const nextItem = items.find(i => i.date >= today);
    const monthPrefix = today.slice(0, 7);
    const monthCount = items.filter(i => i.date.startsWith(monthPrefix)).length;

    content.innerHTML = `
      <div class="dg-hero">
        <div>
          <h2>Olá, Laura 👋</h2>
          <p>${U.formatDateLong(today)}</p>
        </div>
        <div style="text-align:right;">
          <div style="font-size:26px; font-weight:800;">${todayItems.length}</div>
          <div style="font-size:11.5px; opacity:.85;">itens para hoje</div>
        </div>
      </div>

      <div class="dg-cards" id="dg-cards"></div>

      <div class="card section">
        <div class="page-header" style="margin-bottom:14px;">
          <div class="dg-section-title" style="margin:0;"><i data-lucide="calendar-days"></i> Calendário geral</div>
          <div class="header-actions">
            <button class="btn btn-ghost btn-icon" id="dg-cal-prev"><i data-lucide="chevron-left"></i></button>
            <button class="btn btn-soft btn-sm" id="dg-cal-today">Hoje</button>
            <button class="btn btn-ghost btn-icon" id="dg-cal-next"><i data-lucide="chevron-right"></i></button>
          </div>
        </div>
        <div class="subtitle" style="margin:-8px 0 12px;">${U.MESES[refDate.getMonth()]} de ${refDate.getFullYear()} · reúne Faculdade, Igreja, Eventos, Financeiro e Pessoal</div>
        <div class="calendar-grid" id="dg-calendar-grid"></div>
      </div>

      <div class="dg-content">
        <div class="card">
          <div class="dg-section-title"><i data-lucide="calendar-days"></i> Próximos 7 dias</div>
          <div id="dg-upcoming"></div>
        </div>
        <div class="card">
          <div class="dg-section-title"><i data-lucide="clock"></i> Agenda de hoje</div>
          <div id="dg-today"></div>
        </div>
      </div>
    `;

    const cardsHtml = [
      { icon: 'calendar-days', label: 'Eventos do dia', value: todayItems.length + (todayItems.length === 1 ? ' item' : ' itens'), color: '#C0223F' },
      { icon: 'flag', label: 'Próximo compromisso', value: nextItem ? `${U.formatDateBR(nextItem.date)} · ${nextItem.label}` : 'Nada agendado', color: '#EF4444' },
      { icon: 'church', label: 'Próxima escala', value: (() => { const ne = nextEscala(); return ne ? `${U.formatDateBR(ne.data)} · ${ne.culto || 'Culto'}` : 'Nenhuma escala futura'; })(), color: '#22C55E' },
      { icon: 'wallet', label: 'Próximo vencimento', value: (() => { const nv = nextVencimento(); return nv ? `${nv.label}${nv.dia ? ' · dia ' + nv.dia : (nv.data ? ' · ' + U.formatDateBR(nv.data) : '')}` : 'Nenhum vencimento pendente'; })(), color: '#F97316' },
      { icon: 'party-popper', label: 'Próximo evento pessoal', value: (() => { const ne = nextEventoPessoal(); return ne ? `${U.formatDateBR(ne.data)} · ${ne.nome}` : 'Nenhum evento futuro'; })(), color: '#A855F7' },
      { icon: 'bar-chart-2', label: 'Itens este mês', value: String(monthCount), color: '#8B1538' },
    ].map(c => `
      <div class="dg-card">
        <div class="dg-card-icon" style="background:${c.color};"><i data-lucide="${c.icon}"></i></div>
        <div class="dg-card-label">${c.label}</div>
        <div class="dg-card-value">${U.escapeHtml(c.value)}</div>
      </div>
    `).join('');
    content.querySelector('#dg-cards').innerHTML = cardsHtml;

    document.getElementById('dg-calendar-grid').innerHTML =
      U.DIAS_SEMANA_ABREV.map(d => `<div class="calendar-weekday">${d}</div>`).join('') + buildDgCalendarDays(items);
    U.lucide();
    content.querySelector('#dg-cal-prev').addEventListener('click', () => { refDate = new Date(refDate.getFullYear(), refDate.getMonth() - 1, 1); renderContent(content); });
    content.querySelector('#dg-cal-next').addEventListener('click', () => { refDate = new Date(refDate.getFullYear(), refDate.getMonth() + 1, 1); renderContent(content); });
    content.querySelector('#dg-cal-today').addEventListener('click', () => { refDate = new Date(); renderContent(content); });
    U.qsa('[data-dg-day]', content).forEach(dayEl => {
      dayEl.addEventListener('click', () => openDgDayModal(dayEl.getAttribute('data-dg-day'), items));
    });

    function listHtml(list, emptyMsg) {
      if (!list.length) return window.UI.emptyState('calendar', emptyMsg, '');
      return `<div class="timeline">` + list.map(i => `
        <div class="timeline-item">
          <div class="timeline-dot" style="background:${i.color};"></div>
          <div class="timeline-content">
            <div class="t-title">${U.escapeHtml(i.label)}</div>
            <div class="t-meta">${U.formatDateBR(i.date)} · ${i.kind} · <span class="dg-source-tag" style="background:${i.color};">${U.escapeHtml(i.source)}</span></div>
          </div>
        </div>
      `).join('') + `</div>`;
    }
    content.querySelector('#dg-today').innerHTML = listHtml(todayItems, 'Nada para hoje. Aproveite o dia livre!');
    content.querySelector('#dg-upcoming').innerHTML = listHtml(upcoming, 'Nada nos próximos 7 dias.');

    U.lucide();
  }

  function buildDgCalendarDays(items) {
    const year = refDate.getFullYear(), month = refDate.getMonth();
    const today = U.todayISO();
    const itemsByDay = {};
    items.forEach(i => { (itemsByDay[i.date] = itemsByDay[i.date] || []).push(i); });

    const first = new Date(year, month, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const cells = [];
    for (let i = startOffset - 1; i >= 0; i--) cells.push({ day: prevMonthDays - i, other: true, iso: null });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, other: false, iso: U.toISO(new Date(year, month, d)) });
    const rem = (7 - (cells.length % 7)) % 7;
    for (let d = 1; d <= rem; d++) cells.push({ day: d, other: true, iso: null });

    return cells.map(c => {
      if (c.other) return `<div class="calendar-day other-month"><span class="day-num">${c.day}</span></div>`;
      const dayItems = itemsByDay[c.iso] || [];
      return `
        <div class="calendar-day ${c.iso === today ? 'today' : ''}" data-dg-day="${c.iso}" ${dayItems.length ? 'style="cursor:pointer;"' : ''}>
          <span class="day-num">${c.day}</span>
          ${dayItems.slice(0, 3).map(i => `<div class="calendar-event" style="background:${i.color}" title="${U.escapeHtml(i.label)} (${U.escapeHtml(i.source)})">${U.escapeHtml(i.label)}</div>`).join('')}
          ${dayItems.length > 3 ? `<span class="text-faint" style="font-size:10px;">+${dayItems.length - 3} mais</span>` : ''}
        </div>
      `;
    }).join('');
  }

  function openDgDayModal(iso, items) {
    const dayItems = items.filter(i => i.date === iso);
    if (!dayItems.length) return;
    window.UI.openModal({
      title: U.formatDateLong(iso),
      bodyHtml: `
        <div class="timeline">
          ${dayItems.map(i => `
            <div class="timeline-item">
              <div class="timeline-dot" style="background:${i.color};"></div>
              <div class="timeline-content">
                <div class="t-title">${U.escapeHtml(i.label)}</div>
                <div class="t-meta">${i.kind} · <span class="dg-source-tag" style="background:${i.color};">${U.escapeHtml(i.source)}</span></div>
              </div>
            </div>
          `).join('')}
        </div>
        <p class="text-faint" style="font-size:11.5px; margin-top:14px;">Pra editar qualquer item, abra o módulo de origem indicado (Faculdade, Igreja, Financeiro...).</p>
      `,
      footerHtml: `<button class="btn btn-primary" id="f-close-day">Fechar</button>`,
      onMount: (overlay) => {
        U.qs('#f-close-day', overlay).addEventListener('click', window.UI.closeModal);
      }
    });
  }

  return { render, collectEvents };
})();

/* --------------------------------- Backup entre dispositivos -------------------------- */
window.WorkspaceBackup = (function () {
  const MODULE_KEYS = {
    faculdade: 'faculdade_app_state_v1',
    igreja: 'igreja_workspace_v1',
    eventos: 'eventos_workspace_v1',
    financeiro: 'financeiro_workspace_v1',
    pessoal: 'pessoal_workspace_v1',
  };

  function exportAll() {
    const modules = {};
    Object.keys(MODULE_KEYS).forEach(k => {
      try {
        const raw = localStorage.getItem(MODULE_KEYS[k]);
        modules[k] = raw ? JSON.parse(raw) : null;
      } catch (e) { modules[k] = null; }
    });
    const payload = { __laura_backup__: true, version: 1, exportedAt: new Date().toISOString(), modules };
    window.Utils.download(`laura-workspace-backup-${window.Utils.todayISO()}.json`, JSON.stringify(payload, null, 2));
  }

  function importAll(jsonText) {
    try {
      const payload = JSON.parse(jsonText);
      if (!payload || !payload.__laura_backup__ || !payload.modules) return false;
      Object.keys(MODULE_KEYS).forEach(k => {
        if (payload.modules[k]) localStorage.setItem(MODULE_KEYS[k], JSON.stringify(payload.modules[k]));
      });
      return true;
    } catch (e) {
      console.error('Erro ao importar backup do workspace.', e);
      return false;
    }
  }

  return { exportAll, importAll };
})();

        overlay.querySelector('#btn-import-all').addEventListener('click', () => {
          overlay.querySelector('#import-all-file').click();
        });
        overlay.querySelector('#import-all-file').addEventListener('change', (e) => {

          if (!file) return;
          const reader = new FileReader();

            window.UI.confirmDialog(
              'Importar este backup vai substituir os dados atuais de Faculdade, Igreja, Eventos, Financeiro e Pessoal neste dispositivo. Deseja continuar?',

                const ok = window.WorkspaceBackup.importAll(reader.result);

              }
            );
          };
          reader.readAsText(file);
        });

        overlay.querySelectorAll('.pw-toggle').forEach(btn => {
          btn.addEventListener('click', () => window.WorkspaceAuth.togglePwVisibility(btn, overlay.querySelector('#' + btn.getAttribute('data-target'))));
        });

        overlay.querySelector('#autolock-select').addEventListener('change', (e) => {
          const val = e.target.value === 'never' ? 'never' : Number(e.target.value);
          window.WS.save(s2 => { s2.security.autoLockMinutes = val; });
          window.UI.toast('Preferência de bloqueio atualizada.', 'success');
        });

        overlay.querySelector('#btn-lock-now').addEventListener('click', () => {
          window.UI.closeModal();
          window.WorkspaceLock.lockNow();
        });

        overlay.querySelector('#cp-submit').addEventListener('click', async () => {
          const errBox = overlay.querySelector('#cp-error');
          errBox.classList.remove('show');
          const cur = overlay.querySelector('#cp-current').value;
          const n1 = overlay.querySelector('#cp-new').value;
          const n2 = overlay.querySelector('#cp-confirm').value;
          if (n1.length < 6) { errBox.querySelector('span').textContent = 'A nova senha deve ter pelo menos 6 caracteres.'; errBox.classList.add('show'); return; }
          if (n1 !== n2) { errBox.querySelector('span').textContent = 'As senhas não coincidem.'; errBox.classList.add('show'); return; }
          const ok = await window.WorkspaceAuth.changePassword(cur, n1);
          if (!ok) { errBox.querySelector('span').textContent = 'Senha atual incorreta.'; errBox.classList.add('show'); return; }
          window.UI.toast('Senha alterada com sucesso.', 'success');
          overlay.querySelector('#cp-current').value = '';
          overlay.querySelector('#cp-new').value = '';
          overlay.querySelector('#cp-confirm').value = '';
        });

        overlay.querySelector('#sq-submit').addEventListener('click', async () => {
          const errBox = overlay.querySelector('#sq-error');
          errBox.classList.remove('show');
          const existing = (window.WS.get().auth && window.WS.get().auth.questions) || [];
          const finalList = [];
          for (let i = 0; i < 3; i++) {
            const qText = overlay.querySelector(`.sq-question[data-idx="${i}"]`).value.trim();
            const aText = overlay.querySelector(`#sq-answer-${i}`).value;
            if (!qText) { errBox.querySelector('span').textContent = `Preencha a pergunta ${i + 1}.`; errBox.classList.add('show'); return; }
            if (aText) {
              const hashed = await window.WorkspaceAuth.hashAnswer(aText);
              finalList.push(Object.assign({ question: qText }, hashed));
            } else if (existing[i]) {
              finalList.push(Object.assign({}, existing[i], { question: qText }));
            } else {
              errBox.querySelector('span').textContent = `Defina uma resposta para a pergunta ${i + 1}.`; errBox.classList.add('show'); return;
            }
          }
          window.WorkspaceAuth.saveQuestions(finalList);
          window.UI.toast('Perguntas de segurança salvas.', 'success');
          overlay.querySelectorAll('.sq-question').forEach((inp, i) => { inp.placeholder = ''; });
          [0, 1, 2].forEach(i => { const a = overlay.querySelector(`#sq-answer-${i}`); a.value = ''; a.placeholder = 'Deixe em branco para manter a resposta atual'; });
        });

        overlay.querySelector('#btn-wipe-all').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmWithPassword(
            'Isso apagará permanentemente sua senha e todos os dados de todos os módulos do Laura Workspace neste dispositivo. Deseja continuar?',
            () => { window.WS.wipeAll(); window.location.reload(); }
          );
        });
      }
    });
  }

  return { open };
})();


/* ==========================================================================
   module-shell.js — Casca reutilizável para os módulos do Hub (topbar + abas)
   ========================================================================== */
/* ==========================================================================
   Personalização de abas — reordenar, renomear, ocultar, criar e excluir abas
   por instância de módulo (scopeId = "<template>:<builtin|folderId>")
   ========================================================================== */
window.TabLayoutDB = (function () {
  const KEY = 'laura_tab_layouts_v1';
  let state = null;
  function load() {
    try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
    return state;
  }
  function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function getScope(scopeId) {
    if (!state) load();
    if (!state[scopeId]) state[scopeId] = { order: [], hidden: [], labels: {}, customTabs: [] };
    const s = state[scopeId];
    if (!s.order) s.order = [];
    if (!s.hidden) s.hidden = [];
    if (!s.labels) s.labels = {};
    if (!s.customTabs) s.customTabs = [];
    return s;
  }
  function save(scopeId, fn) { const s = getScope(scopeId); fn(s); persist(); return s; }
  function wipeAll() { localStorage.removeItem(KEY); state = {}; }
  return { load, getScope, save, wipeAll };
})();

window.TabCustomizer = (function () {
  const U = window.Utils;

  function mergeTabs(baseTabs, scopeId) {
    const scope = window.TabLayoutDB.getScope(scopeId);
    let combined = baseTabs.map(t => ({ key: t.key, icon: t.icon, label: scope.labels[t.key] || t.label, isCustom: false }));
    scope.customTabs.forEach(ct => {
      combined.push({ key: 'custom:' + ct.id, icon: ct.icon || 'file-text', label: ct.label, isCustom: true, customId: ct.id });
    });
    if (scope.order.length) {
      combined.sort((a, b) => {
        let ia = scope.order.indexOf(a.key); if (ia < 0) ia = 999;
        let ib = scope.order.indexOf(b.key); if (ib < 0) ib = 999;
        return ia - ib;
      });
    }
    return combined.filter(t => !scope.hidden.includes(t.key));
  }

  /* ------------------------- Gerenciador (reordenar/renomear/ocultar/criar/excluir) ------------------------- */
  function openManager(scopeId, baseTabs, onChange) {
    const scope = window.TabLayoutDB.getScope(scopeId);
    let rows = baseTabs.map(t => ({ key: t.key, icon: t.icon, label: scope.labels[t.key] || t.label, isCustom: false }))
      .concat(scope.customTabs.map(ct => ({ key: 'custom:' + ct.id, icon: ct.icon || 'file-text', label: ct.label, isCustom: true })));
    if (scope.order.length) {
      rows.sort((a, b) => {
        let ia = scope.order.indexOf(a.key); if (ia < 0) ia = 999;
        let ib = scope.order.indexOf(b.key); if (ib < 0) ib = 999;
        return ia - ib;
      });
    }

    function persistOrderAndRerender(overlay) {
      window.TabLayoutDB.save(scopeId, s => { s.order = rows.map(r => r.key); });
      renderRows(overlay);
    }

    function renderRows(overlay) {
      const list = overlay.querySelector('#tabmgr-list');
      list.innerHTML = rows.map((r, i) => `
        <div class="tabmgr-row" draggable="true" data-idx="${i}">
          <span class="tabmgr-handle"><i data-lucide="grip-vertical"></i></span>
          <span class="tabmgr-icon"><i data-lucide="${r.icon}"></i></span>
          <input type="text" class="tabmgr-label" data-idx="${i}" value="${U.escapeHtml(r.label)}" ${r.key === 'dashboard' ? '' : ''}>
          <button type="button" class="icon-btn tabmgr-vis" data-idx="${i}" title="${scope.hidden.includes(r.key) ? 'Mostrar aba' : 'Ocultar aba'}">
            <i data-lucide="${scope.hidden.includes(r.key) ? 'eye-off' : 'eye'}"></i>
          </button>
          ${r.isCustom ? `<button type="button" class="icon-btn tabmgr-del" data-idx="${i}" title="Excluir aba"><i data-lucide="trash-2"></i></button>` : ''}
        </div>
      `).join('');
      U.lucide();

      list.querySelectorAll('.tabmgr-label').forEach(inp => {
        inp.addEventListener('change', () => {
          const idx = Number(inp.getAttribute('data-idx'));
          const row = rows[idx];
          row.label = inp.value.trim() || row.label;
          if (row.isCustom) {
            window.TabLayoutDB.save(scopeId, s => {
              const ct = s.customTabs.find(c => 'custom:' + c.id === row.key);
              if (ct) ct.label = row.label;
            });
          } else {
            window.TabLayoutDB.save(scopeId, s => { s.labels[row.key] = row.label; });
          }
        });
      });
      list.querySelectorAll('.tabmgr-vis').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-idx'));
          const row = rows[idx];
          window.TabLayoutDB.save(scopeId, s => {
            const pos = s.hidden.indexOf(row.key);
            if (pos >= 0) s.hidden.splice(pos, 1); else s.hidden.push(row.key);
          });
          renderRows(overlay);
        });
      });
      list.querySelectorAll('.tabmgr-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-idx'));
          const row = rows[idx];
          window.UI.confirmDialog(`Excluir a aba "${row.label}"? O conteúdo dela será perdido.`, () => {
            window.TabLayoutDB.save(scopeId, s => {
              s.customTabs = s.customTabs.filter(c => 'custom:' + c.id !== row.key);
              s.order = s.order.filter(k => k !== row.key);
            });
            rows.splice(idx, 1);
            renderRows(overlay);
            onChange();
          });
        });
      });

      let dragIdx = null;
      list.querySelectorAll('.tabmgr-row').forEach(row => {
        row.addEventListener('dragstart', () => { dragIdx = Number(row.getAttribute('data-idx')); row.classList.add('dragging'); });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (e) => e.preventDefault());
        row.addEventListener('drop', () => {
          const dropIdx = Number(row.getAttribute('data-idx'));
          if (dragIdx === null || dragIdx === dropIdx) return;
          const [moved] = rows.splice(dragIdx, 1);
          rows.splice(dropIdx, 0, moved);
          persistOrderAndRerender(overlay);
          onChange();
        });
      });
    }

    window.UI.openModal({
      title: 'Personalizar abas',
      bodyHtml: `
        <div class="tabmgr-list" id="tabmgr-list"></div>
        <div class="field" style="margin-top:14px;">
          <label>Nova aba</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="tabmgr-new-name" placeholder="Ex: Pesquisas, Monitoria, Anotações...">
            <button class="btn btn-primary btn-sm" id="tabmgr-new-add" style="flex-shrink:0;"><i data-lucide="plus"></i> Criar</button>
          </div>
        </div>
      `,
      footerHtml: `<button class="btn btn-primary" id="tabmgr-done">Concluído</button>`,
      onMount: (overlay) => {
        renderRows(overlay);
        overlay.querySelector('#tabmgr-done').addEventListener('click', () => { window.UI.closeModal(); onChange(); });
        overlay.querySelector('#tabmgr-new-add').addEventListener('click', () => {
          const input = overlay.querySelector('#tabmgr-new-name');
          const name = input.value.trim();
          if (!name) { input.focus(); return; }
          const ct = { id: U.uid('tab'), label: name, icon: 'file-text', blocks: [{ id: U.uid('block'), type: 'notes', text: '' }] };
          window.TabLayoutDB.save(scopeId, s => { s.customTabs.push(ct); });
          rows.push({ key: 'custom:' + ct.id, icon: ct.icon, label: ct.label, isCustom: true });
          input.value = '';
          renderRows(overlay);
          onChange();
        });
      }
    });
  }

  /* ------------------------- Página genérica de uma aba customizada (blocos) ------------------------- */
  function getCustomTab(scopeId, customId) {
    const scope = window.TabLayoutDB.getScope(scopeId);
    return scope.customTabs.find(c => c.id === customId);
  }
  function saveCustomTab(scopeId, customId, fn) {
    window.TabLayoutDB.save(scopeId, s => {
      const ct = s.customTabs.find(c => c.id === customId);
      if (ct) fn(ct);
    });
  }

  function renderCustomTabPage(scopeId, customId, container) {
    const ct = getCustomTab(scopeId, customId);
    if (!ct) { container.innerHTML = window.UI.emptyState('file-x', 'Aba não encontrada', ''); return; }

    function blockHtml(b) {
      if (b.type === 'notes') {
        return `
          <div class="cb-block" data-block="${b.id}">
            <div class="cb-block-head"><span><i data-lucide="sticky-note"></i> Notas</span><button class="icon-btn cb-del" data-block="${b.id}"><i data-lucide="trash-2"></i></button></div>
            <textarea class="cb-notes" data-block="${b.id}" placeholder="Escreva aqui...">${U.escapeHtml(b.text || '')}</textarea>
          </div>`;
      }
      if (b.type === 'checklist') {
        const items = b.items || [];
        return `
          <div class="cb-block" data-block="${b.id}">
            <div class="cb-block-head"><span><i data-lucide="list-checks"></i> Checklist</span><button class="icon-btn cb-del" data-block="${b.id}"><i data-lucide="trash-2"></i></button></div>
            <div class="cb-checklist" data-block="${b.id}">
              ${items.map(it => `
                <label class="cb-check-item">
                  <input type="checkbox" data-block="${b.id}" data-item="${it.id}" ${it.done ? 'checked' : ''}>
                  <span class="${it.done ? 'done' : ''}">${U.escapeHtml(it.text)}</span>
                  <button type="button" class="icon-btn cb-item-del" data-block="${b.id}" data-item="${it.id}"><i data-lucide="x"></i></button>
                </label>
              `).join('') || '<p class="text-muted" style="font-size:12.5px;">Nenhum item ainda.</p>'}
            </div>
            <div class="cb-add-row">
              <input type="text" class="cb-new-item" data-block="${b.id}" placeholder="Novo item...">
              <button class="btn btn-soft btn-sm cb-add-item" data-block="${b.id}">Adicionar</button>
            </div>
          </div>`;
      }
      if (b.type === 'links') {
        const items = b.items || [];
        return `
          <div class="cb-block" data-block="${b.id}">
            <div class="cb-block-head"><span><i data-lucide="link"></i> Links</span><button class="icon-btn cb-del" data-block="${b.id}"><i data-lucide="trash-2"></i></button></div>
            <div class="cb-links" data-block="${b.id}">
              ${items.map(it => `
                <div class="cb-link-item">
                  <a href="${U.escapeHtml(it.url)}" target="_blank" rel="noopener">${U.escapeHtml(it.title || it.url)}</a>
                  <button type="button" class="icon-btn cb-item-del" data-block="${b.id}" data-item="${it.id}"><i data-lucide="x"></i></button>
                </div>
              `).join('') || '<p class="text-muted" style="font-size:12.5px;">Nenhum link ainda.</p>'}
            </div>
            <div class="cb-add-row">
              <input type="text" class="cb-new-link-title" data-block="${b.id}" placeholder="Título">
              <input type="text" class="cb-new-link-url" data-block="${b.id}" placeholder="https://...">
              <button class="btn btn-soft btn-sm cb-add-link" data-block="${b.id}">Adicionar</button>
            </div>
          </div>`;
      }
      return '';
    }

    container.innerHTML = `
      <div class="page-header"><h1>${U.escapeHtml(ct.label)}</h1></div>
      <div class="cb-blocks" id="cb-blocks">${ct.blocks.map(blockHtml).join('')}</div>
      <div class="cb-add-block">
        <button class="btn btn-soft btn-sm" data-add="notes"><i data-lucide="sticky-note"></i> Notas</button>
        <button class="btn btn-soft btn-sm" data-add="checklist"><i data-lucide="list-checks"></i> Checklist</button>
        <button class="btn btn-soft btn-sm" data-add="links"><i data-lucide="link"></i> Links</button>
      </div>
    `;
    U.lucide();

    function rerender() { renderCustomTabPage(scopeId, customId, container); }

    container.querySelectorAll('.cb-notes').forEach(ta => {
      let t = null;
      ta.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => saveCustomTab(scopeId, customId, tab => {
          const b = tab.blocks.find(x => x.id === ta.getAttribute('data-block'));
          if (b) b.text = ta.value;
        }), 300);
      });
    });
    container.querySelectorAll('.cb-del').forEach(btn => {
      btn.addEventListener('click', () => {
        saveCustomTab(scopeId, customId, tab => { tab.blocks = tab.blocks.filter(b => b.id !== btn.getAttribute('data-block')); });
        rerender();
      });
    });
    container.querySelectorAll('.cb-checklist input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        saveCustomTab(scopeId, customId, tab => {
          const b = tab.blocks.find(x => x.id === cb.getAttribute('data-block'));
          const it = b && b.items.find(i => i.id === cb.getAttribute('data-item'));
          if (it) it.done = cb.checked;
        });
        rerender();
      });
    });
    container.querySelectorAll('.cb-item-del').forEach(btn => {
      btn.addEventListener('click', () => {
        saveCustomTab(scopeId, customId, tab => {
          const b = tab.blocks.find(x => x.id === btn.getAttribute('data-block'));
          if (b) b.items = b.items.filter(i => i.id !== btn.getAttribute('data-item'));
        });
        rerender();
      });
    });
    container.querySelectorAll('.cb-add-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const blockId = btn.getAttribute('data-block');
        const input = container.querySelector(`.cb-new-item[data-block="${blockId}"]`);
        const text = input.value.trim();
        if (!text) return;
        saveCustomTab(scopeId, customId, tab => {
          const b = tab.blocks.find(x => x.id === blockId);
          if (b) { if (!b.items) b.items = []; b.items.push({ id: U.uid('item'), text, done: false }); }
        });
        rerender();
      });
    });
    container.querySelectorAll('.cb-add-link').forEach(btn => {
      btn.addEventListener('click', () => {
        const blockId = btn.getAttribute('data-block');
        const titleInput = container.querySelector(`.cb-new-link-title[data-block="${blockId}"]`);
        const urlInput = container.querySelector(`.cb-new-link-url[data-block="${blockId}"]`);
        let url = urlInput.value.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        saveCustomTab(scopeId, customId, tab => {
          const b = tab.blocks.find(x => x.id === blockId);
          if (b) { if (!b.items) b.items = []; b.items.push({ id: U.uid('item'), title: titleInput.value.trim(), url }); }
        });
        rerender();
      });
    });
    container.querySelectorAll('[data-add]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.getAttribute('data-add');
        const block = { id: U.uid('block'), type };
        if (type === 'checklist' || type === 'links') block.items = [];
        if (type === 'notes') block.text = '';
        saveCustomTab(scopeId, customId, tab => { tab.blocks.push(block); });
        rerender();
      });
    });
  }

  return { mergeTabs, openManager, renderCustomTabPage };
})();

window.ModuleShell = (function () {
  const U = window.Utils;

  function mount({ icon, title, accent, tabs, initialTab, onRenderTab, scopeId }) {
    const app = document.getElementById('app');
    const mergedTabs = scopeId ? window.TabCustomizer.mergeTabs(tabs, scopeId) : tabs;
    const hasTabs = Array.isArray(mergedTabs) && mergedTabs.length > 1;
    app.innerHTML = `
      <div class="module-page" style="--mod-accent:${accent};">
        <header class="module-topbar">
          <div class="module-topbar-left">
            <button class="icon-btn" id="btn-mod-back" title="Voltar ao Hub"><i data-lucide="layout-grid"></i></button>
            <div class="module-title"><i data-lucide="${icon}"></i><span>${title}</span></div>
          </div>
          ${hasTabs ? `
          <div class="module-tabs" id="module-tabs">
            ${mergedTabs.map(t => `<button class="module-tab" data-tab="${t.key}">${t.icon ? `<i data-lucide="${t.icon}"></i>` : ''}<span>${U.escapeHtml(t.label)}</span></button>`).join('')}
          </div>` : ''}
          <div class="module-topbar-right">
            ${scopeId ? `<button class="icon-btn" id="btn-mod-tabs" title="Personalizar abas"><i data-lucide="layout-list"></i></button>` : ''}
            <button class="icon-btn" id="btn-mod-lock" title="Bloquear Workspace"><i data-lucide="lock"></i></button>
            <button class="icon-btn" id="btn-mod-theme" title="Alternar tema"><i data-lucide="${window.Theme.current() === 'light' ? 'moon' : 'sun'}"></i></button>
          </div>
        </header>
        <main class="content" id="module-scroll">
          <div class="content-inner" id="module-content"></div>
        </main>
      </div>
    `;
    U.lucide();

    document.getElementById('btn-mod-back').addEventListener('click', () => window.Hub.render());
    document.getElementById('btn-mod-lock').addEventListener('click', () => window.WorkspaceLock.lockNow());
    document.getElementById('btn-mod-theme').addEventListener('click', () => {
      const next = window.Theme.current() === 'light' ? 'dark' : 'light';
      window.DB.save(s => { s.config.theme = next; });
      window.Theme.apply(next);
      const themeBtn = document.getElementById('btn-mod-theme');
      themeBtn.innerHTML = `<i data-lucide="${next === 'light' ? 'moon' : 'sun'}"></i>`;
      U.lucide();
    });
    const tabsBtn = document.getElementById('btn-mod-tabs');
    if (tabsBtn) {
      tabsBtn.addEventListener('click', () => {
        window.TabCustomizer.openManager(scopeId, tabs, () => mount({ icon, title, accent, tabs, initialTab: currentTab, onRenderTab, scopeId }));
      });
    }

    let currentTab = initialTab || (mergedTabs && mergedTabs[0] && mergedTabs[0].key) || 'main';
    if (!mergedTabs.find(t => t.key === currentTab)) currentTab = (mergedTabs[0] && mergedTabs[0].key) || currentTab;

    function renderTab() {
      U.qsa('.module-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === currentTab));
      const scroller = document.getElementById('module-scroll');
      const content = document.getElementById('module-content');
      if (scroller) scroller.scrollTop = 0;
      if (currentTab.indexOf('custom:') === 0) {
        window.TabCustomizer.renderCustomTabPage(scopeId, currentTab.slice(7), content);
      } else {
        onRenderTab(currentTab, content, switchTab);
      }
    }
    function switchTab(key) { currentTab = key; renderTab(); }

    U.qsa('.module-tab').forEach(b => {
      b.addEventListener('click', () => switchTab(b.getAttribute('data-tab')));
    });

    renderTab();
    return { switchTab, refresh: renderTab };
  }

  return { mount };
})();

window.IgrejaDB = (function () {
  const LEGACY_KEY = 'igreja_workspace_v1';
  let KEY = LEGACY_KEY;
  const { uid } = window.Utils;

  function setInstance(id) { KEY = id ? ('folder_igreja_v1::' + id) : LEGACY_KEY; state = null; }

  function defaultState() {
    return { escalas: [], eventos: [] };
  }

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
    } catch (e) {
      console.error('Erro ao carregar dados da Igreja, restaurando padrão.', e);
      state = defaultState();
    }
    persist();
    return state;
  }
  function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function get() { return state; }
  function save(fn) { fn(state); persist(); }

  return { load, get, save, uidHelper: uid, setInstance };
})();

window.IgrejaApp = (function () {
  const U = window.Utils;
  const ACCENT = '#16A34A';

  const ESCALA_STATUS = [
    { v: 'pendente', label: 'Pendente', color: '#EAB308' },
    { v: 'confirmada', label: 'Confirmada', color: '#22C55E' },
    { v: 'concluida', label: 'Concluída', color: '#38BDF8' },
    { v: 'cancelada', label: 'Cancelada', color: '#EF4444' },
  ];
  const CULTO_SUGESTOES = ['Culto de Celebração', 'Culto da Família', 'Culto de Oração', 'Culto Jovem', 'Culto de Ensino', 'EBD'];
  const FUNCAO_SUGESTOES = ['Recepção', 'Som', 'Mídia/Projeção', 'Louvor', 'Ministração', 'Infantil', 'Diaconia', 'Transmissão'];
  const EVENTO_CATEGORIAS = ['Congresso', 'Retiro', 'Culto Jovem', 'Evangelismo', 'Conferência', 'Acampamento', 'Outro'];

  function statusMeta(v) { return ESCALA_STATUS.find(s => s.v === v) || ESCALA_STATUS[0]; }

  function mount(folder) {
    window.IgrejaDB.load();
    window.ModuleShell.mount({
      icon: folder ? folder.icon : 'church',
      title: folder ? folder.name : 'Igreja',
      accent: folder ? folder.color2 : ACCENT,
      scopeId: 'igreja:' + (folder ? folder.id : 'builtin'),
      tabs: [
        { key: 'escalas', label: 'Escalas', icon: 'calendar-clock' },
        { key: 'eventos', label: 'Eventos', icon: 'party-popper' },
      ],
      initialTab: 'escalas',
      onRenderTab: (tab, content, switchTab) => {
        if (tab === 'escalas') renderEscalas(content);
        else renderEventos(content);
      },
    });
  }

  /* =============================== ESCALAS =============================== */
  let escalasView = 'todas'; // hoje | semana | mes | todas
  let escalasRefMonth = new Date();

  function escalasFiltered() {
    const state = window.IgrejaDB.get();
    const today = U.todayISO();
    let list = state.escalas.slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    if (escalasView === 'hoje') list = list.filter(e => e.data === today);
    else if (escalasView === 'semana') {
      const in7 = U.addDays(today, 7);
      list = list.filter(e => e.data >= today && e.data <= in7);
    } else if (escalasView === 'mes') {
      const prefix = today.slice(0, 7);
      list = list.filter(e => (e.data || '').startsWith(prefix));
    }
    return list;
  }

  function renderEscalas(content) {
    const state = window.IgrejaDB.get();
    const list = escalasFiltered();

    content.innerHTML = `
      <div class="filter-bar">
        ${[['hoje', 'Hoje'], ['semana', 'Próximos 7 dias'], ['mes', 'Este mês'], ['todas', 'Todas']].map(([k, label]) => `
          <button class="filter-chip ${escalasView === k ? 'mod-chip-active' : ''}" data-view="${k}">${label}</button>
        `).join('')}
        <div style="flex:1;"></div>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-escala"><i data-lucide="plus"></i> Nova escala</button>
      </div>

      <div class="dash-split-13" style="gap:20px;">
        <div class="card">
          <div class="dg-section-title"><i data-lucide="list"></i> Escalas (${list.length})</div>
          <div id="escalas-list"></div>
        </div>
        <div class="card">
          <div class="dg-section-title"><i data-lucide="calendar"></i> Calendário</div>
          <div id="escalas-cal"></div>
        </div>
      </div>
    `;
    U.lucide();

    document.getElementById('escalas-list').innerHTML = list.length
      ? `<div class="item-grid">` + list.map(e => escalaCard(e)).join('') + `</div>`
      : window.UI.emptyState('calendar-clock', 'Nenhuma escala aqui', 'Cadastre uma nova escala para começar.');

    renderEscalasMiniCal(document.getElementById('escalas-cal'), state);

    U.lucide();
    U.qsa('[data-view]', content).forEach(b => b.addEventListener('click', () => { escalasView = b.getAttribute('data-view'); renderEscalas(content); }));
    document.getElementById('btn-add-escala').addEventListener('click', () => openEscalaForm(null, content));
    U.qsa('[data-open-escala]', content).forEach(b => b.addEventListener('click', () => {
      const esc = window.IgrejaDB.get().escalas.find(x => x.id === b.getAttribute('data-open-escala'));
      openEscalaForm(esc, content);
    }));
  }

  function escalaCard(e) {
    const meta = statusMeta(e.status);
    return `
      <div class="card" data-open-escala="${e.id}" style="cursor:pointer;">
        <div class="item-card-top">
          <div>
            <div class="item-card-title">${U.escapeHtml(e.culto || 'Culto')}</div>
            <div class="item-card-meta" style="margin-top:4px;">
              <i data-lucide="calendar" style="width:12px;height:12px;"></i> ${U.formatDateBR(e.data)}
              ${e.horario ? `· <i data-lucide="clock" style="width:12px;height:12px;"></i> ${e.horario}` : ''}
            </div>
          </div>
          <span class="status-pill" style="background:${meta.color}22; color:${meta.color};">${meta.label}</span>
        </div>
        <div class="item-card-meta" style="margin-top:8px;"><i data-lucide="user" style="width:12px;height:12px;"></i> ${U.escapeHtml(e.funcao || '—')}</div>
        ${e.observacoes ? `<div class="text-muted" style="font-size:11.5px; margin-top:6px; line-height:1.4;">${U.escapeHtml(e.observacoes)}</div>` : ''}
      </div>
    `;
  }

  function renderEscalasMiniCal(container, state) {
    const ref = escalasRefMonth;
    const year = ref.getFullYear(), month = ref.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const todayISO = U.todayISO();

    const escalasByDay = {};
    state.escalas.forEach(e => { if (e.data) (escalasByDay[e.data] = escalasByDay[e.data] || []).push(e); });

    let cells = '';
    for (let i = startOffset - 1; i >= 0; i--) cells += `<div class="calendar-mini-day other-month">${daysInPrevMonth - i}</div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const has = escalasByDay[iso] && escalasByDay[iso].length;
      cells += `<div class="calendar-mini-day ${iso === todayISO ? 'today' : ''} ${has ? 'has-event' : ''}" data-day="${iso}" style="cursor:pointer;">${d}</div>`;
    }
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) cells += `<div class="calendar-mini-day other-month">${i}</div>`;

    container.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <button class="icon-btn" id="cal-prev"><i data-lucide="chevron-left"></i></button>
        <div style="font-size:12.5px; font-weight:700;">${U.MESES[month]} de ${year}</div>
        <button class="icon-btn" id="cal-next"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="calendar-mini">
        ${U.DIAS_SEMANA_ABREV.map(d => `<div class="calendar-weekday">${d}</div>`).join('')}
        ${cells}
      </div>
    `;
    U.lucide();
    container.querySelector('#cal-prev').addEventListener('click', () => { escalasRefMonth = new Date(year, month - 1, 1); renderEscalasMiniCal(container, state); });
    container.querySelector('#cal-next').addEventListener('click', () => { escalasRefMonth = new Date(year, month + 1, 1); renderEscalasMiniCal(container, state); });
    U.qsa('[data-day]', container).forEach(d => d.addEventListener('click', () => {
      const iso = d.getAttribute('data-day');
      const escs = escalasByDay[iso] || [];
      if (escs.length === 1) openEscalaForm(escs[0], document.getElementById('module-content'));
      else if (escs.length > 1) window.UI.toast(`${escs.length} escalas em ${U.formatDateBR(iso)} — veja a lista.`, 'default');
      else openEscalaForm({ id: null, data: iso, horario: '', culto: '', funcao: '', observacoes: '', status: 'pendente' }, document.getElementById('module-content'));
    }));
  }

  function openEscalaForm(escala, content) {
    const isEdit = !!(escala && escala.id);
    const e = escala || { id: null, data: U.todayISO(), horario: '', culto: '', funcao: '', observacoes: '', status: 'pendente' };

    window.UI.openModal({
      title: isEdit ? 'Editar escala' : 'Nova escala',
      bodyHtml: `
        <div class="form-grid">
          <div class="field"><label>Data</label><input type="date" id="f-data" value="${e.data || ''}"></div>
          <div class="field"><label>Horário</label><input type="time" id="f-horario" value="${e.horario || ''}"></div>
          <div class="field span-2"><label>Culto</label><input id="f-culto" list="culto-list" value="${U.escapeHtml(e.culto || '')}" placeholder="Ex: Culto de Celebração">
            <datalist id="culto-list">${CULTO_SUGESTOES.map(c => `<option value="${c}">`).join('')}</datalist>
          </div>
          <div class="field span-2"><label>Função</label><input id="f-funcao" list="funcao-list" value="${U.escapeHtml(e.funcao || '')}" placeholder="Ex: Som, Mídia, Louvor...">
            <datalist id="funcao-list">${FUNCAO_SUGESTOES.map(c => `<option value="${c}">`).join('')}</datalist>
          </div>
          <div class="field"><label>Status</label>
            <select id="f-status">${ESCALA_STATUS.map(s => `<option value="${s.v}" ${e.status === s.v ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
          </div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(e.observacoes || '')}</textarea></div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            data: overlay.querySelector('#f-data').value,
            horario: overlay.querySelector('#f-horario').value,
            culto: overlay.querySelector('#f-culto').value.trim(),
            funcao: overlay.querySelector('#f-funcao').value.trim(),
            status: overlay.querySelector('#f-status').value,
            observacoes: overlay.querySelector('#f-obs').value,
          };
          window.IgrejaDB.save(s => {
            if (isEdit) Object.assign(s.escalas.find(x => x.id === e.id), payload);
            else s.escalas.push(Object.assign({ id: U.uid('escala') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Escala salva.', 'success');
          renderEscalas(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog('Remover esta escala?', () => {
            window.IgrejaDB.save(s => { s.escalas = s.escalas.filter(x => x.id !== e.id); });
            window.UI.toast('Escala removida.', 'success');
            renderEscalas(content);
          });
        });
      }
    });
  }

  /* =============================== EVENTOS =============================== */
  let eventosCatFilter = 'todas';

  function renderEventos(content) {
    const state = window.IgrejaDB.get();
    const cats = ['todas', ...EVENTO_CATEGORIAS];
    const list = state.eventos
      .filter(ev => eventosCatFilter === 'todas' || ev.categoria === eventosCatFilter)
      .sort((a, b) => (a.data || '').localeCompare(b.data || ''));

    content.innerHTML = `
      <div class="filter-bar">
        ${cats.map(c => `<button class="filter-chip ${eventosCatFilter === c ? 'mod-chip-active' : ''}" data-cat="${c}">${c === 'todas' ? 'Todas' : c}</button>`).join('')}
        <div style="flex:1;"></div>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-evento"><i data-lucide="plus"></i> Novo evento</button>
      </div>
      <div id="eventos-list"></div>
    `;
    U.lucide();

    document.getElementById('eventos-list').innerHTML = list.length
      ? `<div class="item-grid">` + list.map(ev => eventoCard(ev)).join('') + `</div>`
      : window.UI.emptyState('party-popper', 'Nenhum evento cadastrado', 'Cadastre congressos, retiros, evangelismos e mais.');

    U.lucide();
    U.qsa('[data-cat]', content).forEach(b => b.addEventListener('click', () => { eventosCatFilter = b.getAttribute('data-cat'); renderEventos(content); }));
    document.getElementById('btn-add-evento').addEventListener('click', () => openEventoForm(null, content));
    U.qsa('[data-open-evento]', content).forEach(b => b.addEventListener('click', () => {
      const ev = window.IgrejaDB.get().eventos.find(x => x.id === b.getAttribute('data-open-evento'));
      openEventoForm(ev, content);
    }));
  }

  function eventoCard(ev) {
    const done = (ev.checklist || []).filter(c => c.feito).length;
    const total = (ev.checklist || []).length;
    return `
      <div class="card" data-open-evento="${ev.id}" style="cursor:pointer;">
        <div class="item-card-top">
          <div>
            <div class="item-card-title">${U.escapeHtml(ev.nome || 'Evento')}</div>
            <div class="item-card-meta" style="margin-top:4px;">
              <i data-lucide="calendar" style="width:12px;height:12px;"></i> ${ev.data ? U.formatDateBR(ev.data) : 'Sem data'}
              ${ev.horario ? `· ${ev.horario}` : ''}
            </div>
          </div>
          <span class="status-pill" style="background:${ACCENT}22; color:${ACCENT};">${U.escapeHtml(ev.categoria || 'Outro')}</span>
        </div>
        ${ev.local ? `<div class="item-card-meta" style="margin-top:8px;"><i data-lucide="map-pin" style="width:12px;height:12px;"></i> ${U.escapeHtml(ev.local)}</div>` : ''}
        ${total ? `<div class="checklist-progress" style="margin-top:8px;"><i data-lucide="check-square" style="width:12px;height:12px;"></i> ${done}/${total} concluídos</div>` : ''}
      </div>
    `;
  }

  function openEventoForm(evento, content) {
    const isEdit = !!(evento && evento.id);
    const ev = evento || { id: null, nome: '', categoria: EVENTO_CATEGORIAS[0], data: '', horario: '', local: '', descricao: '', checklist: [], arquivos: [], observacoes: '' };
    let checklist = (ev.checklist || []).map(c => Object.assign({}, c));
    let arquivos = (ev.arquivos || []).map(a => Object.assign({}, a));

    function checklistHtml() {
      if (!checklist.length) return `<p class="text-faint" style="font-size:12px;">Nenhum item ainda.</p>`;
      return checklist.map(c => `
        <div class="checklist-item ${c.feito ? 'done' : ''}" data-check-id="${c.id}">
          <input type="checkbox" ${c.feito ? 'checked' : ''} data-check-toggle="${c.id}">
          <span>${U.escapeHtml(c.texto)}</span>
          <button class="icon-btn" data-check-del="${c.id}" style="width:24px;height:24px;margin-left:auto;"><i data-lucide="x"></i></button>
        </div>
      `).join('');
    }
    function arquivosHtml() {
      if (!arquivos.length) return `<p class="text-faint" style="font-size:12px;">Nenhum arquivo/link ainda.</p>`;
      return arquivos.map(a => `
        <div class="file-card" data-file-id="${a.id}" style="padding:8px 0;">
          <div class="file-icon"><i data-lucide="file"></i></div>
          <div style="flex:1;">
            <div class="file-name">${U.escapeHtml(a.nome)}</div>
            ${a.link ? `<div class="file-meta">${U.escapeHtml(a.link)}</div>` : ''}
          </div>
          <button class="icon-btn" data-file-del="${a.id}"><i data-lucide="trash-2"></i></button>
        </div>
      `).join('');
    }

    window.UI.openModal({
      title: isEdit ? 'Editar evento' : 'Novo evento',
      size: 'lg',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome do evento</label><input id="f-nome" value="${U.escapeHtml(ev.nome)}" placeholder="Ex: Congresso de Jovens 2026"></div>
          <div class="field"><label>Categoria</label>
            <select id="f-cat">${EVENTO_CATEGORIAS.map(c => `<option ${ev.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Local</label><input id="f-local" value="${U.escapeHtml(ev.local || '')}"></div>
          <div class="field"><label>Data</label><input type="date" id="f-data" value="${ev.data || ''}"></div>
          <div class="field"><label>Horário</label><input type="time" id="f-horario" value="${ev.horario || ''}"></div>
          <div class="field span-2"><label>Descrição</label><textarea id="f-desc">${U.escapeHtml(ev.descricao || '')}</textarea></div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(ev.observacoes || '')}</textarea></div>

          <div class="field span-2">
            <label>Checklist</label>
            <div id="checklist-box">${checklistHtml()}</div>
            <div class="checklist-add"><input id="f-check-new" placeholder="Novo item..."><button class="btn btn-soft btn-sm" id="btn-add-check">Adicionar</button></div>
          </div>

          <div class="field span-2">
            <label>Arquivos (nome + link opcional)</label>
            <div id="arquivos-box">${arquivosHtml()}</div>
            <div class="checklist-add">
              <input id="f-file-nome" placeholder="Nome do arquivo" style="flex:1;">
              <input id="f-file-link" placeholder="Link (opcional)" style="flex:1;">
              <button class="btn btn-soft btn-sm" id="btn-add-file">Adicionar</button>
            </div>
          </div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        function refreshChecklist() {
          overlay.querySelector('#checklist-box').innerHTML = checklistHtml();
          U.lucide();
          U.qsa('[data-check-toggle]', overlay).forEach(cb => cb.addEventListener('change', () => {
            const item = checklist.find(c => c.id === cb.getAttribute('data-check-toggle'));
            item.feito = cb.checked;
            refreshChecklist();
          }));
          U.qsa('[data-check-del]', overlay).forEach(btn => btn.addEventListener('click', () => {
            checklist = checklist.filter(c => c.id !== btn.getAttribute('data-check-del'));
            refreshChecklist();
          }));
        }
        function refreshArquivos() {
          overlay.querySelector('#arquivos-box').innerHTML = arquivosHtml();
          U.lucide();
          U.qsa('[data-file-del]', overlay).forEach(btn => btn.addEventListener('click', () => {
            arquivos = arquivos.filter(a => a.id !== btn.getAttribute('data-file-del'));
            refreshArquivos();
          }));
        }
        refreshChecklist();
        refreshArquivos();

        overlay.querySelector('#btn-add-check').addEventListener('click', () => {
          const input = overlay.querySelector('#f-check-new');
          if (!input.value.trim()) return;
          checklist.push({ id: U.uid('chk'), texto: input.value.trim(), feito: false });
          input.value = '';
          refreshChecklist();
        });
        overlay.querySelector('#f-check-new').addEventListener('keydown', e => { if (e.key === 'Enter') overlay.querySelector('#btn-add-check').click(); });

        overlay.querySelector('#btn-add-file').addEventListener('click', () => {
          const nomeI = overlay.querySelector('#f-file-nome');
          const linkI = overlay.querySelector('#f-file-link');
          if (!nomeI.value.trim()) return;
          arquivos.push({ id: U.uid('file'), nome: nomeI.value.trim(), link: linkI.value.trim() });
          nomeI.value = ''; linkI.value = '';
          refreshArquivos();
        });

        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            nome: overlay.querySelector('#f-nome').value.trim() || 'Evento sem nome',
            categoria: overlay.querySelector('#f-cat').value,
            local: overlay.querySelector('#f-local').value,
            data: overlay.querySelector('#f-data').value,
            horario: overlay.querySelector('#f-horario').value,
            descricao: overlay.querySelector('#f-desc').value,
            observacoes: overlay.querySelector('#f-obs').value,
            checklist, arquivos,
          };
          window.IgrejaDB.save(s => {
            if (isEdit) Object.assign(s.eventos.find(x => x.id === ev.id), payload);
            else s.eventos.push(Object.assign({ id: U.uid('ievento') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Evento salvo.', 'success');
          renderEventos(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog('Remover este evento?', () => {
            window.IgrejaDB.save(s => { s.eventos = s.eventos.filter(x => x.id !== ev.id); });
            window.UI.toast('Evento removido.', 'success');
            renderEventos(content);
          });
        });
      }
    });
  }

  return { mount };
})();

/* ==========================================================================
   eventos.js — Módulo Eventos (organizador de eventos pessoais, categorias dinâmicas)
