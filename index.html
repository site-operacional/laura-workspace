    const nd = nextDelivery(state);

    const estagio = state.estagio;
    const horasFeitas = estagio.registros.reduce((s, r) => s + U.estagioHorasRegistro(r), 0);
    const horasRestantes = Math.max(0, estagio.horasObrigatorias - horasFeitas);

    const diasRestantesSemestre = U.daysFromToday(state.config.semestreFim);
    const totalSemestre = U.daysBetween(state.config.semestreInicio, state.config.semestreFim) || 1;
    const decorridos = totalSemestre - (diasRestantesSemestre || 0);
    const pctSemestre = U.clamp(Math.round((decorridos / totalSemestre) * 100), 0, 100);

    container.innerHTML = `
      <div class="content-inner">
        <div class="page-header">
          <div>
            <h1>Visão geral</h1>
            <div class="subtitle">Bem-vindo de volta. Aqui está o resumo do seu semestre.</div>
          </div>
        </div>

        <div class="grid grid-4 section">
          ${statCard('calendar-clock', 'Próxima aula', nc ? nc.nome : '—', nc ? `${nc.dia} · ${nc.horarioInicio}` : 'Nenhuma aula agendada', nc ? nc.cor : null)}
          ${statCard('clipboard-list', 'Próxima entrega', nd ? nd.titulo : '—', nd ? U.formatDateBR(nd.prazo) : 'Nenhuma pendência', null)}
          ${statCard('list-todo', 'Tarefas pendentes', pendentes.length, `${state.tarefas.length} no total`, null)}
          ${statCard('alert-triangle', 'Atividades atrasadas', atrasadas.length, atrasadas.length ? 'Requer atenção' : 'Tudo em dia', atrasadas.length ? 'var(--danger)' : null)}
          ${statCard('briefcase', 'Horas de estágio', `${horasFeitas}h`, `${horasRestantes}h restantes`, null)}
          ${statCard('graduation-cap', 'Fim do semestre', diasRestantesSemestre !== null ? `${diasRestantesSemestre}d` : '—', 'dias restantes', null)}
        </div>

        <div class="dash-split-13">
          <div>
            <div class="section">
              <div class="section-title"><h3><i data-lucide="check-square"></i> Hoje</h3></div>
              <div class="card" id="today-list-card">
                ${renderTodayList(state)}
              </div>
            </div>

            <div class="section">
              <div class="section-title"><h3><i data-lucide="clock"></i> Entregas próximas</h3></div>
              <div class="card">
                ${renderUpcoming(state)}
              </div>
            </div>

            <div class="section">
              <div class="section-title"><h3><i data-lucide="git-commit-horizontal"></i> Linha do tempo</h3></div>
              <div class="card">
                ${renderTimeline(state)}
              </div>
            </div>
          </div>

          <div>
            <div class="section">
              <div class="section-title"><h3><i data-lucide="calendar"></i> Calendário</h3></div>
              <div class="card" id="mini-cal-card">
                ${renderMiniCalendar(state, new Date())}
              </div>
            </div>

            <div class="section">
              <div class="section-title"><h3><i data-lucide="trending-up"></i> Progresso do semestre</h3></div>
              <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12.5px;">
                  <span class="text-muted">${state.config.semestre}</span>
                  <span class="mono" style="font-weight:700;">${pctSemestre}%</span>
                </div>
                ${window.UI.progressBar(pctSemestre)}
                <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px;" class="text-faint">
                  <span>${U.formatDateBR(state.config.semestreInicio)}</span>
                  <span>${U.formatDateBR(state.config.semestreFim)}</span>
                </div>
              </div>
            </div>

            <div class="section">
              <div class="section-title"><h3><i data-lucide="bar-chart-2"></i> Tarefas por disciplina</h3></div>
              <div class="card"><canvas id="chart-tasks-disc" height="180"></canvas></div>
            </div>
          </div>
        </div>
      </div>
    `;
    U.lucide();
    bindEvents(container);
    renderChart(state);
  }

  function renderChart(state) {
    const canvas = document.getElementById('chart-tasks-disc');
    if (!canvas || !window.Chart) return;
    const withTasks = state.disciplinas.map(d => ({
      d, count: state.tarefas.filter(t => t.disciplinaId === d.id).length,
    })).filter(x => x.count > 0);
    if (!withTasks.length) { canvas.parentElement.innerHTML = window.UI.emptyState('bar-chart-2', 'Sem tarefas vinculadas a disciplinas ainda', ''); U.lucide(); return; }
    if (window.__dashChart) window.__dashChart.destroy();
    window.__dashChart = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: withTasks.map(x => x.d.nome.length > 18 ? x.d.nome.slice(0, 18) + '…' : x.d.nome),
        datasets: [{ data: withTasks.map(x => x.count), backgroundColor: withTasks.map(x => x.d.cor), borderRadius: 6, maxBarThickness: 34 }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8B94A7', font: { family: 'Inter', size: 11 } }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { color: '#8B94A7', stepSize: 1, font: { family: 'Inter', size: 11 } }, grid: { color: '#232C3D' } },
        },
      },
    });
  }

  function statCard(icon, label, value, sub, color) {
    return `
      <div class="card stat-card card-hover">
        <div class="stat-icon" style="${color ? `background:${color}22; color:${color};` : ''}"><i data-lucide="${icon}"></i></div>
        <div class="stat-label">${label}</div>
        <div class="stat-value">${U.escapeHtml(String(value))}</div>
        <div class="stat-sub">${U.escapeHtml(sub)}</div>
      </div>
    `;
  }

  function renderTodayList(state) {
    const today = U.todayISO();
    const items = state.tarefas.filter(t => t.prazo === today);
    if (!items.length) return window.UI.emptyState('sparkles', 'Nada para hoje', 'Aproveite ou adiante alguma tarefa da semana.');
    return `<div class="todo-list">${items.map(t => `
      <div class="todo-row ${t.status === 'concluido' ? 'done' : ''}">
        <input type="checkbox" data-task-toggle="${t.id}" ${t.status === 'concluido' ? 'checked' : ''}>
        <span>${U.escapeHtml(t.titulo)}</span>
        ${badgeForDisciplina(state, t.disciplinaId)}
      </div>
    `).join('')}</div>`;
  }

  function badgeForDisciplina(state, discId) {
    const d = state.disciplinas.find(x => x.id === discId);
    if (!d) return '';
    return `<span class="chip"><span class="dot" style="background:${d.cor}"></span>${U.escapeHtml(d.nome.split(' ').slice(0, 2).join(' '))}</span>`;
  }

  function renderUpcoming(state) {
    const today = U.todayISO();
    const items = state.tarefas
      .filter(t => t.status !== 'concluido' && t.prazo && t.prazo >= today)
      .sort((a, b) => a.prazo.localeCompare(b.prazo))
      .slice(0, 6);
    if (!items.length) return window.UI.emptyState('inbox', 'Sem entregas futuras', 'Cadastre tarefas com prazo para vê-las aqui.');
    return items.map(t => {
      const pr = U.priorityMeta(t.prioridade);
      return `
      <div class="todo-row">
        <span class="dot" style="background:${pr.color}"></span>
        <span>${U.escapeHtml(t.titulo)}</span>
        ${badgeForDisciplina(state, t.disciplinaId)}
        <span class="text-faint mono" style="font-size:11.5px;">${U.formatDateBR(t.prazo)}</span>
      </div>`;
    }).join('');
  }

  function renderTimeline(state) {
    const today = U.todayISO();
    const events = [
      ...state.eventos.map(e => ({ label: e.titulo, date: e.data, color: e.cor || '#38BDF8', meta: e.tipo })),
      ...state.tarefas.filter(t => t.prazo).map(t => ({ label: t.titulo, date: t.prazo, color: U.priorityMeta(t.prioridade).color, meta: 'Tarefa' })),
      ...state.tcc.etapas.map(e => ({ label: e.nome, date: e.dataFim, color: 'var(--accent)', meta: 'Etapa TCC' })),
    ].filter(e => e.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 8);

    if (!events.length) return window.UI.emptyState('git-commit-horizontal', 'Sem eventos futuros', '');
    return `<div class="timeline">${events.map(e => `
      <div class="timeline-item">
        <div class="timeline-dot" style="background:${e.color}"></div>
        <div class="timeline-content">
          <div class="t-title">${U.escapeHtml(e.label)}</div>
          <div class="t-meta">${U.escapeHtml(e.meta)} · ${U.formatDateBR(e.date)}</div>
        </div>
      </div>
    `).join('')}</div>`;
  }

  function renderMiniCalendar(state, refDate) {
    const year = refDate.getFullYear(), month = refDate.getMonth();
    const first = new Date(year, month, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = U.todayISO();
    const eventDates = new Set([...state.eventos.map(e => e.data), ...state.tarefas.filter(t=>t.prazo).map(t => t.prazo)]);

    let cells = '';
    for (let i = 0; i < startOffset; i++) cells += `<div class="calendar-mini-day other-month"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = U.toISO(new Date(year, month, d));
      const isToday = iso === today;
      const hasEvent = eventDates.has(iso);
      cells += `<div class="calendar-mini-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}">${d}</div>`;
    }

    return `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:12.5px; font-weight:700;">${U.MESES[month]} ${year}</span>
        <a href="#calendario" class="btn btn-ghost btn-sm">Abrir</a>
      </div>
      <div class="calendar-mini">
        ${U.DIAS_SEMANA_ABREV.map(d => `<div class="calendar-weekday">${d}</div>`).join('')}
        ${cells}
      </div>
    `;
  }

  function bindEvents(container) {
    U.qsa('[data-task-toggle]', container).forEach(cb => {
      cb.addEventListener('change', () => {
        const id = cb.getAttribute('data-task-toggle');
        window.DB.save(s => {
          const t = s.tarefas.find(x => x.id === id);
          if (t) t.status = cb.checked ? 'concluido' : 'pendente';
        });
        window.Router.rerender();
      });
    });
  }

  return { render };
})();

window.Pages = window.Pages || {};

window.Pages.disciplinas = (function () {
  const U = window.Utils;

  const CORES_SUGERIDAS = ['#0E7C7B', '#8B5CF6', '#38BDF8', '#F97316', '#EC4899', '#22D3EE', '#C084FC', '#6B7280', '#6366F1', '#F472B6', '#FB923C', '#2DD4BF'];
  const TIPOS = ['Presencial', 'EAD', 'Quinzenal', 'Estágio'];

  function render(container) {
    const state = window.DB.get();
    container.innerHTML = `
      <div class="content-inner">
        <div class="page-header">
          <div>
            <h1>Disciplinas</h1>
            <div class="subtitle">${state.disciplinas.length} disciplina(s) cadastrada(s)</div>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" id="btn-add-disc"><i data-lucide="plus"></i> Nova disciplina</button>
          </div>
        </div>

        ${state.disciplinas.length === 0 ? `<div class="card">${window.UI.emptyState('book-open', 'Nenhuma disciplina cadastrada', 'Clique em "Nova disciplina" para começar.')}</div>` : `
        <div class="grid grid-3">
          ${state.disciplinas.map(d => discCard(d, state)).join('')}
        </div>`}
      </div>
    `;
    U.lucide();
    bindListEvents(container);
  }

  function discCard(d, state) {
    const pendentes = state.tarefas.filter(t => t.disciplinaId === d.id && t.status !== 'concluido').length;
    const aulasFeitas = d.aulas.filter(a => a.concluido).length;
    const pct = d.aulas.length ? Math.round((aulasFeitas / d.aulas.length) * 100) : 0;
    return `
      <div class="card card-hover" style="cursor:pointer; display:flex; flex-direction:column; gap:12px;" data-open-disc="${d.id}">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div class="disc-icon" style="width:38px;height:38px;border-radius:11px;background:${d.cor};display:flex;align-items:center;justify-content:center;color:#0F1117;">
            <i data-lucide="book-open" style="width:18px;height:18px;"></i>
          </div>
          <span class="badge badge-muted">${U.escapeHtml(d.tipo)}</span>
        </div>
        <div>
          <div style="font-size:14px; font-weight:700; line-height:1.35;">${U.escapeHtml(d.nome)}</div>
          <div class="text-faint" style="font-size:12px; margin-top:4px;">${d.dia ? `${U.escapeHtml(d.dia)} · ${U.escapeHtml(d.horarioInicio || '')}${d.horarioFim ? '–' + U.escapeHtml(d.horarioFim) : ''}` : 'Sem horário fixo'}</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${pendentes ? `<span class="chip"><i data-lucide="list-todo" style="width:11px;height:11px;"></i> ${pendentes} pendente(s)</span>` : ''}
          ${d.aulas.length ? `<span class="chip">${aulasFeitas}/${d.aulas.length} aulas</span>` : ''}
        </div>
        ${d.aulas.length ? window.UI.progressBar(pct, d.cor) : ''}
      </div>
    `;
  }

  function bindListEvents(container) {
    U.qs('#btn-add-disc', container).addEventListener('click', () => openDiscForm());
    U.qsa('[data-open-disc]', container).forEach(el => {
      el.addEventListener('click', () => {
        window.Router.navigate('disciplinas/' + el.getAttribute('data-open-disc'));
      });
    });
  }

  // -------------------------- FORM (add/edit) --------------------------
  function openDiscForm(disc) {
    const isEdit = !!disc;
    const d = disc || { id: null, nome: '', professor: '', sala: '', bloco: '', dia: '', horarioInicio: '', horarioFim: '', cargaHoraria: '', cor: CORES_SUGERIDAS[0], tipo: 'Presencial', ementa: '', observacoes: '' };

    window.UI.openModal({
      title: isEdit ? 'Editar disciplina' : 'Nova disciplina',
      size: 'lg',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome da disciplina</label><input id="f-nome" value="${U.escapeHtml(d.nome)}" placeholder="Ex: Sistemas Estruturais II"></div>
          <div class="field"><label>Professor</label><input id="f-professor" value="${U.escapeHtml(d.professor)}"></div>
          <div class="field"><label>Tipo</label>
            <select id="f-tipo">${TIPOS.map(t => `<option value="${t}" ${d.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Sala</label><input id="f-sala" value="${U.escapeHtml(d.sala)}"></div>
          <div class="field"><label>Bloco</label><input id="f-bloco" value="${U.escapeHtml(d.bloco)}"></div>
          <div class="field"><label>Dia da semana</label>
            <select id="f-dia"><option value="">—</option>${U.DIAS_SEMANA.map(dia => `<option value="${dia}" ${d.dia === dia ? 'selected' : ''}>${dia}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Carga horária (h)</label><input id="f-carga" type="number" min="0" value="${d.cargaHoraria || ''}"></div>
          <div class="field"><label>Horário início</label><input id="f-hini" type="time" value="${d.horarioInicio || ''}"></div>
          <div class="field"><label>Horário fim</label><input id="f-hfim" type="time" value="${d.horarioFim || ''}"></div>
          <div class="field span-2"><label>Cor</label>
            <div class="field-color-row" id="f-color-row">
              ${CORES_SUGERIDAS.map(c => `<div class="color-swatch ${d.cor === c ? 'selected' : ''}" style="background:${c}" data-color="${c}"></div>`).join('')}
              <input type="color" id="f-cor-custom" value="${d.cor}" style="width:26px;height:26px;padding:0;border:none;border-radius:8px;background:none;cursor:pointer;">
            </div>
          </div>
          <div class="field span-2"><label>Ementa</label><textarea id="f-ementa">${U.escapeHtml(d.ementa)}</textarea></div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(d.observacoes)}</textarea></div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        let selectedColor = d.cor;
        U.qsa('.color-swatch', overlay).forEach(sw => {
          sw.addEventListener('click', () => {
            selectedColor = sw.getAttribute('data-color');
            U.qsa('.color-swatch', overlay).forEach(s => s.classList.remove('selected'));
            sw.classList.add('selected');
            U.qs('#f-cor-custom', overlay).value = selectedColor;
          });
        });
        U.qs('#f-cor-custom', overlay).addEventListener('input', (e) => { selectedColor = e.target.value; });

        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        if (isEdit) {
          U.qs('#f-delete', overlay).addEventListener('click', () => {
            window.UI.confirmDialog('Remover esta disciplina e todos os dados associados?', () => {
              window.DB.save(s => { s.disciplinas = s.disciplinas.filter(x => x.id !== d.id); });
              window.UI.toast('Disciplina removida', 'success');
              window.Router.navigate('disciplinas');
            });
          });
        }
        U.qs('#f-save', overlay).addEventListener('click', () => {
          const nome = U.qs('#f-nome', overlay).value.trim();
          if (!nome) { window.UI.toast('Informe o nome da disciplina', 'error'); return; }
          const payload = {
            nome,
            professor: U.qs('#f-professor', overlay).value.trim(),
            tipo: U.qs('#f-tipo', overlay).value,
            sala: U.qs('#f-sala', overlay).value.trim(),
            bloco: U.qs('#f-bloco', overlay).value.trim(),
            dia: U.qs('#f-dia', overlay).value,
            cargaHoraria: Number(U.qs('#f-carga', overlay).value || 0),
            horarioInicio: U.qs('#f-hini', overlay).value,
            horarioFim: U.qs('#f-hfim', overlay).value,
            cor: selectedColor,
            ementa: U.qs('#f-ementa', overlay).value,
            observacoes: U.qs('#f-obs', overlay).value,
          };
          window.DB.save(s => {
            if (isEdit) {
              Object.assign(s.disciplinas.find(x => x.id === d.id), payload);
            } else {
              s.disciplinas.push(Object.assign({ id: U.uid('disc'), aulas: [], atividades: [], arquivos: [], notas: [], bibliografia: [] }, payload));
            }
          });
          window.UI.closeModal();
          window.UI.toast(isEdit ? 'Disciplina atualizada' : 'Disciplina criada', 'success');
          window.Router.rerender();
        });
      }
    });
  }

  // -------------------------- DETAIL --------------------------
  let activeTab = 'info';

  function renderDetail(container, discId) {
    const state = window.DB.get();
    const d = state.disciplinas.find(x => x.id === discId);
    if (!d) { container.innerHTML = `<div class="content-inner">${window.UI.emptyState('alert-circle', 'Disciplina não encontrada', '')}</div>`; return; }

    const tabs = [
      { id: 'info', label: 'Informações' },
      { id: 'cronograma', label: 'Cronograma' },
      { id: 'atividades', label: 'Atividades' },
      { id: 'arquivos', label: 'Arquivos' },
      { id: 'notas', label: 'Notas' },
      { id: 'bibliografia', label: 'Bibliografia' },
      { id: 'anotacoes', label: 'Anotações' },
    ];

    container.innerHTML = `
      <div class="content-inner">
        <a href="#disciplinas" class="btn btn-ghost btn-sm" style="margin-bottom:14px;"><i data-lucide="arrow-left"></i> Disciplinas</a>

        <div class="disc-hero" style="background:${d.cor}14;">
          <div class="disc-icon" style="background:${d.cor}"><i data-lucide="book-open"></i></div>
          <div style="flex:1;">
            <h1>${U.escapeHtml(d.nome)}</h1>
            <div class="disc-meta">
              <span class="badge badge-muted">${U.escapeHtml(d.tipo)}</span>
              ${d.professor ? `<span class="chip"><i data-lucide="user" style="width:11px;height:11px;"></i> ${U.escapeHtml(d.professor)}</span>` : ''}
              ${d.dia ? `<span class="chip"><i data-lucide="clock" style="width:11px;height:11px;"></i> ${U.escapeHtml(d.dia)} ${d.horarioInicio || ''}${d.horarioFim ? '–' + d.horarioFim : ''}</span>` : ''}
              ${d.sala ? `<span class="chip"><i data-lucide="map-pin" style="width:11px;height:11px;"></i> ${U.escapeHtml(d.sala)} ${d.bloco ? '· ' + U.escapeHtml(d.bloco) : ''}</span>` : ''}
            </div>
          </div>
          <button class="btn btn-soft" id="btn-edit-disc"><i data-lucide="pencil"></i> Editar</button>
        </div>

        <div class="tabs">
          ${tabs.map(t => `<button class="tab-btn ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('')}
        </div>

        <div id="tab-content"></div>
      </div>
    `;
    U.lucide();

    U.qs('#btn-edit-disc', container).addEventListener('click', () => openDiscForm(d));
    U.qsa('[data-tab]', container).forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.getAttribute('data-tab');
        renderDetail(container, discId);
      });
    });

    renderTab(U.qs('#tab-content', container), d);
  }

  function renderTab(el, d) {
    const renderers = {
      info: renderInfoTab, cronograma: renderCronogramaTab, atividades: renderAtividadesTab,
      arquivos: renderArquivosTab, notas: renderNotasTab, bibliografia: renderBibliografiaTab, anotacoes: renderAnotacoesTab,
    };
    (renderers[activeTab] || renderInfoTab)(el, d);
    U.lucide();
  }

  function saveDisc(d, mutator) {
    window.DB.save(s => {
      const disc = s.disciplinas.find(x => x.id === d.id);
      mutator(disc);
    });
  }

  function renderInfoTab(el, d) {
    el.innerHTML = `
      <div class="dash-split-14">
        <div class="card">
          <div class="section-title"><h3>Ementa</h3></div>
          <p class="text-muted" style="font-size:13.5px; line-height:1.7; white-space:pre-wrap;">${d.ementa ? U.escapeHtml(d.ementa) : 'Nenhuma ementa cadastrada.'}</p>
        </div>
        <div class="card">
          <div class="section-title"><h3>Observações</h3></div>
          <p class="text-muted" style="font-size:13.5px; line-height:1.7; white-space:pre-wrap;">${d.observacoes ? U.escapeHtml(d.observacoes) : 'Nenhuma observação.'}</p>
        </div>
      </div>
    `;
  }

  function renderCronogramaTab(el, d) {
    el.innerHTML = `
      <div class="page-header" style="margin-bottom:14px;">
        <div class="subtitle">${d.aulas.length} aula(s) cadastrada(s)</div>
        <button class="btn btn-primary btn-sm" id="btn-add-aula"><i data-lucide="plus"></i> Adicionar aula</button>
      </div>
      ${d.aulas.length === 0 ? `<div class="card">${window.UI.emptyState('calendar', 'Nenhuma aula cadastrada', '')}</div>` : `
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>#</th><th>Tema</th><th>Leitura</th><th>Concluído</th><th></th></tr></thead>
          <tbody>
            ${d.aulas.map(a => `
              <tr>
                <td class="mono">${a.numero}</td>
                <td>${U.escapeHtml(a.tema)}</td>
                <td class="text-faint">${U.escapeHtml(a.leitura || '—')}</td>
                <td><input type="checkbox" data-aula-done="${a.id}" ${a.concluido ? 'checked' : ''}></td>
                <td><div class="row-actions">
                  <button class="icon-btn" data-aula-edit="${a.id}"><i data-lucide="pencil"></i></button>
                  <button class="icon-btn" data-aula-del="${a.id}"><i data-lucide="trash-2"></i></button>
                </div></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`}
    `;
    U.qs('#btn-add-aula', el).addEventListener('click', () => openAulaForm(d));
    U.qsa('[data-aula-edit]', el).forEach(b => b.addEventListener('click', () => openAulaForm(d, d.aulas.find(a => a.id === b.getAttribute('data-aula-edit')))));
    U.qsa('[data-aula-del]', el).forEach(b => b.addEventListener('click', () => {
      window.UI.confirmDialog('Remover esta aula?', () => {
        saveDisc(d, disc => { disc.aulas = disc.aulas.filter(a => a.id !== b.getAttribute('data-aula-del')); });
        renderTab(el, window.DB.get().disciplinas.find(x => x.id === d.id));
      });
    }));
    U.qsa('[data-aula-done]', el).forEach(cb => cb.addEventListener('change', () => {
      saveDisc(d, disc => { disc.aulas.find(a => a.id === cb.getAttribute('data-aula-done')).concluido = cb.checked; });
    }));
  }

  function openAulaForm(d, aula) {
    const isEdit = !!aula;
    const a = aula || { id: null, numero: d.aulas.length + 1, tema: '', descricao: '', arquivos: '', leitura: '', observacoes: '', concluido: false };
    window.UI.openModal({
      title: isEdit ? 'Editar aula' : 'Nova aula',
      bodyHtml: `
        <div class="form-grid">
          <div class="field"><label>Número</label><input id="f-num" type="number" value="${a.numero}"></div>
          <div class="field"><label>Tema</label><input id="f-tema" value="${U.escapeHtml(a.tema)}"></div>
          <div class="field span-2"><label>Descrição</label><textarea id="f-desc">${U.escapeHtml(a.descricao)}</textarea></div>
          <div class="field"><label>Leitura</label><input id="f-leitura" value="${U.escapeHtml(a.leitura)}"></div>
          <div class="field"><label>Arquivos (links, separados por vírgula)</label><input id="f-arqs" value="${U.escapeHtml(a.arquivos)}"></div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(a.observacoes)}</textarea></div>
          <div class="field checkbox-row"><input type="checkbox" id="f-concluido" ${a.concluido ? 'checked' : ''}><label>Aula concluída</label></div>
        </div>
      `,
      footerHtml: `<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Salvar</button>`,
      onMount: (overlay) => {
        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        U.qs('#f-save', overlay).addEventListener('click', () => {
          const payload = {
            numero: Number(U.qs('#f-num', overlay).value || 0),
            tema: U.qs('#f-tema', overlay).value.trim(),
            descricao: U.qs('#f-desc', overlay).value,
            leitura: U.qs('#f-leitura', overlay).value,
            arquivos: U.qs('#f-arqs', overlay).value,
            observacoes: U.qs('#f-obs', overlay).value,
            concluido: U.qs('#f-concluido', overlay).checked,
          };
          saveDisc(d, disc => {
            if (isEdit) Object.assign(disc.aulas.find(x => x.id === a.id), payload);
            else disc.aulas.push(Object.assign({ id: U.uid('aula') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Aula salva', 'success');
          renderTab(U.qs('#tab-content'), window.DB.get().disciplinas.find(x => x.id === d.id));
        });
      }
    });
  }

  function renderAtividadesTab(el, d) {
    const state = window.DB.get();
    const tarefas = state.tarefas.filter(t => t.disciplinaId === d.id);
    el.innerHTML = `
      <div class="page-header" style="margin-bottom:14px;">
        <div class="subtitle">${tarefas.length} atividade(s)</div>
        <button class="btn btn-primary btn-sm" id="btn-add-ativ"><i data-lucide="plus"></i> Nova atividade</button>
      </div>
      ${tarefas.length === 0 ? `<div class="card">${window.UI.emptyState('list-todo', 'Nenhuma atividade vinculada', '')}</div>` :
      `<div class="grid grid-3">${tarefas.map(t => taskMiniCard(t)).join('')}</div>`}
    `;
    U.qs('#btn-add-ativ', el).addEventListener('click', () => {
      window.Pages.tarefas.openTaskForm(null, d.id, () => renderTab(el, window.DB.get().disciplinas.find(x => x.id === d.id)));
    });
    U.qsa('[data-open-task]', el).forEach(c => c.addEventListener('click', () => {
      const t = window.DB.get().tarefas.find(x => x.id === c.getAttribute('data-open-task'));
      window.Pages.tarefas.openTaskForm(t, d.id, () => renderTab(el, window.DB.get().disciplinas.find(x => x.id === d.id)));
    }));
  }

  function taskMiniCard(t) {
    const pr = U.priorityMeta(t.prioridade);
    const st = U.statusBadge(t.status);
    return `
      <div class="card card-hover" style="cursor:pointer;" data-open-task="${t.id}">
        <div style="display:flex; justify-content:space-between; align-items:start; gap:8px;">
          <span style="font-size:13px; font-weight:600;">${U.escapeHtml(t.titulo)}</span>
          <span class="dot" style="background:${pr.color}; margin-top:5px;"></span>
        </div>
        <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
          <span class="badge ${st.cls}">${st.label}</span>
          ${t.prazo ? `<span class="chip">${U.formatDateBR(t.prazo)}</span>` : ''}
        </div>
      </div>
    `;
  }

  function renderArquivosTab(el, d) { renderSimpleListTab(el, d, 'arquivos', {
    title: 'Arquivos', icon: 'folder', addLabel: 'Adicionar arquivo', fileAttach: true,
    fields: [{ id: 'nome', label: 'Nome', type: 'text' }, { id: 'categoria', label: 'Categoria', type: 'text' }, { id: 'link', label: 'Link / caminho (opcional)', type: 'text' }],
    renderItem: (it) => `
      <div class="card file-card">
        <div class="file-icon"><i data-lucide="file"></i></div>
        <div style="flex:1;">
          <div class="file-name">${U.escapeHtml(it.nome)}</div>
          <div class="file-meta">${U.escapeHtml(it.categoria || 'Sem categoria')}</div>
          ${it.fileName ? `<button type="button" class="btn btn-ghost btn-sm" data-open-local="${it.localFileId}" style="margin-top:6px; padding:3px 8px; font-size:11px;"><i data-lucide="paperclip" style="width:11px;height:11px;"></i> ${U.escapeHtml(it.fileName)}</button>` : ''}
        </div>
      </div>`
  }); }

  function renderNotasTab(el, d) { renderSimpleListTab(el, d, 'notas', {
    title: 'Notas', icon: 'sticky-note', addLabel: 'Adicionar nota',
    fields: [{ id: 'texto', label: 'Nota', type: 'textarea' }],
    renderItem: (it) => `<div class="card"><p style="font-size:13px; white-space:pre-wrap;">${U.escapeHtml(it.texto)}</p></div>`
  }); }

  function renderBibliografiaTab(el, d) { renderSimpleListTab(el, d, 'bibliografia', {
    title: 'Bibliografia', icon: 'library', addLabel: 'Adicionar referência', fileAttach: true,
    fields: [{ id: 'autor', label: 'Autor', type: 'text' }, { id: 'titulo', label: 'Título', type: 'text' }, { id: 'ano', label: 'Ano', type: 'text' }],
    renderItem: (it) => `<div class="card"><div style="font-size:13px; font-weight:600;">${U.escapeHtml(it.titulo)}</div><div class="text-faint" style="font-size:12px; margin-top:4px;">${U.escapeHtml(it.autor)} ${it.ano ? '· ' + U.escapeHtml(it.ano) : ''}</div>${it.fileName ? `<button type="button" class="btn btn-ghost btn-sm" data-open-local="${it.localFileId}" style="margin-top:6px; padding:3px 8px; font-size:11px;"><i data-lucide="paperclip" style="width:11px;height:11px;"></i> ${U.escapeHtml(it.fileName)}</button>` : ''}</div>`
  }); }

  function renderAnotacoesTab(el, d) {
    el.innerHTML = `
      <div class="card">
        <div class="section-title"><h3>Anotações livres</h3></div>
        <textarea id="f-anot" style="width:100%; min-height:220px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:12px; font-size:13.5px; font-family:inherit;" placeholder="Escreva aqui suas anotações sobre a disciplina...">${U.escapeHtml(d.anotacoes || '')}</textarea>
        <div style="margin-top:10px; display:flex; justify-content:flex-end;"><button class="btn btn-primary btn-sm" id="btn-save-anot">Salvar</button></div>
      </div>
    `;
    U.qs('#btn-save-anot', el).addEventListener('click', () => {
      saveDisc(d, disc => { disc.anotacoes = U.qs('#f-anot', el).value; });
      window.UI.toast('Anotações salvas', 'success');
    });
  }

  function renderSimpleListTab(el, d, key, cfg) {
    const items = d[key] || [];
    el.innerHTML = `
      <div class="page-header" style="margin-bottom:14px;">
        <div class="subtitle">${items.length} item(ns)</div>
        <button class="btn btn-primary btn-sm" id="btn-add-item"><i data-lucide="plus"></i> ${cfg.addLabel}</button>
      </div>
      ${items.length === 0 ? `<div class="card">${window.UI.emptyState(cfg.icon, 'Nada por aqui ainda', '')}</div>` :
      `<div class="grid grid-3">${items.map((it, idx) => `<div style="position:relative;">${cfg.renderItem(it)}<button class="icon-btn" data-del-item="${idx}" style="position:absolute; top:8px; right:8px; background:var(--bg-elevated);"><i data-lucide="x"></i></button></div>`).join('')}</div>`}
    `;
    U.lucide();
    U.qs('#btn-add-item', el).addEventListener('click', () => {
      const newItem = { id: U.uid('item') };
      window.UI.openModal({
        title: cfg.addLabel,
        bodyHtml: `<div class="form-grid single">${cfg.fields.map(f => `
          <div class="field"><label>${f.label}</label>${f.type === 'textarea' ? `<textarea id="f-${f.id}"></textarea>` : `<input id="f-${f.id}">`}</div>
        `).join('')}${cfg.fileAttach ? window.UI.fileAttachHtml(null, 'sl-file') : ''}</div>`,
        footerHtml: `<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Adicionar</button>`,
        onMount: (overlay) => {
          if (cfg.fileAttach) window.UI.bindFileAttachInput(overlay, 'sl-file', newItem);
          U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
          U.qs('#f-save', overlay).addEventListener('click', () => {
            cfg.fields.forEach(f => { newItem[f.id] = U.qs('#f-' + f.id, overlay).value; });
            saveDisc(d, disc => { disc[key] = disc[key] || []; disc[key].push(newItem); });
            window.UI.closeModal();
            renderTab(el, window.DB.get().disciplinas.find(x => x.id === d.id));
          });
        }
      });
    });
    U.qsa('[data-del-item]', el).forEach(b => b.addEventListener('click', () => {
      const idx = Number(b.getAttribute('data-del-item'));
      const removed = (d[key] || [])[idx];
      if (removed && removed.localFileId) window.LocalFiles.remove(removed.localFileId);
      saveDisc(d, disc => { disc[key].splice(idx, 1); });
      renderTab(el, window.DB.get().disciplinas.find(x => x.id === d.id));
    }));
    U.qsa('[data-open-local]', el).forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      window.UI.openLocalFile(b.getAttribute('data-open-local'));
    }));
  }

  return { render, renderDetail, openDiscForm, CORES_SUGERIDAS };
})();

/* ==========================================================================
   pages/tarefas.js
   ========================================================================== */

window.Pages = window.Pages || {};

window.Pages.tarefas = (function () {
  const U = window.Utils;
  const COLS = [
    { id: 'afazer', label: 'A Fazer', icon: 'circle' },
    { id: 'andamento', label: 'Em andamento', icon: 'loader' },
    { id: 'concluido', label: 'Concluído', icon: 'check-circle-2' },
  ];

  let filters = { periodo: 'todos', prioridade: 'todas', disciplina: 'todas' };

  function render(container) {
    const state = window.DB.get();

    container.innerHTML = `
      <div class="content-inner">
        <div class="page-header">
          <div>
            <h1>Tarefas</h1>
            <div class="subtitle">${state.tarefas.length} tarefa(s) no total</div>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" id="btn-add-task"><i data-lucide="plus"></i> Nova tarefa</button>
          </div>
        </div>

        <div class="filter-bar">
          ${filterChip('periodo', 'todos', 'Todas')}
          ${filterChip('periodo', 'hoje', 'Hoje')}
          ${filterChip('periodo', 'semana', 'Semana')}
          ${filterChip('periodo', 'urgente', 'Urgente')}
          <select class="filter-select" id="f-disc-filter">
            <option value="todas">Todas disciplinas</option>
            ${state.disciplinas.map(d => `<option value="${d.id}" ${filters.disciplina === d.id ? 'selected' : ''}>${U.escapeHtml(d.nome)}</option>`).join('')}
          </select>
        </div>

        <div class="kanban-board" id="kanban-board">
          ${COLS.map(c => kanbanColumn(c, state)).join('')}
        </div>
      </div>
    `;
    U.lucide();
    bindEvents(container);
  }

  function filterChip(key, val, label) {
    return `<button class="filter-chip ${filters[key] === val ? 'active' : ''}" data-filter="${key}:${val}">${label}</button>`;
  }

  function applyFilters(tarefas) {
    const today = U.todayISO();
    const weekEnd = U.addDays(today, 7);
    return tarefas.filter(t => {
      if (filters.disciplina !== 'todas' && t.disciplinaId !== filters.disciplina) return false;
      if (filters.periodo === 'hoje' && t.prazo !== today) return false;
      if (filters.periodo === 'semana' && (!t.prazo || t.prazo < today || t.prazo > weekEnd)) return false;
      if (filters.periodo === 'urgente' && t.prioridade !== 'alta') return false;
      return true;
    });
  }

  function kanbanColumn(col, state) {
    const tarefas = applyFilters(state.tarefas.filter(t => t.status === col.id));
    return `
      <div class="kanban-col" data-col="${col.id}">
        <div class="kanban-col-header">
          <span class="title"><i data-lucide="${col.icon}" style="width:14px;height:14px;"></i> ${col.label}</span>
          <span class="count">${tarefas.length}</span>
        </div>
        <div class="kanban-cards" data-dropzone="${col.id}">
          ${tarefas.map(t => taskCard(t, state)).join('')}
        </div>
      </div>
    `;
  }

  function taskCard(t, state) {
    const pr = U.priorityMeta(t.prioridade);
    const disc = state.disciplinas.find(d => d.id === t.disciplinaId);
    const overdue = t.prazo && t.prazo < U.todayISO() && t.status !== 'concluido';
    const doneCount = (t.checklist || []).filter(c => c.done).length;
    return `
      <div class="kanban-card" draggable="true" data-task-id="${t.id}" style="border-left-color:${pr.color};">
        <div class="card-title">${U.escapeHtml(t.titulo)}</div>
        <div class="card-meta">
          ${disc ? `<span class="chip"><span class="dot" style="background:${disc.cor}"></span>${U.escapeHtml(disc.nome.split(' ').slice(0, 2).join(' '))}</span>` : ''}
          <span class="badge" style="background:${pr.color}22; color:${pr.color};">${pr.icon} ${pr.label}</span>
        </div>
        <div class="card-footer">
          <span class="text-faint" style="font-size:11px;">
            ${t.checklist && t.checklist.length ? `<span class="kanban-checklist-mini"><i data-lucide="check-square" style="width:11px;height:11px;"></i> ${doneCount}/${t.checklist.length}</span>` : ''}
          </span>
          ${t.prazo ? `<span class="chip" style="${overdue ? 'color:var(--danger); border-color:var(--danger);' : ''}">${U.formatDateBR(t.prazo)}</span>` : ''}
        </div>
      </div>
    `;
  }

  function bindEvents(container) {
    U.qs('#btn-add-task', container).addEventListener('click', () => openTaskForm());
    U.qsa('[data-filter]', container).forEach(chip => {
      chip.addEventListener('click', () => {
        const [key, val] = chip.getAttribute('data-filter').split(':');
        filters[key] = val;
        render(container);
      });
    });
    const discFilter = U.qs('#f-disc-filter', container);
    if (discFilter) discFilter.addEventListener('change', () => { filters.disciplina = discFilter.value; render(container); });

    U.qsa('[data-task-id]', container).forEach(card => {
      card.addEventListener('click', () => {
        const t = window.DB.get().tarefas.find(x => x.id === card.getAttribute('data-task-id'));
        openTaskForm(t);
      });
      card.addEventListener('dragstart', () => card.classList.add('dragging'));
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });

    U.qsa('[data-dropzone]', container).forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.closest('.kanban-col').classList.add('drag-over');
        const dragging = U.qs('.dragging', container);
        if (!dragging) return;
        const after = getDragAfterElement(zone, e.clientY);
        if (after == null) zone.appendChild(dragging);
        else zone.insertBefore(dragging, after);
      });
      zone.addEventListener('dragleave', (e) => {
        if (!zone.contains(e.relatedTarget)) zone.closest('.kanban-col').classList.remove('drag-over');
      });
      zone.addEventListener('drop', () => {
        zone.closest('.kanban-col').classList.remove('drag-over');
        const dragging = U.qs('.dragging', container);
        if (!dragging) return;
        const taskId = dragging.getAttribute('data-task-id');
        const newStatus = zone.getAttribute('data-dropzone');
        window.DB.save(s => { const t = s.tarefas.find(x => x.id === taskId); if (t) t.status = newStatus; });
        render(container);
      });
    });
  }

  function getDragAfterElement(container, y) {
    const cards = U.qsa('.kanban-card:not(.dragging)', container);
    return cards.reduce((closest, card) => {
      const box = card.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset, element: card };
      return closest;
    }, { offset: -Infinity }).element;
  }

  // -------------------------- FORM --------------------------
  function openTaskForm(task, presetDisciplinaId, onSaved) {
    const isEdit = !!task;
    const state = window.DB.get();
    const t = task || { id: null, titulo: '', descricao: '', disciplinaId: presetDisciplinaId || '', prazo: '', prioridade: 'media', status: 'afazer', checklist: [], observacoes: '', anexos: [] };

    window.UI.openModal({
      title: isEdit ? 'Editar tarefa' : 'Nova tarefa',
      size: 'lg',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Título</label><input id="f-titulo" value="${U.escapeHtml(t.titulo)}" placeholder="Ex: Entregar memorial do TCC"></div>
          <div class="field span-2"><label>Descrição</label><textarea id="f-desc">${U.escapeHtml(t.descricao)}</textarea></div>
          <div class="field"><label>Disciplina</label>
            <select id="f-disc"><option value="">—</option>${state.disciplinas.map(d => `<option value="${d.id}" ${t.disciplinaId === d.id ? 'selected' : ''}>${U.escapeHtml(d.nome)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Prazo</label><input id="f-prazo" type="date" value="${t.prazo || ''}"></div>
          <div class="field"><label>Prioridade</label>
            <select id="f-prio">
              <option value="alta" ${t.prioridade === 'alta' ? 'selected' : ''}>🔴 Alta</option>
              <option value="media" ${t.prioridade === 'media' ? 'selected' : ''}>🟡 Média</option>
              <option value="baixa" ${t.prioridade === 'baixa' ? 'selected' : ''}>🟢 Baixa</option>
            </select>
          </div>
          <div class="field"><label>Status</label>
            <select id="f-status">${COLS.map(c => `<option value="${c.id}" ${t.status === c.id ? 'selected' : ''}>${c.label}</option>`).join('')}</select>
          </div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(t.observacoes)}</textarea></div>
          <div class="field span-2">
            <label>Checklist</label>
            <div id="checklist-box">${renderChecklistEditor(t.checklist || [])}</div>
            <div class="checklist-add"><input id="f-check-new" placeholder="Novo item..."><button class="btn btn-soft btn-sm" id="btn-add-check">Adicionar</button></div>
          </div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        let checklist = JSON.parse(JSON.stringify(t.checklist || []));

        function refreshChecklist() {
          U.qs('#checklist-box', overlay).innerHTML = renderChecklistEditor(checklist);
          U.lucide();
          U.qsa('[data-check-toggle]', overlay).forEach(cb => cb.addEventListener('change', () => {
            checklist.find(c => c.id === cb.getAttribute('data-check-toggle')).done = cb.checked;
            refreshChecklist();
          }));
          U.qsa('[data-check-del]', overlay).forEach(b => b.addEventListener('click', () => {
            checklist = checklist.filter(c => c.id !== b.getAttribute('data-check-del'));
            refreshChecklist();
          }));
        }
        refreshChecklist();

        U.qs('#btn-add-check', overlay).addEventListener('click', () => {
          const input = U.qs('#f-check-new', overlay);
          if (!input.value.trim()) return;
          checklist.push({ id: U.uid('chk'), texto: input.value.trim(), done: false });
          input.value = '';
          refreshChecklist();
        });

        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        if (isEdit) {
          U.qs('#f-delete', overlay).addEventListener('click', () => {
            window.UI.confirmDialog('Remover esta tarefa?', () => {
              window.DB.save(s => { s.tarefas = s.tarefas.filter(x => x.id !== t.id); });
              window.UI.closeModal();
              window.UI.toast('Tarefa removida', 'success');
              (onSaved || window.Router.rerender)();
            });
          });
        }
        U.qs('#f-save', overlay).addEventListener('click', () => {
          const titulo = U.qs('#f-titulo', overlay).value.trim();
          if (!titulo) { window.UI.toast('Informe o título da tarefa', 'error'); return; }
          const payload = {
            titulo,
            descricao: U.qs('#f-desc', overlay).value,
            disciplinaId: U.qs('#f-disc', overlay).value,
            prazo: U.qs('#f-prazo', overlay).value,
            prioridade: U.qs('#f-prio', overlay).value,
            status: U.qs('#f-status', overlay).value,
            observacoes: U.qs('#f-obs', overlay).value,
            checklist,
          };
          window.DB.save(s => {
            if (isEdit) Object.assign(s.tarefas.find(x => x.id === t.id), payload);
            else s.tarefas.push(Object.assign({ id: U.uid('task'), anexos: [] }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Tarefa salva', 'success');
          (onSaved || window.Router.rerender)();
        });
      }
    });
  }

  function renderChecklistEditor(checklist) {
    if (!checklist.length) return `<div class="text-faint" style="font-size:12px; padding:6px 0;">Nenhum item ainda.</div>`;
    return checklist.map(c => `
      <div class="checklist-item ${c.done ? 'done' : ''}">
        <input type="checkbox" data-check-toggle="${c.id}" ${c.done ? 'checked' : ''}>
        <span>${U.escapeHtml(c.texto)}</span>
        <button class="icon-btn" data-check-del="${c.id}" style="margin-left:auto;"><i data-lucide="x"></i></button>
      </div>
    `).join('');
  }

  return { render, openTaskForm };
})();

window.Pages = window.Pages || {};

window.Pages.calendario = (function () {
  const U = window.Utils;
  let refDate = new Date();
  const TIPOS_EVENTO = ['Prova', 'Entrega', 'Seminário', 'Reunião', 'Visita técnica', 'Lembrete', 'Outro'];

  function render(container) {
    const state = window.DB.get();
    const year = refDate.getFullYear(), month = refDate.getMonth();

    container.innerHTML = `
      <div class="content-inner">
        <div class="page-header">
          <div>
            <h1>Calendário</h1>
            <div class="subtitle">${U.MESES[month]} de ${year}</div>
          </div>
          <div class="header-actions">
            <button class="btn btn-ghost btn-icon" id="btn-prev-month"><i data-lucide="chevron-left"></i></button>
            <button class="btn btn-soft btn-sm" id="btn-today">Hoje</button>
            <button class="btn btn-ghost btn-icon" id="btn-next-month"><i data-lucide="chevron-right"></i></button>
            <button class="btn btn-primary" id="btn-add-event"><i data-lucide="plus"></i> Novo evento</button>
          </div>
        </div>

        <div class="calendar-grid">
          ${U.DIAS_SEMANA_ABREV.map(d => `<div class="calendar-weekday">${d}</div>`).join('')}
          ${buildDays(state, year, month)}
        </div>
      </div>
    `;
    U.lucide();
    bindEvents(container);
  }

  function buildDays(state, year, month) {
    const first = new Date(year, month, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();
    const today = U.todayISO();

    const items = [];
    for (let i = startOffset - 1; i >= 0; i--) items.push({ day: prevMonthDays - i, other: true, iso: null });
    for (let d = 1; d <= daysInMonth; d++) items.push({ day: d, other: false, iso: U.toISO(new Date(year, month, d)) });
    const rem = (7 - (items.length % 7)) % 7;
    for (let d = 1; d <= rem; d++) items.push({ day: d, other: true, iso: null });

    return items.map(it => {
      if (it.other) return `<div class="calendar-day other-month"><span class="day-num">${it.day}</span></div>`;
      const dayEvents = eventsForDay(state, it.iso);
      return `
        <div class="calendar-day ${it.iso === today ? 'today' : ''}" data-day="${it.iso}">
          <span class="day-num">${it.day}</span>
          ${dayEvents.slice(0, 3).map(e => `<div class="calendar-event" style="background:${e.color}" title="${U.escapeHtml(e.titulo)}">${U.escapeHtml(e.titulo)}</div>`).join('')}
          ${dayEvents.length > 3 ? `<span class="text-faint" style="font-size:10px;">+${dayEvents.length - 3} mais</span>` : ''}
        </div>
      `;
    }).join('');
  }

  function eventsForDay(state, iso) {
    const fromEvents = state.eventos.filter(e => e.data === iso).map(e => ({ id: e.id, titulo: e.titulo, color: e.cor || '#38BDF8', kind: 'evento' }));
    const fromTasks = state.tarefas.filter(t => t.prazo === iso).map(t => {
      const disc = state.disciplinas.find(d => d.id === t.disciplinaId);
      return { id: t.id, titulo: t.titulo, color: disc ? disc.cor : U.priorityMeta(t.prioridade).color, kind: 'tarefa' };
    });
    return [...fromEvents, ...fromTasks];
  }

  function bindEvents(container) {
    U.qs('#btn-prev-month', container).addEventListener('click', () => { refDate = new Date(refDate.getFullYear(), refDate.getMonth() - 1, 1); render(container); });
    U.qs('#btn-next-month', container).addEventListener('click', () => { refDate = new Date(refDate.getFullYear(), refDate.getMonth() + 1, 1); render(container); });
    U.qs('#btn-today', container).addEventListener('click', () => { refDate = new Date(); render(container); });
    U.qs('#btn-add-event', container).addEventListener('click', () => openEventForm(null, container));
    U.qsa('[data-day]', container).forEach(dayEl => {
      dayEl.addEventListener('click', () => openDayPanel(dayEl.getAttribute('data-day'), container));
    });
  }

  function openDayPanel(iso, container) {
    const state = window.DB.get();
    const events = state.eventos.filter(e => e.data === iso);
    window.UI.openModal({
      title: U.formatDateLong(iso),
      bodyHtml: `
        <div id="day-events-list">
          ${events.length === 0 ? window.UI.emptyState('calendar', 'Nenhum evento neste dia', '') :
            events.map(e => `
              <div class="card" style="margin-bottom:8px; display:flex; align-items:center; gap:10px;">
                <span class="dot" style="background:${e.cor}"></span>
                <div style="flex:1;">
                  <div style="font-weight:600; font-size:13px;">${U.escapeHtml(e.titulo)}</div>
                  <div class="text-faint" style="font-size:11.5px;">${U.escapeHtml(e.tipo)}${e.hora ? ' · ' + e.hora : ''}</div>
                </div>
                <button class="icon-btn" data-edit-event="${e.id}"><i data-lucide="pencil"></i></button>
                <button class="icon-btn" data-del-event="${e.id}"><i data-lucide="trash-2"></i></button>
              </div>
            `).join('')}
        </div>
      `,
      footerHtml: `<button class="btn btn-primary" id="btn-add-event-day"><i data-lucide="plus"></i> Novo evento neste dia</button>`,
      onMount: (overlay) => {
        U.qs('#btn-add-event-day', overlay).addEventListener('click', () => { window.UI.closeModal(); openEventForm({ data: iso }, container); });
        U.qsa('[data-edit-event]', overlay).forEach(b => b.addEventListener('click', () => {
          const ev = window.DB.get().eventos.find(x => x.id === b.getAttribute('data-edit-event'));
          window.UI.closeModal();
          openEventForm(ev, container);
        }));
        U.qsa('[data-del-event]', overlay).forEach(b => b.addEventListener('click', () => {
          window.DB.save(s => { s.eventos = s.eventos.filter(x => x.id !== b.getAttribute('data-del-event')); });
          window.UI.closeModal();
          render(container);
        }));
      }
    });
  }

  function openEventForm(preset, container) {
    const isEdit = preset && preset.id;
    const state = window.DB.get();
    const e = preset || {};
    const data = e.data || U.todayISO();

    window.UI.openModal({
      title: isEdit ? 'Editar evento' : 'Novo evento',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Título</label><input id="f-titulo" value="${U.escapeHtml(e.titulo || '')}"></div>
          <div class="field"><label>Tipo</label><select id="f-tipo">${TIPOS_EVENTO.map(t => `<option ${e.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          <div class="field"><label>Disciplina (opcional)</label><select id="f-disc"><option value="">—</option>${state.disciplinas.map(d => `<option value="${d.id}" ${e.disciplinaId === d.id ? 'selected' : ''}>${U.escapeHtml(d.nome)}</option>`).join('')}</select></div>
          <div class="field"><label>Data</label><input id="f-data" type="date" value="${data}"></div>
          <div class="field"><label>Hora</label><input id="f-hora" type="time" value="${e.hora || ''}"></div>
          <div class="field checkbox-row span-2"><input type="checkbox" id="f-recorrente" ${e.recorrente ? 'checked' : ''}><label>Evento recorrente (semanal)</label></div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(e.obs || '')}</textarea></div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        if (isEdit) U.qs('#f-delete', overlay).addEventListener('click', () => {
          window.DB.save(s => { s.eventos = s.eventos.filter(x => x.id !== e.id); });
          window.UI.closeModal();
          render(container);
        });
        U.qs('#f-save', overlay).addEventListener('click', () => {
          const titulo = U.qs('#f-titulo', overlay).value.trim();
          if (!titulo) { window.UI.toast('Informe um título', 'error'); return; }
          const discId = U.qs('#f-disc', overlay).value;
          const disc = state.disciplinas.find(d => d.id === discId);
          const payload = {
            titulo, tipo: U.qs('#f-tipo', overlay).value, disciplinaId: discId,
            data: U.qs('#f-data', overlay).value, hora: U.qs('#f-hora', overlay).value,
            recorrente: U.qs('#f-recorrente', overlay).checked, obs: U.qs('#f-obs', overlay).value,
            cor: disc ? disc.cor : '#38BDF8',
          };
          window.DB.save(s => {
            if (isEdit) Object.assign(s.eventos.find(x => x.id === e.id), payload);
            else s.eventos.push(Object.assign({ id: U.uid('evt') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Evento salvo', 'success');
          render(container);
        });
      }
    });
  }

  return { render };
})();

   ========================================================================== */

window.Pages = window.Pages || {};

window.Pages.cronograma = (function () {
  const U = window.Utils;
  const START_HOUR = 7, END_HOUR = 22;

  function render(container) {
    const state = window.DB.get();
    const hours = [];
    for (let h = START_HOUR; h <= END_HOUR; h++) hours.push(h);

    container.innerHTML = `
      <div class="content-inner">
        <div class="page-header">
          <div>
            <h1>Cronograma semanal</h1>
            <div class="subtitle">Visualize e edite os horários fixos das disciplinas</div>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" id="btn-add-slot"><i data-lucide="plus"></i> Adicionar horário</button>
          </div>
        </div>

        <div class="week-grid" style="grid-template-rows: 40px repeat(${hours.length}, 46px);">
          <div class="week-head-cell" style="background:var(--bg-elevated);"></div>
          ${U.DIAS_SEMANA.slice(1).concat(U.DIAS_SEMANA.slice(0,1)).map(d => `<div class="week-head-cell">${d}</div>`).join('')}
          ${hours.map(h => `
            <div class="week-time-cell">${String(h).padStart(2, '0')}:00</div>
            ${U.DIAS_SEMANA.slice(1).concat(U.DIAS_SEMANA.slice(0,1)).map(dia => `<div class="week-slot" data-dia="${dia}" data-hour="${h}"></div>`).join('')}
          `).join('')}
        </div>
      </div>
    `;

    placeBlocks(container, state, hours);
    U.lucide();
    bindEvents(container);
  }

  function placeBlocks(container, state, hours) {
    const dayOrder = U.DIAS_SEMANA.slice(1).concat(U.DIAS_SEMANA.slice(0, 1));
    state.disciplinas.forEach(d => {
      if (!d.dia || !d.horarioInicio) return;
      const dayIdx = dayOrder.indexOf(d.dia);
      if (dayIdx < 0) return;
      const slot = U.qs(`.week-slot[data-dia="${d.dia}"][data-hour="${parseInt(d.horarioInicio.split(':')[0], 10)}"]`, container);
      if (!slot) return;
      const [h1, m1] = d.horarioInicio.split(':').map(Number);
      const [h2, m2] = (d.horarioFim || d.horarioInicio).split(':').map(Number);
      const durationHours = Math.max(0.5, (h2 * 60 + m2 - (h1 * 60 + m1)) / 60);
      const offsetMinutes = m1;
      const block = U.el(`<div class="week-block" style="top:${(offsetMinutes/60)*46}px; height:${durationHours * 46 - 4}px; background:${d.cor};" data-disc-block="${d.id}">${U.escapeHtml(d.nome)}</div>`);
      slot.style.position = 'relative';
      slot.appendChild(block);
    });

    // eventos extras adicionados diretamente no cronograma (sem prazo de tarefa)
    (state.cronogramaExtras || []).forEach(ev => {
      const dayIdx = dayOrder.indexOf(ev.dia);
      if (dayIdx < 0) return;
      const slot = U.qs(`.week-slot[data-dia="${ev.dia}"][data-hour="${parseInt(ev.horarioInicio.split(':')[0], 10)}"]`, container);
      if (!slot) return;
      const block = U.el(`<div class="week-block" style="background:${ev.cor || '#6366F1'};" data-extra-block="${ev.id}">${U.escapeHtml(ev.titulo)}</div>`);
      slot.style.position = 'relative';
      slot.appendChild(block);
    });
  }

  function bindEvents(container) {
    U.qs('#btn-add-slot', container).addEventListener('click', () => openSlotForm(container));
    U.qsa('[data-disc-block]', container).forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      window.Router.navigate('disciplinas/' + b.getAttribute('data-disc-block'));
    }));
    U.qsa('[data-extra-block]', container).forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-extra-block');
      window.UI.confirmDialog('Remover este item do cronograma?', () => {
        window.DB.save(s => { s.cronogramaExtras = (s.cronogramaExtras || []).filter(x => x.id !== id); });
        render(container);
      });
    }));
  }

  function openSlotForm(container) {
    const state = window.DB.get();
    window.UI.openModal({
      title: 'Adicionar horário',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Tipo</label>
            <select id="f-mode">
              <option value="disc">Vincular a uma disciplina existente</option>
              <option value="extra">Evento avulso (ex: monitoria, estudo)</option>
            </select>
          </div>
          <div class="field span-2" id="disc-select-wrap"><label>Disciplina</label>
            <select id="f-disc">${state.disciplinas.map(d => `<option value="${d.id}">${U.escapeHtml(d.nome)}</option>`).join('')}</select>
          </div>
          <div class="field span-2" id="extra-title-wrap" style="display:none;"><label>Título</label><input id="f-extra-titulo"></div>
          <div class="field"><label>Dia da semana</label><select id="f-dia">${U.DIAS_SEMANA.map(d => `<option>${d}</option>`).join('')}</select></div>
          <div class="field"></div>
          <div class="field"><label>Início</label><input id="f-hini" type="time" value="08:00"></div>
          <div class="field"><label>Fim</label><input id="f-hfim" type="time" value="10:00"></div>
        </div>
      `,
      footerHtml: `<button class="btn btn-ghost" id="f-cancel">Cancelar</button><button class="btn btn-primary" id="f-save">Salvar</button>`,
      onMount: (overlay) => {
        const modeSel = U.qs('#f-mode', overlay);
        modeSel.addEventListener('change', () => {
          const isExtra = modeSel.value === 'extra';
          U.qs('#disc-select-wrap', overlay).style.display = isExtra ? 'none' : '';
          U.qs('#extra-title-wrap', overlay).style.display = isExtra ? '' : 'none';
        });
        U.qs('#f-cancel', overlay).addEventListener('click', window.UI.closeModal);
        U.qs('#f-save', overlay).addEventListener('click', () => {
          const dia = U.qs('#f-dia', overlay).value;
          const horarioInicio = U.qs('#f-hini', overlay).value;
          const horarioFim = U.qs('#f-hfim', overlay).value;
          if (modeSel.value === 'disc') {
            const discId = U.qs('#f-disc', overlay).value;
            window.DB.save(s => {
              const d = s.disciplinas.find(x => x.id === discId);
              Object.assign(d, { dia, horarioInicio, horarioFim });
            });
          } else {
            const titulo = U.qs('#f-extra-titulo', overlay).value.trim();
            if (!titulo) { window.UI.toast('Informe um título', 'error'); return; }
            window.DB.save(s => {
              s.cronogramaExtras = s.cronogramaExtras || [];
              s.cronogramaExtras.push({ id: U.uid('extra'), titulo, dia, horarioInicio, horarioFim, cor: '#6366F1' });
            });
          }
          window.UI.closeModal();
          window.UI.toast('Cronograma atualizado', 'success');
          render(container);
        });
      }
    });
  }

  return { render };
})();


/* ===================== pages/tcc.js ===================== */
/* ==========================================================================
   pages/tcc.js
   Módulo do TCC — centro do sistema.
   Sub-páginas: dashboard, cronograma (gantt), etapas, projeto,
   referencias, ideias, orientacoes, arquivos.
   ========================================================================== */

window.Pages = window.Pages || {};

window.Pages.tcc = (function () {
  const U = window.Utils;

  function tcc() { return window.DB.get().tcc; }
  function saveTcc(mutator) { window.DB.save(s => mutator(s.tcc)); }

  function progressoGeral() {
    const etapas = tcc().etapas;
    if (!etapas.length) return 0;
    const done = etapas.filter(e => e.status === 'concluido').length;
    return Math.round((done / etapas.length) * 100);
  }

  // ===================== DASHBOARD =====================
  const dashboard = {
    render(container) {
      const t = tcc();
      const pct = progressoGeral();
      const etapaAtual = t.etapas.find(e => e.status === 'andamento') || t.etapas.find(e => e.status === 'pendente');
      const ultimaOrientacao = [...t.orientacoes].sort((a, b) => b.data.localeCompare(a.data))[0];
      const proximaEntrega = t.etapas.filter(e => e.status !== 'concluido' && e.dataFim).sort((a, b) => a.dataFim.localeCompare(b.dataFim))[0];
      const diasRestantes = proximaEntrega ? U.daysFromToday(proximaEntrega.dataFim) : null;
      const pendencias = t.orientacoes.filter(o => o.pendencias && o.pendencias.trim()).slice(-4).reverse();

      container.innerHTML = `
        <div class="content-inner">
          ${tccHeader('dashboard')}

          <div class="grid grid-2">
            <div class="card">
              <div class="section-title"><h3><i data-lucide="trending-up"></i> Progresso geral</h3></div>
              <div style="display:flex; align-items:baseline; gap:10px; margin-bottom:10px;">
                <span style="font-size:26px; font-weight:800;">${pct}%</span>
                <span class="text-muted" style="font-size:12.5px;">${t.etapas.filter(e=>e.status==='concluido').length} de ${t.etapas.length} etapas concluídas</span>
              </div>
              ${window.UI.progressBar(pct, '#C084FC')}
            </div>
            <div class="card">
              <div class="section-title"><h3><i data-lucide="flag"></i> Etapa atual</h3></div>
              ${etapaAtual ? `
                <div style="font-size:14px; font-weight:700; margin-bottom:6px;">${U.escapeHtml(etapaAtual.nome)}</div>
                <div class="text-faint" style="font-size:12px; margin-bottom:10px;">${U.formatDateBR(etapaAtual.dataInicio)} → ${U.formatDateBR(etapaAtual.dataFim)}</div>
                <div class="checklist-mini-list">${(etapaAtual.checklist||[]).slice(0,4).map(c => `<div class="checklist-item ${c.done?'done':''}"><input type="checkbox" disabled ${c.done?'checked':''}><span style="font-size:12.5px;">${U.escapeHtml(c.texto)}</span></div>`).join('') || '<span class="text-faint" style="font-size:12px;">Sem checklist definido.</span>'}</div>
              ` : window.UI.emptyState('flag', 'Nenhuma etapa em andamento', '')}
            </div>
          </div>

          <div class="grid grid-4">
            ${statMini('calendar-clock', 'Próxima orientação', ultimaOrientacao ? U.formatDateBR(ultimaOrientacao.data) : '—', ultimaOrientacao ? U.escapeHtml(ultimaOrientacao.professor) : 'Toque para agendar', 'tcc/orientacoes')}
            ${statMini('hourglass', 'Dias restantes', diasRestantes !== null ? `${diasRestantes}d` : '—', proximaEntrega ? U.escapeHtml(proximaEntrega.nome) : '', 'tcc/cronograma')}
            ${statMini('clipboard-check', 'Próxima entrega', proximaEntrega ? U.formatDateBR(proximaEntrega.dataFim) : '—', proximaEntrega ? U.escapeHtml(proximaEntrega.nome) : 'Sem etapas pendentes', 'tcc/etapas')}
            ${statMini('list-checks', 'Etapa atual', etapaAtual ? '#' + (t.etapas.indexOf(etapaAtual)+1) : '—', etapaAtual ? U.escapeHtml(etapaAtual.nome.slice(0,28)) : '', 'tcc/etapas')}
          </div>

          <div class="section">
            <div class="section-title"><h3><i data-lucide="git-commit-horizontal"></i> Linha do tempo</h3></div>
            <div class="card">${renderMiniTimeline(t.etapas)}</div>
          </div>

          <div class="section">
            <div class="section-title"><h3><i data-lucide="alert-triangle"></i> Pendências recentes</h3></div>
            <div class="card">
              ${pendencias.length === 0 ? window.UI.emptyState('check-circle-2', 'Sem pendências registradas', '') :
                pendencias.map(p => `<div class="todo-row"><span class="dot" style="background:var(--warning)"></span><span>${U.escapeHtml(p.pendencias)}</span><span class="text-faint mono" style="font-size:11px;">${U.formatDateBR(p.data)}</span></div>`).join('')}
            </div>
          </div>
        </div>
      `;
      U.lucide();
    }
  };

  function statMini(icon, label, value, sub, route) {
    const tag = route ? 'a' : 'div';
    const attrs = route ? `href="#${route}"` : '';
    return `
      <${tag} ${attrs} class="card stat-card card-hover" style="${route ? 'text-decoration:none; color:inherit; display:block;' : ''}">
        <div class="stat-icon"><i data-lucide="${icon}"></i></div>
        <div class="stat-label">${label}</div>
        <div class="stat-value">${U.escapeHtml(String(value))}</div>
        <div class="stat-sub">${U.escapeHtml(sub || '')}</div>
      </${tag}>
    `;
  }

  function renderMiniTimeline(etapas) {
    const sorted = [...etapas].sort((a, b) => (a.dataInicio||'').localeCompare(b.dataInicio||''));
    if (!sorted.length) return window.UI.emptyState('list', 'Nenhuma etapa cadastrada', '');
    return `<div class="timeline">${sorted.map(e => `
      <div class="timeline-item">
        <div class="timeline-dot" style="background:${e.status === 'concluido' ? 'var(--success)' : 'var(--accent)'}"></div>
        <div class="timeline-content">
          <div class="t-title">${U.escapeHtml(e.nome)}</div>
          <div class="t-meta">${U.formatDateBR(e.dataInicio)} → ${U.formatDateBR(e.dataFim)} · ${U.statusBadge(e.status).label}</div>
        </div>
      </div>
    `).join('')}</div>`;
  }

  function tccHeader(activeSub) {
    const items = window.UI.TCC_ITEMS;
    return `
      <div class="page-header">
        <div>
          <h1>TCC</h1>
          <div class="subtitle">Centro do sistema — projeto de trabalho de conclusão de curso</div>
        </div>
      </div>
      <div class="tabs">
        ${items.map(i => `<a href="#${i.route}" class="tab-btn ${i.route === 'tcc/' + activeSub ? 'active' : ''}">${i.label}</a>`).join('')}
      </div>
    `;
  }

  // ===================== CRONOGRAMA (GANTT) =====================
  const cronogramaTcc = {
    view: 'gantt', // 'gantt' | 'timeline'
    render(container) {
      const t = tcc();
      container.innerHTML = `
        <div class="content-inner">
          ${tccHeader('cronograma')}
          <div class="page-header" style="margin-bottom:14px;">
            <div class="header-actions">
              <button class="filter-chip ${cronogramaTcc.view==='gantt'?'active':''}" data-view="gantt">Gantt</button>
              <button class="filter-chip ${cronogramaTcc.view==='timeline'?'active':''}" data-view="timeline">Timeline</button>
            </div>
            <button class="btn btn-primary btn-sm" id="btn-add-etapa"><i data-lucide="plus"></i> Nova etapa</button>
          </div>
          <div id="gantt-container"></div>
        </div>
      `;
      U.qsa('[data-view]', container).forEach(b => b.addEventListener('click', () => { cronogramaTcc.view = b.getAttribute('data-view'); cronogramaTcc.render(container); }));
      U.qs('#btn-add-etapa', container).addEventListener('click', () => window.Pages.tcc.openEtapaForm(null, () => cronogramaTcc.render(container)));

      const target = U.qs('#gantt-container', container);
      if (cronogramaTcc.view === 'gantt') renderGantt(target, t.etapas, container);
      else renderTimelineView(target, t.etapas);
      U.lucide();
    }
  };

  function renderTimelineView(target, etapas) {
    target.innerHTML = `<div class="card">${renderMiniTimeline(etapas)}</div>`;
  }

  const LABEL_WIDTH = 260;
  const GANTT_HEADER_H = 46;

  function renderGantt(target, etapas, pageContainer) {
    if (!etapas.length) { target.innerHTML = `<div class="card">${window.UI.emptyState('bar-chart-2', 'Nenhuma etapa cadastrada', '')}</div>`; return; }

    const allDates = etapas.flatMap(e => [e.dataInicio, e.dataFim]).filter(Boolean);
    let minDate = allDates.reduce((a, b) => a < b ? a : b);
    let maxDate = allDates.reduce((a, b) => a > b ? a : b);
    minDate = U.addDays(minDate, -3);
    maxDate = U.addDays(maxDate, 6);
    const totalDays = U.daysBetween(minDate, maxDate);
    const dayWidth = 30;
    const rowHeight = 54;
    const ganttWidth = totalDays * dayWidth;

    const weekMarks = [];
    for (let i = 0; i <= totalDays; i += 7) {
      weekMarks.push({ offset: i, width: Math.min(7 * dayWidth, ganttWidth - i * dayWidth), label: U.formatDateBR(U.addDays(minDate, i)) });
    }

    const todayOffset = U.daysBetween(minDate, U.todayISO());
    const bodyHeight = etapas.length * rowHeight;

    target.innerHTML = `
      <div class="gantt-wrap">
        <div class="gantt" style="width:${Math.max(900, ganttWidth + LABEL_WIDTH)}px;">
          <div class="gantt-header" style="height:${GANTT_HEADER_H}px;">
            <div class="gantt-row-label" style="background:var(--bg-elevated); width:${LABEL_WIDTH}px; height:${GANTT_HEADER_H}px;">Etapa</div>
            <div style="position:relative; width:${ganttWidth}px; height:${GANTT_HEADER_H}px;">
              ${weekMarks.map(w => `<div class="gantt-header-cell" style="position:absolute; top:0; left:${w.offset*dayWidth}px; width:${w.width}px; height:${GANTT_HEADER_H}px;">${w.label}</div>`).join('')}
            </div>
          </div>
          <div class="gantt-body" style="position:relative;">
            <div class="gantt-gridlines" style="left:${LABEL_WIDTH}px; height:${bodyHeight}px;">
              ${weekMarks.map(w => `<div class="gantt-grid-line" style="left:${w.offset*dayWidth}px;"></div>`).join('')}
            </div>
            ${todayOffset >= 0 && todayOffset <= totalDays ? `
              <div class="gantt-today-line" style="left:${LABEL_WIDTH + todayOffset*dayWidth}px; height:${bodyHeight}px;">
                <span class="gantt-today-tag">Hoje</span>
              </div>` : ''}
            ${etapas.map((e, idx) => `
              <div class="gantt-row ${idx % 2 === 1 ? 'alt' : ''}" style="height:${rowHeight}px;">
                <div class="gantt-row-label" title="${U.escapeHtml(e.nome)}" style="width:${LABEL_WIDTH}px;">
                  <span class="gantt-row-dot" style="background:var(--accent)"></span>
                  <span class="gantt-row-text">${U.escapeHtml(e.nome)}</span>
                </div>
                <div class="gantt-track" style="width:${ganttWidth}px;" data-track-for="${e.id}"></div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;

    etapas.forEach(e => {
      const track = U.qs(`[data-track-for="${e.id}"]`, target);
      const startOffset = U.daysBetween(minDate, e.dataInicio || minDate);
      const duration = Math.max(1, U.daysBetween(e.dataInicio || minDate, e.dataFim || minDate) + 1);
      const st = U.statusBadge(e.status);
      const bar = U.el(`
        <div class="gantt-bar ${e.status === 'concluido' ? 'gantt-bar-done' : ''}" data-bar-id="${e.id}" style="left:${startOffset*dayWidth}px; width:${duration*dayWidth}px; background:var(--accent); color:#fff;" title="${U.escapeHtml(e.nome)} · ${st.label}">
          <div class="resize-handle left"></div>
          <span class="gantt-bar-label">${U.escapeHtml(e.nome)}</span>
          <div class="resize-handle right"></div>
        </div>
      `);
      track.appendChild(bar);
      makeBarInteractive(bar, e, dayWidth, minDate, pageContainer);
      bar.addEventListener('dblclick', () => window.Pages.tcc.openEtapaForm(e, () => cronogramaTcc.render(pageContainer)));
    });
  }

  function makeBarInteractive(bar, etapa, dayWidth, minDate, pageContainer) {
    let mode = null, startX = 0, origLeft = 0, origWidth = 0;

    function onDown(e, m) {
      mode = m;
      startX = e.clientX;
      origLeft = parseFloat(bar.style.left);
      origWidth = parseFloat(bar.style.width);
      bar.classList.add('dragging');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.stopPropagation();
      e.preventDefault();
    }

    function onMove(e) {
      const dx = e.clientX - startX;
      const snapped = Math.round(dx / dayWidth) * dayWidth;
      if (mode === 'move') {
        bar.style.left = Math.max(0, origLeft + snapped) + 'px';
      } else if (mode === 'resize-right') {
        bar.style.width = Math.max(dayWidth, origWidth + snapped) + 'px';
      } else if (mode === 'resize-left') {
        const newLeft = origLeft + snapped;
        const newWidth = origWidth - snapped;
        if (newWidth >= dayWidth) { bar.style.left = newLeft + 'px'; bar.style.width = newWidth + 'px'; }
      }
    }

    function onUp() {
      bar.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      const newLeftDays = Math.round(parseFloat(bar.style.left) / dayWidth);
      const newWidthDays = Math.round(parseFloat(bar.style.width) / dayWidth);
      const novaInicio = U.addDays(minDate, newLeftDays);
      const novaFim = U.addDays(novaInicio, newWidthDays - 1);
      saveTcc(t => {
        const et = t.etapas.find(x => x.id === etapa.id);
        et.dataInicio = novaInicio; et.dataFim = novaFim;
      });
      window.UI.toast('Datas da etapa atualizadas', 'success');
      cronogramaTcc.render(pageContainer);
    }

    bar.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('resize-handle')) return;
      onDown(e, 'move');
    });
    U.qs('.resize-handle.left', bar).addEventListener('mousedown', (e) => onDown(e, 'resize-left'));
    U.qs('.resize-handle.right', bar).addEventListener('mousedown', (e) => onDown(e, 'resize-right'));
  }

  return { dashboard, cronogramaTcc, tccHeader, statMini, saveTcc, tcc };
})();

          <div class="card" style="margin-bottom:12px; border-left:3px solid var(--accent);">

            </div>
            <div style="margin-top:10px;">
              <div class="checklist-mini-list">
                ${(e.checklist || []).map(c => `
                  <div class="checklist-item ${c.done ? 'done' : ''}">
                    <input type="checkbox" data-chk="${e.id}:${c.id}" ${c.done ? 'checked' : ''}>
                    <span>${U.escapeHtml(c.texto)}</span>
