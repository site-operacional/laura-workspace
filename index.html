          <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="f-valor" value="${c.valor}"></div>
          <div class="field"><label>Dia de vencimento</label><input type="number" min="1" max="31" id="f-dia" value="${c.diaVencimento}"></div>
          <div class="field"><label>Competência (mês)</label><input type="month" id="f-competencia" value="${c.competencia}" ${jaRecorrente ? 'disabled' : ''}></div>
          <div class="field"><label>Status</label>
            <select id="f-status"><option value="pendente" ${c.status === 'pendente' ? 'selected' : ''}>Pendente</option><option value="paga" ${c.status === 'paga' ? 'selected' : ''}>Paga</option></select>
          </div>
          <div class="field">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-top:22px;">
              <input type="checkbox" id="f-recorrente" ${jaRecorrente ? 'checked disabled' : ''}>
              Conta recorrente (repete todo mês)
            </label>
          </div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(c.observacoes || '')}</textarea></div>
        </div>
        ${jaRecorrente ? `<p class="text-faint" style="font-size:11.5px; margin-top:10px;">Esta conta faz parte de uma recorrência. Editar aqui altera só ${competenciaLabel(c.competencia)}. Use "Gerenciar recorrência" no card para pausar, encerrar ou mudar o valor dos próximos meses.</p>` : ''}
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            nome: overlay.querySelector('#f-nome').value.trim() || 'Conta sem nome',
            tipo: overlay.querySelector('#f-tipo').value,
            categoriaId: overlay.querySelector('#f-cat').value,
            valor: parseFloat(overlay.querySelector('#f-valor').value) || 0,
            diaVencimento: parseInt(overlay.querySelector('#f-dia').value, 10) || null,
            competencia: overlay.querySelector('#f-competencia').value || financeiroMes,
            status: overlay.querySelector('#f-status').value,
            observacoes: overlay.querySelector('#f-obs').value,
          };
          const tornarRecorrente = !jaRecorrente && overlay.querySelector('#f-recorrente').checked;
          window.FinanceiroDB.save(s => {
            if (isEdit) {
              Object.assign(s.contas.find(x => x.id === c.id), payload);
            } else if (tornarRecorrente) {
              const recId = U.uid('rec');
              s.recorrencias.push({
                id: recId, nome: payload.nome, categoriaId: payload.categoriaId, tipo: payload.tipo,
                valor: payload.valor, diaVencimento: payload.diaVencimento, status: 'ativa', criadoEm: payload.competencia,
              });
              s.contas.push(Object.assign({ id: U.uid('conta'), recorrenciaId: recId }, payload));
            } else {
              s.contas.push(Object.assign({ id: U.uid('conta'), recorrenciaId: null }, payload));
            }
          });
          window.UI.closeModal();
          window.UI.toast(tornarRecorrente ? 'Conta recorrente criada — os próximos meses serão gerados automaticamente.' : 'Conta salva.', 'success');
          renderContas(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog(jaRecorrente ? 'Remover esta conta apenas deste mês? A recorrência continuará gerando os próximos meses.' : 'Remover esta conta?', () => {
            window.FinanceiroDB.save(s => { s.contas = s.contas.filter(x => x.id !== c.id); });
            window.UI.toast('Conta removida.', 'success');
            renderContas(content);
          });
        });
      }
    });
  }

  function openRecorrenciaManager(recorrenciaId, content) {
    const r = window.FinanceiroDB.get().recorrencias.find(x => x.id === recorrenciaId);
    if (!r) return;
    window.UI.openModal({
      title: `Recorrência: ${r.nome}`,
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome</label><input id="r-nome" value="${U.escapeHtml(r.nome)}"></div>
          <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="r-valor" value="${r.valor}"></div>
          <div class="field"><label>Dia de vencimento</label><input type="number" min="1" max="31" id="r-dia" value="${r.diaVencimento}"></div>
        </div>
        <p class="text-faint" style="font-size:11.5px; margin-top:10px;">Alterações aqui valem para os próximos meses ainda não gerados. Meses já criados não são alterados retroativamente.</p>
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft);">
          <span class="status-pill" style="background:${r.status === 'ativa' ? '#22C55E22' : '#EAB30822'}; color:${r.status === 'ativa' ? '#22C55E' : '#EAB308'};">${r.status === 'ativa' ? 'Ativa' : r.status === 'pausada' ? 'Pausada' : 'Encerrada'}</span>
        </div>
      `,
      footerHtml: `
        ${r.status === 'ativa' ? '<button class="btn btn-soft btn-sm" id="r-pausar"><i data-lucide="pause"></i> Pausar</button>' : '<button class="btn btn-soft btn-sm" id="r-retomar"><i data-lucide="play"></i> Retomar</button>'}
        <button class="btn btn-danger btn-sm" id="r-encerrar"><i data-lucide="square"></i> Encerrar</button>
        <div style="flex:1;"></div>
        <button class="btn btn-ghost" id="r-cancel">Fechar</button>
        <button class="btn mod-btn-primary" id="r-save">Salvar</button>
      `,
      onMount: (overlay) => {
        overlay.querySelector('#r-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#r-save').addEventListener('click', () => {
          window.FinanceiroDB.save(s => {
            const rec = s.recorrencias.find(x => x.id === recorrenciaId);
            rec.nome = overlay.querySelector('#r-nome').value.trim() || rec.nome;
            rec.valor = parseFloat(overlay.querySelector('#r-valor').value) || rec.valor;
            rec.diaVencimento = parseInt(overlay.querySelector('#r-dia').value, 10) || rec.diaVencimento;
          });
          window.UI.closeModal();
          window.UI.toast('Recorrência atualizada para os próximos meses.', 'success');
          renderContas(content);
        });
        const pausarBtn = overlay.querySelector('#r-pausar');
        if (pausarBtn) pausarBtn.addEventListener('click', () => {
          window.FinanceiroDB.save(s => { s.recorrencias.find(x => x.id === recorrenciaId).status = 'pausada'; });
          window.UI.closeModal();
          window.UI.toast('Recorrência pausada. Nenhum mês novo será gerado até você retomar.', 'success');
          renderContas(content);
        });
        const retomarBtn = overlay.querySelector('#r-retomar');
        if (retomarBtn) retomarBtn.addEventListener('click', () => {
          window.FinanceiroDB.save(s => { s.recorrencias.find(x => x.id === recorrenciaId).status = 'ativa'; });
          window.UI.closeModal();
          window.UI.toast('Recorrência retomada.', 'success');
          renderContas(content);
        });
        overlay.querySelector('#r-encerrar').addEventListener('click', () => {
          window.UI.confirmDialog('Encerrar esta recorrência? Ela para de gerar novos meses, mas os meses já criados continuam existindo.', () => {
            window.FinanceiroDB.save(s => { s.recorrencias.find(x => x.id === recorrenciaId).status = 'encerrada'; });
            window.UI.closeModal();
            window.UI.toast('Recorrência encerrada.', 'success');
            renderContas(content);
          });
        });
      }
    });
  }

  /* ================================ CARTÕES ================================ */
  let cartaoDetalheId = null;
  let mostrarArquivados = false;

  function renderCartoes(content) {
    if (cartaoDetalheId) { renderFaturaDetail(content); return; }

    const s = window.FinanceiroDB.get();
    const ativos = s.cartoes.filter(c => !c.arquivado);
    const arquivados = s.cartoes.filter(c => c.arquivado);
    const lista = mostrarArquivados ? arquivados : ativos;

    content.innerHTML = `
      <div class="filter-bar">
        <div style="flex:1;"></div>
        <span class="archived-toggle" id="toggle-arquivados">${mostrarArquivados ? `← Ver cartões ativos (${ativos.length})` : `Ver arquivados (${arquivados.length})`}</span>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-cartao"><i data-lucide="plus"></i> Novo cartão</button>
      </div>
      <div id="cartoes-list"></div>
    `;
    U.lucide();

    document.getElementById('cartoes-list').innerHTML = lista.length
      ? `<div class="item-grid">` + lista.map(c => cartaoCard(c)).join('') + `</div>`
      : window.UI.emptyState('credit-card', mostrarArquivados ? 'Nenhum cartão arquivado' : 'Nenhum cartão cadastrado', mostrarArquivados ? '' : 'Cadastre um ou mais cartões de crédito para acompanhar limites e faturas.');

    U.lucide();
    document.getElementById('toggle-arquivados').addEventListener('click', () => { mostrarArquivados = !mostrarArquivados; renderCartoes(content); });
    document.getElementById('btn-add-cartao').addEventListener('click', () => openCartaoForm(null, content));
    U.qsa('[data-open-cartao]', content).forEach(b => b.addEventListener('click', (e) => {
      if (e.target.closest('[data-cartao-action]')) return;
      cartaoDetalheId = b.getAttribute('data-open-cartao');
      renderCartoes(content);
    }));
    U.qsa('[data-cartao-action]', content).forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = b.getAttribute('data-cartao-action');
      const id = b.getAttribute('data-cartao-id');
      if (action === 'editar') {
        const cartao = window.FinanceiroDB.get().cartoes.find(x => x.id === id);
        openCartaoForm(cartao, content);
      } else if (action === 'arquivar') {
        window.FinanceiroDB.save(s2 => { s2.cartoes.find(x => x.id === id).arquivado = true; });
        window.UI.toast('Cartão arquivado. O histórico foi mantido.', 'success');
        renderCartoes(content);
      } else if (action === 'restaurar') {
        window.FinanceiroDB.save(s2 => { s2.cartoes.find(x => x.id === id).arquivado = false; });
        window.UI.toast('Cartão restaurado.', 'success');
        renderCartoes(content);
      } else if (action === 'excluir') {
        window.UI.confirmDialog('Excluir este cartão e todo o seu histórico de compras? Esta ação não pode ser desfeita. Se preferir manter o histórico, use "Arquivar" em vez de excluir.', () => {
          window.FinanceiroDB.save(s2 => { s2.cartoes = s2.cartoes.filter(x => x.id !== id); });
          window.UI.toast('Cartão excluído.', 'success');
          renderCartoes(content);
        });
      }
    }));
  }

  function cartaoCard(c) {
    const usado = cartaoLimiteUsado(c);
    const limite = Number(c.limite) || 0;
    const pct = limite ? (usado / limite) * 100 : 0;
    const disponivel = Math.max(0, limite - usado);
    return `
      <div class="card" data-open-cartao="${c.id}" style="cursor:pointer;">
        <div class="item-card-top">
          <div style="display:flex; gap:10px; align-items:center;">
            <div class="card-mini-swatch" style="background:linear-gradient(135deg, ${c.cor}, ${c.cor}99);"></div>
            <div>
              <div class="item-card-title">${U.escapeHtml(c.nome)}</div>
              <div class="item-card-meta" style="margin-top:4px; display:flex; align-items:center; gap:6px;">${U.escapeHtml(c.banco || '—')} ${c.bandeira ? `<span class="card-bandeira-badge">${U.escapeHtml(c.bandeira)}</span>` : ''}</div>
            </div>
          </div>
        </div>
        <div style="margin-top:12px;">
          <div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-faint); margin-bottom:5px;">
            <span>Usado: ${formatBRL(usado)}</span><span>Disponível: ${formatBRL(disponivel)}</span>
          </div>
          ${window.UI.progressBar(pct, pct > 85 ? '#EF4444' : c.cor)}
        </div>
        <div class="item-card-meta" style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
          <span>Fecha dia ${c.fechamento || '—'}</span><span>Vence dia ${c.vencimento || '—'}</span>
        </div>
        <div class="item-card-actions">
          ${c.arquivado
            ? `<button class="btn btn-soft btn-sm" data-cartao-action="restaurar" data-cartao-id="${c.id}" style="flex:1;"><i data-lucide="rotate-ccw"></i> Restaurar</button>
               <button class="btn btn-danger btn-sm" data-cartao-action="excluir" data-cartao-id="${c.id}"><i data-lucide="trash-2"></i></button>`
            : `<button class="btn btn-soft btn-sm" data-cartao-action="editar" data-cartao-id="${c.id}" style="flex:1;"><i data-lucide="pencil"></i> Editar</button>
               <button class="btn btn-soft btn-sm" data-cartao-action="arquivar" data-cartao-id="${c.id}"><i data-lucide="archive"></i></button>`}
        </div>
      </div>
    `;
  }

  function openCartaoForm(cartao, content) {
    const isEdit = !!(cartao && cartao.id);
    const s = window.FinanceiroDB.get();
    const c = cartao || { id: null, nome: '', banco: '', bandeira: '', cor: window.FinanceiroDB.CARD_COLOR_PALETTE[s.cartoes.length % window.FinanceiroDB.CARD_COLOR_PALETTE.length], limite: '', fechamento: '', vencimento: '', melhorDiaCompra: '', observacoes: '', compras: [], faturas: {}, arquivado: false };
    let corSelecionada = c.cor;
    window.UI.openModal({
      title: isEdit ? 'Editar cartão' : 'Novo cartão',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome do cartão</label><input id="f-nome" value="${U.escapeHtml(c.nome)}" placeholder="Ex: Nubank Roxinho"></div>
          <div class="field"><label>Banco</label><input id="f-banco" value="${U.escapeHtml(c.banco || '')}"></div>
          <div class="field"><label>Bandeira</label>
            <select id="f-bandeira"><option value="">Selecionar...</option>${window.FinanceiroDB.BANDEIRAS.map(b => `<option ${c.bandeira === b ? 'selected' : ''}>${b}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Limite (R$)</label><input type="number" step="0.01" id="f-limite" value="${c.limite}"></div>
          <div class="field"><label>Melhor dia de compra</label><input type="number" min="1" max="31" id="f-melhordia" value="${c.melhorDiaCompra}"></div>
          <div class="field"><label>Dia de fechamento</label><input type="number" min="1" max="31" id="f-fechamento" value="${c.fechamento}"></div>
          <div class="field"><label>Dia de vencimento</label><input type="number" min="1" max="31" id="f-vencimento" value="${c.vencimento}"></div>
          <div class="field span-2">
            <label>Cor do cartão</label>
            <div class="color-swatch-row" id="color-swatch-row">
              ${window.FinanceiroDB.CARD_COLOR_PALETTE.map(cor => `<span class="color-swatch ${cor === corSelecionada ? 'selected' : ''}" data-cor="${cor}" style="background:${cor};"></span>`).join('')}
            </div>
          </div>
          <div class="field span-2"><label>Observações</label><textarea id="f-obs">${U.escapeHtml(c.observacoes || '')}</textarea></div>
        </div>
      `,
      footerHtml: `
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        U.qsa('.color-swatch', overlay).forEach(sw => sw.addEventListener('click', () => {
          corSelecionada = sw.getAttribute('data-cor');
          U.qsa('.color-swatch', overlay).forEach(x => x.classList.remove('selected'));
          sw.classList.add('selected');
        }));
        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            nome: overlay.querySelector('#f-nome').value.trim() || 'Cartão',
            banco: overlay.querySelector('#f-banco').value,
            bandeira: overlay.querySelector('#f-bandeira').value,
            cor: corSelecionada,
            limite: parseFloat(overlay.querySelector('#f-limite').value) || 0,
            melhorDiaCompra: parseInt(overlay.querySelector('#f-melhordia').value, 10) || null,
            fechamento: parseInt(overlay.querySelector('#f-fechamento').value, 10) || null,
            vencimento: parseInt(overlay.querySelector('#f-vencimento').value, 10) || null,
            observacoes: overlay.querySelector('#f-obs').value,
          };
          window.FinanceiroDB.save(s2 => {
            if (isEdit) Object.assign(s2.cartoes.find(x => x.id === c.id), payload);
            else s2.cartoes.push(Object.assign({ id: U.uid('cartao'), compras: [], faturas: {}, arquivado: false }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Cartão salvo.', 'success');
          renderCartoes(content);
        });
      }
    });
  }

  /* ------------------------------ Fatura (detalhe do cartão) ------------------------------ */
  function renderFaturaDetail(content) {
    const cartao = window.FinanceiroDB.get().cartoes.find(x => x.id === cartaoDetalheId);
    if (!cartao) { cartaoDetalheId = null; renderCartoes(content); return; }

    const rows = parcelasDoMes(cartao, financeiroMes);
    const totalFatura = rows.reduce((sum, r) => sum + r.parcela.valor, 0);
    const fatura = cartao.faturas[financeiroMes] || { status: 'aberta', valorPago: 0, dataPagamento: null, pagamentoAntecipado: false };
    const todasPagas = rows.length > 0 && rows.every(r => r.parcela.paga);
    const statusMeta = todasPagas ? { label: 'Paga', color: '#22C55E' } : fatura.status === 'parcial' ? { label: 'Parcial', color: '#EAB308' } : { label: 'Aberta', color: '#EF4444' };

    content.innerHTML = `
      <button class="btn btn-ghost btn-sm" id="btn-voltar-cartoes" style="margin-bottom:14px;"><i data-lucide="arrow-left"></i> Voltar para Cartões</button>
      <div class="filter-bar" style="align-items:center;">
        <div class="card-mini-swatch" style="background:linear-gradient(135deg, ${cartao.cor}, ${cartao.cor}99); width:52px; height:36px;"></div>
        <div>
          <div style="font-size:15px; font-weight:800;">${U.escapeHtml(cartao.nome)}</div>
          <div class="item-card-meta">${U.escapeHtml(cartao.banco || '')}${cartao.bandeira ? ' · ' + U.escapeHtml(cartao.bandeira) : ''}</div>
        </div>
        <div style="flex:1;"></div>
        ${monthNavHtml()}
      </div>

      <div class="fatura-summary">
        <div class="dg-card"><div class="dg-card-icon" style="background:${cartao.cor}22; color:${cartao.cor};"><i data-lucide="receipt"></i></div><div class="dg-card-label">Total da fatura</div><div class="dg-card-value">${formatBRL(totalFatura)}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#22C55E22; color:#22C55E;"><i data-lucide="check-circle-2"></i></div><div class="dg-card-label">Valor pago</div><div class="dg-card-value">${formatBRL(fatura.valorPago || (todasPagas ? totalFatura : 0))}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${statusMeta.color}22; color:${statusMeta.color};"><i data-lucide="info"></i></div><div class="dg-card-label">Status</div><div class="dg-card-value">${statusMeta.label}${fatura.pagamentoAntecipado ? ' (antecipado)' : ''}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${cartao.cor}22; color:${cartao.cor};"><i data-lucide="calendar"></i></div><div class="dg-card-label">Vencimento</div><div class="dg-card-value">Dia ${cartao.vencimento || '—'}</div></div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div class="dg-section-title"><i data-lucide="shopping-bag"></i> Compras e parcelas deste mês</div>
        <div id="fatura-rows"></div>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;">
        ${!todasPagas ? `<button class="btn mod-btn-primary btn-sm" id="btn-pagar-fatura"><i data-lucide="check"></i> Marcar fatura como paga</button>
        <button class="btn btn-soft btn-sm" id="btn-pagar-parcial"><i data-lucide="percent"></i> Registrar pagamento parcial</button>` : `<span class="status-pill" style="background:#22C55E22; color:#22C55E;"><i data-lucide="check"></i> Fatura quitada</span>`}
        <button class="btn btn-soft btn-sm" id="btn-nova-compra"><i data-lucide="plus"></i> Nova compra</button>
      </div>
    `;
    U.lucide();
    bindMonthNav(content, () => renderFaturaDetail(content));

    document.getElementById('fatura-rows').innerHTML = rows.length
      ? rows.map(({ compra, assinatura, parcela }) => {
          if (compra) {
            return `
              <div class="fatura-parcela-row">
                <div class="file-icon" style="background:${catById(compra.categoriaId).cor}22; color:${catById(compra.categoriaId).cor};"><i data-lucide="shopping-bag"></i></div>
                <div style="flex:1;">
                  <div class="file-name">${U.escapeHtml(compra.descricao)} ${compra.parcelado ? `<span class="text-faint" style="font-weight:600;">${parcela.numero}/${compra.quantidadeParcelas}</span>` : ''}</div>
                  <div class="file-meta">${U.formatDateBR(compra.dataCompra)} · ${U.escapeHtml(catById(compra.categoriaId).nome)} ${parcela.paga ? '· <span style="color:#22C55E;">paga</span>' : ''}</div>
                </div>
                <div style="font-weight:700;">${formatBRL(parcela.valor)}</div>
                <button class="icon-btn" data-compra-edit="${compra.id}" title="Editar compra"><i data-lucide="pencil"></i></button>
                ${compra.parcelado && !parcela.paga ? `<button class="icon-btn" data-antecipar="${compra.id}" title="Antecipar parcelas restantes"><i data-lucide="fast-forward"></i></button>` : ''}
              </div>
            `;
          }
          return `
            <div class="fatura-parcela-row">
              <div class="file-icon" style="background:${catById(assinatura.categoriaId).cor}22; color:${catById(assinatura.categoriaId).cor};"><i data-lucide="repeat"></i></div>
              <div style="flex:1;">
                <div class="file-name">${U.escapeHtml(assinatura.nome)} <span class="text-faint" style="font-weight:600;">assinatura</span></div>
                <div class="file-meta">${U.escapeHtml(catById(assinatura.categoriaId).nome)} ${parcela.paga ? '· <span style="color:#22C55E;">paga</span>' : ''}</div>
              </div>
              <div style="font-weight:700;">${formatBRL(parcela.valor)}</div>
              <button class="icon-btn" data-assin-edit="${assinatura.id}" title="Editar assinatura"><i data-lucide="pencil"></i></button>
            </div>
          `;
        }).join('')
      : window.UI.emptyState('shopping-bag', 'Nenhuma compra nesta fatura', '');
    U.lucide();

    document.getElementById('btn-voltar-cartoes').addEventListener('click', () => { cartaoDetalheId = null; renderCartoes(content); });
    document.getElementById('btn-nova-compra').addEventListener('click', () => openCompraForm(null, cartao, content));
    U.qsa('[data-compra-edit]', content).forEach(b => b.addEventListener('click', () => {
      const compra = cartao.compras.find(x => x.id === b.getAttribute('data-compra-edit'));
      openCompraForm(compra, cartao, content);
    }));
    U.qsa('[data-assin-edit]', content).forEach(b => b.addEventListener('click', () => {
      const assinatura = window.FinanceiroDB.get().assinaturas.find(x => x.id === b.getAttribute('data-assin-edit'));
      openAssinaturaForm(assinatura, content, () => renderFaturaDetail(content));
    }));
    U.qsa('[data-antecipar]', content).forEach(b => b.addEventListener('click', () => {
      const compraId = b.getAttribute('data-antecipar');
      window.UI.confirmDialog('Antecipar todas as parcelas restantes desta compra? Elas serão marcadas como pagas e o limite será liberado imediatamente.', () => {

  /* ================================ RESERVAS / CAIXINHAS ================================ */
  function taxaAnualEfetiva(reserva) {
    const s = window.FinanceiroDB.get();
    if (reserva.taxaTipo === 'personalizada') return Number(reserva.taxaPersonalizadaAnual) || 0;
    return (Number(s.cdiAnual) || 0) * (Number(reserva.taxaCdiPercentual) || 0) / 100;
  }

  function calcularReserva(reserva) {
    const taxaAnual = taxaAnualEfetiva(reserva);
    const taxaDiaria = Math.pow(1 + taxaAnual / 100, 1 / 365) - 1;
    const movs = (reserva.movimentacoes || []).slice().sort((a, b) => a.data.localeCompare(b.data));
    const totalAportado = movs.filter(m => m.tipo === 'aporte').reduce((s2, m) => s2 + (Number(m.valor) || 0), 0);
    const totalResgatado = movs.filter(m => m.tipo === 'resgate').reduce((s2, m) => s2 + (Number(m.valor) || 0), 0);
    const totalInvestido = totalAportado - totalResgatado;
    const meta = Number(reserva.meta) || 0;

    if (!movs.length) {
      return {
        valorAtual: 0, totalInvestido: 0, totalRendimento: 0, rendimentoDiario: 0, rendimentoMensal: 0,
        taxaAnual, percentualMeta: 0, faltante: meta, evolucao: [],
      };
    }

    let saldo = 0;
    const hoje = U.todayISO();
    const evolucao = [];
    let dCursor = new Date(movs[0].data + 'T00:00:00');
    const dFim = new Date(hoje + 'T00:00:00');
    let movIdx = 0;
    let lastSampleMonth = null;
    let salvaguarda = 0;
    while (dCursor <= dFim && salvaguarda < 20000) {
      salvaguarda++;
      const iso = dCursor.toISOString().slice(0, 10);
      while (movIdx < movs.length && movs[movIdx].data === iso) {
        saldo += movs[movIdx].tipo === 'aporte' ? (Number(movs[movIdx].valor) || 0) : -(Number(movs[movIdx].valor) || 0);
        movIdx++;
      }
      const mesAtual = iso.slice(0, 7);
      if (mesAtual !== lastSampleMonth) { evolucao.push({ data: iso, valor: Math.round(saldo * 100) / 100 }); lastSampleMonth = mesAtual; }
      saldo *= (1 + taxaDiaria);
      dCursor.setDate(dCursor.getDate() + 1);
    }
    saldo = Math.round(saldo * 100) / 100;
    if (!evolucao.length || evolucao[evolucao.length - 1].data !== hoje) evolucao.push({ data: hoje, valor: saldo });

    const totalRendimento = Math.round((saldo - totalInvestido) * 100) / 100;
    const rendimentoDiario = Math.round(saldo * taxaDiaria * 100) / 100;
    const rendimentoMensal = Math.round((saldo * (Math.pow(1 + taxaDiaria, 30) - 1)) * 100) / 100;
    const percentualMeta = meta > 0 ? Math.min(999, (saldo / meta) * 100) : 0;
    const faltante = Math.max(0, meta - saldo);

    return { valorAtual: saldo, totalInvestido, totalRendimento, rendimentoDiario, rendimentoMensal, taxaAnual, percentualMeta, faltante, evolucao };
  }

  /* ================================ SIMULADOR FINANCEIRO ================================ */
  // Executa calcularProjecao12Meses() sobre uma cópia isolada dos dados (nunca toca nos dados reais).
  function simularCenario(mutatorFn) {
    const originalGet = window.FinanceiroDB.get;
    const clone = JSON.parse(JSON.stringify(originalGet()));
    mutatorFn(clone);
    window.FinanceiroDB.get = () => clone;
    let resultado;
    try {
      resultado = calcularProjecao12Meses();
    } finally {
      window.FinanceiroDB.get = originalGet;
    }
    return resultado;
  }

  const CENARIOS = [
    { key: 'compra', icon: 'shopping-bag', titulo: 'Comprar algo', desc: 'Simule uma compra à vista ou parcelada em um cartão.' },
    { key: 'cancelar-assin', icon: 'x-circle', titulo: 'Cancelar uma assinatura', desc: 'Veja quanto você liberaria cancelando uma assinatura ativa.' },
    { key: 'nova-despesa', icon: 'arrow-up-circle', titulo: 'Criar uma nova despesa', desc: 'Uma conta nova, única ou recorrente.' },
    { key: 'quitar', icon: 'check-circle-2', titulo: 'Quitar um parcelamento', desc: 'Simule antecipar todas as parcelas restantes de uma compra.' },
    { key: 'nova-renda', icon: 'arrow-down-circle', titulo: 'Adicionar uma nova renda', desc: 'Uma nova entrada, única ou recorrente.' },
  ];

  let simulacaoAtual = null; // { cenario, mutator, baseline, simulado, resumoLabel }

  function renderSimulacoes(content) {
    content.innerHTML = `
      <p class="text-muted" style="font-size:13px; line-height:1.6; margin-bottom:18px; max-width:640px;">
        Teste decisões financeiras antes de tomá-las de verdade. Escolha uma situação, veja como ela mudaria os próximos 12 meses,
        e só aplique aos seus dados reais se quiser.
      </p>
      <div class="item-grid" id="cenarios-grid" style="margin-bottom:24px;"></div>
      <div id="simulacao-resultado"></div>
    `;
    document.getElementById('cenarios-grid').innerHTML = CENARIOS.map(c => `
      <div class="card" data-cenario="${c.key}" style="cursor:pointer;">
        <div class="item-card-top">
          <div class="reserva-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="${c.icon}"></i></div>
        </div>
        <div class="item-card-title" style="margin-top:10px;">${c.titulo}</div>
        <div class="text-muted" style="font-size:11.5px; margin-top:4px; line-height:1.4;">${c.desc}</div>
      </div>
    `).join('');
    U.lucide();
    U.qsa('[data-cenario]', content).forEach(el => el.addEventListener('click', () => openCenarioForm(el.getAttribute('data-cenario'), content)));

    if (simulacaoAtual) renderResultadoSimulacao(content);
  }

  function openCenarioForm(cenarioKey, content) {
    const s = window.FinanceiroDB.get();
    const cartoesAtivos = s.cartoes.filter(c => !c.arquivado);

    let bodyHtml = '';
    if (cenarioKey === 'compra') {
      bodyHtml = `
        <div class="form-grid">
          <div class="field span-2"><label>Descrição</label><input id="sim-desc" placeholder="Ex: Notebook"></div>
          <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="sim-valor"></div>
          <div class="field"><label>Cartão</label><select id="sim-cartao">${cartoesAtivos.map(c => `<option value="${c.id}">${U.escapeHtml(c.nome)}</option>`).join('')}</select></div>
          <div class="field"><label>Data da compra</label><input type="date" id="sim-data" value="${U.todayISO()}"></div>
          <div class="field"><label>Pagamento</label><select id="sim-parcelado"><option value="0">À vista</option><option value="1">Parcelado</option></select></div>
          <div class="field" id="sim-qtd-field" style="display:none;"><label>Quantidade de parcelas</label><input type="number" min="2" id="sim-qtd" value="2"></div>
        </div>
      `;
    } else if (cenarioKey === 'cancelar-assin') {
      const ativas = s.assinaturas.filter(a => a.status === 'ativa');
      bodyHtml = ativas.length
        ? `<div class="field"><label>Assinatura</label><select id="sim-assin">${ativas.map(a => `<option value="${a.id}">${U.escapeHtml(a.nome)} — ${formatBRL(a.valor)}</option>`).join('')}</select></div>`
        : `<p class="text-faint">Nenhuma assinatura ativa para simular cancelamento.</p>`;
    } else if (cenarioKey === 'nova-despesa' || cenarioKey === 'nova-renda') {
      const isDespesa = cenarioKey === 'nova-despesa';
      bodyHtml = `
        <div class="form-grid">
          <div class="field span-2"><label>Nome</label><input id="sim-nome" placeholder="${isDespesa ? 'Ex: Plano de saúde' : 'Ex: Freelance'}"></div>
          <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="sim-valor"></div>
          <div class="field"><label>Mês inicial</label><input type="month" id="sim-competencia" value="${financeiroMes}"></div>
          <div class="field">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-top:22px;">
              <input type="checkbox" id="sim-recorrente"> Recorrente (todo mês)
            </label>
          </div>
        </div>
      `;
    } else if (cenarioKey === 'quitar') {
      const comprasComParcelasPendentes = [];
      cartoesAtivos.forEach(cartao => (cartao.compras || []).forEach(compra => {
        if (compra.cancelada) return;
        const pendentes = (compra.parcelas || []).filter(p => !p.paga);
        if (pendentes.length) comprasComParcelasPendentes.push({ cartao, compra, pendentes });
      }));
      bodyHtml = comprasComParcelasPendentes.length
        ? `<div class="field"><label>Compra parcelada</label><select id="sim-compra">${comprasComParcelasPendentes.map(x => `<option value="${x.cartao.id}::${x.compra.id}">${U.escapeHtml(x.compra.descricao)} (${x.cartao.nome}) — ${x.pendentes.length} parcela(s) restantes</option>`).join('')}</select></div>`
        : `<p class="text-faint">Nenhuma compra com parcelas pendentes para simular quitação.</p>`;
    }

    window.UI.openModal({
      title: CENARIOS.find(c => c.key === cenarioKey).titulo,
      bodyHtml,
      footerHtml: `<button class="btn btn-ghost" id="sim-cancel">Cancelar</button><button class="btn mod-btn-primary" id="sim-run"><i data-lucide="flask-conical"></i> Simular</button>`,
      onMount: (overlay) => {
        const parceladoSel = overlay.querySelector('#sim-parcelado');
        if (parceladoSel) parceladoSel.addEventListener('change', (e) => {
          overlay.querySelector('#sim-qtd-field').style.display = e.target.value === '1' ? '' : 'none';
        });
        overlay.querySelector('#sim-cancel').addEventListener('click', window.UI.closeModal);
        const runBtn = overlay.querySelector('#sim-run');
        if (!runBtn) return;
        runBtn.addEventListener('click', () => {
          const built = construirCenario(cenarioKey, overlay);
          if (!built) return;
          window.UI.closeModal();
          const baseline = calcularProjecao12Meses();
          const simulado = simularCenario(built.mutator);
          simulacaoAtual = { cenario: cenarioKey, mutator: built.mutator, baseline, simulado, resumoLabel: built.resumoLabel };
          renderResultadoSimulacao(content);
        });
      }
    });
  }

  function construirCenario(cenarioKey, overlay) {
    if (cenarioKey === 'compra') {
      const desc = overlay.querySelector('#sim-desc').value.trim() || 'Compra simulada';
      const valor = parseFloat(overlay.querySelector('#sim-valor').value) || 0;
      const cartaoId = overlay.querySelector('#sim-cartao').value;
      const dataCompra = overlay.querySelector('#sim-data').value || U.todayISO();
      const parcelado = overlay.querySelector('#sim-parcelado').value === '1';
      const qtd = parcelado ? Math.max(2, parseInt(overlay.querySelector('#sim-qtd').value, 10) || 2) : 1;
      if (!valor || !cartaoId) { window.UI.toast('Preencha o valor e escolha um cartão.', 'default'); return null; }
      return {
        resumoLabel: `Compra: ${desc} — ${formatBRL(valor)}${parcelado ? ` em ${qtd}x` : ' à vista'}`,
        mutator: (state) => {
          const cartao = state.cartoes.find(c => c.id === cartaoId);
          if (!cartao) return;
          const payload = { descricao: desc, categoriaId: categorias()[0].id, valor, dataCompra, parcelado, quantidadeParcelas: qtd, cancelada: false };
          const parcelas = gerarParcelas(payload, cartao);
          cartao.compras = cartao.compras || [];
          cartao.compras.push(Object.assign({ id: U.uid('compra'), parcelas }, payload));
        },
      };
    }
    if (cenarioKey === 'cancelar-assin') {
      const sel = overlay.querySelector('#sim-assin');
      if (!sel) return null;
      const assinId = sel.value;
      const nome = sel.options[sel.selectedIndex].text;
      return {
        resumoLabel: `Cancelar: ${nome}`,
        mutator: (state) => {
          const a = state.assinaturas.find(x => x.id === assinId);
          if (a) { a.status = 'cancelada'; a.dataCancelamento = U.todayISO(); }
        },
      };
    }
    if (cenarioKey === 'nova-despesa' || cenarioKey === 'nova-renda') {
      const nome = overlay.querySelector('#sim-nome').value.trim() || (cenarioKey === 'nova-despesa' ? 'Nova despesa' : 'Nova renda');
      const valor = parseFloat(overlay.querySelector('#sim-valor').value) || 0;
      const competencia = overlay.querySelector('#sim-competencia').value || financeiroMes;
      const recorrente = overlay.querySelector('#sim-recorrente').checked;
      const tipo = cenarioKey === 'nova-despesa' ? 'saida' : 'entrada';
      if (!valor) { window.UI.toast('Informe um valor.', 'default'); return null; }
      return {
        resumoLabel: `${cenarioKey === 'nova-despesa' ? 'Nova despesa' : 'Nova renda'}: ${nome} — ${formatBRL(valor)}${recorrente ? '/mês' : ''}`,
        mutator: (state) => {
          const catId = (state.categorias[0] || {}).id;
          if (recorrente) {
            const recId = U.uid('rec');
            state.recorrencias = state.recorrencias || [];
            state.recorrencias.push({ id: recId, nome, categoriaId: catId, tipo, valor, diaVencimento: 10, status: 'ativa', criadoEm: competencia });
          } else {
            state.contas.push({ id: U.uid('conta'), nome, categoriaId: catId, tipo, valor, diaVencimento: 10, competencia, status: 'pendente', observacoes: '', recorrenciaId: null });
          }
        },
      };
    }
    if (cenarioKey === 'quitar') {
      const sel = overlay.querySelector('#sim-compra');
      if (!sel) return null;
      const [cartaoId, compraId] = sel.value.split('::');
      const nome = sel.options[sel.selectedIndex].text;
      return {
        resumoLabel: `Quitar: ${nome}`,
        mutator: (state) => {
          const cartao = state.cartoes.find(c => c.id === cartaoId);
          const compra = cartao && cartao.compras.find(c => c.id === compraId);
          if (compra) compra.parcelas.forEach(p => { if (!p.paga) { p.paga = true; p.dataPagamento = U.todayISO(); } });
        },
      };
    }
    return null;
  }

  function renderResultadoSimulacao(content) {
    const box = document.getElementById('simulacao-resultado');
    if (!box || !simulacaoAtual) return;
    const { baseline, simulado, resumoLabel } = simulacaoAtual;

    const impactoUltimoMes = simulado[11].saldoPrevisto - baseline[11].saldoPrevisto;
    const impactoTotal12Meses = simulado.reduce((sum, m, i) => sum + (m.disponivel - baseline[i].disponivel), 0);

    box.innerHTML = `
      <div class="card" style="margin-bottom:18px; border-left:3px solid ${ACCENT};">
        <div class="dg-section-title" style="margin-bottom:4px;"><i data-lucide="flask-conical"></i> Simulação: ${U.escapeHtml(resumoLabel)}</div>
        <p class="text-muted" style="font-size:12.5px; line-height:1.6;">
          Isso ${impactoTotal12Meses < 0 ? 'reduziria' : 'aumentaria'} sua sobra em <strong>${formatBRL(Math.abs(impactoTotal12Meses))}</strong> somando os próximos 12 meses,
          e o saldo previsto acumulado em ${MESES_LONGOS[Number(simulado[11].mesKey.split('-')[1]) - 1]} de ${simulado[11].mesKey.split('-')[0]}
          ${impactoUltimoMes < 0 ? 'cairia' : 'subiria'} <strong>${formatBRL(Math.abs(impactoUltimoMes))}</strong> (de ${formatBRL(baseline[11].saldoPrevisto)} para ${formatBRL(simulado[11].saldoPrevisto)}).
        </p>
        <canvas id="sim-chart" height="130" style="margin-top:14px;"></canvas>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Mês</th><th>Disponível hoje</th><th>Disponível simulado</th><th>Diferença</th></tr></thead>
          <tbody>
            ${simulado.map((m, i) => {
              const diff = m.disponivel - baseline[i].disponivel;
              const [ano, mesNum] = m.mesKey.split('-');
              return `<tr>
                <td style="font-weight:700;">${MESES_LONGOS[Number(mesNum) - 1]} ${ano}</td>
                <td>${formatBRL(baseline[i].disponivel)}</td>
                <td>${formatBRL(m.disponivel)}</td>
                <td style="font-weight:700; color:${diff < 0 ? '#EF4444' : diff > 0 ? '#22C55E' : 'var(--text-faint)'};">${diff === 0 ? '—' : (diff > 0 ? '+' : '') + formatBRL(diff)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex; gap:8px; margin-top:18px;">
        <button class="btn btn-soft btn-sm" id="btn-descartar-sim"><i data-lucide="x"></i> Descartar simulação</button>
        <button class="btn mod-btn-primary btn-sm" id="btn-aplicar-sim"><i data-lucide="check"></i> Aplicar aos meus dados reais</button>
      </div>
    `;
    U.lucide();

    if (window.Chart) {
      if (window.__simChart) window.__simChart.destroy();
      const ctx = document.getElementById('sim-chart').getContext('2d');
      window.__simChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: simulado.map(m => MESES_LONGOS[Number(m.mesKey.split('-')[1]) - 1].slice(0, 3)),
          datasets: [
            { label: 'Hoje', data: baseline.map(m => m.saldoPrevisto), borderColor: '#8B94A7', backgroundColor: 'transparent', tension: 0.3 },
            { label: 'Simulado', data: simulado.map(m => m.saldoPrevisto), borderColor: ACCENT, backgroundColor: ACCENT + '22', fill: true, tension: 0.3 },
          ],
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#8B94A7', font: { size: 11 } } } }, scales: { x: { ticks: { color: '#8B94A7', font: { size: 10 } } }, y: { ticks: { color: '#8B94A7', font: { size: 10 } } } } },
      });
    }

    document.getElementById('btn-descartar-sim').addEventListener('click', () => {
      simulacaoAtual = null;
      box.innerHTML = '';
      window.UI.toast('Simulação descartada. Nada foi alterado.', 'default');
    });
    document.getElementById('btn-aplicar-sim').addEventListener('click', () => {
      window.UI.confirmDialog('Aplicar esta simulação aos seus dados reais? Isso vai criar/alterar registros de verdade no Financeiro.', () => {
        window.FinanceiroDB.save(simulacaoAtual.mutator);
        window.UI.toast('Aplicado aos seus dados reais.', 'success');
        simulacaoAtual = null;
        renderSimulacoes(content);
      });
    });
  }

  function openCategoriaManager(content, refreshFn) {
    function bodyHtml() {
      return `
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
          ${categorias().map(c => `
            <div style="display:flex; align-items:center; gap:8px;" data-cat-row="${c.id}">
              <span style="width:12px; height:12px; border-radius:50%; background:${c.cor}; flex-shrink:0;"></span>
              <input class="cat-name-input" data-cat-id="${c.id}" value="${U.escapeHtml(c.nome)}" style="flex:1;">
              <button class="icon-btn" data-cat-del="${c.id}"><i data-lucide="trash-2"></i></button>
            </div>
          `).join('')}
        </div>
        <div class="checklist-add">
          <input id="new-cat-name" placeholder="Nova categoria..." style="flex:1;">
          <button class="btn btn-soft btn-sm" id="btn-add-cat">Adicionar</button>
        </div>
      `;
    }
    window.UI.openModal({
      title: 'Gerenciar categorias',
      bodyHtml: bodyHtml(),
      footerHtml: `<button class="btn mod-btn-primary" id="cats-done">Concluído</button>`,
      onMount: (overlay) => {
        function bindRows() {
          U.qsa('.cat-name-input', overlay).forEach(inp => inp.addEventListener('change', () => {
            window.FinanceiroDB.save(s => { const c = s.categorias.find(x => x.id === inp.getAttribute('data-cat-id')); if (c) c.nome = inp.value.trim() || c.nome; });
            window.UI.toast('Categoria atualizada.', 'success');
          }));
          U.qsa('[data-cat-del]', overlay).forEach(btn => btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-cat-del');
            if (categorias().length <= 1) { window.UI.toast('Mantenha ao menos uma categoria.', 'default'); return; }
            window.UI.confirmDialog('Remover esta categoria? Itens vinculados serão movidos para a primeira categoria disponível.', () => {
              window.FinanceiroDB.save(s => {
                const fallback = s.categorias.find(x => x.id !== id);
                s.contas.forEach(c => { if (c.categoriaId === id) c.categoriaId = fallback.id; });
                s.assinaturas.forEach(a => { if (a.categoriaId === id) a.categoriaId = fallback.id; });
                s.cartoes.forEach(card => (card.compras || []).forEach(p => { if (p.categoriaId === id) p.categoriaId = fallback.id; }));
                s.categorias = s.categorias.filter(x => x.id !== id);
              });
              overlay.querySelector('.modal-body').innerHTML = bodyHtml();
              bindRows();
              U.lucide();
              window.UI.toast('Categoria removida.', 'success');
            });
          }));
        }
        bindRows();
        overlay.querySelector('#btn-add-cat').addEventListener('click', () => {
          const input = overlay.querySelector('#new-cat-name');
          const name = input.value.trim();
          if (!name) return;
          window.FinanceiroDB.save(s => {
            const color = CAT_PALETTE[s.categorias.length % CAT_PALETTE.length];
            s.categorias.push({ id: U.uid('fcat'), nome: name, cor: color });
          });
          overlay.querySelector('.modal-body').innerHTML = bodyHtml();
          bindRows();
          U.lucide();
        });
        overlay.querySelector('#cats-done').addEventListener('click', () => {
          window.UI.closeModal();
          if (refreshFn) refreshFn(content);
        });
      }
    });
  }

  return { mount, totaisDoMes, proximoVencimento, proximaCobrancaDe, calcularProjecao12Meses };
})();

      const o = window.PessoalDB.get().objetivos.find(x => x.id === el.getAttribute('data-open-obj'));
      openObjetivoForm(o, content);

  function objetivoCard(o) {
    const meta = PRAZO_META[o.prazo] || PRAZO_META.curto;
    return `

        <div class="item-card-top">

              <div class="item-card-title" style="${o.feito ? 'text-decoration:line-through; color:var(--text-faint);' : ''}">${U.escapeHtml(o.titulo)}</div>
              ${o.dataAlvo ? `<div class="item-card-meta" style="margin-top:4px;"><i data-lucide="calendar" style="width:12px;height:12px;"></i> ${U.formatDateBR(o.dataAlvo)}</div>` : ''}

          <span class="status-pill" style="background:${meta.color}22; color:${meta.color};">${meta.label}</span>

        overlay.querySelector('#f-save').addEventListener('click', () => {
          const payload = {
            titulo: overlay.querySelector('#f-titulo').value.trim() || 'Objetivo sem título',
            prazo: overlay.querySelector('#f-prazo').value,
            dataAlvo: overlay.querySelector('#f-data').value,
            descricao: overlay.querySelector('#f-desc').value,
            observacoes: overlay.querySelector('#f-obs').value,
            feito: o.feito || false,
          };
          window.PessoalDB.save(s => {
            if (isEdit) Object.assign(s.objetivos.find(x => x.id === o.id), payload);
            else s.objetivos.push(Object.assign({ id: U.uid('obj') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Objetivo salvo.', 'success');
          renderObjetivos(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog('Remover este objetivo?', () => {
            window.PessoalDB.save(s => { s.objetivos = s.objetivos.filter(x => x.id !== o.id); });

            renderObjetivos(content);
          });

  /* ================================ WISHLIST ================================ */
  let wishlistCatFilter = 'todas';

  function wcats() { return window.PessoalDB.get().wishlistCategorias; }
  function wcatById(id) { return wcats().find(c => c.id === id) || { nome: 'Outros', cor: '#64748B' }; }

  function renderWishlist(content) {
    const s = window.PessoalDB.get();
    const list = s.wishlist.filter(w => wishlistCatFilter === 'todas' || w.categoriaId === wishlistCatFilter);

    content.innerHTML = `
      <div class="filter-bar">
        <button class="filter-chip ${wishlistCatFilter === 'todas' ? 'mod-chip-active' : ''}" data-cat="todas">Todas</button>
        ${wcats().map(c => `<button class="filter-chip ${wishlistCatFilter === c.id ? 'mod-chip-active' : ''}" data-cat="${c.id}">${U.escapeHtml(c.nome)}</button>`).join('')}
        <button class="icon-btn" id="btn-manage-wcats" title="Gerenciar categorias"><i data-lucide="settings-2"></i></button>
        <div style="flex:1;"></div>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-wish"><i data-lucide="plus"></i> Novo desejo</button>
      </div>
      <div id="wish-list"></div>
    `;
    U.lucide();

    document.getElementById('wish-list').innerHTML = list.length
      ? `<div class="item-grid">` + list.map(w => wishlistCard(w)).join('') + `</div>`
      : window.UI.emptyState('gift', 'Sua wishlist está vazia', 'Adicione algo que você deseja comprar ou ganhar.');

    U.lucide();
    U.qsa('[data-cat]', content).forEach(b => b.addEventListener('click', () => { wishlistCatFilter = b.getAttribute('data-cat'); renderWishlist(content); }));
    document.getElementById('btn-manage-wcats').addEventListener('click', () => openWishlistCatManager(content));
    document.getElementById('btn-add-wish').addEventListener('click', () => openWishForm(null, content));
    U.qsa('[data-toggle-wish]', content).forEach(cb => cb.addEventListener('change', (e) => {
      e.stopPropagation();
      window.PessoalDB.save(s2 => { s2.wishlist.find(x => x.id === cb.getAttribute('data-toggle-wish')).comprado = cb.checked; });
      renderWishlist(content);
    }));
    U.qsa('[data-open-wish]', content).forEach(el => el.addEventListener('click', (e) => {
      if (e.target.closest('[data-toggle-wish]')) return;
      const w = window.PessoalDB.get().wishlist.find(x => x.id === el.getAttribute('data-open-wish'));
      openWishForm(w, content);

  function wishlistCard(w) {
    const cat = wcatById(w.categoriaId);
    const prioMeta = { baixa: { label: 'Baixa', color: '#64748B' }, media: { label: 'Média', color: '#F59E0B' }, alta: { label: 'Alta', color: '#EF4444' } }[w.prioridade] || { label: 'Média', color: '#F59E0B' };
    return `
      <div class="card" data-open-wish="${w.id}" style="cursor:pointer; ${w.comprado ? 'opacity:.6;' : ''}">

            <input type="checkbox" data-toggle-wish="${w.id}" ${w.comprado ? 'checked' : ''} style="margin-top:3px;" title="Marcar como comprado">
            <div>
              <div class="item-card-title" style="${w.comprado ? 'text-decoration:line-through;' : ''}">${U.escapeHtml(w.nome)}</div>
              <div class="item-card-meta" style="margin-top:4px;"><span style="width:7px; height:7px; border-radius:50%; background:${cat.cor}; display:inline-block;"></span> ${U.escapeHtml(cat.nome)}</div>
            </div>
          </div>
          <span class="status-pill" style="background:${prioMeta.color}22; color:${prioMeta.color};">${prioMeta.label}</span>

        ${w.link ? `<div class="item-card-meta" style="margin-top:6px;"><i data-lucide="link" style="width:12px;height:12px;"></i> ${U.escapeHtml(w.link)}</div>` : ''}
      </div>

  function openWishlistCatManager(content) {
    function bodyHtml() {
      return `
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
          ${wcats().map(c => `
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:12px; height:12px; border-radius:50%; background:${c.cor}; flex-shrink:0;"></span>
              <input class="wc-name-input" data-cat-id="${c.id}" value="${U.escapeHtml(c.nome)}" style="flex:1;">
              <button class="icon-btn" data-cat-del="${c.id}"><i data-lucide="trash-2"></i></button>
            </div>
          `).join('')}
        </div>
        <div class="checklist-add"><input id="new-wcat-name" placeholder="Nova categoria..." style="flex:1;"><button class="btn btn-soft btn-sm" id="btn-add-wcat">Adicionar</button></div>
      `;
    }
    window.UI.openModal({
      title: 'Gerenciar categorias da wishlist',
      bodyHtml: bodyHtml(),
      footerHtml: `<button class="btn mod-btn-primary" id="wcats-done">Concluído</button>`,
      onMount: (overlay) => {
        function bindRows() {
          U.qsa('.wc-name-input', overlay).forEach(inp => inp.addEventListener('change', () => {
            window.PessoalDB.save(s => { const c = s.wishlistCategorias.find(x => x.id === inp.getAttribute('data-cat-id')); if (c) c.nome = inp.value.trim() || c.nome; });
          }));
          U.qsa('[data-cat-del]', overlay).forEach(btn => btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-cat-del');
            if (wcats().length <= 1) { window.UI.toast('Mantenha ao menos uma categoria.', 'default'); return; }
            window.UI.confirmDialog('Remover esta categoria? Itens nela irão para a primeira categoria disponível.', () => {
              window.PessoalDB.save(s => {
                const fallback = s.wishlistCategorias.find(x => x.id !== id);
                s.wishlist.forEach(w => { if (w.categoriaId === id) w.categoriaId = fallback.id; });
                s.wishlistCategorias = s.wishlistCategorias.filter(x => x.id !== id);
              });
              if (wishlistCatFilter === id) wishlistCatFilter = 'todas';
              overlay.querySelector('.modal-body').innerHTML = bodyHtml();
              bindRows(); U.lucide();
            });
          }));
        }
        bindRows();
        overlay.querySelector('#btn-add-wcat').addEventListener('click', () => {
          const input = overlay.querySelector('#new-wcat-name');
          if (!input.value.trim()) return;
          window.PessoalDB.save(s => { s.wishlistCategorias.push({ id: U.uid('wcat'), nome: input.value.trim(), cor: CAT_PALETTE[s.wishlistCategorias.length % CAT_PALETTE.length] }); });
          overlay.querySelector('.modal-body').innerHTML = bodyHtml();
          bindRows(); U.lucide();
        });
        overlay.querySelector('#wcats-done').addEventListener('click', () => { window.UI.closeModal(); renderWishlist(content); });
      }
    });
  }

  /* ================================ LIVROS ================================ */
  const LIVRO_STATUS = {
    'quero-ler': { label: 'Quero ler', color: '#64748B' },
    lendo: { label: 'Lendo', color: '#3B82F6' },
    finalizado: { label: 'Finalizado', color: '#22C55E' },
    releitura: { label: 'Releitura', color: '#8B5CF6' },
  };
  const FORMATOS = [
    { key: 'fisico-comum', label: 'Físico (comum)', icon: 'book' },
    { key: 'fisico-capa-dura', label: 'Físico (capa dura)', icon: 'gem' },
    { key: 'epub', label: 'E-book / EPUB', icon: 'tablet' },
    { key: 'kindle-unlimited', label: 'Kindle Unlimited', icon: 'infinity' },
  ];
  const FISICO_KEYS = ['fisico-comum', 'fisico-capa-dura'];
  const SPINE_PALETTE = ['#7C2D12', '#1E3A8A', '#166534', '#7E22CE', '#B91C3C', '#0F766E', '#92400E', '#3730A3', '#831843', '#374151', '#065F46', '#9D174D'];
  let livrosFilter = 'todos';
  let livrosView = 'lista'; // lista | ano | estante
  let livrosAnoFilter = 'todos'; // todos | finalizado | releitura

  function formatoMeta(key) { return FORMATOS.find(f => f.key === key); }

  function renderLivros(content) {
    const s = window.PessoalDB.get();
    const countBy = (pred) => s.livros.filter(pred).length;
    const cQueroLer = countBy(l => l.status === 'quero-ler');
    const cLendo = countBy(l => l.status === 'lendo');
    const cFinalizado = countBy(l => l.status === 'finalizado');
    const cReleitura = countBy(l => l.status === 'releitura');
    const cTodos = s.livros.length;

    content.innerHTML = `
      <div class="filter-bar">
        <div class="module-tabs" style="padding:3px;">
          <button class="module-tab ${livrosView === 'lista' ? 'active' : ''}" data-view="lista" style="${livrosView === 'lista' ? `background:${ACCENT};` : ''}"><i data-lucide="list"></i><span>Lista de leitura</span></button>
          <button class="module-tab ${livrosView === 'ano' ? 'active' : ''}" data-view="ano" style="${livrosView === 'ano' ? `background:${ACCENT};` : ''}"><i data-lucide="calendar-range"></i><span>Por ano</span></button>
          <button class="module-tab ${livrosView === 'estante' ? 'active' : ''}" data-view="estante" style="${livrosView === 'estante' ? `background:${ACCENT};` : ''}"><i data-lucide="library"></i><span>Minha estante</span></button>
        </div>
        ${livrosView === 'lista' ? `
          <button class="filter-chip ${livrosFilter === 'todos' ? 'mod-chip-active' : ''}" data-f="todos">Todos <span class="chip-count">${cTodos}</span></button>
          <button class="filter-chip ${livrosFilter === 'quero-ler' ? 'mod-chip-active' : ''}" data-f="quero-ler">Quero ler <span class="chip-count">${cQueroLer}</span></button>
          <button class="filter-chip ${livrosFilter === 'lendo' ? 'mod-chip-active' : ''}" data-f="lendo">Lendo <span class="chip-count">${cLendo}</span></button>
          <button class="filter-chip ${livrosFilter === 'finalizado' ? 'mod-chip-active' : ''}" data-f="finalizado">Finalizados <span class="chip-count">${cFinalizado}</span></button>
          <button class="filter-chip ${livrosFilter === 'releitura' ? 'mod-chip-active' : ''}" data-f="releitura">Releituras <span class="chip-count">${cReleitura}</span></button>
        ` : ''}
        ${livrosView === 'ano' ? `
          <button class="filter-chip ${livrosAnoFilter === 'todos' ? 'mod-chip-active' : ''}" data-fa="todos">Lidos + releituras <span class="chip-count">${cFinalizado + cReleitura}</span></button>
          <button class="filter-chip ${livrosAnoFilter === 'finalizado' ? 'mod-chip-active' : ''}" data-fa="finalizado">Só os lidos <span class="chip-count">${cFinalizado}</span></button>
          <button class="filter-chip ${livrosAnoFilter === 'releitura' ? 'mod-chip-active' : ''}" data-fa="releitura">Só as releituras <span class="chip-count">${cReleitura}</span></button>
        ` : ''}
        <div style="flex:1;"></div>
        <button class="btn mod-btn-primary btn-sm" id="btn-add-livro"><i data-lucide="plus"></i> Novo livro</button>
      </div>
      <div id="livros-list"></div>
    `;
    U.lucide();

    U.qsa('[data-view]', content).forEach(b => b.addEventListener('click', () => { livrosView = b.getAttribute('data-view'); renderLivros(content); }));
    document.getElementById('btn-add-livro').addEventListener('click', () => openLivroForm(null, content));

    if (livrosView === 'estante') {
      renderEstante(content, s);
    } else if (livrosView === 'ano') {
      renderPorAno(content, s);
      U.qsa('[data-fa]', content).forEach(b => b.addEventListener('click', () => { livrosAnoFilter = b.getAttribute('data-fa'); renderLivros(content); }));
    } else {
      const list = s.livros.filter(l => livrosFilter === 'todos' || l.status === livrosFilter);
      document.getElementById('livros-list').innerHTML = list.length
        ? `<div class="item-grid">` + list.map(l => livroCard(l)).join('') + `</div>`
        : window.UI.emptyState('book-open', 'Nenhum livro cadastrado', 'Adicione livros que você quer ler, está lendo, já leu ou está relendo.');
      U.lucide();
      U.qsa('[data-f]', content).forEach(b => b.addEventListener('click', () => { livrosFilter = b.getAttribute('data-f'); renderLivros(content); }));
      U.qsa('[data-open-livro]', content).forEach(el => el.addEventListener('click', () => {
        const l = window.PessoalDB.get().livros.find(x => x.id === el.getAttribute('data-open-livro'));
        openLivroForm(l, content);
      }));
    }
  }

  function renderPorAno(content, s) {
    const container = document.getElementById('livros-list');
    let lidos = s.livros.filter(l => l.status === 'finalizado' || l.status === 'releitura');
    if (livrosAnoFilter !== 'todos') lidos = lidos.filter(l => l.status === livrosAnoFilter);

    if (!lidos.length) {
      container.innerHTML = window.UI.emptyState('calendar-range', 'Nada por aqui ainda', 'Livros marcados como Finalizado ou Releitura aparecem agrupados por ano de conclusão.');
      return;
    }

    const groups = {};
    lidos.forEach(l => {
      const dateRef = l.dataTermino || l.dataInicio;
      const year = dateRef ? dateRef.slice(0, 4) : 'Sem data';
      (groups[year] = groups[year] || []).push(l);
    });
    const years = Object.keys(groups).sort((a, b) => {
      if (a === 'Sem data') return 1;
      if (b === 'Sem data') return -1;
      return b.localeCompare(a);
    });

    container.innerHTML = years.map(year => {
      const items = groups[year].sort((a, b) => (b.dataTermino || b.dataInicio || '').localeCompare(a.dataTermino || a.dataInicio || ''));
      const finalizadosCount = items.filter(l => l.status === 'finalizado').length;
      const releiturasCount = items.filter(l => l.status === 'releitura').length;
      return `
        <div class="section">
          <div class="section-title">
            <h3><i data-lucide="calendar-range"></i> ${year}</h3>
            <span class="text-faint" style="font-size:12px;">${items.length} livro${items.length === 1 ? '' : 's'}${releiturasCount ? ` · ${finalizadosCount} lidos, ${releiturasCount} releituras` : ''}</span>
          </div>
          <div class="item-grid">${items.map(l => livroCard(l)).join('')}</div>
        </div>
      `;
    }).join('');
    U.lucide();
    U.qsa('[data-open-livro]', container).forEach(el => el.addEventListener('click', () => {
      const l = window.PessoalDB.get().livros.find(x => x.id === el.getAttribute('data-open-livro'));
      openLivroForm(l, content);
    }));
  }

  function renderEstante(content, s) {
    const possuidos = s.livros.filter(l => (l.formatos || []).some(f => FISICO_KEYS.includes(f)));
    const container = document.getElementById('livros-list');
    if (!possuidos.length) {
      container.innerHTML = window.UI.emptyState('library', 'Sua estante está vazia', 'Marque "Físico (comum)" ou "Físico (capa dura)" nos formatos de um livro para ele aparecer aqui, lido ou não.');
      return;
    }

    // Cada edição física possuída vira sua própria lombada, para contabilizar corretamente
    // livros que você tem tanto na versão comum quanto na capa dura.
    const spines = [];
    possuidos.forEach((l, idx) => {
      const formatos = l.formatos || [];
      if (formatos.includes('fisico-comum')) spines.push({ livro: l, edicao: 'fisico-comum', seed: idx });
      if (formatos.includes('fisico-capa-dura')) spines.push({ livro: l, edicao: 'fisico-capa-dura', seed: idx + 0.5 });
    });

    const totalComum = spines.filter(sp => sp.edicao === 'fisico-comum').length;
    const totalCapaDura = spines.filter(sp => sp.edicao === 'fisico-capa-dura').length;

    const PER_ROW = 10;
    const rows = [];
    for (let i = 0; i < spines.length; i += PER_ROW) rows.push(spines.slice(i, i + PER_ROW));

    container.innerHTML = `
      <div class="dg-cards" style="grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); margin-bottom:20px;">
        <div class="dg-card"><div class="dg-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="library"></i></div><div class="dg-card-label">Total de exemplares</div><div class="dg-card-value">${spines.length}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="book"></i></div><div class="dg-card-label">Edição comum</div><div class="dg-card-value">${totalComum}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:#FBBF2422; color:#FBBF24;"><i data-lucide="gem"></i></div><div class="dg-card-label">Capa dura</div><div class="dg-card-value">${totalCapaDura}</div></div>
        <div class="dg-card"><div class="dg-card-icon" style="background:${ACCENT}22; color:${ACCENT};"><i data-lucide="bookmark"></i></div><div class="dg-card-label">Títulos únicos</div><div class="dg-card-value">${possuidos.length}</div></div>
      </div>
      <div class="shelf-container">` + rows.map(row => `
        <div class="shelf-row">
          ${row.map(sp => bookSpine(sp.livro, sp.seed, sp.edicao)).join('')}
        </div>
        <div class="shelf-plank"></div>
      `).join('') + `</div>
    `;
    U.lucide();

    U.qsa('[data-open-livro]', container).forEach(el => el.addEventListener('click', () => {
      const l = window.PessoalDB.get().livros.find(x => x.id === el.getAttribute('data-open-livro'));
      openLivroForm(l, content);
    }));
  }

  function bookSpine(l, seed, edicao) {
    const color = SPINE_PALETTE[Math.abs((l.titulo || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) + Math.floor(seed)) % SPINE_PALETTE.length];
    const isCapaDura = edicao === 'fisico-capa-dura';
    const height = (isCapaDura ? 138 : 130) + ((l.titulo || '').length % 6) * 9;
    const lido = l.status === 'finalizado' || l.status === 'releitura';
    const outrosFormatos = (l.formatos || []).filter(f => !FISICO_KEYS.includes(f));
    const borderStyle = isCapaDura ? 'box-shadow:2px 0 5px rgba(0,0,0,.22), inset -2px 0 0 rgba(255,255,255,.14), inset 0 0 0 2px rgba(251,191,36,.55);' : '';
    return `
      <div class="book-spine" data-open-livro="${l.id}" title="${U.escapeHtml(l.titulo)}${isCapaDura ? ' (capa dura)' : ' (comum)'}" style="height:${height}px; width:${isCapaDura ? 52 : 46}px; background:linear-gradient(90deg, ${color}, ${color}dd); ${borderStyle}">
        <div class="spine-title">${U.escapeHtml(l.titulo)}</div>
        <div class="spine-badges">
          ${isCapaDura ? `<span class="spine-badge" style="background:rgba(251,191,36,.45);" title="Capa dura"><i data-lucide="gem"></i></span>` : ''}
          ${lido ? `<span class="spine-badge" title="Lido"><i data-lucide="check"></i></span>` : ''}
          ${l.status === 'releitura' ? `<span class="spine-badge" title="Releitura"><i data-lucide="repeat"></i></span>` : ''}
          ${outrosFormatos.map(f => { const m = formatoMeta(f); return m ? `<span class="spine-badge" title="${m.label}"><i data-lucide="${m.icon}"></i></span>` : ''; }).join('')}
        </div>
      </div>
    `;
  }

  function livroCard(l) {
    const meta = LIVRO_STATUS[l.status] || LIVRO_STATUS['quero-ler'];
    const formatos = l.formatos || [];
    const metaBits = [];
    if (l.serie) metaBits.push(U.escapeHtml(l.serie));
    if (l.genero) metaBits.push(U.escapeHtml(l.genero));
    if (l.paginas) metaBits.push(`${l.paginas} pág.`);
    const periodo = l.dataTermino ? U.formatDateBR(l.dataTermino) : (l.dataInicio ? `desde ${U.formatDateBR(l.dataInicio)}` : '');
    return `
      <div class="card" data-open-livro="${l.id}" style="cursor:pointer;">
        <div class="item-card-top">
          <div>
            <div class="item-card-title">${U.escapeHtml(l.titulo)}</div>
            ${l.autor ? `<div class="item-card-meta" style="margin-top:4px;">${U.escapeHtml(l.autor)}</div>` : ''}
          </div>
          <span class="status-pill" style="background:${meta.color}22; color:${meta.color};">${meta.label}</span>
        </div>
        ${metaBits.length ? `<div class="item-card-meta" style="margin-top:6px;">${metaBits.join(' · ')}</div>` : ''}
        ${periodo ? `<div class="item-card-meta" style="margin-top:4px;"><i data-lucide="calendar" style="width:12px;height:12px;"></i> ${periodo}</div>` : ''}
        ${formatos.length ? `<div class="item-card-meta" style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">${formatos.map(f => { const m = formatoMeta(f); return m ? `<span><i data-lucide="${m.icon}" style="width:12px;height:12px;"></i> ${m.label}</span>` : ''; }).join('')}</div>` : ''}
        ${(l.status === 'finalizado' || l.status === 'releitura') ? `<div style="margin-top:10px;">${stars(l.avaliacao || 0)}</div>` : ''}
        ${l.notas ? `<div class="text-muted" style="font-size:12px; margin-top:8px; line-height:1.4;">${U.escapeHtml(l.notas)}</div>` : ''}
      </div>
    `;
  }

  function openLivroForm(livro, content) {
    const isEdit = !!(livro && livro.id);
    const l = livro || { id: null, titulo: '', autor: '', paginas: '', serie: '', genero: '', status: 'quero-ler', avaliacao: 0, notas: '', formatos: [], dataInicio: '', dataTermino: '' };
    const formatosAtuais = new Set(l.formatos || []);
    window.UI.openModal({
      title: isEdit ? 'Editar livro' : 'Novo livro',
      size: 'lg',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Título</label><input id="f-titulo" value="${U.escapeHtml(l.titulo)}"></div>
          <div class="field"><label>Autor(a)</label><input id="f-autor" value="${U.escapeHtml(l.autor || '')}"></div>
          <div class="field"><label>Páginas</label><input type="number" min="0" id="f-paginas" value="${l.paginas || ''}"></div>
          <div class="field"><label>Volume / Série</label><input id="f-serie" value="${U.escapeHtml(l.serie || '')}" placeholder="Ex: Nome da Série: 1/3"></div>
          <div class="field"><label>Gênero</label><input id="f-genero" value="${U.escapeHtml(l.genero || '')}" placeholder="Ex: Romance, Fantasia..."></div>
          <div class="field"><label>Status</label><select id="f-status"><option value="quero-ler" ${l.status === 'quero-ler' ? 'selected' : ''}>Quero ler</option><option value="lendo" ${l.status === 'lendo' ? 'selected' : ''}>Lendo</option><option value="finalizado" ${l.status === 'finalizado' ? 'selected' : ''}>Finalizado</option><option value="releitura" ${l.status === 'releitura' ? 'selected' : ''}>Releitura</option></select></div>
          <div class="field"><label>Data de início</label><input type="date" id="f-inicio" value="${l.dataInicio || ''}"></div>
          <div class="field"><label>Data de término</label><input type="date" id="f-termino" value="${l.dataTermino || ''}"></div>
          <div class="field"><label>Avaliação (0 a 5)</label><input type="number" min="0" max="5" id="f-nota" value="${l.avaliacao || 0}"></div>
          <div class="field span-2">
            <label>Formatos que você possui / leu</label>
            <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">
              ${FORMATOS.map(f => `
                <label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; cursor:pointer;">
                  <input type="checkbox" class="f-formato" value="${f.key}" ${formatosAtuais.has(f.key) ? 'checked' : ''}>
                  <i data-lucide="${f.icon}" style="width:15px;height:15px; color:var(--text-muted);"></i> ${f.label}
                </label>
              `).join('')}
            </div>
            <p class="text-faint" style="font-size:11.5px; margin-top:6px;">Marcar qualquer opção "Físico" adiciona o livro à sua estante — lido ou não. Se você tem as duas edições, marque ambas: elas aparecem como duas lombadas separadas.</p>
          </div>
          <div class="field span-2"><label>Notas</label><textarea id="f-notas">${U.escapeHtml(l.notas || '')}</textarea></div>
        </div>
      `,
      footerHtml: `
        ${isEdit ? '<button class="btn btn-danger" id="f-delete" style="margin-right:auto;"><i data-lucide="trash-2"></i> Remover</button>' : ''}
        <button class="btn btn-ghost" id="f-cancel">Cancelar</button>
        <button class="btn mod-btn-primary" id="f-save">Salvar</button>
      `,
      onMount: (overlay) => {
        overlay.querySelector('#f-cancel').addEventListener('click', window.UI.closeModal);
        overlay.querySelector('#f-save').addEventListener('click', () => {
          const formatos = U.qsa('.f-formato', overlay).filter(cb => cb.checked).map(cb => cb.value);
          const payload = {
            titulo: overlay.querySelector('#f-titulo').value.trim() || 'Livro sem título',
            autor: overlay.querySelector('#f-autor').value,
            paginas: parseInt(overlay.querySelector('#f-paginas').value, 10) || null,
            serie: overlay.querySelector('#f-serie').value,
            genero: overlay.querySelector('#f-genero').value,
            status: overlay.querySelector('#f-status').value,
            dataInicio: overlay.querySelector('#f-inicio').value,
            dataTermino: overlay.querySelector('#f-termino').value,
            avaliacao: Math.max(0, Math.min(5, parseInt(overlay.querySelector('#f-nota').value, 10) || 0)),
            notas: overlay.querySelector('#f-notas').value,
            formatos,
          };
          window.PessoalDB.save(s => {
            if (isEdit) Object.assign(s.livros.find(x => x.id === l.id), payload);
            else s.livros.push(Object.assign({ id: U.uid('livro') }, payload));
          });
          window.UI.closeModal();
          window.UI.toast('Livro salvo.', 'success');
          renderLivros(content);
        });
        if (isEdit) overlay.querySelector('#f-delete').addEventListener('click', () => {
          window.UI.closeModal();
          window.UI.confirmDialog('Remover este livro?', () => {
            window.PessoalDB.save(s => { s.livros = s.livros.filter(x => x.id !== l.id); });
            window.UI.toast('Livro removido.', 'success');
            renderLivros(content);
          });
        });
      }
    });
  }

  /* ================================ FILMES & SÉRIES ================================ */
  const FILME_TIPOS = { filme: 'Filme', serie: 'Série', dorama: 'Dorama', documentario: 'Documentário' };
  const FILME_STATUS = { 'quero-assistir': { label: 'Quero assistir', color: '#64748B' }, assistindo: { label: 'Assistindo', color: '#3B82F6' }, finalizado: { label: 'Finalizado', color: '#22C55E' } };
  let filmesTipoFilter = 'todos';

  function renderFilmes(content) {
    const s = window.PessoalDB.get();
    const list = s.filmes.filter(f => filmesTipoFilter === 'todos' || f.tipo === filmesTipoFilter);

    content.innerHTML = `
      <div class="filter-bar">
        <button class="filter-chip ${filmesTipoFilter === 'todos' ? 'mod-chip-active' : ''}" data-f="todos">Todos</button>
        ${Object.entries(FILME_TIPOS).map(([k, v]) => `<button class="filter-chip ${filmesTipoFilter === k ? 'mod-chip-active' : ''}" data-f="${k}">${v}s</button>`).join('')}

        <button class="btn mod-btn-primary btn-sm" id="btn-add-filme"><i data-lucide="plus"></i> Adicionar</button>
      </div>
      <div id="filmes-list"></div>

    document.getElementById('filmes-list').innerHTML = list.length
      ? `<div class="item-grid">` + list.map(f => filmeCard(f)).join('') + `</div>`
      : window.UI.emptyState('clapperboard', 'Nada por aqui ainda', 'Adicione filmes, séries, doramas ou documentários.');

    document.getElementById('btn-add-filme').addEventListener('click', () => openFilmeForm(null, content));
    U.qsa('[data-open-filme]', content).forEach(el => el.addEventListener('click', () => {
      const f = window.PessoalDB.get().filmes.find(x => x.id === el.getAttribute('data-open-filme'));
      openFilmeForm(f, content);
    }));

  }

          <div class="field span-2"><label>Nota (0 a 5)</label><input type="number" min="0" max="5" id="f-nota" value="${f.avaliacao || 0}"></div>
          <div class="field span-2"><label>Comentários</label><textarea id="f-com">${U.escapeHtml(f.comentarios || '')}</textarea></div>

    window.UI.openModal({
      title: isEdit ? 'Editar receita' : 'Nova receita',
      size: 'lg',
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-2"><label>Nome da receita</label><input id="f-nome" value="${U.escapeHtml(r.nome)}"></div>
          <div class="field"><label>Tipo</label><select id="f-tipo"><option value="doce" ${r.tipo === 'doce' ? 'selected' : ''}>🍰 Doce</option><option value="salgada" ${r.tipo === 'salgada' ? 'selected' : ''}>🍝 Salgada</option></select></div>
          <div class="field"><label>Categoria</label><input id="f-cat" value="${U.escapeHtml(r.categoria || '')}" placeholder="Ex: Bolos, Tortas, Massas..."></div>
          <div class="field span-2"><label>Tempo de preparo</label><input id="f-tempo" value="${U.escapeHtml(r.tempo || '')}" placeholder="Ex: 40 minutos"></div>
